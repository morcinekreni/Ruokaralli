  {"id": "kalakeitto-ukha", "name": "Venäläinen kalakeitto (ukha)", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7n8su21699013057.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli, siivutettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkanat", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kalaliemi", "amount": 720, "unit": "ml", "chip": "Kalaliemi"}, {"name": "Vesi", "amount": 720, "unit": "ml", "chip": null}, {"name": "Perunat", "amount": 4, "unit": "kpl", "chip": "Peruna"}, {"name": "Laakerinlehdet", "amount": 3, "unit": "kpl", "chip": null}, {"name": "Turskafilee kuutioina", "amount": 200, "unit": "g", "chip": "Kalafilee"}, {"name": "Lohifilee kuutioina", "amount": 200, "unit": "g", "chip": "Lohi"}], "steps": ["Kuumenna öljy kattilassa ja kuullota sipuli, kunnes se alkaa karamellisoitua. Lisää porkkanat ja paista vielä muutama minuutti.", "Lisää liemi, vesi, perunat, laakerinlehdet ja pippurit, mausta suolalla ja kiehauta. Hauduta kannen alla noin 10 minuuttia.", "Lisää kalakuutiot varovasti ja anna kiehahtaa. Kala kypsyy nopeasti, joten vältä liikaa keittämistä.", "Koristele keitto tuoreella tillillä tai persiljalla ennen tarjoilua."]},
  {"id": "lohinuudelikeitto", "name": "Vietnamilainen lohi-nuudelikeitto", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ikizdm1763760862.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanaliemi", "amount": 1, "unit": "l", "chip": "Kanaliemi"}, {"name": "Punainen currytahna", "amount": 2, "unit": "tl", "chip": "Punainen currytahna"}, {"name": "Riisinuudelit", "amount": 100, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Shiitakesienet", "amount": 150, "unit": "g", "chip": "Sieni"}, {"name": "Maissi", "amount": 125, "unit": "g", "chip": "Maissi"}, {"name": "Lohifile", "amount": 2, "unit": "kpl", "chip": "Lohi"}, {"name": "Limemehu", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ruskea sokeri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}], "steps": ["Kiehauta liemi kattilassa ja sekoita joukkoon currytahna.", "Lisää nuudelit ja keitä noin 8 minuuttia. Lisää sienet ja maissi ja keitä vielä 2 minuuttia.", "Lisää lohipalat ja kypsennä noin 3 minuuttia, kunnes kala on läpikypsää.", "Ota liedeltä ja mausta limemehulla, soijakastikkeella ja hivenellä sokeria.", "Annostele kulhoihin ja ripottele pinnalle tuoretta korianteria."]},
  {"id": "lohi-nuudelikaarot", "name": "Uunissa paistetut lohi-nuudelikääröt", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/prrirc1763781360.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Riisinuudelit", "amount": 100, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Kevätsipulit, ohuesti siivutetut", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Herneet", "amount": 50, "unit": "g", "chip": "Herne"}, {"name": "Chili, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Voi", "amount": 30, "unit": "g", "chip": "Voi"}, {"name": "Lohifile", "amount": 300, "unit": "g", "chip": "Lohi"}], "steps": ["Kaada nuudelien päälle kiehuvaa vettä ja anna liota pari minuuttia, kunnes ne taipuvat mutta eivät ole liian pehmeitä. Valuta hyvin.", "Sekoita nuudelien joukkoon kevätsipuli, herneet, suola, pippuri ja osa voista, kunnes voi on sulanut.", "Jaa nuudeliseos kahden leivinpaperiarkin päälle ja aseta lohipalat päälle. Levitä loppu voi lohen päälle.", "Taita paperin reunat tiiviisti kääröiksi niin ettei rakoja jää, ja siirrä uunipellille.", "Paista 200-asteisessa uunissa 15-20 minuuttia ja siirrä kääröt suoraan lautasille tarjolle."]},
  {"id": "lohi-katkarapurisotto", "name": "Lohi-katkarapurisotto parsalla", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xxrxux1503070723.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 50, "unit": "g", "chip": "Voi"}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Risottoriisi", "amount": 150, "unit": "g", "chip": "Riisi"}, {"name": "Valkoviini", "amount": 125, "unit": "ml", "chip": "Valkoviini"}, {"name": "Kasvisliemi, kuuma", "amount": 1, "unit": "l", "chip": "Kasvisliemi"}, {"name": "Sitruunan mehu ja kuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Isot katkaravut", "amount": 240, "unit": "g", "chip": "Katkarapu"}, {"name": "Lohifile", "amount": 150, "unit": "g", "chip": "Lohi"}, {"name": "Parsa", "amount": 100, "unit": "g", "chip": "Parsa"}, {"name": "Mustapippuri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Parmesaanilastut", "amount": 50, "unit": "g", "chip": "Juusto"}], "steps": ["Sulata voi paksupohjaisessa kattilassa ja kuullota sipuli pehmeäksi ilman väriä.", "Lisää riisi ja sekoita, kunnes jyvät ovat voin peitossa. Kaada joukkoon viini ja anna sen imeytyä sekoittaen.", "Lisää kuumaa lientä vähän kerrallaan koko ajan sekoittaen ja annostelevalla lisäyksellä, kunnes riisi on täyteläistä ja kypsää.", "Mausta sitruunamehulla, kuorella ja pippurilla.", "Paista lohi ja katkaravut erikseen kypsiksi, ja aseta risoton päälle yhdessä esikeitetyn parsan kanssa. Viimeistele parmesaanilla."]},
  {"id": "singaporen-nuudelit-katkaravuilla", "name": "Singaporen tyyliset nuudelit katkaravuilla", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/f3cxnc1765656994.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Seesamiöljy", "amount": 2, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Riisietikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Ohuet riisinuudelit", "amount": 170, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Kananmunat", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Inkiväärijauhe", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Porkkanat, suikaloidut", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Jalapeño, siivutettu", "amount": 1, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Sipuli", "amount": 0.5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kinkku suikaleina", "amount": 115, "unit": "g", "chip": "Kinkku"}, {"name": "Kiinankaali, suikaloitu", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Kevätsipulit", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Punainen paprika, suikaloitu", "amount": 0.5, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Currymauste", "amount": 2, "unit": "tl", "chip": null}, {"name": "Katkaravut", "amount": 225, "unit": "g", "chip": "Katkarapu"}, {"name": "Korianterinlehdet", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Sekoita kastike seesamiöljystä, soijakastikkeesta ja riisietikasta.", "Keitä riisinuudelit noin 2 minuuttia purevan kypsiksi, valuta ja huuhtele kylmällä vedellä. Leikkaa lyhyemmiksi.", "Paista vatkatuista munista pehmeä munakokkeli öljyssä ja nosta syrjään.", "Paista samassa pannussa inkivääri, valkosipuli, porkkana, jalapeño, sipuli ja suola pehmeiksi.", "Lisää kinkku, kaali, kevätsipuli, paprika ja currymauste, ja paista hetki. Lisää katkaravut ja kypsennä muutama minuutti.", "Lisää munakokkeli, kastike ja nuudelit ja sekoita hyvin kuumaksi. Viimeistele korianterilla."]},
  {"id": "kolmen-kalan-piirakka", "name": "Kolmen kalan piirakka", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/spswqs1511558697.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Perunat", "amount": 1000, "unit": "g", "chip": "Peruna"}, {"name": "Voi muusiin", "amount": 30, "unit": "g", "chip": "Voi"}, {"name": "Maito muusiin", "amount": 1, "unit": "dl", "chip": "Maito"}, {"name": "Gruyère-juusto", "amount": 50, "unit": "g", "chip": "Juusto"}, {"name": "Voi kastikkeeseen", "amount": 75, "unit": "g", "chip": "Voi"}, {"name": "Purjo, siivutettu", "amount": 2, "unit": "kpl", "chip": "Purjo"}, {"name": "Vehnäjauho", "amount": 75, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Valkoviini", "amount": 150, "unit": "ml", "chip": "Valkoviini"}, {"name": "Maito kastikkeeseen", "amount": 568, "unit": "ml", "chip": "Maito"}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Lohifile kuutioina", "amount": 250, "unit": "g", "chip": "Lohi"}, {"name": "Kolja kuutioina", "amount": 250, "unit": "g", "chip": "Kolja"}, {"name": "Savukolja kuutioina", "amount": 250, "unit": "g", "chip": "Savukolja"}, {"name": "Kovaksi keitetyt kananmunat", "amount": 6, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Keitä perunat suolatussa vedessä pehmeiksi, valuta ja soseuta voin ja maidon kanssa. Mausta suolalla ja pippurilla.", "Sulata voi kattilassa, lisää purjo ja hauduta kannen alla noin 10 minuuttia pehmeäksi.", "Sekoita jauho ja viini pieneksi tahnaksi. Lisää maito purjoihin, kiehauta ja lisää viinitahna. Hämmennä paksuksi kastikkeeksi.", "Mausta kastike, lisää persilja ja kalat, ja anna hetken kypsyä. Kaada uunivuokaan ja levitä pinnalle munat.", "Levitä perunamuusi kalaseoksen päälle, uritä haarukalla ja ripottele juustoa. Paista 200-asteisessa uunissa 30-40 minuuttia, kunnes pinta on kullanruskea."]},
  {"id": "uunilohi-fenkolilla-ja-tomaatilla", "name": "Uunilohi fenkolilla ja kirsikkatomaateilla", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1548772327.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Fenkolit", "amount": 2, "unit": "kpl", "chip": "Fenkoli"}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sitruunan mehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kirsikkatomaatit", "amount": 175, "unit": "g", "chip": "Tomaatti"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Lohifile", "amount": 350, "unit": "g", "chip": "Lohi"}, {"name": "Mustat oliivit tarjoiluun", "amount": 1, "unit": "annos", "chip": "Oliivit"}], "steps": ["Leikkaa fenkolin varret talteen, halkaise sipulit ja lohko kukin puolikas kolmeen osaan. Keitä suolatussa vedessä noin 10 minuuttia ja valuta.", "Silppua fenkolin varret ja sekoita persiljaan ja sitruunankuoreen.", "Levitä fenkoli uunivuokaan, lisää tomaatit, valuta öljyä päälle ja paista 180-asteisessa uunissa 10 minuuttia.", "Aseta lohi kasvisten sekaan, ripottele sitruunamehua ja paista vielä noin 15 minuuttia, kunnes kala on kypsä.", "Ripottele persiljaseos ja oliivit päälle ennen tarjoilua."]},
  {"id": "garides-saganaki", "name": "Garides saganaki - kreikkalaiset fetakatkaravut", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wuvryu1468232995.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Raa'at kuningaskatkaravut", "amount": 500, "unit": "g", "chip": "Katkarapu"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Persilja", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Valkoviini", "amount": 250, "unit": "ml", "chip": "Valkoviini"}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Valkosipuli, hienonnettu", "amount": 0.5, "unit": "tl", "chip": "Valkosipuli"}, {"name": "Fetajuusto kuutioina", "amount": 200, "unit": "g", "chip": "Juusto"}], "steps": ["Keitä katkaravut vedessä noin 5 minuuttia, valuta keitinliemi talteen ja jäähdytä ravut.", "Kuullota sipuli öljyssä, lisää persilja, viini, tomaattimurska ja valkosipuli, ja hauduta noin 30 minuuttia, kunnes kastike sakenee.", "Kuori ravut jättäen pää ja pyrstö kiinni, sillä aikaa kun kastike hautuu.", "Lisää ravut kastikkeeseen ja anna kiehahtaa uudelleen, kypsennä vielä noin 5 minuuttia.", "Lisää feta ja nosta liedeltä. Anna juuston pehmetä hieman ja tarjoile rapean leivän kanssa."]},
  {"id": "katkarapu-chow-fun", "name": "Katkarapu chow fun -nuudelit", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1529445434.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Leveät riisinuudelit", "amount": 250, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Katkaravut", "amount": 225, "unit": "g", "chip": "Katkarapu"}, {"name": "Kananmuna", "amount": 0.5, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Valkopippuri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Seesamiöljy", "amount": 2, "unit": "tl", "chip": null}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Öljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Valkosipuli, hienonnettu", "amount": 1, "unit": "tl", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sipuli", "amount": 0.5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Pavunversot", "amount": 100, "unit": "g", "chip": "Pavunversot"}, {"name": "Kevätsipulit", "amount": 0.5, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Riisiviini", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Osterikastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sokeri", "amount": 0.5, "unit": "rkl", "chip": "Sokeri"}, {"name": "Etikka", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Liota riisinuudeleita, kunnes ne ovat pehmeitä, ja keitä sitten noin 10-15 minuuttia. Huuhtele kylmällä vedellä.", "Sekoita katkaravut munan, valkopippurin, seesamiöljyn, maissitärkkelyksen ja hieman öljyä kanssa marinoitumaan.", "Paista katkaravut wokissa kuumassa öljyssä kullanruskeiksi ja nosta syrjään.", "Paista samassa wokissa valkosipuli, inkivääri ja kasvikset. Lisää nuudelit.", "Lisää riisiviini, osterikastike, sokeri, etikka, soijakastike ja katkaravut takaisin. Sekoita hyv   {"id": "hunaja-teriyakilohi", "name": "Hunaja-teriyakilohi", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xxyupu1468262513.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lohifile", "amount": 450, "unit": "g", "chip": "Lohi"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sake", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Seesaminsiemenet", "amount": 4, "unit": "rkl", "chip": "Seesaminsiemenet"}], "steps": ["Sekoita soijakastike ja sake teriyaki-glaseeraukseksi.", "Kaada glaseeraus lohipalojen päälle ja anna maustua hetki.", "Kuumenna öljy pannulla ja paista lohi keskilämmöllä molemmin puolin, kunnes se on kypsää ja glaseeraus on tiivistynyt.", "Ripottele pinnalle seesaminsiemeniä ja tarjoile heti."]},
  {"id": "katkarapu-wokki", "name": "Thaimaalainen katkarapuwokki", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/96lt871763480970.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Raa'at jättikatkaravut", "amount": 200, "unit": "g", "chip": "Katkarapu"}, {"name": "Vihreä chili", "amount": 1, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Valkosipulinkynnet", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Hienosokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Limemehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kalakastike", "amount": 3, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Maapähkinäöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Inkivääri", "amount": 1, "unit": "pala", "chip": null}, {"name": "Kevätsipulit", "amount": 8, "unit": "viipaletta", "chip": "Kevätsipuli"}, {"name": "Punainen paprika, siivutettu", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Vesikastanjat", "amount": 85, "unit": "g", "chip": "Vesikastanja"}, {"name": "Pavunversot", "amount": 100, "unit": "g", "chip": "Pavunversot"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Riisinuudelit tarjoiluun", "amount": 1, "unit": "annos", "chip": "Riisinuudelit"}], "steps": ["Jauha chili, valkosipuli, korianterin varret ja sokeri tehosekoittimessa tahnaksi. Sekoita joukkoon puolet limemehusta ja kalakastike, ja kaada katkarapujen päälle marinoitumaan.", "Kuumenna hieman öljyä wokissa, paista inkivääri ja kevätsipuli hetki, lisää paprika ja paista pehmeäksi.", "Lisää vesikastanjat ja pavunversot ja paistele, kunnes versot alkavat kuihtua. Mausta soijakastikkeella ja pippurilla, kaada vatiin.", "Kuumenna loppu öljy wokissa, paista katkaravut marinadista nostettuina noin 1-2 minuuttia vaaleanpunaisiksi.", "Lisää marinad   {"id": "lohi-avokadosalaatti", "name": "Lohi-avokadosalaatti", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1549542994.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lohifile", "amount": 400, "unit": "g", "chip": "Lohi"}, {"name": "Avokadot", "amount": 3, "unit": "kpl", "chip": "Avokado"}, {"name": "Kurkku", "amount": 1, "unit": "kpl", "chip": "Kurkku"}, {"name": "Pinaatti", "amount": 400, "unit": "g", "chip": "Pinaatti"}, {"name": "Minttu", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Limen kuori ja mehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Hunaja", "amount": 2, "unit": "tl", "chip": null}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}], "steps": ["Mausta lohi suolalla ja pippurilla, ja hiero pintaan öljyä.", "Sekoita kastikkeen ainekset limestä, hunajasta ja öljystä keskenään.", "Kuori ja viipaloi avokadot, viipaloi kurkku pitkittäin ja edelleen suikaleiksi.", "Jaa pinaatti, avokado ja kurkku neljälle lautaselle ja valuta päälle puolet kastikkeesta.", "Paista lohi kuumalla pannulla 3-4 minuuttia puolelta, kunnes pinta on rapea ja sisus vielä mehukas. Aseta salaatin päälle ja valuta loppu kastike."]},
  {"id": "bangladeshilainen-kalacurry", "name": "Bangladeshilainen kalacurry retiisillä", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/r7mcjm1780261264.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Valkoinen kalafile", "amount": 450, "unit": "g", "chip": "Kalafilee"}, {"name": "Daikon-retiisi", "amount": 450, "unit": "g", "chip": "Daikon-retiisi"}, {"name": "Rypsiöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynnet", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Suola", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kurkumajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Korianterijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Chilijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Vihreät chilit", "amount": 2, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Korianterinlehdet", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Leikkaa kalafile paloiksi ja huuhtele. Kuori ja siivuta daikon puolikuiksi paloiksi.", "Kuumenna öljy kattilassa, paista valkosipuli hetki kullanvärisiksi ja lisää sipuli ja suola. Kypsennä pehmeäksi.", "Lisää vesi, kansi päälle ja hauduta 10 minuuttia. Sekoita joukkoon kurkuma, korianteri ja chilijauhe, ja anna maustua muutama minuutti.", "Lisää daikon ja vielä vähän vettä, ja hauduta kannen alla noin 10 minuuttia.", "Lisää kalapalat varovasti pataan, ravista kevyesti ja anna hautua kannen alla noin 5 minuuttia koskematta.", "Kaada varovasti kuumaa vettä pataan reunoja pitkin, anna kiehua vielä 15 minuuttia ja lisää lopuksi korianteri ja chilit. Tarjoile riisin ja limelohkojen kanssa."]},
  {"id": "jamaikalainen-pippurikatkarapu", "name": "Jamaikalainen pippurikatkarapu", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/bx07m71764792853.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Katkaravut", "amount": 450, "unit": "g", "chip": "Katkarapu"}, {"name": "Scotch bonnet -chilit, pilkotut", "amount": 2, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Yleismauste", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Annattojauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Maustepippuri", "amount": 2, "unit": "tl", "chip": null}, {"name": "Katkarapuliemi", "amount": 1.8, "unit": "dl", "chip": "Katkarapuliemi"}, {"name": "Sipuli, pilkottu", "amount": 0.5, "unit": "dl", "chip": "Sipuli"}, {"name": "Valkosipulinkynnet", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Valkoviinietikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Timjami", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Sekoita katkaravut kulhossa scotch bonnet -chilien, yleismausteen, annattojauheen ja maustepippurin kanssa, ja anna marinoitua noin 10 minuuttia.", "Kuumenna katkarapuliemi pannulla ja lisää sipuli ja valkosipuli, kunnes ne pehmenevät ja tuoksuvat.", "Lisää maustetut katkaravut ja timjami pannulle levittäen tasaisesti. Peitä kannella ja kypsennä 5-7 minuuttia sekoittaen välillä, kunnes ravut ovat kirkkaanoranssit ja kypsät.", "Lisää etikka, sekoita ja kypsennä vielä hetki. Mausta suolalla.", "Nosta ravut reikäkauhalla lautaselle ja valuta päälle hieman keitinlientä."]},
  {"id": "katkarapu-lumiherneilla", "name": "Kiinalainen katkarapuwokki lumiherneillä", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/fpl3mv1766433431.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Maissitärkkelys", "amount": 2, "unit": "tl", "chip": "Maissitärkkelys"}, {"name": "Kuiva sherry", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Katkaravut", "amount": 450, "unit": "g", "chip": "Katkarapu"}, {"name": "Maapähkinäöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Inkiväärijauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynnet", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Lumiherneet", "amount": 225, "unit": "g", "chip": "Lumiherne"}, {"name": "Soijakastike", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kanaliemi", "amount": 60, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Kevätsipulit", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Seesamiöljy", "amount": 2, "unit": "tl", "chip": null}], "steps": ["Sekoita marinadin ainekset kulhossa ja lisää katkaravut. Anna marinoitua 15-20 minuuttia sillä aikaa kun valmistelet muut ainekset.", "Kuumenna wokki tai iso paistinpannu kuumaksi, lisää öljy ja paista inkivääriä ja valkosipulia noin 30 sekuntia.", "Lisää katkaravut marinadeineen wokkiin, sekä lumiherneet, soijakastike ja liemi. Paista sekoittaen noin 2 minuuttia, kunnes ravut muuttuvat vaaleanpunaisiksi.", "Lisää kevätsipulit ja paistele vielä minuutti.", "Ota liedeltä, lisää seesamiöljy ja sekoita. Tarjoile höyrytetyn riisin kanssa."]},

  {"id": "balchi-di-pisca", "name": "Balchi di pisca - arubalaiset kalapullat", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qqwhw51780093126.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Suolattu turska", "amount": 1, "unit": "kpl", "chip": "Suolattu turska"}, {"name": "Perunat", "amount": 3, "unit": "kpl", "chip": "Peruna"}, {"name": "Tomaatti", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Vihreä paprika", "amount": 0.5, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Tabascokastike", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Muskottipähkinä", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Suola", "amount": 1, "unit": "annos", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "annos", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Liota suolattua turskaa vedessä vuorokausi, vaihtaen vesi välillä. Keitä sitten tuoreessa vedessä, kunnes kala hajoaa helposti haarukalla. Poista ruodot.", "Keitä perunat kuoritusta ja kuutioidusta muodossa pehmeiksi, valuta ja soseuta yhdessä kalan kanssa.", "Soseuta tehosekoittimessa tomaatti, paprika, sipuli, valkosipuli, tabasco, muskotti sekä suola ja pippuri, ja sekoita seos kala-perunamuusiin.", "Lisää joukkoon muna ja sekoita tasaiseksi, tarpeeksi kiinteäksi massaksi että siitä voi pyörittää palloja. Lisää tarvittaessa hieman kalalientä.", "Muotoile massasta noin 4 cm:n pallot ja paista kuumassa rasvassa uppopaistaen kullanruskeiksi."]},
  {"id": "camarao-grelhado", "name": "Grillatut katkaravut vihersipulikastikkeella", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/jg4r991779916649.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Katkaravut", "amount": 450, "unit": "g", "chip": "Katkarapu"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kevätsipuli", "amount": 1.2, "unit": "dl", "chip": "Kevätsipuli"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Valkoviinietikka", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Vesi", "amount": 4, "unit": "rkl", "chip": null}], "steps": ["Valmista kastike murskaamalla valkosipuli, vihersipuli, kumina, suola, etikka ja vesi keskenään tasaiseksi tahnaksi.", "Pujota katkaravut varrastikkuihin ja sivele niitä reilusti kastikkeella.", "Grillaa katkarapuja 3-4 minuuttia per puoli, kunnes ne ovat läpikypsiä ja vaaleanpunaisia.", "Tarjoile grillatut katkaravut lopun kastikkeen kera."]},
  {"id": "bahia-moqueca", "name": "Bahialainen katkarapumuhennos (Moqueca)", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/e2kcut1782591669.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Katkaravut", "amount": 450, "unit": "g", "chip": "Katkarapu"}, {"name": "Limemehu", "amount": 75, "unit": "ml", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kookosöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kevätsipuli", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Chilihiutaleet", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Kookosmaito", "amount": 400, "unit": "ml", "chip": "Kookosmaito"}, {"name": "Korianteri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Riisi", "amount": 300, "unit": "g", "chip": "Riisi"}], "steps": ["Marinoi katkaravut limemehussa, suolassa ja osassa valkosipulia jääkaapissa noin tunti.", "Kuumenna kookosöljy kattilassa ja kuullota kevätsipuli ja sipuli, lisää sitten paprika, chilihiutaleet, paprikajauhe ja loppu valkosipuli.", "Lisää tomaatit ja kookosmaito, kiehauta ja anna hautua noin 10 minuuttia.", "Lisää katkaravut marinadeineen ja hauduta noin 3 minuuttia, kunnes ne ovat kypsiä.", "Tarjoile riisin ja tuoreen korianterin kera."]},
  {"id": "egg-foo-young", "name": "Kiinalainen katkarapumunaomeletti", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/47y6ii1765658818.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliemi", "amount": 2.4, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Shaoxing-viini", "amount": 1, "unit": "rkl", "chip": "Shaoxing-viini"}, {"name": "Osterikastike", "amount": 1, "unit": "rkl", "chip": "Osterikastike"}, {"name": "Valkopippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Vesi", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 8, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Sokeri", "amount": 0.25, "unit": "tl", "chip": "Sokeri"}, {"name": "Kevätsipuli", "amount": 1, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Mungpavun idut", "amount": 2.4, "unit": "dl", "chip": "Idut"}, {"name": "Katkaravut", "amount": 300, "unit": "g", "chip": "Katkarapu"}, {"name": "Öljy paistamiseen", "amount": 7, "unit": "dl", "chip": null}, {"name": "Jasmiiniriisi", "amount": 4.8, "unit": "dl", "chip": "Riisi"}], "steps": ["Kiehauta naudanliemi, soijakastike, shaoxing-viini, osterikastike ja pippuri kattilassa, sekoita joukkoon veteen liuotettu maissitärkkelys ja anna kastikkeen sakenea.", "Vatkaa munat toisen erän maissitärkkelys-vesiseoksen, suolan ja sokerin kanssa tasaiseksi.", "Sekoita munaseokseen kevätsipuli, mungpavun idut ja katkaravut.", "Kuumenna runsaasti öljyä wokissa ja kaada neljäsosa munaseoksesta kerrallaan pannuun, paista kultaisen rapeaksi molemmin puolin noin 2 minuuttia per puoli.", "Nostele omeletit riisiannosten päälle ja kaada päälle lämmintä kastiketta."]},
  {"id": "fish-stew-rouille", "name": "Kalapata rouille-kastikkeella", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vptqpw1511798500.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Katkaravut", "amount": 6, "unit": "kpl", "chip": "Katkarapu"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Valkoviini", "amount": 150, "unit": "ml", "chip": "Valkoviini"}, {"name": "Kalaliemi", "amount": 200, "unit": "ml", "chip": "Kalaliemi"}, {"name": "Fenkoli", "amount": 1, "unit": "kpl", "chip": "Fenkoli"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Appelsiinin kuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Tähtianis", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Harissatahna", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Tomaattipyree", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaatti", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Simpukat", "amount": 400, "unit": "g", "chip": "Simpukat"}, {"name": "Valkokalafile", "amount": 200, "unit": "g", "chip": "Kalafilee"}, {"name": "Timjami", "amount": 2, "unit": "oksaa", "chip": null}, {"name": "Leipä", "amount": 1, "unit": "kpl", "chip": "Leipä"}], "steps": ["Kuori katkaravut ja ruskista kuoret öljyssä, kaada joukkoon viini ja vesi ja hauduta liemeksi, siivilöi.", "Kuullota fenkoli, sipuli ja valkosipuli öljyssä pehmeiksi. Keitä kuutioitu peruna esikypsäksi.", "Lisää appelsiinin kuori, tähtianis, laakerinlehti ja harissa, hauduta kunnes vihannekset ovat kypsiä.", "Lisää tomaattipyree, tomaatit ja kalaliemi, keitä kunnes kastike hieman sakenee.", "Nostele peruna, kalapalat ja katkaravut varovasti kastikkeeseen, hauduta muutama minuutti, lisää simpukat ja kypsennä kunnes kuoret avautuvat.", "Tarjoile paahdetun leivän kanssa."]},

  {"id": "paella-mereneläväpaella", "name": "Espanjalainen mereneläväpaella", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/9bl20p1763248192.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Katkaravut", "amount": 10, "unit": "kpl", "chip": "Katkarapu"}, {"name": "Persilja", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Sherry", "amount": 100, "unit": "ml", "chip": "Sherry"}, {"name": "Simpukat", "amount": 500, "unit": "g", "chip": "Simpukat"}, {"name": "Sahrami", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Chorizo", "amount": 150, "unit": "g", "chip": "Chorizo"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kalmari", "amount": 1, "unit": "kpl", "chip": "Kalmari"}, {"name": "Tomaatti", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Riisi", "amount": 250, "unit": "g", "chip": "Riisi"}, {"name": "Härkäpapu", "amount": 100, "unit": "g", "chip": "Härkäpapu"}, {"name": "Sitruunankuori", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Kuumenna öljyä paellapannussa, ruskista katkarapujen kuoret ja persiljanvarret, lisää sherry ja vesi ja hauduta liemeksi, siivilöi.", "Kypsennä simpukat kannen alla, kunnes ne avautuvat, siivilöi liemi talteen ja liuota siihen sahrami.", "Paista chorizo pannussa, lisää sipuli ja valkosipuli, sitten kalmari kunnes se muuttuu valkoiseksi. Lisää tomaatit ja suurin osa liemestä.", "Lisää riisi, kiehauta ja hauduta miedolla lämmöllä, kunnes riisi on imenyt nesteen.", "Työnnä katkaravut riisin joukkoon, lisää simpukat ja härkäpavut, kypsennä loppuun asti.", "Viimeistele sitruunankuorella ja persiljalla ennen tarjoilua."]},
  {"id": "caldeirada-de-peixe", "name": "Portugalilainen kalamuhennos (Caldeirada)", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/do7zps1614349775.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Valkoviini", "amount": 400, "unit": "ml", "chip": "Valkoviini"}, {"name": "Sahrami", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Peruna", "amount": 300, "unit": "g", "chip": "Peruna"}, {"name": "Tomaatti", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Turska", "amount": 600, "unit": "g", "chip": "Turska"}, {"name": "Kalmari", "amount": 300, "unit": "g", "chip": "Kalmari"}, {"name": "Katkaravut", "amount": 8, "unit": "kpl", "chip": "Katkarapu"}, {"name": "Simpukat", "amount": 500, "unit": "g", "chip": "Simpukat"}, {"name": "Sinisimpukat", "amount": 500, "unit": "g", "chip": "Simpukat"}, {"name": "Patonki", "amount": 1, "unit": "kpl", "chip": "Leipä"}], "steps": ["Kuullota sipuli ja paprika öljyssä pehmeiksi, lisää korianterinvarret, chili ja valkosipuli, paista hetki.", "Lisää viini, sahrami ja laakerinlehti, anna kiehua kasaan noin puoleen.", "Lisää perunat, tomaatit ja vettä, hauduta kunnes perunat ovat lähes kypsiä ja tomaatit hajoavat.", "Työnnä kalapalat kastikkeeseen ja asettele kalmari, katkaravut, simpukat ja sinisimpukat päälle, hauduta kannen alla kunnes kuoret avautuvat ja kala on kypsää.", "Tarjoile paahdetun patongin kanssa, koristele tuoreella korianterilla."]},
  {"id": "salt-cod-tortilla", "name": "Suolatun turskan munakastortilla", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/njj1681763297231.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Peruna", "amount": 300, "unit": "g", "chip": "Peruna"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kananmuna", "amount": 8, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 2.5, "unit": "rkl", "chip": null}, {"name": "Suolattu turska", "amount": 300, "unit": "g", "chip": "Turska"}], "steps": ["Kuullota sipuli öljyssä pehmeäksi ja kullankeltaiseksi, noin 8 minuuttia, nosta sivuun.", "Paista perunaviipaleet samassa pannussa pehmeiksi, lisää sipuli ja valkosipuli takaisin ja kypsennä vielä hetki.", "Sekoita perunaseos kulhossa munien ja persiljan kanssa ja anna maustua noin puoli tuntia.", "Liota ja keitä suolattu turska vedessä, poista nahka ja ruodot, murustele kala munaseoksen joukkoon.", "Paista munakasseos pannulla matalalla lämmöllä, kunnes se on lähes hyytynyt, käännä varovasti ja paista toinen puoli kypsäksi.", "Anna jäähtyä hetki ennen viipalointia ja tarjoilua."]},

  {"id": "spanish-rice-prawn-onepot", "name": "Yhden padan espanjalainen riisi-katkarapupata", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sl6vqv1763335988.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Vihreä paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Chorizo", "amount": 50, "unit": "g", "chip": "Chorizo"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Basmatiriisi", "amount": 250, "unit": "g", "chip": "Riisi"}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Katkaravut", "amount": 200, "unit": "g", "chip": "Katkarapu"}], "steps": ["Paista sipuli, paprikat, chorizo ja valkosipuli öljyssä kuumalla lämmöllä muutama minuutti.", "Lisää riisi ja tomaattimurska sekä kiehuvaa vettä, kypsennä kannen alla noin 12 minuuttia, kunnes riisi on lähes kypsää.", "Sekoita joukkoon katkaravut, lisää tarvittaessa hieman vettä, ja jatka kypsennystä minuutti, kunnes katkaravut ovat vaaleanpunaisia ja riisi kypsää."]},
  {"id": "thai-fried-rice-prawns-peas", "name": "Thaimaalainen paistettu riisi katkaravuilla ja herneillä", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hblwvg1763478203.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Öljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Punasipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Katkaravut", "amount": 250, "unit": "g", "chip": "Katkarapu"}, {"name": "Täysjyväriisi", "amount": 140, "unit": "g", "chip": "Riisi"}, {"name": "Pakasteherneet", "amount": 75, "unit": "g", "chip": "Herne"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Kalakastike", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Chilikastike", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Kuumenna osa öljystä wokissa, kuullota sipuli, valkosipuli ja chili muutama minuutti.", "Lisää katkaravut ja paista hetki, lisää keitetty riisi ja herneet, paista kuumaksi.", "Mausta soijakastikkeella ja kalakastikkeella ja sekoita joukkoon tuoretta korianteria.", "Paista munat erikseen loppuöljyssä ja jaa riisi neljälle lautaselle, kukin kera yksi paistettu muna.", "Tarjoile korianterilla ja chilikastikkeella maustettuna."]},

  {"id": "arroz-con-gambas-calamar", "name": "Riisipata katkaravuilla ja kalmarilla", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/jc6oub1763196663.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Katkaravut", "amount": 24, "unit": "kpl", "chip": "Katkarapu"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Sahrami", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Riisi", "amount": 450, "unit": "g", "chip": "Riisi"}, {"name": "Tomaattipyree", "amount": 2, "unit": "tl", "chip": "Tomaattipyree"}, {"name": "Valkoviini", "amount": 200, "unit": "ml", "chip": "Valkoviini"}, {"name": "Kalaliemi", "amount": 650, "unit": "ml", "chip": "Kalaliemi"}, {"name": "Kalmari", "amount": 3, "unit": "kpl", "chip": "Kalmari"}], "steps": ["Kuori suurin osa katkaravuista, jätä muutama kuorineen koristeeksi. Kuullota sipuli öljyssä pehmeäksi.", "Lisää laakerinlehti, sahrami, riisi ja tomaattipyree, paista hetki sekoitellen.", "Kaada joukkoon valkoviini ja anna kiehahtaa, lisää kalaliemi ja kalmari, mausta hyvin.", "Kiehauta, peitä kannella ja hauduta miedolla lämmöllä noin 12 minuuttia, lisää tarvittaessa vähän vettä.", "Sekoita joukkoon kuoritut katkaravut ja asettele kuorelliset päälle, hauduta 5-6 minuuttia kunnes kaikki on kypsää. Anna vetäytyä hetki ennen tarjoilua."]},

  {"id": "fish-fofos", "name": "Portugalilaiset kalapullat (Fish Fofos)", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/a15wsa1614349126.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kolja", "amount": 600, "unit": "g", "chip": "Kolja"}, {"name": "Peruna", "amount": 300, "unit": "g", "chip": "Peruna"}, {"name": "Vihreä chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Korianteri", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Jeeransiemenet", "amount": 1, "unit": "tl", "chip": null}, {"name": "Pippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 2, "unit": "palaa", "chip": null}, {"name": "Riisijauho", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Korppujauho", "amount": 75, "unit": "g", "chip": "Korppujauho"}, {"name": "Öljy paistamiseen", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Hauduta kalafileet kevyesti vedessä noin 10 minuuttia, valuta ja murustele.", "Sekoita kala, peruna, chili, korianteri, jeeransiemenet, pippuri, valkosipuli ja inkivääri kulhossa. Lisää riisijauho ja yksi kananmuna, sekoita ja muotoile 15 pientä tankoa.", "Vatkaa loput munat kulhossa, kastele tangot munassa ja pyörittele korppujauhoissa. Jäähdytä noin 20 minuuttia.", "Paista fofoja kuumassa öljyssä erissä molemmin puolin kultaisen ruskeiksi, noin 2 minuuttia per puoli.", "Tarjoile sipuli-korianterisalaatin ja mangochutneyn kanssa."]},
  {"id": "fiskesuppe", "name": "Norjalainen kermainen kalakeitto", "category": "Kala ja äyriäiset", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/raqjbj1762773035.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kalafile", "amount": 450, "unit": "g", "chip": "Kalafilee"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Peruna", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Purjo", "amount": 1, "unit": "kpl", "chip": "Purjo"}, {"name": "Voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Vehnäjauho", "amount": 5, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Kalaliemi", "amount": 9.6, "unit": "dl", "chip": "Kalaliemi"}, {"name": "Maito", "amount": 2.4, "unit": "dl", "chip": "Maito"}, {"name": "Ranskankerma (crème fraîche)", "amount": 3, "unit": "dl", "chip": "Smetana"}, {"name": "Katkaravut", "amount": 150, "unit": "g", "chip": "Katkarapu"}, {"name": "Ruohosipuli", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Leikkaa kalafile kuutioiksi tai suikaleiksi, murskaa valkosipuli ja viipaloi porkkanat ja purjo ohuiksi suikaleiksi.", "Sulata voi kattilassa, lisää valkosipuli ja anna sen kullertua hieman, ripottele joukkoon jauhot ja vatkaa tasaiseksi.", "Kaada joukkoon kalaliemi vähitellen koko ajan vatkaten, jotta seos pysyy kokkareettomana.", "Lisää vihannekset ja maito, kiehauta ja keitä noin 10 minuuttia.", "Lisää ranskankerma, anna keiton lämmetä lähes kiehumispisteeseen, lisää kalapalat ja katkaravut ja anna hautua 5 minuuttia ilman kiehumista.", "Ripottele pinnalle ruohosipulia ennen tarjoilua."]},

  {"id": "pan-fried-hake-white-bean-chorizo-broth", "name": "Paistettu kummeliturska valkopapu-chorizoliemessä", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/4yjart1763248459.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kuivatut valkoiset pavut", "amount": 450, "unit": "g", "chip": "Pavut"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Timjami", "amount": 1, "unit": "annos", "chip": null}, {"name": "Oliiviöljy", "amount": 6, "unit": "rkl", "chip": null}, {"name": "Leipä", "amount": 100, "unit": "g", "chip": "Leipä"}, {"name": "Chorizo", "amount": 100, "unit": "g", "chip": "Chorizo"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Paprikajauhe", "amount": 3, "unit": "tl", "chip": null}, {"name": "Kanaliemi", "amount": 1, "unit": "l", "chip": "Kanaliemi"}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Kummeliturska", "amount": 4, "unit": "filettä", "chip": "Kummeliturska"}], "steps": ["Keitä valkoiset pavut veden, valkosipulin, laakerinlehtien ja timjamin kanssa noin 30 minuuttia kypsiksi.", "Paista leipäpalat valkosipulilla maustetussa öljyssä rapeiksi, nosta sivuun. Paista chorizo samassa pannussa rapeaksi.", "Kuullota sipuli öljyssä, lisää paprikajauhe, sekoita joukkoon kypsät pavut, kanaliemi ja suola, kypsennä 5-10 minuuttia ja lisää persilja.", "Mausta kalafileet, paista nahkapuoli alaspäin rapeaksi öljyssä, käännä ja kypsennä läpi.", "Annostele papumuhennos kulhoihin, nosta kala päälle ja viimeistele paahdetulla leivällä ja chorizolla."]},

  {"id": "eggplant-adobo", "name": "Filippiiniläinen munakoiso-adobo", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/y7h0lq1683208991.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Munakoiso", "amount": 450, "unit": "g", "chip": "Munakoiso"}, {"name": "Sokeri", "amount": 3, "unit": "rkl", "chip": "Sokeri"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Pippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkosipuli", "amount": 8, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sian jauheliha", "amount": 115, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Riisietikka", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}], "steps": ["Leikkaa munakoisot lohkoiksi, mausta sokerilla, suolalla ja pippurilla ja anna vetäytyä 20-120 minuuttia.", "Paista puolet valkosipulista öljyssä rapeaksi siruksi, nosta sivuun.", "Ruskista sianjauheliha samassa padassa ja nosta sivuun. Paista munakoisot erissä pehmeän ruskeiksi.", "Lisää vettä, loput valkosipulista, riisietikka, soijakastike, laakerinlehdet ja loppu sokeri, kiehauta.", "Palauta liha ja munakoisot pataan, hauduta miedolla lämmöllä kannen alla noin 20-25 minuuttia, kunnes munakoiso on pehmeää ja kastike vähentynyt puoleen.", "Tarjoile valkosipulisirujen kera keitetyn riisin kanssa."]},

  {"id": "falafel", "name": "Falafelit", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/u5e9qq1763795441.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Auringonkukkaöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Kikherne", "amount": 400, "unit": "g", "chip": "Kikherne"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jauhettu korianteri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuullota sipuli ja valkosipuli öljyssä miedolla lämmöllä noin 5 minuuttia.", "Soseuta kikherneet ja mausteet isossa kulhossa haarukalla tai perunanmuusaimella, kunnes seos on tasaista mutta ei täysin sileää.", "Sekoita joukkoon kuullotettu sipuli-valkosipuli, persilja ja muna, mausta tarpeen mukaan.", "Muotoile seoksesta kuusi palloa ja litistä ne pihveiksi.", "Paista falafelit öljyssä keskilämmöllä noin 3 minuuttia per puoli, kunnes ne ovat kultaisen ruskeita ja kiinteitä.", "Tarjoile kuskusin, pitaleivän tai salaatin kanssa."]},
  {"id": "grillattu-munakoiso-kikhernein", "name": "Grillattu munakoiso kikhernemuhennoksella ja saksanpähkinäkastikkeella", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ctw3ba1763788978.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Inkivääri", "amount": 1, "unit": "pala", "chip": null}, {"name": "Jauhettu kumina", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kikherneet", "amount": 400, "unit": "g", "chip": "Kikherne"}, {"name": "Tomaatti", "amount": 200, "unit": "g", "chip": "Tomaatti"}, {"name": "Sitruunamehu", "amount": 0.5, "unit": "kpl", "chip": null}, {"name": "Munakoiso", "amount": 2, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Kreikkalainen jogurtti", "amount": 200, "unit": "g", "chip": "Jogurtti"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Saksanpähkinät", "amount": 25, "unit": "g", "chip": "Saksanpähkinä"}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuullota silputtu sipuli öljyssä pehmeäksi ja kevyesti ruskistuneeksi, lisää sitten chili, inkivääri ja kumina.", "Lisää kikherneet, tomaatti ja pieni loraus vettä, kiehauta ja anna hautua noin 10 minuuttia. Mausta suolalla, pippurilla ja sitruunamehulla.", "Sivele munakoisoviipaleet öljyllä ja grillaa molemmin puolin kullanruskeiksi ja pehmeiksi.", "Sekoita jogurttiin valkosipuli, suurin osa saksanpähkinöistä ja korianteri. Asettele munakoisot lautaselle, lisää kikhernemuhennos päälle, valuta jogurttikastiketta ja ripottele loput saksanpähkinät ja korianteri päälle."]},
