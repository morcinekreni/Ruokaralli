  {"id": "porsas-hapankaaligoulassi", "name": "Puolalainen porsas-hapankaaligoulassi", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/cyuhwp1764362103.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sianrasva", "amount": 3, "unit": "rkl", "chip": "Sianrasva"}, {"name": "Sipuli", "amount": 4, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kuminansiemen", "amount": null, "unit": null, "chip": null}, {"name": "Possun lapaliha", "amount": 800, "unit": "g", "chip": "Sianliha"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Vehnäjauho", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Paprikajauhe", "amount": null, "unit": null, "chip": null}, {"name": "Naudanliemi", "amount": 1.5, "unit": "l", "chip": "Naudanliemi"}, {"name": "Laakerinlehti", "amount": null, "unit": null, "chip": null}, {"name": "Valkoinen hapankaali", "amount": 400, "unit": "g", "chip": "Hapankaali"}, {"name": "Kuohukerma", "amount": 2, "unit": "dl", "chip": "Kerma"}, {"name": "Smetana", "amount": 4, "unit": "rkl", "chip": "Smetana"}], "steps": ["Kuumenna sianrasva kattilassa ja kuullota hienonnettu sipuli kullanruskeaksi noin 5-8 minuuttia.", "Lisää kuminansiemenet ja possunlihakuutiot, paista ruskeiksi kaikilta puolilta noin 10 minuuttia.", "Lisää valkosipuli ja jauho, mausta hyvin ja lisää paprikajauhe, kypsennä minuutin ajan.", "Kaada joukkoon puolet liemestä, lisää laakerinlehdet ja hauduta kannen alla miedolla lämmöllä 30 minuuttia.", "Lisää hapankaali, loppu liemi ja tilkka hapankaalin nestettä. Hauduta kannen alla 30 minuuttia lisää, kunnes liha on mureaa.", "Sekoita joukkoon kuohukerma ja anna hautua vielä 5 minuuttia. Tarjoile lusikallisen smetanan kanssa."]},
  {"id": "omena-porsaskyljys-bataatti", "name": "Omenainen porsaankyljys paahdetuilla bataateilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/h3ijwo1581013377.jpg", "aiImage": false, "servings": 2, "ingredients": [{"name": "Bataatti", "amount": 2, "unit": "kpl", "chip": "Bataatti"}, {"name": "Omena", "amount": 1, "unit": "kpl", "chip": "Omena"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sitruuna", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Porsaankyljykset", "amount": 2, "unit": "kpl", "chip": "Sianliha"}, {"name": "Kesäkurpitsa", "amount": 1, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Kanaliemi", "amount": null, "unit": null, "chip": "Kanaliemi"}, {"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sokeri", "amount": 1.5, "unit": "tl", "chip": "Sokeri"}, {"name": "Voi", "amount": 2, "unit": "rkl", "chip": "Voi"}], "steps": ["Kuumenna uuni 230 asteeseen. Kuutioi bataatit, ripottele öljyä, suolaa ja pippuria ja paista uunissa 12 minuuttia.", "Viipaloi omena ja kesäkurpitsa. Lisää kesäkurpitsa öljyllä ja mausteilla toiselle pellille ja paista uunissa yhdessä bataattien kanssa noin 12-15 minuuttia, kunnes molemmat ovat pehmeitä ja ruskistuneita.", "Mausta kyljykset suolalla ja pippurilla, paista öljyssä pannulla 4-5 minuuttia puolelta kypsiksi. Nosta lautaselle.", "Sulata voi samalla pannulla, lisää omenaviipaleet ja mausta. Kypsennä pari minuuttia, lisää valkosipuli ja hetken päästä hieman vettä, kanaliemijauhetta ja sokeria.", "Anna kastikkeen sakeutua 3-5 minuuttia, kunnes omena on hyvin pehmeää.", "Lisää loppu voi ja tilkka sitruunamehua kastikkeeseen. Annostele kyljykset, kesäkurpitsa ja bataatit lautasille, kaada omenakastike kyljysten päälle."]},
  {"id": "vietnamilainen-grillattu-porsas", "name": "Vietnamilainen grillattu sianliha nuudeleilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qqwypw1504642429.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Possunliha ohuina viipaleina", "amount": 675, "unit": "g", "chip": "Sianliha"}, {"name": "Riisivermiselli", "amount": 1, "unit": "pkt", "chip": "Riisivermiselli"}, {"name": "Kevätrullat", "amount": 6, "unit": "kpl", "chip": "Kevätrulla"}, {"name": "Salottisipuli", "amount": 3, "unit": "rkl", "chip": "Salottisipuli"}, {"name": "Valkosipuli", "amount": 1.5, "unit": "rkl", "chip": "Valkosipuli"}, {"name": "Sokeri", "amount": 0.6, "unit": "dl", "chip": "Sokeri"}, {"name": "Kalakastike", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Paksu soijakastike", "amount": 0.5, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kurkku", "amount": null, "unit": null, "chip": "Kurkku"}, {"name": "Minttu", "amount": null, "unit": null, "chip": null}, {"name": "Maapähkinät", "amount": null, "unit": null, "chip": "Maapähkinä"}], "steps": ["Viipaloi possunliha hyvin ohuiksi suikaleiksi, esimerkiksi lievästi pakastettuna helpompi leikata.", "Hienonna valkosipuli ja salottisipuli, sekoita kulhossa sokerin, kalakastikkeen, soijakastikkeen, pippurin ja öljyn kanssa, kunnes sokeri liukenee.", "Marinoi liha seoksessa vähintään tunti, mieluiten yön yli jääkaapissa.", "Paista lihaa uunissa noin 190 asteessa 10-15 minuuttia, kunnes se on lähes kypsä, ja viimeistele grillaamalla, kunnes pinta on kauniin ruskea.", "Keitä riisivermiselli pakkauksen ohjeen mukaan ja jäähdytä.", "Kokoa kulhot nuudeleista, kurkusta, mintusta ja grillatusta lihasta, ripottele maapähkinöitä ja lisää haluamasi verran kastiketta päälle."]},
  {"id": "wontonit", "name": "Kiinalaiset paistetut wontonit", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1525876468.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sian jauheliha", "amount": 450, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": null, "unit": null, "chip": null}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Seesamiöljy", "amount": null, "unit": null, "chip": "Seesamiöljy"}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 3, "unit": "kpl", "chip": "Selleri"}, {"name": "Kevätsipuli", "amount": 6, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Wonton-kääretaikinat", "amount": 1, "unit": "pkt", "chip": "Wonton-kääretaikina"}, {"name": "Öljy paistamiseen", "amount": null, "unit": null, "chip": null}, {"name": "Vesi", "amount": null, "unit": null, "chip": null}], "steps": ["Sekoita kulhossa jauheliha, hienonnettu valkosipuli, raastettu inkivääri, soijakastike, seesamiöljy sekä hienonnetut porkkana, selleri ja kevätsipuli.", "Erottele wonton-kääretaikinat toisistaan. Lusikoi kunkin keskelle kekomainen teelusikallinen täytettä.", "Kostuta taikinan kaksi reunaa vedellä ja taita kolmioksi, painaen reunat tiiviisti kiinni.", "Nipistä kolmion kaksi ulointa kärkeä yhteen niin, että syntyy perinteinen wonton-muoto.", "Kuumenna öljy noin 230 asteeseen ja paista wontoneja 4-5 kerrallaan kullanruskeiksi.", "Valuta ylimääräinen öljy talouspaperilla ja tarjoile dippikastikkeen kanssa."]},
  {"id": "zapiekanki", "name": "Puolalainen sämpylägratiini (zapiekanki)", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/72lmpt1764122511.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Patonki", "amount": 2, "unit": "kpl", "chip": "Patonki"}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Rypsiöljy", "amount": 2, "unit": "tl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Herkkusieni", "amount": 300, "unit": "g", "chip": "Sieni"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Majoneesi", "amount": 1, "unit": "rkl", "chip": "Majoneesi"}, {"name": "Cheddarjuusto", "amount": 50, "unit": "g", "chip": "Juusto"}, {"name": "Kinkku", "amount": 75, "unit": "g", "chip": "Kinkku"}, {"name": "Puolalainen kabanossi-makkara", "amount": 75, "unit": "g", "chip": "Kabanossi-makkara"}, {"name": "Mozzarella", "amount": 50, "unit": "g", "chip": "Juusto"}, {"name": "Tilli", "amount": null, "unit": null, "chip": null}, {"name": "Ruohosipuli", "amount": null, "unit": null, "chip": null}, {"name": "Ketsuppi", "amount": null, "unit": null, "chip": "Ketsuppi"}], "steps": ["Kuumenna uuni 200 asteeseen ja paahda patongit uunissa 8-10 minuuttia, anna jäähtyä.", "Kuullota silputtu sipuli voi-öljyseoksessa 5 minuuttia, lisää sienet ja paista 5-10 minuuttia, kunnes neste haihtuu. Lisää valkosipuli, mausta ja sekoita joukkoon majoneesi.", "Halkaise patongit pituussuunnassa, levitä sienitäyte päälle ja ripottele cheddar, kinkku, kabanossi ja mozzarella.", "Paista uunissa 8-10 minuuttia, kunnes juusto sulaa ja saa väriä.", "Kuullota erikseen loput sipulit voi-öljyseoksessa kullanruskeiksi ja pehmeiksi.", "Nosta karamellisoitu sipuli valmiiden gratiinien päälle, ripottele tilliä ja ruohosipulia sekä pieni loraus ketsuppia."]},
  {"id": "bai-sach-chrouk", "name": "Kambodžalainen grillattu sianliha riisillä", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/f0cdwk1782688162.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Possun lapaliha", "amount": 650, "unit": "g", "chip": "Sianliha"}, {"name": "Kookosmaito", "amount": 0.6, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Soijakastike", "amount": 3, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Osterikastike", "amount": 2, "unit": "rkl", "chip": "Osterikastike"}, {"name": "Hunaja", "amount": 2, "unit": "rkl", "chip": "Hunaja"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Jasmiiniriisi", "amount": 4.8, "unit": "dl", "chip": "Riisi"}, {"name": "Vesi", "amount": null, "unit": null, "chip": null}, {"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kurkku", "amount": 1, "unit": "kpl", "chip": "Kurkku"}, {"name": "Korianterin lehdet", "amount": null, "unit": null, "chip": null}], "steps": ["Sekoita kulhossa kookosmaito, soijakastike, osterikastike, hunaja, hienonnettu valkosipuli ja mustapippuri marinadiksi.", "Lisää ohuiksi viipaloitu possunliha marinadiin, peitä ja anna maustua jääkaapissa vähintään 30 minuuttia.", "Huuhtele jasmiiniriisi kylmällä vedellä, keitä riisin ja veden kanssa kannen alla kypsäksi noin 15 minuuttia.", "Kuumenna grillipannu tai grilli keskikuumaksi ja voitele öljyllä. Grillaa lihaviipaleet 3-4 minuuttia puolelta, kunnes ne ovat kypsiä ja rapean ruskeita.", "Anna lihan levätä muutama minuutti ennen viipalointia, jotta se säilyttää mehukkuutensa.", "Tarjoile grillattu sianliha riisin, viipaloidun kurkun ja tuoreen korianterin kanssa."]},
  {"id": "bbq-possusamnpylat", "name": "Vietnamilaiset BBQ-possusämpylät", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/tzsy461763769901.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sokeri", "amount": 85, "unit": "g", "chip": "Sokeri"}, {"name": "Vaalea leipätaikinaseos", "amount": 500, "unit": "g", "chip": "Taikinapohja"}, {"name": "Auringonkukkaöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Pekoni", "amount": 12, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Inkivääri", "amount": null, "unit": null, "chip": null}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Kirkas hunaja", "amount": 3, "unit": "rkl", "chip": "Hunaja"}, {"name": "Tomaattipyree", "amount": 3, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Sekoita sokeri leipätaikinaseokseen ja lisää vesi pakkauksen ohjeen mukaan. Vaivaa taikina sileäksi noin 5 minuuttia.", "Peitä taikina ja anna kohota lämpimässä paikassa, kunnes se on kaksinkertaistunut.", "Paista pekonia öljyssä rapeaksi noin 5 minuuttia. Lisää inkivääri ja valkosipuli ja paista minuutin verran. Sekoita joukkoon soijakastike, hunaja ja tomaattipyree.", "Painele kohonneesta taikinasta 12 palloa, litistä ja lisää keskelle lusikallinen täytettä. Nypi taikina kiinni kuten kukkaro ja käännä sauma alaspäin.", "Anna sämpylöiden kohota vielä noin 30 minuuttia, siveltele munalla ja paista uunissa 200 asteessa 20 minuuttia kullanruskeiksi.", "Tarjoile lämpimänä dippikastikkeen kanssa."]},
  {"id": "belgialainen-stoemp", "name": "Belgialainen stoemp-perunasose makkaralla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/byolko1782500400.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 450, "unit": "g", "chip": "Peruna"}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Savoijinkaali", "amount": 200, "unit": "g", "chip": "Kaali"}, {"name": "Grillimakkara", "amount": 2, "unit": "kpl", "chip": "Makkara"}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Suolaton voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Vaalea olut", "amount": 2.4, "unit": "dl", "chip": "Olut"}, {"name": "Kevytmaito", "amount": 0.6, "unit": "dl", "chip": "Maito"}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Muskottipähkinä", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Keitä kuutioidut perunat ja valkosipulinkynnet suolatussa vedessä kypsiksi.", "Paista suikaloitu savoijinkaali voissa pehmeäksi noin 15-20 minuutin ajan, maustaen suolalla ja pippurilla.", "Paista makkarat toisessa pannussa kullanruskeiksi ja nosta odottamaan lämpimänä.", "Kuullota samassa pannussa sipuli, lisää olut ja anna kiehua kokoon kastikkeeksi.", "Soseuta kuumat perunat kaalin, persiljan, maidon ja loppuvoin kanssa, mausta muskotilla, suolalla ja pippurilla.", "Annostele perunasose lautasille, nosta päälle makkarat ja valuta olut-sipulikastiketta."]},
  {"id": "bryndzove-halusky", "name": "Slovakialaiset lammaskeso-perunanytyt pekonilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/g33c901763365484.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna, raastettu", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Vehnäjauho", "amount": 200, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Bryndza-lampaanjuusto (tai fetan ja smetanan seos)", "amount": 250, "unit": "g", "chip": "Juusto"}, {"name": "Pekoni", "amount": 200, "unit": "g", "chip": "Pekoni"}, {"name": "Ruohosipuli", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Raasta perunat hienoksi ja sekoita joukkoon jauhot, kananmuna ja suola, kunnes syntyy sitkeä taikina.", "Pursota tai raaputa taikinasta pieniä nytyt kiehuvaan suolattuun veteen ja anna niiden kypsyä, kunnes ne nousevat pintaan.", "Paista pekoni rapeaksi pannulla erikseen.", "Sekoita bryndza-juusto (tai feta ja smetana) kuumien nyttyjen joukkoon, kunnes seos on kermaista.", "Annostele lautasille, ripottele päälle rapea pekoni ja pekonin rasva sekä silputtu ruohosipuli."]},
  {"id": "kikherne-chorizo-pinaattipata", "name": "Kikherne-chorizopata pinaatilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xvnx8j1763287209.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri, kuutioitu", "amount": 1, "unit": "varsi", "chip": "Selleri"}, {"name": "Timjami", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Chorizomakkara", "amount": 200, "unit": "g", "chip": "Chorizo"}, {"name": "Kaneli", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kikherne", "amount": 800, "unit": "g", "chip": "Kikherne"}, {"name": "Sherryetikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Pinaatti", "amount": 400, "unit": "g", "chip": "Pinaatti"}], "steps": ["Kuullota sipuli öljyssä pehmeäksi, lisää porkkana, selleri, timjami ja laakerinlehti ja jatka paistamista pari minuuttia.", "Lisää valkosipuli, chorizo, kaneli ja paprikajauhe ja paista, kunnes chorizo alkaa vapauttaa punaista rasvaansa.", "Kaada joukkoon kikherneet, sherryetikka ja hieman vettä, anna kiehahtaa pari minuuttia.", "Sekoita pinaatti joukkoon ja anna sen lässähtää.", "Tarkista maku ja tarjoa lämpimänä rapean leivän kanssa."]},
  {"id": "chorizo-munasalaatti", "name": "Chorizo- ja munasalaatti", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/v8eaed1763257313.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Uusi peruna", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vihreä papu", "amount": 225, "unit": "g", "chip": "Vihreä papu"}, {"name": "Chorizomakkara, viipaloituna", "amount": 225, "unit": "g", "chip": "Chorizo"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Sherryetikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Keitä perunoita kiehuvassa suolavedessä 12 minuuttia, lisää kananmunat 6 minuutin kohdalla ja pavut viimeisiksi kahdeksi minuutiksi.", "Valuta kaikki ja jäähdytä munat kylmässä vedessä.", "Paista chorizoviipaleet pannussa rapeiksi, nosta sivuun ja jätä rasva pannuun.", "Kuullota valkosipuli samassa rasvassa hetki, ota pannu pois liedeltä ja sekoita joukkoon etikka ja persilja.", "Yhdistä kastike perunoihin, papuihin ja chorizoon, kuori ja lohko munat ja lisää salaattiin."]},
  {"id": "chorizo-tomaattisalaatti", "name": "Chorizo- ja tomaattisalaatti", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6cskio1763338156.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Isokokoinen tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Punasipuli", "amount": 0.5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Timjami", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Sherryetikka", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Chorizomakkara, viipaloituna", "amount": 100, "unit": "g", "chip": "Chorizo"}], "steps": ["Lohko tomaatit ja sekoita ne kulhossa sipulin ja timjamin kanssa.", "Mausta suolalla ja pippurilla, valuta päälle etikka ja öljy ja anna maustua hetken aikaa.", "Paista chorizoviipaleet kuivalla pannulla molemmin puolin ruskeiksi.", "Nosta paistettu chorizo tomaattien päälle ja valuta pannuun jäänyttä öljyä salaatin päälle."]},
  {"id": "chorizo-peruna-juustomunakas", "name": "Chorizo-peruna-juustomunakas", "category": "Aamiainen", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0y6uvc1763258983.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna, pieni", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Oliiviöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Chorizomakkara", "amount": 50, "unit": "g", "chip": "Chorizo"}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Cheddarjuusto, raastettu", "amount": 25, "unit": "g", "chip": "Juusto"}], "steps": ["Keitä peruna kiehuvassa vedessä 8-10 minuuttia kypsäksi, valuta ja anna höyrystyä hetki.", "Paista chorizo öljyssä pari minuuttia, lisää peruna ja paista muutama minuutti lisää, kunnes peruna alkaa rapistua.", "Nosta chorizo ja peruna hetkeksi sivuun ja pyyhi pannu.", "Vatkaa munat ja kaada pannulle, anna hyytyä hieman ja ripottele päälle chorizo, peruna, persilja ja juusto.", "Taita munakas kokoon ja anna vielä minuutin verran, kunnes juusto sulaa."]},
  {"id": "rapeat-makkarat-lehtivihannekset", "name": "Rapeat makkarat ja paahdetut lehtivihannekset", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/st1ifa1583267248.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lehtikaali", "amount": 1, "unit": "nippu", "chip": "Lehtikaali"}, {"name": "Fenkolimakkara", "amount": 8, "unit": "kpl", "chip": "Makkara"}, {"name": "Kaali, karkeasti pilkottu", "amount": 500, "unit": "g", "chip": "Kaali"}, {"name": "Valkosipulinkynsi", "amount": 8, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sipuli, viipaloitu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Shiitakesieni, viipaloitu", "amount": 150, "unit": "g", "chip": "Sieni"}, {"name": "Kanaliemi", "amount": 2.4, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Kuumenna uuni 175 asteeseen. Revi lehtikaalin lehdet paloiksi ja pilko kaali karkeasti.", "Levitä vihannekset uunivuokaan ja lisää valkosipuli, tarvittaessa myös kuullotettu sipuli ja shiitakesienet.", "Valuta joukkoon hieman öljyä ja kanaliemi, peitä foliolla ja paista noin 15 minuuttia, kunnes lehdet lässähtävät.", "Poista folio, mausta suolalla ja pippurilla ja jatka paistamista 20-25 minuuttia, kunnes kaali on mureaa.", "Paista samaan aikaan makkarat pannulla ruskeiksi ja kypsiksi, viipaloi ja sekoita vihannesten joukkoon tarjoiluvaiheessa."]},
  {"id": "kuumahapan-keitto", "name": "Kiinalainen kuumahapan keitto", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1529445893.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanaliemi", "amount": 6, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Herkkusieni", "amount": 80, "unit": "g", "chip": "Sieni"}, {"name": "Mustasieni", "amount": 80, "unit": "g", "chip": "Sieni"}, {"name": "Tofu, kuutioitu", "amount": 160, "unit": "g", "chip": "Tofu"}, {"name": "Sianliha, suikaloitu", "amount": 120, "unit": "g", "chip": "Sianliha"}, {"name": "Soijakastike", "amount": 1, "unit": "tl", "chip": "Soijakastike"}, {"name": "Maissitärkkelys", "amount": 1, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Kevätsipuli", "amount": 0.6, "unit": "dl", "chip": "Kevätsipuli"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Sokeri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Seesamiöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkopippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Chilikastike", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Riisietikka", "amount": 3.6, "unit": "dl", "chip": null}, {"name": "Vesi", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna kanaliemi wokissa kiehuvaksi ja mausta suolalla, sokerilla, seesamiöljyllä, valkopippurilla, chilikastikkeella, etikalla ja soijakastikkeella.", "Lisää tofu, herkkusienet ja mustasienet ja anna kiehua hetki.", "Sekoita maissitärkkelys veteen ja kaada ohuena nauhana keittoon sitä koko ajan sekoittaen, kunnes keitto sakenee.", "Vatkaa muna kevyesti ja valuta se ohuena nauhana kiehuvaan keittoon, sekoita muutama sekunti.", "Sekoita joukkoon paloiteltu sianliha ja tarjoile keitto kulhoissa kevätsipulisilpulla koristeltuna."]},
  {"id": "raspeballer-perunanyytit", "name": "Norjalaiset raspeballer-perunanytyt", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hhm7xy1763075871.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Possunpotka", "amount": 1, "unit": "kpl", "chip": "Possunpotka"}, {"name": "Savumakkara", "amount": 1, "unit": "kpl", "chip": "Makkara"}, {"name": "Keitetty peruna", "amount": 450, "unit": "g", "chip": "Peruna"}, {"name": "Raaka peruna, raastettu", "amount": 900, "unit": "g", "chip": "Peruna"}, {"name": "Ohrajauho", "amount": 300, "unit": "g", "chip": "Ohrajauho"}, {"name": "Vehnäjauho", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Liemikuutio", "amount": 4, "unit": "kpl", "chip": "Liemikuutio"}, {"name": "Persilja", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Lanttu", "amount": 1, "unit": "kpl", "chip": "Lanttu"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kuohukerma", "amount": 0.6, "unit": "dl", "chip": "Kerma"}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Muskottipähkinä", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Halutessasi keitä possunpotkaa kevyesti kiehuvassa vedessä noin 3 tuntia, kunnes liha irtoaa luusta; ota talteen liemi.", "Keitä osa perunoista kuoriin, jäähdytä ja kuori, raasta loput raa'at perunat ja purista niistä ylimääräinen neste pois.", "Soseuta keitetyt perunat, sekoita joukkoon raastetut raa'at perunat, jauhot ja suola käsin tasaiseksi taikinaksi.", "Kuumenna liemi tai liemikuutioista tehty liemi kevyeen kiehumiseen, muotoile taikinasta kostein käsin nyttyjä ja liu'uta ne varovasti liemeen kypsymään noin 30 minuuttia.", "Lämmitä makkara samassa liemessä ja ripottele nyttyjen päälle persiljaa.", "Keitä kuutioidut lanttu ja porkkana pehmeiksi, soseuta kerman, voin ja muskotin kanssa ja tarjoile lisukkeena nyttyjen ja lihan kanssa."]},
  {"id": "imelahappoinen-porsas", "name": "Imelähapan porsas", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1529442316.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porsaan sisäfilee, suikaloituna", "amount": 200, "unit": "g", "chip": "Sianliha"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maissitärkkelys", "amount": 20, "unit": "g", "chip": "Maissitärkkelys"}, {"name": "Vaalea soijakastike", "amount": 10, "unit": "g", "chip": "Soijakastike"}, {"name": "Tomaattipyree", "amount": 30, "unit": "g", "chip": "Tomaattipyree"}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Riisietikka", "amount": 10, "unit": "g", "chip": null}, {"name": "Vesi", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Erottele munan valkuainen ja keltuainen. Sekoita valkuainen, hieman suolaa, tärkkelystä ja soijakastiketta, ja marinoi porsassuikaleita seoksessa noin 20 minuuttia.", "Sekoita loppu tärkkelys veteen ja etikkaan sakeaksi liemeksi.", "Kuumenna öljy ja paista marinoidut suikaleet rapeiksi, nosta sivuun.", "Kuumenna samassa öljyssä tomaattipyree ja sokeri, lisää vettä ja keitä kunnes kastike on tasainen.", "Lisää tärkkelysliemi kastikkeeseen sakeuttamaan, palauta liha joukkoon ja sekoita, kunnes kaikki on tasaisesti kastikkeen peitossa.", "Tarjoile koristeltuna tuoreella korianterilla."]},
  {"id": "thaimainen-porsas-maapahkinacurry", "name": "Thaimainen porsas-maapähkinäcurry", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/snmtd61763426568.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kasviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kevätsipuli", "amount": 1, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Porsaan sisäfilee, viipaloitu", "amount": 400, "unit": "g", "chip": "Sianliha"}, {"name": "Punainen currytahna", "amount": 4, "unit": "rkl", "chip": "Currytahna"}, {"name": "Maapähkinävoi", "amount": 4, "unit": "rkl", "chip": "Maapähkinävoi"}, {"name": "Ruskea sokeri", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Kookosmaito", "amount": 400, "unit": "ml", "chip": "Kookosmaito"}, {"name": "Maissi", "amount": 175, "unit": "g", "chip": "Maissi"}, {"name": "Limemehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Jasmiiniriisi", "amount": 300, "unit": "g", "chip": "Riisi"}], "steps": ["Kuumenna öljy kattilassa ja paista kevätsipuli ja korianterin varret hetki.", "Lisää porsassuikaleet ja paista, kunnes ne alkavat ruskistua.", "Sekoita joukkoon currytahna ja maapähkinävoi, anna kuumeta hetki ja lisää sokeri, soijakastike ja kookosmaito sekä hieman vettä.", "Anna kastikkeen hautua kannen alla noin 15 minuuttia välillä sekoittaen.", "Lisää maissi ja keitä pari minuuttia, kunnes maissi on kypsää ja kastike hieman sakenee.", "Mausta limemehulla ja tarjoile riisin sekä korianterinlehtien kanssa."]},
  {"id": "tonkatsu-sianliha", "name": "Japanilainen tonkatsu-sianliha", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lwsnkl1604181187.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porsaan kylkiliha", "amount": 4, "unit": "kpl", "chip": "Sianliha"}, {"name": "Vehnäjauho", "amount": 100, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna, vatkattu", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Panko-korppujauho", "amount": 100, "unit": "g", "chip": "Korppujauho"}, {"name": "Kasviöljy paistamiseen", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Ketsuppi", "amount": 2, "unit": "rkl", "chip": "Ketsuppi"}, {"name": "Worcestershire-kastike", "amount": 2, "unit": "rkl", "chip": "Worcestershire-kastike"}, {"name": "Osterikastike", "amount": 1, "unit": "rkl", "chip": "Osterikastike"}, {"name": "Sokeri", "amount": 2, "unit": "rkl", "chip": "Sokeri"}], "steps": ["Poista kylkilihoista rasvareunat ja taputtele leivinpaperien välissä noin sentin paksuisiksi.", "Pane jauho, vatkatut munat ja panko-korppujauho omiin astioihinsa, mausta liha ja panerion se ensin jauhossa, sitten munassa ja lopuksi korppujauhossa.", "Kuumenna runsaasti öljyä pannussa noin 180 asteeseen ja paista lihat parittain noin 1,5 minuuttia puolelta, anna vetäytyä ritilällä.", "Sekoita kastikkeen ainekset keskenään, lisää tarvittaessa tilkka vettä.", "Viipaloi paistettu tonkatsu ja tarjoile kastikkeen kanssa."]},
  {"id": "chorizo-kikhernekeitto", "name": "Chorizo-kikhernekeitto", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/kggfo91763288633.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Chorizomakkara, paloiteltu", "amount": 110, "unit": "g", "chip": "Chorizo"}, {"name": "Savoijinkaali, silputtu", "amount": 140, "unit": "g", "chip": "Kaali"}, {"name": "Chilihiutale", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Kikherne", "amount": 400, "unit": "g", "chip": "Kikherne"}, {"name": "Kanaliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kanaliemi"}, {"name": "Rapea leipä tarjoiluun", "amount": 4, "unit": "viipaletta", "chip": "Leipä"}], "steps": ["Kuumenna kattilassa tomaattimurska ja tölkillinen vettä.", "Paloittele sillä aikaa chorizo ja silppua kaali.", "Lisää chorizo, kaali, chilihiutaleet ja kikherneet kattilaan, murustele joukkoon liemikuutio.", "Anna kiehua kannen alla korkealla lämmöllä noin 6 minuuttia, kunnes kaali on juuri ja juuri kypsää.", "Tarjoile kuumana rapean leivän kanssa."]},
  {"id": "jamon-karhunlaukkakroketit", "name": "Jamón- ja karhunlaukkakroketit", "category": "Alkuruoka", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/zc9cwz1763196177.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Karhunlaukan lehti", "amount": 150, "unit": "g", "chip": "Karhunlaukka"}, {"name": "Maito", "amount": 350, "unit": "ml", "chip": "Maito"}, {"name": "Oliiviöljy", "amount": 45, "unit": "g", "chip": null}, {"name": "Vehnäjauho", "amount": 65, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Manchegojuusto, raastettu", "amount": 35, "unit": "g", "chip": "Juusto"}, {"name": "Jamón ibérico -kinkku, hienonnettu", "amount": 80, "unit": "g", "chip": "Kinkku"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Panko-korppujauho", "amount": 75, "unit": "g", "chip": "Korppujauho"}, {"name": "Kasviöljy paistamiseen", "amount": 1, "unit": "l", "chip": null}], "steps": ["Huuhtele karhunlaukan lehdet, kaada niiden päälle kiehuvaa vettä kunnes lässähtävät, huuhtele kylmällä vedellä ja hienonna.", "Lämmitä maito kattilassa. Kuumenna toisessa kattilassa öljy tai voi ja lisää jauho, paista hetki ja lisää lämmin maito vähitellen sakeaksi bechamelksi.", "Sekoita joukkoon manchego, jamón ja karhunlaukka, mausta, kaada vuokaan ja anna jäähtyä kylmässä vähintään tunti.", "Muotoile massasta öljytyillä käsillä noin 20 palloa ja pakasta 30 minuuttia kiinteytymään.", "Panerio pallot ensin vatkatussa munassa ja sitten korppujauhossa.", "Paista kroketit runsaassa 170-asteisessa öljyssä kullanruskeiksi ja rapeiksi, valuta ja tarjoile lämpimänä."]},
  {"id": "avoin-perunavoileipa", "name": "Tanskalainen avoin perunavoileipä", "category": "Aamiainen", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wooxjq1784663522.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Uusi peruna", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Pekoni", "amount": 4, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Majoneesi", "amount": 4, "unit": "rkl", "chip": "Majoneesi"}, {"name": "Ruohosipuli", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Ruisleipä", "amount": 8, "unit": "viipaletta", "chip": "Leipä"}, {"name": "Punasipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Vehnäjauho", "amount": 120, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kasviöljy paistamiseen", "amount": 3, "unit": "dl", "chip": null}, {"name": "Merisuola", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Keitä pestyjä perunoita suolatussa vedessä noin 10 minuuttia, anna vetäytyä liemessä vielä 5 minuuttia ja valuta.", "Paista pekoniviipaleet rapeiksi ja nosta talouspaperin päälle.", "Viipaloi punasipuli renkaiksi, panerio jauhossa ja paista kuumassa öljyssä kullanruskeiksi ja rapeiksi.", "Voitele ruisleipäviipaleet ja järjestä niiden päälle perunaviipaleet.", "Lisää päälle reilusti majoneesia, rapeat sipulirenkaat, pekoni ja silputtu ruohosipuli."]},
  {"id": "portugalilainen-grillisianliha", "name": "Portugalilainen grillisianliha ranskalaisilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/cybyue1614349443.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porsaan sisäfilee", "amount": 700, "unit": "g", "chip": "Sianliha"}, {"name": "Valkoviini", "amount": 200, "unit": "ml", "chip": "Valkoviini"}, {"name": "Paprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Sitruuna", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Sitruunamehu", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Oliiviöljy", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Majoneesi tarjoiluun", "amount": 4, "unit": "rkl", "chip": "Majoneesi"}, {"name": "Peruna", "amount": 1000, "unit": "g", "chip": "Peruna"}, {"name": "Kasviöljy paistamiseen", "amount": 1, "unit": "l", "chip": null}], "steps": ["Leikkaa sisäfilee viiteen palaan ja taputtele muovipussin sisällä ohuiksi lihalätkiksi.", "Marinoi lihat viinissä, paprikajauheessa, suolassa, pippurissa ja puolikkaan sitruunan mehussa 20-30 minuuttia.", "Leikkaa perunat ranskalaisiksi, liota kylmässä vedessä ja kuivaa hyvin.", "Esipaista ranskalaiset noin 130-asteisessa öljyssä 8-10 minuuttia, anna jäähtyä ja paista sitten 180-asteisessa öljyssä rapeiksi ja kullanruskeiksi.", "Grillaa tai paista marinoidut lihat kuumalla pannulla tai grillillä noin minuutti puolelta.", "Kasaa lautaselle ranskalaiset ja niiden päälle lihat, valuta paistoliemi päälle ja tarjoile majoneesin ja sitruunalohkon kanssa."]},
  {"id": "lammas-tomaatti-makeat-mausteet", "name": "Lammasta täytetyissä viininlehdissä makeilla mausteilla", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qtwtss1468572261.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Tuore inkivääri", "amount": 4, "unit": "cm pala", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Tomaatti", "amount": 1000, "unit": "g", "chip": "Tomaatti"}, {"name": "Sitruunamehu", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suolatut viininlehdet", "amount": 50, "unit": "kpl", "chip": "Viininlehdet"}, {"name": "Fenkoli", "amount": 1, "unit": "kpl", "chip": "Fenkoli"}, {"name": "Lampaan jauheliha", "amount": 400, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Peruna, raastettu", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Basmatiriisi", "amount": 2, "unit": "rkl", "chip": "Riisi"}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Korianteri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Neilikka, jauhettu", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kaneli, jauhettu", "amount": 0.5, "unit": "tl", "chip": null}], "steps": ["Huuhtele suolatut viininlehdet, liota niitä kiehuvassa vedessä 10 minuuttia ja anna kuivua liinan päällä.", "Sekoita täyte: lampaan jauheliha, sipuli, raastettu peruna, riisi, yrtit ja mausteet, lisää joukkoon karkeasti raastetut tomaatit ja mausta suolalla ja pippurilla.", "Keitä valkosipulista, inkivääristä, tomaatista, sitruunamehusta ja sokerista makea tomaattikastike noin 20 minuuttia.", "Levitä viininlehtien alle fenkolisiivuja padan pohjalle, aseta lusikallinen täytettä kunkin lehden keskelle ja kääri tiiviiksi rullaksi.", "Latele rullat tiiviisti pataan, kaada päälle tomaattikastike ja tarvittaessa hieman vettä, paina painolla ja hauduta kannen alla noin 70 minuuttia.", "Anna jäähtyä hetki ennen tarjoilua ja koristele korianterilla, tarjoile riisin kanssa."]},
  {"id": "chorba-hamra-bel-frik", "name": "Algerialainen lammas-tomaattikeitto frikellä", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/p9tebp1764118792.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Freekeh (poltettu vehnä)", "amount": 240, "unit": "g", "chip": "Freekeh"}, {"name": "Lampaanliha, kuutioitu", "amount": 340, "unit": "g", "chip": "Lampaanliha"}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Kasviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Minttu", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Selleri", "amount": 1, "unit": "varsi", "chip": "Selleri"}, {"name": "Kikherne", "amount": 400, "unit": "g", "chip": "Kikherne"}, {"name": "Vesi", "amount": 9.5, "unit": "dl", "chip": null}, {"name": "Kesäkurpitsa, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Porkkana, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Peruna, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Peruna"}], "steps": ["Liota freekeh kylmässä vedessä sivuun odottamaan.", "Yhdistä padassa lampaanliha, sipuli, mausteet, öljy, puolet korianterista ja mintusta sekä sellerin varsi, hauduta matalalla lämmöllä 15 minuuttia.", "Lisää kikherneet ja vettä juuri sen verran, että aineet peittyvät, anna kiehahtaa ja lisää kesäkurpitsa, porkkana ja tomaattipyree.", "Höyrytä tomaatit padan päällä pehmeiksi, murskaa ne lusikalla keittoon ja poista kuoret.", "Lisää peruna ja vettä peittävästi, keitä noin 10 minuuttia pehmeäksi.", "Valuta freekeh joukkoon ja keitä vielä 15 minuuttia, poista sellerinvarsi ja viimeistele lopuilla yrteillä."]},
  {"id": "tunisialainen-lammaskeitto", "name": "Tunisialainen lammaskeitto", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/t8mn9g1560460231.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaan jauheliha", "amount": 500, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Valkosipulinkynsi", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Pinaatti", "amount": 300, "unit": "g", "chip": "Pinaatti"}, {"name": "Tomaattipyree", "amount": 3, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Jeera (kumina)", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kanaliemi", "amount": 1, "unit": "l", "chip": "Kanaliemi"}, {"name": "Harissatahna", "amount": 3, "unit": "tl", "chip": "Harissa"}, {"name": "Kikherne", "amount": 400, "unit": "g", "chip": "Kikherne"}, {"name": "Sitruunamehu", "amount": 0.5, "unit": "kpl", "chip": null}, {"name": "Makaronipasta", "amount": 150, "unit": "g", "chip": "Pasta"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Ruskista lampaan jauheliha padassa kovalla lämmöllä ja nosta hetkeksi sivuun.", "Jätä pataan ruokalusikallinen rasvaa, kuullota siinä valkosipuli, sipuli ja pinaatti noin 5 minuuttia, kunnes sipuli on läpikuultavaa ja pinaatti lässähtänyt.", "Palauta liha joukkoon ja lisää tomaattipyree, kumina, kanaliemi, harissa, kikherneet, sitruunamehu, suola ja pippuri.", "Anna hautua matalalla lämmöllä noin 20 minuuttia.", "Lisää makaronit ja keitä vielä noin 15 minuuttia, kunnes pasta on kypsää."]},
  {"id": "vietnamilaiset-lampaanpotkat-bataatilla", "name": "Vietnamilaiset lampaanpotkat bataatilla", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7xte3u1763757761.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Maapähkinäöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Lampaanpotka", "amount": 4, "unit": "kpl", "chip": "Lampaanpotka"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Tuore inkivääri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Punainen chili", "amount": 2, "unit": "kpl", "chip": "Chili"}, {"name": "Ruskea sokeri", "amount": 2, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Tähtianis", "amount": 3, "unit": "kpl", "chip": null}, {"name": "Sitruunaruoho", "amount": 2, "unit": "vartta", "chip": "Sitruunaruoho"}, {"name": "Lampaanliemi", "amount": 1, "unit": "l", "chip": "Lampaanliemi"}, {"name": "Tomaattipyree", "amount": 1.5, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Bataatti", "amount": 4, "unit": "kpl", "chip": "Bataatti"}, {"name": "Kalakastike", "amount": 2, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Limemehu", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Minttu", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Basilika", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuumenna uuni 150 asteeseen. Ruskista lampaanpotkat öljyssä padassa erissä joka puolelta.", "Nosta lihat sivuun ja kuullota samassa padassa sipuli, lisää inkivääri, valkosipuli ja chili ja paista hetki.", "Lisää sokeri, tähtianis, sitruunaruoho, lampaanliemi ja tomaattipyree, mausta ja kuumenna kiehuvaksi.", "Palauta lihat pataan, peitä ja hauduta uunissa noin 1,5 tuntia.", "Lisää bataatit ja jatka haudutusta vielä noin tunti, kunnes liha irtoaa luusta.", "Mausta lopuksi kalakastikkeella ja limemehulla,   {"id": "kelem-dolmasi", "name": "Kelem dolmasi – täytetyt kaalikääryleet", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7vdtqi1780160088.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaan jauheliha", "amount": 500, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Iso kaali", "amount": 1, "unit": "kpl", "chip": "Kaali"}, {"name": "Sipuli", "amount": 225, "unit": "g", "chip": "Sipuli"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Kurkuma", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Korianteri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Tilli", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Riisi", "amount": 60, "unit": "g", "chip": "Riisi"}, {"name": "Kikherne, karkeasti murskattu", "amount": 60, "unit": "g", "chip": "Kikherne"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Vesi", "amount": 3, "unit": "rkl", "chip": null}], "steps": ["Sekoita lampaan jauheliha, hienonnettu sipuli, mausteet, yrtit, riisi ja karkeasti murskatut kikherneet käsin tasaiseksi täytteeksi.", "Keitä koko kaali suolatussa vedessä muutaman minuutin ajan, kunnes uloimmat lehdet irtoavat helposti, ja irrota lehdet varovasti; toista tarvittaessa.", "Leikkaa lehtien paksut rungot pois ja jaa isoimmat lehdet kahtia.", "Lado lusikallinen täytettä kunkin lehden reunaan ja kääri tiiviiksi pieneksi kääryleeksi.", "Vuoraa padan pohja jäljelle jääneillä kaalinlehdillä ja rungoilla, aseta kääryleet niiden päälle, lisää vettä lähes peittäväksi ja paina painolla.", "Keitä kannen alla noin 25 minuuttia, kaada päälle tomaattipyreestä ja vedestä tehty kastike ja jatka vielä 5 minuuttia."]},
  {"id": "lammas-aprikoosipyorykat", "name": "Lammas-aprikoosipyörykät tomaattikastikkeessa", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/72fgzj1764109947.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Punasipuli, hienonnettu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Jeera (kumina)", "amount": 2, "unit": "tl", "chip": null}, {"name": "Korianteri, jauhettu", "amount": 2, "unit": "tl", "chip": null}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Sokeri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Minttu", "amount": 10, "unit": "g", "chip": null}, {"name": "Lampaan jauheliha", "amount": 500, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Kuivatut aprikoosit, pilkotut", "amount": 8, "unit": "kpl", "chip": "Kuivatut aprikoosit"}, {"name": "Korppujauho", "amount": 50, "unit": "g", "chip": "Korppujauho"}, {"name": "Pitaleipä tarjoiluun", "amount": 4, "unit": "kpl", "chip": "Pitaleipä"}], "steps": ["Kuumenna hieman öljyä ja kuullota sipulia noin 5 minuuttia, lisää valkosipuli ja mausteet ja paista vielä hetki.", "Ota puolet sipuliseoksesta jäähtymään, lisää loppuun tomaattimurska, sokeri ja mausteet ja hauduta noin 10 minuuttia kastikkeeksi.", "Sekoita jäähtyneeseen sipuliseokseen minttu, lampaan jauheliha, aprikoosit ja korppujauho, mausta ja muotoile pieniksi pyöryköiksi.", "Paista pyörykät lopulla öljyllä pannussa kullanruskeiksi, tarvittaessa erissä.", "Sekoita pyörykät tomaattikastikkeeseen, lisää tilkka vettä ja anna hautua vielä muutama minuutti.", "Tarjoile pitaleivän ja salaatin kanssa."]},
  {"id": "mcsinghs-lampaanpiirakka", "name": "McSinghin skotlantilainen lammaspiirakka", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vssrtx1511557680.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Jeera (kumina)", "amount": 2, "unit": "tl", "chip": null}, {"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punasipuli, hienonnettu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 6, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Vihreä chili", "amount": 3, "unit": "kpl", "chip": "Chili"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Muskottipähkinä", "amount": 1, "unit": "tl", "chip": null}, {"name": "Korianteri, jauhettu", "amount": 2, "unit": "tl", "chip": null}, {"name": "Lampaan jauheliha", "amount": 1000, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Valkopippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Tuore korianteri", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Vehnäjauho", "amount": 340, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maito", "amount": 90, "unit": "ml", "chip": "Maito"}, {"name": "Sianrasva (voi tai laardi)", "amount": 150, "unit": "g", "chip": "Sianrasva"}, {"name": "Kananmuna, keltuainen", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Paahda kuminaa kuivassa pannussa hetki ja nosta sivuun. Kuullota samassa pannussa öljyssä sipuli, valkosipuli, chili, paprika ja hieman suolaa noin 8 minuuttia, kunnes kosteus on haihtunut.", "Sekoita joukkoon paahdettu kumina, muskotti ja jauhettu korianteri, anna jäähtyä.", "Yhdistä kulhossa lampaan jauheliha, valkopippuri, tuore korianteri ja jäähtynyt mauste-sipuliseos.", "Kuumenna maito ja rasva vedessä kiehuvaksi ja kaada kiehuva neste jauhon ja suolan joukkoon, sekoita puuhaarukalla ja muotoile taikina.", "Vuoraa öljytty piirakkavuoka kahdella kolmasosalla taikinasta, täytä lihaseoksella ja peitä lopulla taikinalla, sulje reunat ja tee keskelle reikä höyryä varten.", "Voitele pinta munankeltuaisella ja paista 200-asteisessa uunissa 30 minuuttia, laske lämpötila 160 asteeseen ja jatka vielä noin 1 tunti 15 minuuttia, kunnes kuori on kullanruskea."]},
  {"id": "kuumakuminainen-lammaswrappi", "name": "Kuumakuminainen lammaswrappi rapealla kaalisalaatilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/jyylmo1763790808.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaanreisipihvi", "amount": 500, "unit": "g", "chip": "Lampaanliha"}, {"name": "Oliiviöljy", "amount": 2, "unit": "tl", "chip": null}, {"name": "Jeera (kumina)", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkoviinietikka", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Porkkana, raastettu", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kevätsipuli, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Valkokaali", "amount": 400, "unit": "g", "chip": "Kaali"}, {"name": "Makea paprika, viipaloitu", "amount": 5, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Majoneesi", "amount": 3, "unit": "rkl", "chip": "Majoneesi"}, {"name": "Pitaleipä", "amount": 4, "unit": "kpl", "chip": "Pitaleipä"}], "steps": ["Hiero lammaspihvit öljyllä, kuminalla ja mausteilla ja paista grillipannulla noin 3-4 minuuttia puolelta.", "Anna lihan levätä hetki lautasella.", "Liuota sokeri etikkaan, sekoita joukkoon porkkana, kevätsipuli, kaali ja mausteet salaatiksi.", "Soseuta makeat paprikat majoneesin kanssa tasaiseksi kastikkeeksi.", "Levitä leivälle kaalisalaattia, lisää päälle viipaloitu lammas ja paistoliemi, valuta päälle paprikamajoneesia.", "Kääri wrapiksi tai täytä pitaleipä ja tarjoile heti."]},
  {"id": "presh-me-oriz-purjo-riisivuoka", "name": "Presh me oriz – albanialainen purjo-riisivuoka", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sjfgbc1779647169.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Purjo, viipaloitu", "amount": 500, "unit": "g", "chip": "Purjo"}, {"name": "Lampaan jauheliha", "amount": 400, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Sipuli, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Riisi", "amount": 200, "unit": "g", "chip": "Riisi"}, {"name": "Lampaanliemi", "amount": 1, "unit": "l", "chip": "Lampaanliemi"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Oliiviöljy", "amount": 1, "unit": "loraus", "chip": null}], "steps": ["Paista purjoa vähässä öljyssä muutama minuutti, kunnes se alkaa ruskistua.", "Lisää sipuli ja jauheliha ja paista, kunnes liha on ruskistunut, sekoittaen ettei purjo pala pohjaan.", "Lisää riisi ja sekoita hetki, jotta se peittyy paistorasvalla.", "Kaada joukkoon lampaanliemi, mausta suolalla ja pippurilla ja anna kiehahtaa noin 2 minuuttia.", "Kaada seos uunivuokaan ja paista 180-asteisessa uunissa noin 1 tunti, kunnes neste on imeytynyt ja riisi kypsää.", "Anna jäähtyä hetki uunin ovi raollaan ennen tarjoilua."]},
  {"id": "lampaan-tzatzikipihvit", "name": "Lampaan tzatzikipihvit sämpylässä", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/k420tj1585565244.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Bulgur", "amount": 25, "unit": "g", "chip": "Bulgur"}, {"name": "Lampaan jauheliha", "amount": 500, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Jeera (kumina)", "amount": 1, "unit": "tl", "chip": null}, {"name": "Korianteri, jauhettu", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Oliiviöljy paistamiseen", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Hampurilaissämpylä", "amount": 4, "unit": "kpl", "chip": "Sämpylä"}, {"name": "Kurkku, raastettu", "amount": 1, "unit": "kpl", "chip": "Kurkku"}, {"name": "Kreikkalainen jogurtti", "amount": 200, "unit": "g", "chip": "Jogurtti"}, {"name": "Minttu", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Keitä bulguria vedessä noin 10 minuuttia, valuta hyvin ja purista ylimääräinen vesi pois.", "Sekoita tzatzikia varten raastetun kurkun pusertama neste pois ja yhdistä jogurttiin silputun mintun ja hieman suolan kanssa.", "Sekoita jauhelihaan bulgur, mausteet, valkosipuli ja suolaa, muotoile neljä pihviä.", "Voitele pihvit öljyllä ja paista tai grillaa noin 5 minuuttia puolelta, kunnes kypsiä.", "Kokoa sämpylöihin pihvi, tzatziki, tomaatti, sipuli ja tuoretta minttua."]},
  {"id": "hidaspaistettu-lammas-kaneli-fenkoli-sitrus", "name": "Hidaspaistettu lammas kanelilla, fenkolilla ja sitruksella", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/gr4lo51763791826.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaanpaisti (reisi)", "amount": 1, "unit": "kpl", "chip": "Lampaanliha"}, {"name": "Sitruuna, kuori ja mehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Hunaja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kaneli", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Fenkolinsiemen", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Jeera (kumina)", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}], "steps": ["Laita lammas suureen pussiin sitruunan kuoren, mehun ja hieman öljyn kanssa ja anna marinoitua yön yli jääkaapissa.", "Ota lammas huoneenlämpöön tunniksi ennen paistamista, kuumenna uuni 220 asteeseen.", "Kuivaa liha marinadista, hiero puolella öljystä ja paahda 15-20 minuuttia kullanruskeaksi, laske sitten uunin lämpö 150 asteeseen.", "Sekoita loppu sitruunankuori, öljy, hunaja, mausteet ja valkosipuli tahnaksi ja hiero lampaan pintaan leivinpaperin ja folion sisällä.", "Kaada jäljellä oleva marinadi käärön pohjalle ja sulje folio tiiviisti.", "Paista uunissa noin 4 tuntia, kunnes liha on hyvin mureaa, anna levätä käärössä vielä 30 minuuttia ennen tarjoilua paistolientä valuttaen."]},
  {"id": "adana-kebab", "name": "Adana-kebab lampaasta", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/04axct1763793018.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Romano-paprika", "amount": 2, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Lampaan jauheliha", "amount": 800, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Paprikatahna", "amount": 3, "unit": "rkl", "chip": "Paprikatahna"}, {"name": "Chilihiutale (pul biber)", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Auringonkukkaöljy", "amount": 3, "unit": "rkl", "chip": null}], "steps": ["Hienonna paprikat monitoimikoneessa ja purista siivilässä irti niiden neste.", "Sekoita paprikat kulhossa jauhelihan, paprikatahnan, chilihiutaleiden, suolan ja osan öljystä kanssa, vaivaa 2-3 minuuttia tahmeaksi massaksi.", "Anna massan levätä kylmässä vähintään 2 tuntia.", "Jaa massa 12 osaan ja muotoile kostein käsin pitkulaisiksi kebab-tikuiksi, tai muovaile pitkiksi köfteiksi ilman tikkua.", "Sivele lopulla öljyllä ja paista grillissä tai 220-asteisessa uunissa noin 10-18 minuuttia, kunnes pinta on rapea ja sisus mehukas.", "Tarjoile leivän ja salaatin kanssa."]},
  {"id": "taytetyt-lampaantomaatit", "name": "Kreikkalaiset lampaanjauhelihalla täytetyt tomaatit", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/u55lbp1585564013.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Isot tomaatit", "amount": 4, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Sokeri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynnet, hienonnettu", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Lampaan jauheliha", "amount": 200, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Kaneli", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaattipyree", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Riisi", "amount": 50, "unit": "g", "chip": "Riisi"}, {"name": "Kanaliemi", "amount": 100, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Tuore tilli", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Minttu", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Lohkaise tomaattien kannet talteen ja kaavi sisus lusikalla, ilman että kuori rikkoutuu. Silppua sisus hienoksi ja säästä mehut.", "Ripottele tomaattien sisään hieman sokeria tasaamaan happamuutta ja nosta tomaatit uunivuokaan.", "Kuullota sipuli ja valkosipuli öljyssä, lisää jauheliha, kaneli ja tomaattipyree ja paista kunnes liha ruskistuu.", "Lisää pannuun tomaattisilppu mehuineen, riisi ja liemi. Kiehauta ja hauduta noin 15 minuuttia kunnes riisi on melkein kypsää. Sekoita joukkoon yrtit.", "Täytä tomaatit seoksella, aseta kannet päälle, valuta pinnalle öljyä ja vähän vettä vuokaan. Paista 180-asteisessa uunissa noin 35 minuuttia ja tarjoile leivän ja salaatin kanssa."]},
  {"id": "lampaan-perunapiirakka", "name": "Lampaanliha-perunapiirakka", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sxrpws1511555907.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaanliha kuutioina", "amount": 500, "unit": "g", "chip": "Lampaanliha"}, {"name": "Vehnäjauho", "amount": 1, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Rypsiöljy", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Sipuli, siivutettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkanat, siivutettu", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kasvisliemi", "amount": 350, "unit": "ml", "chip": "Kasvisliemi"}, {"name": "Perunat kuutioina", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Murotaikina", "amount": 450, "unit": "g", "chip": "Taikinapohja"}, {"name": "Kananmuna, vatkattu", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Pyörittele lampaanlihakuutiot kevyesti jauhossa.", "Ruskista liha ja sipuli kuumassa öljyssä kattilassa, mausta suolalla ja pippurilla.", "Lisää porkkanat ja liemi, kiehauta, laske lämpöä ja hauduta kannen alla vähintään tunti kunnes liha on mureaa.", "Sekoita joukkoon valutetut perunakuutiot ja kaada seos piirakkavuokaan.", "Peitä murotaikinalla, tee kanteen muutama viilto ja sivele muna. Paista 180-asteisessa uunissa noin 40 minuuttia kunnes kansi on kullanruskea."]},
  {"id": "lancashiren-patapaisti", "name": "Lancashiren lammaspata perunakannella", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uttrxw1511637813.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 100, "unit": "g", "chip": "Voi"}, {"name": "Lampaanliha", "amount": 900, "unit": "g", "chip": "Lampaanliha"}, {"name": "Lampaan munuaiset", "amount": 3, "unit": "kpl", "chip": "Lampaan munuainen"}, {"name": "Sipulit", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkanat, siivutettu", "amount": 4, "unit": "kpl", "chip": "Porkkana"}, {"name": "Vehnäjauho", "amount": 25, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Worcestershire-kastike", "amount": 2, "unit": "tl", "chip": "Worcestershire-kastike"}, {"name": "Kanaliemi", "amount": 500, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Laakerinlehdet", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Perunat, siivutettu", "amount": 900, "unit": "g", "chip": "Peruna"}], "steps": ["Ruskista lampaanliha ja munuaiset erissä kuumassa voissa laakeassa padassa ja nosta hetkeksi syrjään.", "Kuullota sipulit ja porkkanat samassa padassa, ripottele joukkoon jauho ja anna paahtua hetki.", "Lisää Worcestershire-kastike ja liemi, kiehauta. Palauta liha ja munuaiset joukkoon laakerinlehtien kera ja sammuta lämpö.", "Latele perunaviipaleet padan pinnalle kattamaan täyte ja valuta päälle vähän sulaa voita.", "Paista kannen alla 160-asteisessa uunissa noin 1,5 tuntia. Nosta kansi pois, sivele perunat voilla ja paista tai grillaa vielä hetki, kunnes pinta on ruskea."]},
  {"id": "espanjalainen-lampaanpotka-ja-pavut", "name": "Espanjalaishenkinen haudutettu lampaanpotka ja voipavut", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/9kwatm1763327074.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaan lapapaisti", "amount": 1600, "unit": "g", "chip": "Lampaanliha"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipulit, pilkotut", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkanat, pilkotut", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Valkosipulin kynnet", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kanaliemi", "amount": 330, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Voipavut", "amount": 800, "unit": "g", "chip": "Pavut"}, {"name": "Paahdettu paprika", "amount": 300, "unit": "g", "chip": "Paprika (vihannes)"}, {"name": "Mustat oliivit", "amount": 200, "unit": "g", "chip": "Oliivit"}, {"name": "Persilja", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Savupaprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Oliiviöljy mausteseokseen", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Rosmariini", "amount": 0.5, "unit": "tl", "chip": null}], "steps": ["Sekoita mausteseoksen ainekset ja hiero ne suolan kera lampaanpotkaan viiltojen sisään. Anna maustua hetki, mielellään pidempäänkin.", "Kuullota sipulit, porkkanat ja valkosipuli öljyssä patapadassa, kunnes ne pehmenevät.", "Kaada joukkoon liemi ja kiehauta. Nosta liha pataan, peitä kannella ja paista 150-asteisessa uunissa noin 2 tuntia.", "Nosta liha syrjään, sekoita pataliemeen pavut, paprika ja oliivit. Aseta liha takaisin päälle ja jatka uunissa ilman kantta vielä noin 1,5 tuntia, kunnes liha on mureaa.", "Revi liha haarukoilla säikeiksi, sekoita persilja pataan ja tarjoile yhdessä."]},
  {"id": "imam-bayildi-grillilampaalla", "name": "Imam bayildi munakoiso grillatun lampaan ja tzatzikin kera", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ampz9v1763787134.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Munakoisot", "amount": 3, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynnet", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kaneli", "amount": 1, "unit": "tl", "chip": null}, {"name": "Tomaatit", "amount": 8, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Persilja", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Lampaan ulkofilepihvit", "amount": 12, "unit": "kpl", "chip": "Lampaanliha"}, {"name": "Paprikajauhe", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Sitruuna", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kreikkalainen jogurtti", "amount": 150, "unit": "g", "chip": "Jogurtti"}, {"name": "Kurkku", "amount": 0.5, "unit": "kpl", "chip": "Kurkku"}, {"name": "Minttu", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Halkaise munakoisot pituussuunnassa, viillä pinta ristikkoon, sivele öljyllä ja paista uunissa 190 asteessa noin 20 minuuttia, kunnes liha pehmenee.", "Kuullota sipuli öljyssä, lisää valkosipuli ja kaneli. Kaavi munakoisojen sisus joukkoon ja lisää pilkotut tomaatit. Hauduta noin 10 minuuttia ja sekoita joukkoon persilja.", "Täytä munakoisokuoret tomaattiseoksella, valuta päälle öljyä ja paista uunissa vielä noin 30 minuuttia.", "Sekoita samalla tzatziki jogurtista, kurkusta ja mintusta pieneen kulhoon.", "Mausta lampaanpihvit suolalla, pippurilla ja paprikajauheella ja paista tai grillaa noin 3 minuuttia puolelta. Purista päälle sitruunaa ja tarjoile munakoisojen ja tzatzikin kanssa."]},
  {"id": "kapsalon", "name": "Kapsalon-uunivuoka", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sxysrt1468240488.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Ranskanperunat", "amount": 250, "unit": "g", "chip": "Ranskanperunat"}, {"name": "Kebabliha", "amount": 500, "unit": "g", "chip": "Kebabliha"}, {"name": "Valkosipulikastike", "amount": 1, "unit": "annos", "chip": null}, {"name": "Chilikastike", "amount": 1, "unit": "annos", "chip": null}, {"name": "Jäävuorisalaatti", "amount": 1, "unit": "kpl", "chip": "Salaatti"}, {"name": "Tomaatti", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Kurkku", "amount": 0.33, "unit": "kpl", "chip": "Kurkku"}, {"name": "Raastettu juusto", "amount": 100, "unit": "g", "chip": "Juusto"}], "steps": ["Paista ranskanperunat kypsiksi ja kullanruskeiksi ja levitä uunivuoan pohjalle tasaisesti.", "Paista kebabliha kuumalla pannulla muutama minuutti kypsäksi ja levitä puolet perunoiden päälle.", "Ripottele juusto lihan päälle ja paista uunissa muutama minuutti, kunnes juusto sulaa.", "Silppua salaatti, tomaatti ja kurkku pieneksi ja sekoita keskenään.", "Levitä salaattiseos vuoan päälle ja tarjoile valkosipulikastikkeen ja chilikastikkeen kera."]},
  {"id": "kofta-burgerit", "name": "Turkkilaiset kofta-pihvihampurilaiset", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lgmnff1763789847.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Lampaan jauheliha", "amount": 1000, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Sipulit, hienonnetut", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynnet", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Garam masala", "amount": 6, "unit": "rkl", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Chilikastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Pitaleivät", "amount": 8, "unit": "kpl", "chip": "Pitaleipä"}, {"name": "Tomaatit, siivutetut", "amount": 4, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Punakaali, suikaloitu", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Punasipuli, siivutettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Jogurtti", "amount": 100, "unit": "g", "chip": "Jogurtti"}], "steps": ["Sekoita jauheliha isossa kulhossa sipulin, valkosipulin, garam masalan, korianterin, chilikastikkeen ja ripauksen suolaa kanssa käsin tasaiseksi massaksi.", "Muotoile seoksesta 16 pientä pihviä. Näitä voi säilyttää pakastimessa kuukauden tai jääkaapissa vuorokauden.", "Paista pihvit uunin grillivastuksella tai pannulla noin 5-6 minuuttia puolelta, kunnes ne ovat ruskistuneet ja kypsiä.", "Kokoa hampurilaiset pitaleipiin tomaatin, punakaalin, punasipulin ja jogurtin kanssa ja anna jokaisen koota omansa."]},
  {"id": "lampaan-biryani", "name": "Intialainen lampaan biryani", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xrttsx1487339558.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Cashewpähkinät", "amount": 12, "unit": "kpl", "chip": "Cashewpähkinä"}, {"name": "Unikonsiemenet", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Jeeransiemenet", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Sipulit, ohuesti siivutetut", "amount": 3, "unit": "kpl", "chip": "Sipuli"}, {"name": "Inkivääri-valkosipulitahna", "amount": 2, "unit": "tl", "chip": null}, {"name": "Valkosipulinkynnet", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Minttu", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Sahrami", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Ghee-voi", "amount": 2, "unit": "rkl", "chip": "Voi"}, {"name": "Basmatiriisi", "amount": 5, "unit": "dl", "chip": "Riisi"}, {"name": "Täysrasvainen jogurtti", "amount": 1.2, "unit": "dl", "chip": "Jogurtti"}, {"name": "Jeeransiemenet riisiin", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Laakerinlehti", "amount": 0.5, "unit": "kpl", "chip": null}, {"name": "Kanelitanko", "amount": 1, "unit": "pala", "chip": null}, {"name": "Neilikat", "amount": 3, "unit": "kpl", "chip": null}, {"name": "Kardemumma", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Lampaanliha kuutioina", "amount": 450, "unit": "g", "chip": "Lampaanliha"}, {"name": "Chilijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Biryanimauste", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Jauha cashewpähkinät, unikonsiemenet ja jeeransiemenet tasaiseksi tahnaksi hieman vettä lisäten. Paista lisäksi osa sipuleista rapeiksi ja cashewpähkinät kullanruskeiksi ja nosta talteen.", "Liota riisi vedessä noin 20 minuuttia. Kuumenna öljyä laajassa padassa, lisää loput sipulit ja pähkinätahna, ja paista hetki inkivääri-valkosipulitahnan ja valkosipulin kanssa.", "Lisää tomaattipohja tarpeen mukaan ja kypsennä kunnes seos on tiivistynyt. Sekoita joukkoon chilijauhe, biryanimauste, minttu ja korianteri, ja lopuksi jogurtti pois liedeltä sekoittaen ettei se juoksetu.", "Lisää lampaanliha, suola ja vähän vettä, ja hauduta kannen alla noin tunti kunnes liha on mureaa.", "Keitä riisi erillisessä kattilassa jeeransiementen kera noin 80-prosenttisen kypsäksi ja valuta. Levitä riisi lampaan päälle, koristele paahdetuilla sipuleilla, gheellä, yrteillä ja maitoon liuotetulla sahramilla.", "Peitä ja kypsennä miedolla lämmöllä tai 180-asteisessa uunissa vielä noin 15-20 minuuttia, sekoita varovasti ja tarjoile heti kuumana."]},
  {"id": "jamaikalainen-vuohicurry", "name": "Jamaikalainen vuohilihacurry", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uc9qp11764796575.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vuohenliha kuutioina", "amount": 1350, "unit": "g", "chip": "Vuohenliha"}, {"name": "Jamaikalainen currymauste", "amount": 2.5, "unit": "rkl", "chip": null}, {"name": "Inkiväärijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Yleismauste", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maustepippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynnet", "amount": 6, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Timjami", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Öljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Vesi", "amount": 3, "unit": "dl", "chip": null}, {"name": "Scotch bonnet -chili", "amount": 1, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Iso peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}], "steps": ["Huuhtele vuohenliha etikkavedessä ja mausta curryjauheella, yleismausteella, inkiväärillä, maustepippurilla, sipulilla, valkosipulilla ja timjamilla. Anna marinoitua vähintään 4 tuntia, mielellään yön yli.", "Ruskista liha kuumassa öljyssä painekattilassa erissä, nosta hetkeksi sivuun.", "Kuullota loppu currymauste, sipulit ja valkosipuli öljyssä, kunnes tuoksuu ja on pehmennyt.", "Palauta liha kattilaan, lisää vesi ja kypsennä paineessa noin 40 minuuttia. Anna paineen laskea rauhassa.", "Avaa kansi, lisää perunakuutiot ja kokonainen chili, ja hauduta vielä kunnes perunat ovat kypsiä. Poista chili ennen tarjoilua."]},
  {"id": "mbuzi-choma-paahdettu-vuohi", "name": "Mbuzi choma - keniaalainen grillattu vuohenliha", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/cuio7s1555492979.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vuohenliha", "amount": 1, "unit": "kg", "chip": "Vuohenliha"}, {"name": "Maissijauho", "amount": 1, "unit": "kg", "chip": "Maissijauho"}, {"name": "Tomaatit", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Vihreä chili", "amount": 1, "unit": "kpl", "chip": "Chilipaprika"}, {"name": "Korianterinlehdet", "amount": 1, "unit": "nippu", "chip": null}], "steps": ["Grillaa tai paista vuohenliha keskilämmöllä noin 50 minuuttia, suolaten sitä käännellessä.", "Kiehauta vesi ja suola kattilassa ugalia varten ja ripottele maissijauho joukkoon ohuena virtana koko ajan sekoittaen.", "Laske lämpöä ja jatka sekoittamista noin 10 minuuttia, kunnes puuro tiivistyy ja irtoaa kattilan reunoista.", "Anna jäähtyä hieman, kostuta kädet ja muotoile ugalista pallo tarjoiluvatiin.", "Sekoita kachumbari-salaatiksi tomaatit, sipuli, chili ja korianteri, ja tarjoile grillatun lihan ja ugalin kanssa."]},
