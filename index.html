  {"id": "flapper-piiras", "name": "Flapper-piiras", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6ht8141764786479.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Keksimurske (graham)", "amount": 3.6, "unit": "dl", "chip": "Keksimurske"}, {"name": "Sulatettu voi", "amount": 0.9, "unit": "dl", "chip": "Voi"}, {"name": "Sokeri", "amount": 1.2, "unit": "dl", "chip": "Sokeri"}, {"name": "Kaneli", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maito", "amount": 6, "unit": "dl", "chip": "Maito"}, {"name": "Sokeri", "amount": 1.2, "unit": "dl", "chip": "Sokeri"}, {"name": "Maissitärkkelys", "amount": 0.6, "unit": "dl", "chip": "Maissitärkkelys"}, {"name": "Munankeltuainen", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Munanvalkuainen", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sokeri", "amount": 0.6, "unit": "dl", "chip": "Sokeri"}, {"name": "Kreemitartraatti", "amount": 0.25, "unit": "tl", "chip": null}], "steps": ["Kuumenna uuni 175 asteeseen. Sekoita keksimurske, sulatettu voi, sokeri ja kaneli, painele piirakkavuoan pohjalle ja reunoille, säästä pieni osa koristeluun. Esipaista 10 minuuttia.", "Sekoita maito, sokeri, maissitärkkelys, munankeltuaiset, vaniljauute ja suola kattilassa ja kuumenna jatkuvasti sekoittaen kunnes seos kiehahtaa ja sakenee vaniljakastikkeen paksuiseksi. Anna jäähtyä hieman.", "Vatkaa munanvalkuaiset, sokeri ja kreemitartraatti kiiltäväksi ja kovaksi marengiksi.", "Kaada vaniljatäyte piirakkapohjaan, lusikoi marenki päälle piikkeinä ja ripottele säästetty keksimurske pinnalle.", "Paista uunissa noin 10 minuuttia kunnes marenki ruskistuu, jäähdytä jääkaapissa ja tarjoa saman päivän aikana."]},
  {"id": "bangladeshilaiset-riisijauho-taatelikakut", "name": "Bangladeshilaiset riisijauho-taatelikakut", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/vfybi01780261706.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Taatelisiirappi", "amount": 250, "unit": "g", "chip": "Taatelisiirappi"}, {"name": "Lämmin vesi", "amount": 400, "unit": "ml", "chip": null}, {"name": "Riisijauho", "amount": 250, "unit": "g", "chip": "Riisijauho"}, {"name": "Vehnäjauho", "amount": 150, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kaneli", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kardemumma", "amount": 0.25, "unit": "tl", "chip": null}], "steps": ["Sekoita taatelisiirappi ja lämmin vesi tasaiseksi kulhossa.", "Vatkaa joukkoon riisijauho, vehnäjauho ja mausteet, kunnes taikina on sileää ja kokkareetonta. Anna levätä peitettynä 2 tuntia.", "Vatkaa taikina uudelleen läpi, sen tulee olla paksuhko mutta valuva, ohuen pannukakkutaikinan kaltainen.", "Kuumenna runsaasti öljyä paistinpannussa tai wokissa ja kaada taikinaa ohuena nauhana keskelle, muutama ruokalusikallinen kerrallaan.", "Paista kumpikin puoli kullanruskeaksi, noin 30-45 sekuntia per puoli, ja nosta talouspaperille valumaan.", "Tarjoa lämpiminä tai jäähdytettyinä, tarvittaessa uudelleen lämmitettyinä."]},
  {"id": "jamaikalainen-mausteleipa", "name": "Jamaikalainen mausteleipä", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/08c5f41764791918.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Vehnäjauho", "amount": 380, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Leivinjauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Ruskea sokeri", "amount": 150, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Tumma olut", "amount": 250, "unit": "ml", "chip": "Olut"}, {"name": "Maito", "amount": 0.8, "unit": "dl", "chip": "Maito"}, {"name": "Hunaja", "amount": 0.6, "unit": "dl", "chip": "Hunaja"}, {"name": "Suolaton voi, sulatettu", "amount": 60, "unit": "g", "chip": "Voi"}, {"name": "Siirappi (melassi)", "amount": 1, "unit": "rkl", "chip": "Melassi"}, {"name": "Ruskistusliemi (väriä varten)", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kuivatut karpalot", "amount": 1.2, "unit": "dl", "chip": "Kuivattu karpalo"}, {"name": "Rusinat", "amount": 1.2, "unit": "dl", "chip": "Rusinat"}, {"name": "Kuivatut kirsikat", "amount": 1.2, "unit": "dl", "chip": "Kuivattu kirsikka"}], "steps": ["Liota karpaloita, rusinoita ja kirsikoita tummassa oluessa noin 30 minuuttia.", "Lämmitä uuni 160 asteeseen ja voitele leipävuoka. Sekoita keskenään vehnäjauho, leivinjauhe, kaneli ja suola.", "Vatkaa toisessa kulhossa ruskea sokeri, kananmuna, maito, hunaja, sulatettu voi, melassi, ruskistusliemi, vaniljauute ja oluesta valutettu liotusneste tasaiseksi seokseksi.", "Pyörittele liotetut hedelmät hieman jauhoseoksesta otetussa jauhossa, jotta ne eivät painu pohjaan.", "Yhdistä märät ja kuivat aineet varovasti sekoittaen ja lisää lopuksi hedelmät. Kaada taikina vuokaan.", "Paista noin 50–60 minuuttia, kunnes tikulla kokeiltuna leipä on kypsä. Anna jäähtyä ja tarjoa esimerkiksi juustoviipaleen kanssa."]},
  {"id": "jamaikalainen-bataattivanukas", "name": "Jamaikalainen bataattivanukas", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/xj9sa81764788866.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Bataatti, raastettu", "amount": 900, "unit": "g", "chip": "Bataatti"}, {"name": "Kookosmaito taikinaan", "amount": 3.6, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Ruskea sokeri", "amount": 3.6, "unit": "dl", "chip": "Ruskea sokeri"}, {"name": "Vehnäjauho", "amount": 1.2, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Vaniljauute", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Maustepippurijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Muskottijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Inkiväärijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Rusinat", "amount": 1.2, "unit": "dl", "chip": "Rusinat"}, {"name": "Kookosmaito seokseen", "amount": 1.8, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Kanelijauhe pinnalle", "amount": 0.125, "unit": "tl", "chip": null}, {"name": "Muskottijauhe pinnalle", "amount": 0.125, "unit": "tl", "chip": null}], "steps": ["Lämmitä uuni 175 asteeseen ja vuoraa pyöreä tai suorakaiteen muotoinen vuoka leivinpaperilla.", "Raasta bataatit hienoksi esimerkiksi yleiskoneella. Pyörittele rusinat pieneen määrään jauhoa.", "Sekoita suuressa kulhossa raastettu bataatti, ruskea sokeri, jauho, vanilja, maustepippuri, kaneli, muskotti, inkivääri ja suola.", "Lisää joukkoon kookosmaito sekoittaen tasaiseksi taikinaksi ja nosta lopuksi jauhossa pyöräytetyt rusinat mukaan.", "Kaada seos vuokaan ja tasoita pinta. Paista noin 1,5 tuntia, kunnes vanukas on pinnaltaan kypsä mutta keskeltä vielä hieman pehmeä."]},
  {"id": "joulupiiraat", "name": "Perinteiset englantilaiset joulupiiraat", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qe8pf51576795532.jpg", "aiImage": false, "servings": 18, "ingredients": [{"name": "Kylmä voi kuutioituna", "amount": 225, "unit": "g", "chip": "Voi"}, {"name": "Vehnäjauho", "amount": 350, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Hienosokeri", "amount": 100, "unit": "g", "chip": "Sokeri"}, {"name": "Hedelmätäyte (mincemeat)", "amount": 280, "unit": "g", "chip": "Hedelmätäyte"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Tomusokeri pintaan", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Hierro kylmä voi jauhoihin sormin murumaiseksi ja sekoita joukkoon sokeri sekä ripaus suolaa.", "Kokoa taikina käsin palloksi lisäämättä nestettä ja anna sen levätä hetki, tarvittaessa kylmässä.", "Lämmitä uuni 200 asteeseen. Painele pieniä taikinapalloja voideltujen piirasvuokien pohjille noin 18 kuppiin.", "Lusikoi jokaiseen kuppiin hedelmätäytettä ja tee jäljelle jääneestä taikinasta ohuet kannet piiraiden päälle.", "Sivele piiraat vatkatulla kananmunalla ja paista noin 20 minuuttia kultaisen ruskeiksi.", "Anna jäähtyä hieman vuoassa, siirrä ritilälle ja ripottele pinnalle tomusokeria ennen tarjoilua."]},
  {"id": "parkin-inkivaarikakku", "name": "Parkin – englantilainen melassi-inkiväärikakku", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qxuqtt1511724269.jpg", "aiImage": false, "servings": 10, "ingredients": [{"name": "Voi", "amount": 200, "unit": "g", "chip": "Voi"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 0.6, "unit": "dl", "chip": "Maito"}, {"name": "Vaalea siirappi", "amount": 200, "unit": "g", "chip": "Siirappi"}, {"name": "Musta melassi", "amount": 85, "unit": "g", "chip": "Melassi"}, {"name": "Ruskea sokeri", "amount": 85, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Kaurahiutaleet, karkeat", "amount": 100, "unit": "g", "chip": "Kaurahiutale"}, {"name": "Itsekohoava vehnäjauho", "amount": 250, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Inkiväärijauhe", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Lämmitä uuni 160 asteeseen ja vuoraa neliönmuotoinen kakkuvuoka leivinpaperilla. Vatkaa kananmuna ja maito kevyesti keskenään.", "Sulata kattilassa siirappi, melassi, sokeri ja voi miedolla lämmöllä, kunnes sokeri on liuennut.", "Sekoita erillisessä kulhossa kaurahiutaleet, jauho ja inkivääri, ja lisää joukkoon sulatettu siirappiseos.", "Kaada lopuksi kananmuna-maitoseos joukkoon ja sekoita tasaiseksi taikinaksi.", "Kaada taikina vuokaan ja paista noin 50–60 minuuttia, kunnes kakku on kiinteä ja hieman rapea pinnalta.", "Anna jäähtyä vuoassa ja kääri kakku foliolla – parkin maistuu parhaalta muutaman päivän vanhennettuna."]},
  {"id": "puolalainen-piparkakkukakku", "name": "Piernik – puolalainen hunajakakku", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/kwmdk41764120884.jpg", "aiImage": false, "servings": 10, "ingredients": [{"name": "Suolaton voi", "amount": 140, "unit": "g", "chip": "Voi"}, {"name": "Nestemäinen hunaja", "amount": 300, "unit": "g", "chip": "Hunaja"}, {"name": "Ruskea sokeri", "amount": 100, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Itsekohoava vehnäjauho", "amount": 375, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Inkiväärijauhe", "amount": 3, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Neilikkajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Muskottijauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Luumuhillo", "amount": 200, "unit": "g", "chip": "Luumuhillo"}, {"name": "Kuohukerma", "amount": 225, "unit": "ml", "chip": "Kerma"}, {"name": "Tumma suklaa", "amount": 140, "unit": "g", "chip": "Suklaa"}, {"name": "Nestemäinen hunaja kuorrutteeseen", "amount": 3, "unit": "rkl", "chip": "Hunaja"}], "steps": ["Lämmitä uuni 160 asteeseen ja vuoraa pyöreä kakkuvuoka. Sulata kattilassa hunaja, sokeri ja voi ja anna jäähtyä.", "Sekoita jauho ja mausteet suuressa kulhossa. Vatkaa jäähtyneeseen hunajaseokseen kananmunat ja kaada seos kuiviin aineksiin.", "Sekoita tasaiseksi taikinaksi mutta älä vatkaa liikaa. Kaada vuokaan ja paista noin 50–55 minuuttia, kunnes tikkukoe on puhdas.", "Anna kakun jäähtyä ja leikkaa se kolmeen kerrokseen. Levitä hilloa kahden alimman kerroksen väliin ja kokoa kakku uudelleen.", "Sulata kerma, suklaa ja hunaja kattilassa kiiltäväksi kuorrutteeksi ja kaada se kakun päälle tasaisesti.", "Anna kuorrutteen jähmettyä ennen tarjoilua ja säil   {"id": "paczki-donitsit", "name": "Pączki – puolalaiset hillodonitsit", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/x6jqog1764359857.jpg", "aiImage": false, "servings": 16, "ingredients": [{"name": "Kuivahiiva", "amount": 10, "unit": "g", "chip": "Hiiva"}, {"name": "Hienosokeri esitaikinaan", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vehnäjauho esitaikinaan", "amount": 1, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Lämmin maito", "amount": 1.2, "unit": "dl", "chip": "Maito"}, {"name": "Munankeltuainen", "amount": 7, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sokeri", "amount": 15, "unit": "g", "chip": "Sokeri"}, {"name": "Vaniljasokeri", "amount": 10, "unit": "g", "chip": null}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vehnäjauho taikinaan", "amount": 500, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kuohukerma", "amount": 2, "unit": "dl", "chip": "Kerma"}, {"name": "Voi, sulatettu", "amount": 15, "unit": "g", "chip": "Voi"}, {"name": "Hillo täytteeksi", "amount": 1.2, "unit": "dl", "chip": "Hillo"}, {"name": "Manteli, jauhettu", "amount": 10, "unit": "g", "chip": "Manteli"}, {"name": "Öljy tai rasva paistamiseen", "amount": 1, "unit": "l", "chip": null}, {"name": "Tomusokeri kuorrutteeseen", "amount": 75, "unit": "g", "chip": null}, {"name": "Sitruunamehu", "amount": 0.5, "unit": "kpl", "chip": null}, {"name": "Mantelitiiviste", "amount": 1, "unit": "tilkka", "chip": null}, {"name": "Mantelisilput koristeeksi", "amount": 50, "unit": "g", "chip": "Manteli"}], "steps": ["Sekoita hiiva, sokeri ja jauho lämpimään maitoon ja anna esitaikinan kohota lämpimässä paikassa noin 30 minuuttia.", "Vatkaa munankeltuaiset, sokeri ja vaniljasokeri vesihauteessa paksuksi ja vaaleaksi vaahdoksi.", "Sekoita jauhoihin lämmin kerma ja munaseos, lisää esitaikina ja ripaus suolaa. Vaivaa tasaiseksi taikinaksi noin 10 minuuttia.", "Lisää sulatettu vo   {"id": "unikkoperunanytit", "name": "Šúľance – slovakialaiset unikonsiemen-perunanytit", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/d6o4nu1763362422.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 700, "unit": "g", "chip": "Peruna"}, {"name": "Vehnäjauho", "amount": 300, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Mannasuurimo", "amount": 100, "unit": "g", "chip": "Mannasuurimo"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Unikonsiemen, jauhettu", "amount": 150, "unit": "g", "chip": "Unikonsiemen"}, {"name": "Tomusokeri", "amount": 100, "unit": "g", "chip": null}, {"name": "Voi", "amount": 100, "unit": "g", "chip": "Voi"}], "steps": ["Keitä perunat kuorineen kypsiksi, anna jäähtyä mieluiten yön yli, kuori ja soseuta hienoksi.", "Sekoita perunasose, jauho, mannasuurimo ja suola tasaiseksi, ei-tahmeaksi taikinaksi.", "Kaulitse taikinasta ohuita puikkoja ja leikkaa noin 3 cm pituisiksi paloiksi. Pyörittele käsien välissä pieniksi nyteiksi.", "Keitä nytit erissä kiehuvassa suolavedessä, kunnes ne nousevat pintaan, noin 2–3 minuuttia. Valuta.", "Sekoita jauhettu unikonsiemen ja tomusokeri keskenään ja sulata voi.", "Valuta sulaa voita nyttien päälle ja pyörittele ne unikonsiemen-sokeriseoksessa. Tarjoile lämpimänä, halutessa tomusokerilla tai hunajalla höystettynä."]},
  {"id": "saksanpahkina-taateli-hunajakakku", "name": "Saksanpähkinä-taateli-hunajakakku", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/towo9c1763814590.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Itsekohoava vehnäjauho", "amount": 225, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kanelijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Voi", "amount": 175, "unit": "g", "chip": "Voi"}, {"name": "Muscovadosokeri", "amount": 100, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Nestemäinen hunaja", "amount": 3, "unit": "rkl", "chip": "Hunaja"}, {"name": "Kananmuna, vatkattu", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Banaani", "amount": 2, "unit": "kpl", "chip": "Banaani"}, {"name": "Kivetön taateli", "amount": 100, "unit": "g", "chip": "Taateli"}, {"name": "Saksanpähkinä", "amount": 50, "unit": "g", "chip": "Saksanpähkinä"}], "steps": ["Lämmitä uuni 160 asteeseen ja vuoraa leipävuoka leivinpaperilla.", "Yhdistä kulhossa jauho, kaneli, voi, sokeri, 2 rkl hunajaa ja kananmunat.", "Soseuta banaanit ja pilko taatelit, lisää ne joukkoon ja sekoita seosta 2–3 minuuttia tasaiseksi.", "Kaada taikina vuokaan, tasoita pinta ja ripottele päälle saksanpähkinät.", "Paista noin 1 tunti, kunnes kakku tuntuu painettaessa kiinteältä. Anna jäähtyä hetki ja nosta vuoasta.", "Valuta jäähtyneen kakun päälle jäljellä oleva hunaja ennen viipalointia."]},
  {"id": "baklava-mausteisilla-pahkinoilla", "name": "Baklava mausteisilla pähkinöillä, ricottalla ja suklaalla", "category": "Jälkiruoka", "price": 3, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ytme8t1764111401.jpg", "aiImage": false, "servings": 12, "ingredients": [{"name": "Sokeri siirappiin", "amount": 500, "unit": "g", "chip": "Sokeri"}, {"name": "Sitruunamehu", "amount": 1, "unit": "tilkka", "chip": null}, {"name": "Saksanpähkinä", "amount": 300, "unit": "g", "chip": "Saksanpähkinä"}, {"name": "Pekaanipähkinä", "amount": 200, "unit": "g", "chip": "Pekaanipähkinä"}, {"name": "Manteli", "amount": 100, "unit": "g", "chip": "Manteli"}, {"name": "Kanelijauhe", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kardemummajauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ricotta", "amount": 500, "unit": "g", "chip": "Ricotta"}, {"name": "Sitruunankuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Appelsiininkuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Vaniljatahna", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suolaton voi, sulatettu", "amount": 250, "unit": "g", "chip": "Voi"}, {"name": "Filotaikina", "amount": 500, "unit": "g", "chip": "Filotaikina"}, {"name": "Pistaasi, jauhettu", "amount": 100, "unit": "g", "chip": "Pistaasipähkinä"}, {"name": "Tumma suklaa", "amount": 150, "unit": "g", "chip": "Suklaa"}], "steps": ["Keitä sokeri ja 6,5 dl vettä siirapiksi, mausta tipalla sitruunamehua ja anna jäähtyä. Sulata voi hitaasti kirkkaaksi.", "Rouhi saksanpähkinät, pekaanipähkinät ja mantelit karkeaksi murskaksi ja sekoita joukkoon kaneli ja kardemumma.", "Sekoita ricotta sitruunan- ja appelsiininkuoren sekä vaniljan kanssa.", "Sivele filotaikinalevy sulalla voilla, ripottele päälle pähkinäseosta ja lusikoi reunaan ricottatäytettä. Rullaa levy vartaan ympärille ja rypytä se harmonikaksi. Toista koko taikinalla, kunnes rullia on noin 12, ja leikkaa ne pienemmiksi paloiksi.", "S   {"id": "dominican-kookoskakku", "name": "Dominican rapea kookoskakku", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/sgqy9d1784832045.jpg", "aiImage": false, "servings": 12, "ingredients": [{"name": "Vehnäjauho", "amount": 480, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kaurahiutale", "amount": 90, "unit": "g", "chip": "Kaurahiutale"}, {"name": "Ruskea sokeri", "amount": 320, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Raastettu kookos", "amount": 160, "unit": "g", "chip": "Kookos"}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kookosmaito", "amount": 6, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Ruokasooda", "amount": 1, "unit": "tl", "chip": null}, {"name": "Leivinjauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Muskottijauhe", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Limenkuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Rusinat", "amount": 0.6, "unit": "dl", "chip": "Rusinat"}], "steps": ["Lämmitä uuni 175 asteeseen ja voitele leivinpelti tai muotti kasviöljyllä.", "Sekoita suuressa kulhossa jauho, kaurahiutaleet, ruskea sokeri, kookos, sooda, leivinjauhe, kaneli, muskotti ja limenkuori.", "Lisää joukkoon kookosmaito ja vaniljauute ja sekoita tasaiseksi, melko paksuksi taikinaksi. Nosta lopuksi rusinat mukaan.", "Annostele taikinasta jäätelöluikulla tai lusikalla pieniä kasoja pellille tai painele taikina muottiin.", "Paista noin 25–35 minuuttia, kunnes pinta on ruskistunut. Anna jäähtyä ennen tarjoilua."]},
  {"id": "firni-riisivanukas", "name": "Afganistanilainen firni-vanukas", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/dm8kee1779553541.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Täysmaito", "amount": 14.4, "unit": "dl", "chip": "Maito"}, {"name": "Maissitärkkelys", "amount": 5, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Sokeri", "amount": 3.6, "unit": "dl", "chip": "Sokeri"}, {"name": "Kardemummajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Ruusuvesi", "amount": 1, "unit": "tl", "chip": null}, {"name": "Manteli, viipaloitu", "amount": 1, "unit": "kourallinen", "chip": "Manteli"}, {"name": "Pistaasi", "amount": 1, "unit": "kourallinen", "chip": "Pistaasipähkinä"}], "steps": ["Kaada osa maidosta pieneen kulhoon, lisää maissitärkkelys ja vatkaa tasaiseksi.", "Kaada loppu maito kattilaan, lisää sokeri ja kardemumma (sekä halutessa ruusuvesi) ja kuumenna keskilämmöllä.", "Ennen kiehumista lisää tärkkelysseos ohuena nauhana koko ajan vatkaten, jotta seokseen ei muodostu paakkuja.", "Jatka hämmentämistä, kunnes vanukas sakenee selvästi. Ota pois liedeltä ja kaada matalaan tarjoiluastiaan.", "Anna jäähtyä huoneenlämmössä ja siirrä sitten jääkaappiin noin 1–2 tunniksi.", "Ripottele viipaloituja manteleita ja pistaaseja pinnalle juuri ennen tarjoilua."]},

/* Yleisimmät ainekset ensin, harvinaisemmat perässä */
const COMMON_ORDER = [
  "Naudan jauheliha","Kanan jauheliha","Sian jauheliha","Lampaan jauheliha",
  "Kana","Naudanliha","Sianliha","Lampaanliha","Lohi","Kalafilee",
  "Peruna","Riisi","Pasta","Kerma","Maito","Juusto","Voi","Kananmuna",
  "Sipuli","Valkosipuli","Kevätsipuli","Porkkana","Tomaatti","Paprika (vihannes)",
  "Vehnäjauho","Sokeri"
];
const rawChips = [...new Set(
  RECIPES.flatMap(r => r.ingredients.filter(i => i.chip).map(i => i.chip))
)];
const ALL_INGREDIENTS = rawChips.sort((a,b)=>{
  const ai = COMMON_ORDER.indexOf(a);
  const bi = COMMON_ORDER.indexOf(b);
  if(ai!==-1 && bi!==-1) return ai-bi;
  if(ai!==-1) return -1;
  if(bi!==-1) return 1;
  return a.localeCompare(b,'fi');
});

let selectedIngredients = [];
let currentMode = "pantry";
let selectedBudget = null;
let favorites = JSON.parse(localStorage.getItem("ruokaralli_favorites")||"[]");

function saveFavs(){ localStorage.setItem("ruokaralli_favorites", JSON.stringify(favorites)); updateFavCount(); }

const ingGrid = document.getElementById("ingGrid");
function renderIngGrid(filter=""){
  ingGrid.innerHTML = "";
  ALL_INGREDIENTS.filter(i=>i.toLowerCase().includes(filter.toLowerCase())).forEach(ing=>{
    const chip = document.createElement("div");
    chip.className = "ing-chip" + (selectedIngredients.includes(ing) ? " selected":"");
    chip.textContent = ing;
    chip.onclick = ()=>{
      if(selectedIngredients.includes(ing)){
        selectedIngredients = selectedIngredients.filter(x=>x!==ing);
      } else {
        selectedIngredients.push(ing);
      }
      renderIngGrid(document.getElementById("ingSearch").value);
      renderSelectedRow();
    };
    ingGrid.appendChild(chip);
  });
}
function renderSelectedRow(){
  const row = document.getElementById("selectedRow");
  row.innerHTML = "";
  selectedIngredients.forEach(ing=>{
    const chip = document.createElement("div");
    chip.className = "ing-chip selected";
    chip.textContent = ing + " ✕";
    chip.onclick = ()=>{
      selectedIngredients = selectedIngredients.filter(x=>x!==ing);
      renderIngGrid(document.getElementById("ingSearch").value);
      renderSelectedRow();
    };
    row.appendChild(chip);
  });
}
renderIngGrid();

      selectedBudget = null;
    } else {
      selectedBudget = parseInt(b.dataset.b);
      b.classList.add("selected");
    }
  };
});

function matchInfo(recipe){
  const mainIngredients = recipe.ingredients.filter(i=>i.chip);
  if(selectedIngredients.length===0) return {matched:0,total:mainIngredients.length,missing:[]};
  const chips = mainIngredients.map(i=>i.chip);
  const matched = chips.filter(c=>selectedIngredients.includes(c));
  const missing = chips.filter(c=>!selectedIngredients.includes(c));
  return {matched:matched.length, total:chips.length, missing};
}

const cardStack = document.getElementById("cardStack");
const resultCount = document.getElementById("resultCount");
let revealedCount = 0;
let currentResults = [];

function getResults(){
  let list = RECIPES.slice();
  if(currentMode==="pantry" && selectedIngredients.length>0){
    list = list.map(r=>({...r, _m:matchInfo(r)}))
               .filter(r=>r._m.matched>0)
               .sort((a,b)=>(b._m.matched/b._m.total) - (a._m.matched/a._m.total));
  } else if(currentMode==="budget" && selectedBudget){
    list = list.filter(r=>r.price===selectedBudget);
  } else if(currentMode==="surprise"){
    list = [list[Math.floor(Math.random()*list.length)]];
  }
  return list;
}

document.getElementById("actionBtn").onclick = ()=>{
  currentResults = getResults();
  revealedCount = 0;
  cardStack.innerHTML = "";
  if(currentResults.length===0){
    resultCount.textContent = "";
    const fallback = RECIPES[Math.floor(Math.random()*RECIPES.length)];
    cardStack.innerHTML = `<div class="empty-state">😔 Valitettavasti ei löytynyt reseptiä näillä valinnoilla.<br>Tässä sinulle hyvä vaihtoehto:</div>`;
    currentResults = [fallback];
    revealNext(3);
    return;
  }
  resultCount.textContent = currentResults.length + " reseptiä löytyi";
  revealNext(currentMode==="surprise" ? 1 : 5);
};

function buildInListAd(){
  const ad = document.createElement("div");
  ad.className = "ad-slot";
  const inlineScript = document.createElement("script");
  inlineScript.async = false;
  inlineScript.text = "atOptions = { 'key' : '336ba149ff2dde929b595683821bd032', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };";
  const invokeScript = document.createElement("script");
  invokeScript.async = false;
  invokeScript.src = "https://www.highrevenueformat.com/336ba149ff2dde929b595683821bd032/invoke.js";
  ad.appendChild(inlineScript);
  ad.appendChild(invokeScript);
  return ad;
}

function revealNext(n){
  const slice = currentResults.slice(revealedCount, revealedCount+n);
  slice.forEach((r, idx)=>{
    cardStack.appendChild(buildCard(r));
    const overallIdx = revealedCount + idx + 1;
    if(overallIdx % 5 === 0 && overallIdx < currentResults.length){
      cardStack.appendChild(buildInListAd());
    }
  });
  revealedCount += slice.length;
  if(revealedCount < currentResults.length){
    const moreBtn = document.createElement("button");
    moreBtn.className = "surprise-btn";
    moreBtn.style.background = "var(--green)";
    moreBtn.textContent = "Näytä lisää reseptejä";
    moreBtn.onclick = ()=>{ moreBtn.remove(); revealNext(5); };
    cardStack.appendChild(moreBtn);
  }
}

function buildCard(recipe){
  const card = document.createElement("div");
  card.className = "card";
  const m = matchInfo(recipe);
  const pct = m.total ? Math.round((m.matched/m.total)*100) : 0;
  const priceStr = "€".repeat(recipe.price);

  card.innerHTML = `
    <img src="${recipe.image}" alt="${recipe.name}">
    ${recipe.aiImage ? '<div class="ai-note">Tekoälyn luoma kategoriakuva</div>' : ''}
    <div class="card-body">
      <div class="card-top">
        <h3 class="card-title">${recipe.name}</h3>
        <div class="price-tag">${priceStr}</div>
      </div>
      ${selectedIngredients.length>0 ? `
        <div class="match-bar-wrap"><div class="match-bar" style="width:${pct}%"></div></div>
        <div class="match-text">${m.matched}/${m.total} ainesta löytyy</div>
        ${m.missing.length>0 ? `<div class="missing">Puuttuu: ${m.missing.join(", ")}</div>` : ''}
      ` : ''}
      <div class="tags">
        <span class="tag">${recipe.category}</span>
        ${recipe.vegan ? '<span class="tag">Vegaani</span>' : recipe.vegetarian ? '<span class="tag">Kasvis</span>' : ''}
      </div>
      <div class="card-actions">
        <button class="open-btn">Avaa resepti</button>
        <button class="heart-btn ${favorites.includes(recipe.id)?'active':''}">♥</button>
      </div>
    </div>
  `;
  card.querySelector(".open-btn").onclick = ()=>openModal(recipe);
  const heart = card.querySelector(".heart-btn");
  heart.onclick = ()=>{
    if(favorites.includes(recipe.id)){ favorites = favorites.filter(x=>x!==recipe.id); heart.classList.remove("active"); }
    else { favorites.push(recipe.id); heart.classList.add("active"); }
    saveFavs();
  };

  return card;
}

const overlay = document.getElementById("modalOverlay");
const modalEl = document.getElementById("modal");
let currentServings = 4;

function openModal(recipe){
  currentServings = recipe.servings;
  renderModal(recipe);
  overlay.classList.add("open");
}
function renderModal(recipe){
  const scale = currentServings / recipe.servings;
  const m = matchInfo(recipe);
  modalEl.innerHTML = `
    <div style="position:relative;">
      <img src="${recipe.image}" alt="${recipe.name}">
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <div class="modal-inner">
      <h2>${recipe.name}</h2>
      <div class="tags">
        <span class="tag">${recipe.category}</span>
        ${recipe.vegan ? '<span class="tag">Vegaani</span>' : recipe.vegetarian ? '<span class="tag">Kasvis</span>' : ''}
        <span class="tag">${"€".repeat(recipe.price)}</span>
      </div>
      <div class="serving-row">
        <button class="serving-btn" id="minusServ">−</button>
        <strong>${currentServings} annosta</strong>
        <button class="serving-btn" id="plusServ">+</button>
      </div>
      <ul class="ing-list">
        ${recipe.ingredients.map(i=>{
          const scaled = (i.amount*scale);
          const displayAmt = scaled % 1 === 0 ? scaled : scaled.toFixed(1);
          const isMissing = i.chip && selectedIngredients.length>0 && m.missing.includes(i.chip);
          return `<li class="${isMissing?'missing-ing':''}"><span>${i.name}</span><span>${displayAmt} ${i.unit}</span></li>`;
        }).join("")}
      </ul>
      <h3 style="font-size:15px;margin-bottom:6px;">Valmistusohje</h3>
      <ol class="steps">${recipe.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="modal-actions">
        <button class="btn-fav" id="toggleFavModal">${favorites.includes(recipe.id)?'♥ Poista suosikeista':'♡ Lisää suosikkeihin'}</button>
      </div>
    </div>
  `;
  document.getElementById("closeModal").onclick = ()=>overlay.classList.remove("open");
  document.getElementById("minusServ").onclick = ()=>{ if(currentServings>1){ currentServings--; renderModal(recipe);} };
  document.getElementById("plusServ").onclick = ()=>{ currentServings++; renderModal(recipe); };
  document.getElementById("toggleFavModal").onclick = ()=>{
    if(favorites.includes(recipe.id)) favorites = favorites.filter(x=>x!==recipe.id);
    else favorites.push(recipe.id);
    saveFavs();
    renderModal(recipe);
  };
}
overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove("open"); };

document.getElementById("favToggle").onclick = ()=>{
  currentResults = RECIPES.filter(r=>favorites.includes(r.id));
  revealedCount = 0;
  cardStack.innerHTML = "";
  resultCount.textContent = favorites.length===0 ? "Ei vielä suosikkeja" : "Suosikkisi (" + favorites.length + ")";
  if(currentResults.length) revealNext(currentResults.length);
};

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

document.getElementById("actionBtn").click();
</script>
