  {"id": "hernekeitto-porsaalla", "name": "Hollantilainen hernekeitto (snert)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/9ptx0a1565090843.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vesi", "amount": 20, "unit": "dl", "chip": null}, {"name": "Kuivatut herneet", "amount": 300, "unit": "g", "chip": "Herne"}, {"name": "Savuporsas tai pekoni", "amount": 100, "unit": "g", "chip": "Pekoni"}, {"name": "Kasvisliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kasvisliemi"}, {"name": "Selleri", "amount": 2, "unit": "varsi", "chip": "Selleri"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Purjo", "amount": 1, "unit": "kpl", "chip": "Purjo"}, {"name": "Mukulaselleri", "amount": 2.4, "unit": "dl", "chip": "Mukulaselleri"}, {"name": "Savumakkara", "amount": 450, "unit": "g", "chip": "Makkara"}], "steps": ["Kiehauta vedessä herneet, pekoni, sianliha ja liemikuutio, laske lämpöä ja hauduta kannen alla 45 minuuttia, kuoritse pinnalle nouseva vaahto pois.", "Poista liha kattilasta, leikkaa pieniksi paloiksi ja laita talteen.", "Lisää selleri, porkkanat, peruna, sipuli, purjo ja mukulaselleri, keitä vielä 30 minuuttia.", "Lisää savumakkara viimeisiksi 15 minuutiksi, nosta sitten pois ja viipaloi.", "Soseuta keitto halutessasi tasaiseksi sauvasekoittimella, mausta suolalla ja pippurilla, ja lisää liha takaisin joukkoon.", "Tarjoa kuumana makkaraviipaleilla koristeltuna."]},
  {"id": "slovakialaiset-perunaletut", "name": "Slovakialaiset perunaletut (zemiakové placky)", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0umm891763364625.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 1000, "unit": "g", "chip": "Peruna"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vehnäjauho", "amount": 4, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Meirami", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "annos", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "annos", "chip": null}, {"name": "Öljy paistamiseen", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Kuori ja raasta perunat hienoksi, purista liina-avulla ylimääräinen neste pois mahdollisimman rapean lopputuloksen saamiseksi.", "Sekoita perunaraaste, hienonnettu sipuli, valkosipuli, munat, jauho, meirami, suola ja pippuri paksuksi taikinaksi.", "Kuumenna reilusti öljyä pannulla.", "Lusikoi taikinaa pannulle ohuiksi letuiksi, paista kullanruskeiksi ja rapeiksi molemmin puolin.", "Valuta talouspaperilla ja tarjoa heti kuumana esimerkiksi smetanan kanssa."]},
  {"id": "leipahedelma-voikastikkeessa", "name": "Leipähedelmä voikastikkeessa", "category": "Lisuke", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6utn1w1782237402.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Leipähedelmä", "amount": 0.5, "unit": "kpl", "chip": "Leipähedelmä"}, {"name": "Sipuli keittoveteen", "amount": 0.5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Voi", "amount": 125, "unit": "g", "chip": "Voi"}, {"name": "Sipuli renkaina", "amount": 3, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli hienonnettuna", "amount": 1, "unit": "rkl", "chip": "Valkosipuli"}, {"name": "Tomaattimurska", "amount": 500, "unit": "ml", "chip": "Tomaatti"}, {"name": "Persilja", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Limemehu", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Vesi", "amount": 250, "unit": "ml", "chip": null}, {"name": "Chilikastike", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Persilja koristeeksi", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Kuori leipähedelmä, poista siemenet ja paloittele. Keitä suolavedessä sipulinpalan ja tilkan öljyn kanssa kunnes pehmenee, valuta ja anna jäähtyä.", "Sulata voi pannulla ja ruskista sipulirenkaat kevyesti kullanruskeiksi.", "Lisää valkosipuli, tomaattimurska, persilja, limemehu, suola ja pippuri. Hauduta muutama minuutti.", "Lisää vesi, kuumenna kiehuvaksi ja anna kiehua 5-10 minuuttia, kunnes kastike on hieman paksuuntunut.", "Viipaloi jäähtynyt leipähedelmä tarjoiluvadille ja kaada voikastike päälle.", "Koristele tuoreella persiljalla ja tarjoa heti."]},
  {"id": "klassinen-lasagne", "name": "Klassinen lasagne", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wtsvxx1511296896.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Pekoni", "amount": 2, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Sipuli hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Selleri", "amount": 1, "unit": "varsi", "chip": "Selleri"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaattimurska", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Hunaja", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Lasagnelevyt", "amount": 500, "unit": "g", "chip": "Pasta"}, {"name": "Ranskankerma", "amount": 400, "unit": "ml", "chip": "Smetana"}, {"name": "Mozzarellapallot", "amount": 125, "unit": "g", "chip": "Juusto"}, {"name": "Parmesaani", "amount": 50, "unit": "g", "chip": "Juusto"}, {"name": "Basilika koristeeksi", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Kuumenna öljy padassa, lisää pilkottu pekoni ja paista hetki kullanruskeaksi. Lisää sipuli, selleri ja porkkana, ja kypsennä 5 minuuttia pehmeiksi.", "Lisää valkosipuli ja jauheliha, ja ruskista lihaa lastalla rikkoen noin 6 minuuttia.", "Lisää tomaattipyree ja sekoita, kaada joukkoon tomaattimurska ja hunaja, mausta ja anna hautua 20 minuuttia.", "Kuumenna uuni 200 asteeseen. Levitä hieman kastiketta vuoan pohjalle, lado päälle lasagnelevyt ja toista kerrokset kastikkeella ja pastalla neljä kertaa, pastakerros päällimmäisenä.", "Sekoita ranskankerma tilkkaan vettä ja kaada tasaisesti pastan päälle. Ripottele mozzarella ja parmesaani päälle.", "Paista 25-30 minuuttia kunnes pinta on kuplivan kullanruskea. Tarjoa halutessasi basilikalla koristeltuna."]},
  {"id": "barbadoksen-makaronipiiras", "name": "Barbadoksen makaronipiiras", "category": "Pasta", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/kpiu4t1782242131.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Makaroni", "amount": 250, "unit": "g", "chip": "Pasta"}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Cheddarjuusto raastettuna", "amount": 375, "unit": "g", "chip": "Juusto"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 250, "unit": "ml", "chip": "Maito"}, {"name": "Sipulijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Sinappi", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Cayennepippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Korppujauhot", "amount": 2, "unit": "rkl", "chip": "Korppujauho"}, {"name": "Voi pinnalle", "amount": 2, "unit": "tl", "chip": "Voi"}, {"name": "Cheddarjuusto pinnalle", "amount": 2, "unit": "rkl", "chip": "Juusto"}], "steps": ["Keitä makaroni suolavedessä noin 8 minuuttia, kunnes se on kypsää mutta ei ylikypsää. Valuta ja sekoita joukkoon voi.", "Raasta cheddarjuusto ja sekoita se lämpimään makaroniin.", "Vatkaa kananmuna kuohkeaksi ja sekoita joukkoon maito, sipulijauhe, sinappi, pippuri, suola ja cayennepippuri. Kaada seos makaronin joukkoon ja sekoita.", "Kaada seos voideltuun vuokaan, ripottele pinnalle vielä juustoa, korppujauhoja ja pieniä voinokareita.", "Paista 180-asteisessa uunissa 30-45 minuuttia, kunnes pinta on kullanruskea ja pöhöttynyt."]},
  {"id": "venetsialainen-ankkaragu", "name": "Venetsialainen ankkaragu", "category": "Pasta", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qvrwpt1511181864.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ankankoivet", "amount": 4, "unit": "kpl", "chip": "Ankanliha"}, {"name": "Sipuli hienonnettuna", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kanelijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Vehnäjauho", "amount": 2, "unit": "tl", "chip": "Vehnäjauho"}, {"name": "Punaviini", "amount": 250, "unit": "ml", "chip": "Punaviini"}, {"name": "Tomaattimurska", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Kanaliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kanaliemi"}, {"name": "Rosmariini", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": "Sokeri"}, {"name": "Maito", "amount": 2, "unit": "rkl", "chip": "Maito"}, {"name": "Paccheri-pasta", "amount": 600, "unit": "g", "chip": "Pasta"}, {"name": "Parmesaani raastettuna", "amount": 1, "unit": "annos", "chip": "Juusto"}], "steps": ["Kuumenna öljy padassa ja ruskista ankankoivet joka puolelta noin 10 minuuttia. Nosta lautaselle odottamaan.", "Kuullota sipuli samassa padassa 5 minuuttia, lisää valkosipuli, kanelijauhe ja vehnäjauho, ja kypsennä hetki.", "Palauta ankankoivet pataan ja lisää viini, tomaattimurska, kanaliemi, rosmariini, laakerinlehti, sokeri ja mausteet. Kuumenna kiehuvaksi, laske lämpöä, peitä ja hauduta 2 tuntia välillä sekoittaen.", "Nosta ankankoivet, poista rasva, revi liha haarukoilla irti luista ja palauta liha kastikkeeseen maidon kanssa. Anna kiehua kannen alla vielä 10-15 minuuttia.", "Keitä paccheri-pasta pakkauksen ohjeen mukaan, valuta ja sekoita ragun joukkoon. Lisää tarvittaessa hieman keitinvettä, jos kastike on liian paksua.", "Tarjoile heti raastetun parmesaanin kera."]},
  {"id": "chilikatkarapulinguine", "name": "Chilinen katkarapulinguine", "category": "Pasta", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/usywpp1511189717.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Linguine-pasta", "amount": 280, "unit": "g", "chip": "Pasta"}, {"name": "Sokeriherneet", "amount": 200, "unit": "g", "chip": "Herne"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi hienonnettuna", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "iso", "chip": "Chili"}, {"name": "Jättikatkaravut", "amount": 24, "unit": "kpl", "chip": "Katkarapu"}, {"name": "Kirsikkatomaatit", "amount": 12, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Basilika", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Salaatinlehdet", "amount": 1, "unit": "annos", "chip": "Salaatti"}, {"name": "Rapea leipä tarjoiluun", "amount": 1, "unit": "annos", "chip": "Leipä"}, {"name": "Ranskankerma kastikkeeseen", "amount": 2, "unit": "rkl", "chip": "Tuorejuusto"}, {"name": "Limen raastettu kuori", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Hienosokeri", "amount": 2, "unit": "tl", "chip": "Sokeri"}], "steps": ["Sekoita kastikkeen ainekset pieneen kulhoon ja mausta suolalla ja pippurilla. Jätä odottamaan.", "Keitä pasta pakkauksen ohjeen mukaan, lisää sokeriherneet keittoveteen viimeiseksi minuutiksi.", "Kuumenna öljy wokissa, lisää valkosipuli ja chili ja kuullota noin 30 sekuntia ilman että valkosipuli tummuu. Lisää katkaravut ja paista kovalla lämmöllä noin 3 minuuttia, kunnes ne muuttuvat vaaleanpunaisiksi.", "Lisää tomaatit ja kypsennä 3 minuuttia, kunnes ne pehmenevät hieman. Valuta pasta ja herneet, ja sekoita katkarapuseoksen joukkoon.", "Revi basilikanlehdet joukkoon ja mausta suolalla ja pippurilla.", "Tarjoa salaatinlehtien ja limekastikkeen sekä rapean leivän kanssa."]},
  {"id": "sardiinipasta-puttanesca", "name": "Sardiinipasta puttanesca", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vvtvtr1511180578.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Spagetti", "amount": 300, "unit": "g", "chip": "Pasta"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": "Chili"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Sardiinit tomaattikastikkeessa", "amount": 425, "unit": "g", "chip": "Sardiini"}, {"name": "Mustat oliivit", "amount": 70, "unit": "g", "chip": "Oliivit"}, {"name": "Parmesaani lastuina", "amount": 1, "unit": "annos", "chip": "Juusto"}], "steps": ["Keitä pasta pakkauksen ohjeen mukaan.", "Kuumenna öljy paistinpannulla ja kuullota sipuli, valkosipuli ja chili 3-4 minuuttia pehmeiksi.", "Lisää tomaattipyree ja kypsennä minuutti, lisää sitten sardiinit kastikkeineen. Riko kalaa puulastalla ja lisää oliivit, hauda vielä muutama minuutti.", "Valuta pasta ja lisää se pannuun 2-3 ruokalusikallisen keitinveden kanssa. Sekoita hyvin.", "Jaa lautasille ja ripottele päälle parmesaania."]},
  {"id": "grillattu-makaronijuustovoileipa", "name": "Grillattu makaroni-juustovoileipä", "category": "Pasta", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xutquv1505330523.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Makaroni", "amount": 230, "unit": "g", "chip": "Pasta"}, {"name": "Vehnäjauho", "amount": 45, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Sinappijauhe", "amount": 0.75, "unit": "tl", "chip": null}, {"name": "Valkosipulijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Cayennepippuri", "amount": 0.125, "unit": "tl", "chip": null}, {"name": "Voi kastikkeeseen", "amount": 85, "unit": "g", "chip": "Voi"}, {"name": "Täysmaito", "amount": 360, "unit": "ml", "chip": "Maito"}, {"name": "Kuohukerma", "amount": 240, "unit": "ml", "chip": "Kerma"}, {"name": "Montereyjuusto", "amount": 455, "unit": "g", "chip": "Juusto"}, {"name": "Voi valkosipulivoihin", "amount": 55, "unit": "g", "chip": "Voi"}, {"name": "Valkosipulijauhe voihin", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vuokaleipä", "amount": 16, "unit": "viipaletta", "chip": "Leipä"}, {"name": "Cheddarjuusto", "amount": 8, "unit": "viipaletta", "chip": "Juusto"}, {"name": "Colby Jack -juusto", "amount": 8, "unit": "viipaletta", "chip": "Juusto"}, {"name": "Voi paistamiseen", "amount": 55, "unit": "g", "chip": "Voi"}], "steps": ["Keitä makaroni suolavedessä al denteksi pakkauksen ohjeen mukaan ja valuta.", "Sekoita kulhossa vehnäjauho, sinappijauhe, valkosipulijauhe, suola, pippuri ja cayennepippuri.", "Sulata voi samassa kattilassa, vatkaa joukkoon jauhoseos ja kypsennä noin minuutti kunnes tuoksuu pähkinäiseltä. Lisää vähitellen maito ja kerma koko ajan vatkaten, ja anna kastikkeen sakenee hieman.", "Ota kattila liedeltä, lisää juusto vähitellen sekoittaen kunnes se sulaa kastikkeeseen. Lisää keitetty makaroni ja sekoita.", "Levitä makaroni-juustoseos leivinpaperoidulle pellille tasaiseksi kerrokseksi ja jäähdytä jääkaapissa noin tunti, kunnes se on kiinteä. Leikkaa 8 palaan.", "Sekoita valkosipulivoi ja sivele leipäviipaleille. Kokoa voileivät cheddarilla, makaroni-juustopalalla ja Colby Jackilla, paista voissa pannulla molemmin puolin kullanruskeiksi ja kunnes täyte on lämmennyt läpi."]},
  {"id": "lasagne-voileivat", "name": "Lasagnetäytteiset voileivät", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xr0n4r1576788363.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Smetana", "amount": 60, "unit": "ml", "chip": "Smetana"}, {"name": "Sipuli hienonnettuna", "amount": 2, "unit": "rkl", "chip": "Sipuli"}, {"name": "Kuivattu oregano", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Vuokaleipä", "amount": 8, "unit": "viipaletta", "chip": "Leipä"}, {"name": "Pekoni", "amount": 8, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Tomaatti viipaloituna", "amount": 8, "unit": "viipaletta", "chip": "Tomaatti"}, {"name": "Mozzarella", "amount": 4, "unit": "viipaletta", "chip": "Juusto"}, {"name": "Voi", "amount": 2.5, "unit": "rkl", "chip": "Voi"}], "steps": ["Sekoita kulhossa smetana, sipuli, oregano ja suola.", "Levitä seos neljälle leipäviipaleelle. Lado päälle pekoni, tomaatti ja juusto, ja peitä loput leipäviipaleilla.", "Sulata pannulla tai levyllä 2 rkl voita ja paista voileivät molemmin puolin kullanruskeiksi ja rapeiksi, kunnes juusto on sulanut.", "Lisää tarvittaessa lisää voita paistamisen aikana.", "Tarjoa voileivät heti kuumina."]},
  {"id": "fettuccine-alfredo", "name": "Fettuccine alfredo", "category": "Pasta", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uquqtu1511178042.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kuohkea kerma", "amount": 227, "unit": "g", "chip": "Kerma"}, {"name": "Voi", "amount": 25, "unit": "g", "chip": "Voi"}, {"name": "Maissitärkkelys", "amount": 1, "unit": "tl", "chip": "Maissitärkkelys"}, {"name": "Parmesaani raastettuna", "amount": 100, "unit": "g", "chip": "Juusto"}, {"name": "Muskottipähkinä raastettuna", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Fettuccine", "amount": 250, "unit": "g", "chip": "Pasta"}, {"name": "Persilja tai ruohosipuli", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Kuumenna kerma, voi ja maissitärkkelys kattilassa miedolla lämmöllä matalaan kiehuntaan. Ota liedeltä ja pidä lämpimänä.", "Sekoita raastettu juusto ja muskottipähkinä pieneen kulhoon, mausta mustapippurilla.", "Keitä fettuccine suolalla maustetussa vedessä pakkauksen ohjeen mukaan, ota talteen hieman keitinvettä ja valuta pasta.", "Lisää pasta kermaseoksen joukkoon, ripottele juusto päälle ja sekoita varovasti kumilastalla miedolla lämmöllä.", "Lisää tarvittaessa muutama ruokalusikallinen keitinvettä, kunnes kastike on kiiltävä ja tasainen. Tarkista maku.", "Annostele lämpimille lautasille ja ripottele pinnalle tuoreita yrttejä."]},
  {"id": "makaronivanukas", "name": "Caymansaarten makaronivanukas", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hbte551782770868.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Makaroni", "amount": 400, "unit": "g", "chip": "Pasta"}, {"name": "Haihdutettu maito", "amount": 950, "unit": "ml", "chip": "Haihdutettu maito"}, {"name": "Vesi", "amount": 240, "unit": "ml", "chip": null}, {"name": "Sokeri", "amount": 600, "unit": "g", "chip": "Sokeri"}, {"name": "Suola", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Voi", "amount": 60, "unit": "g", "chip": "Voi"}, {"name": "Rusinat", "amount": 150, "unit": "g", "chip": "Rusinat"}, {"name": "Muskottipähkinä", "amount": 2.5, "unit": "tl", "chip": null}, {"name": "Vaniljauute", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Keitä makaroni runsaassa suolatussa vedessä kypsäksi, noin 25-30 minuuttia.", "Vatkaa samalla kananmunat ja sokeri keskenään, lisää vaniljauute ja hieman muskottia. Jätä odottamaan.", "Kuumenna toisessa kattilassa haihdutettu maito, vesi ja voi lähelle kiehumispistettä, ota liedeltä ja lisää muna-sokeriseokseen ohuena nauhana koko ajan sekoittaen.", "Valuta kypsä makaroni ja sekoita se rusinoiden kanssa maitoseokseen.", "Kaada seos voideltuun uunivuokaan, ripottele pinnalle vielä hieman muskottia. Paista 180-asteisessa uunissa noin tunti, kunnes vanukas on kiinteä mutta mehevä."]},
  {"id": "spagetti-carbonara", "name": "Spagetti carbonara", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Spagetti", "amount": 320, "unit": "g", "chip": "Pasta"}, {"name": "Munankeltuainen", "amount": 6, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Pekoni", "amount": 150, "unit": "g", "chip": "Pekoni"}, {"name": "Pecorino-juusto raastettuna", "amount": 50, "unit": "g", "chip": "Juusto"}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}], "steps": ["Keitä iso kattilallinen suolavettä ja keitä spagetti pakkauksen ohjeen mukaan al denteksi.", "Kuutioi pekoni ja paista se rapeaksi ja kullanruskeaksi pannulla ilman lisärasvaa.", "Vatkaa munankeltuaiset ja raastettu pecorino keskenään, mausta reilusti mustapippurilla.", "Ota kuuma valutettu pasta talteen hieman keitinvettä varten, ja lisää pasta pannuun pekonin joukkoon liedeltä otettuna.", "Kaada muna-juustoseos joukkoon ja sekoita nopeasti niin, että kastike paksunee mutta ei hyydy munaksi. Lisää tarvittaessa keitinvettä kastikkeen notkistamiseksi.", "Tarjoile heti lisäjuuston ja mustapippurin kera."]},
  {"id": "lohi-eggs-benedict", "name": "Savulohinen eggs benedict", "category": "Aamiainen", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1550440197.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmuna pochattavaksi", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Valkoviinietikka keitinveteen", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Englantilaiset muffinit", "amount": 2, "unit": "kpl", "chip": "Muffinipohja"}, {"name": "Voi paahtoleivälle", "amount": 1, "unit": "annos", "chip": "Voi"}, {"name": "Savulohi", "amount": 8, "unit": "viipaletta", "chip": "Lohi"}, {"name": "Sitruunamehu", "amount": 2, "unit": "tl", "chip": null}, {"name": "Valkoviinietikka kastikkeeseen", "amount": 2, "unit": "tl", "chip": null}, {"name": "Munankeltuainen", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suolaton voi", "amount": 125, "unit": "g", "chip": "Voi"}], "steps": ["Tee hollandaisekastike: sekoita sitruunamehu ja etikka kulhossa munankeltuaisten kanssa ja vatkaa vaaleaksi ja kuohkeaksi.", "Aseta kulho kiehuvan vesihauteen päälle ja vatkaa kunnes seos paksunee. Lisää sula voi vähitellen koko ajan vatkaten, kunnes kastike on paksu ja tasainen. Mausta ja pidä lämpimänä.", "Kuumenna kattilallinen vettä kiehuvaksi, lisää etikka ja laske lämpöä niin että vesi kiehuu hiljalleen. Pyöräytä vettä kevyesti ja liu'uta munat yksitellen veteen. Keitä noin 4 minuuttia ja nosta reikäkauhalla.", "Paahda ja voitele muffinipuolikkaat, ja lado päälle pari viipaletta savulohta.", "Nosta pochattu muna jokaisen muffinin päälle, lusikoi päälle hollandaisekastiketta ja koristele ruohosipulilla."]},
  {"id": "kaurahiutalelettuset", "name": "Kaurahiutalelettuset", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/c400ok1764439058.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 80, "unit": "ml", "chip": "Maito"}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Leivinjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Vaniljauute", "amount": 1, "unit": "tilkka", "chip": null}, {"name": "Kaurahiutaleet jauhettuna", "amount": 150, "unit": "g", "chip": "Kaurahiutale"}, {"name": "Voi paistamiseen", "amount": 150, "unit": "g", "chip": "Voi"}, {"name": "Sokerisiirappi", "amount": 1, "unit": "rkl", "chip": "Sokerisiirappi"}, {"name": "Mansikoita", "amount": 3, "unit": "kpl", "chip": "Mansikka"}], "steps": ["Mittaa kaikki taikinan ainekset sekoituskulhoon tai tehosekoittimeen ja vatkaa tasaiseksi.", "Anna taikinan levätä noin 10 minuuttia.", "Voitele kuuma paistinpannu kevyesti voilla ja kaada pannulle pieni annos taikinaa.", "Kun pinnalle nousee kuplia, käännä lettu lastalla. Paista keskilämmöllä, jotta lettu ei pala.", "Tarjoa lämpimät letut sokerisiirapin ja mansikoiden kera."]},
  {"id": "jamaikalainen-maissipuuro", "name": "Jamaikalainen maissipuuro", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sng9bm1765320170.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vesi", "amount": 600, "unit": "ml", "chip": null}, {"name": "Kookosmaito", "amount": 380, "unit": "g", "chip": "Kookosmaito"}, {"name": "Hieno keltainen maissijauho", "amount": 150, "unit": "g", "chip": "Maissijauho"}, {"name": "Vesi maissijauhoon", "amount": 360, "unit": "ml", "chip": null}, {"name": "Vaniljauute", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Muskottipähkinä", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maustepippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Makeutettu kondensoitu maito", "amount": 120, "unit": "ml", "chip": "Kondensoitu maito"}], "steps": ["Kiehauta vesi ja kookosmaito paksupohjaisessa kattilassa keskilämmöllä.", "Vatkaa samalla maissijauho ja vesi erillisessä kulhossa tasaiseksi seokseksi.", "Kun kattilan neste kiehuu, vatkaa joukkoon maissijauhoseos noin minuutin ajan, kunnes ei ole paakkuja. Laske lämpö matalaksi ja peitä kannella.", "Anna kypsyä 15-20 minuuttia miedolla lämmöllä, sekoittaen välillä. Lisää loppuvaiheessa vanilja, kaneli, muskotti ja maustepippuri.", "Ota liedeltä ja makeuta kondensoidulla maidolla. Tarjoa heti."]},
  {"id": "savukalakedgeree", "name": "Savukolja-kedgeree", "category": "Aamiainen", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1550441275.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 50, "unit": "g", "chip": "Voi"}, {"name": "Sipuli hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kardemumma", "amount": 3, "unit": "palkoa", "chip": null}, {"name": "Kurkumajauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kanelitanko", "amount": 1, "unit": "pieni", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Basmatiriisi", "amount": 450, "unit": "g", "chip": "Riisi"}, {"name": "Kanaliemi", "amount": 1000, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Savustettu kolja", "amount": 750, "unit": "g", "chip": "Savukala"}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sitruuna lohkoina", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Sulata voi kattilassa, lisää sipuli ja kuullota 5 minuuttia pehmeäksi mutta ei ruskeaksi.", "Lisää kardemumma, kurkuma, kanelitanko ja laakerinlehdet, ja kypsennä minuutin ajan.", "Kaada joukkoon riisi ja sekoita, kunnes se on tasaisesti maustevoin peitossa. Lisää kanaliemi ja suola, kuumenna kiehuvaksi, peitä ja hauduta miedolla lämmöllä noin 12 minuuttia.", "Keitä samaan aikaan koljafile toisessa kattilassa vedessä 4 minuuttia kypsäksi, nosta jäähtymään ja keitä munat kovaksi noin 8 minuuttia.", "Suikaloi kala nahasta ja ruodoista vapaana, kuori ja pilko munat. Nosta ne varovasti riisin sekaan laakerinlehdet ja kanelitanko poistaen, ja anna lämmetä yhdessä pari minuuttia.", "Sekoita joukkoon suurin osa persiljasta, mausta suolalla ja pippurilla, ja tarjoa loppupersiljan ja sitruunalohkojen kera."]},
  {"id": "jemeninlainen-shakshuka", "name": "Jemeniläinen munaruoka", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/30s7vf1763741844.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmuna", "amount": 5, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sipuli kuutioituna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Tomaatti kuutioituna", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Maustepippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Sulatejuusto", "amount": 3, "unit": "rkl", "chip": "Juusto"}], "steps": ["Kuumenna öljy pannulla keskilämmöllä ja kuullota kuutioitu sipuli pehmeäksi.", "Lisää tomaattikuutiot ja kypsennä 4-5 minuuttia.", "Mausta maustepippurilla ja mustapippurilla, lisää halutessasi ripaus suolaa.", "Riko munat pannulle, sekoita seosta kevyesti pari minuuttia ja peitä kannella. Anna kypsyä 5-6 minuuttia, kunnes pinta on hyytynyt.", "Levitä pinnalle sulatejuustoa ja anna sulaa hetki kannen alla ennen tarjoilua.", "Tarjoa halutessasi paahdettujen perunoiden, oliivien ja fetajuuston kera."]},
  {"id": "antiguan-chop-up", "name": "Antigualainen vihannessose", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/jvjnoh1780086318.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Munakoiso", "amount": 4, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Pinaatti (callaloo)", "amount": 225, "unit": "g", "chip": "Pinaatti"}, {"name": "Kurpitsa", "amount": 450, "unit": "g", "chip": "Kurpitsa"}, {"name": "Valkosipuli hienonnettuna", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sipuli kuutioituna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Voi", "amount": 55, "unit": "g", "chip": "Voi"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}], "steps": ["Kuori ja paloittele munakoiso ja kurpitsa keskikokoisiksi paloiksi.", "Sulata voi kattilassa ja kuullota sipuli ja valkosipuli 2 minuuttia pehmeiksi.", "Lisää kurpitsa ja munakoiso, ja paista vielä 2-3 minuuttia.", "Lisää vettä juuri kasvisten peitoksi, kuumenna kiehuvaksi, laske lämpöä ja hauduta kunnes kasvikset ovat pehmeitä.", "Lisää pinaatti, sekoita ja kypsennä vielä 3 minuuttia. Valuta liika neste pois.", "Soseuta seos survimella tai vispilällä, mausta suolalla ja pippurilla maun mukaan."]},
  {"id": "aamiaisperunat", "name": "Aamiaisperunat pekonilla", "category": "Aamiainen", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1550441882.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 3, "unit": "kpl", "chip": "Peruna"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Pekoni", "amount": 2, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Valkosipulinkynsi hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Vaahterasiirappi", "amount": 1, "unit": "rkl", "chip": "Vaahterasiirappi"}, {"name": "Persilja", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Maustepippuri", "amount": 1, "unit": "maun mukaan", "chip": null}], "steps": ["Pese perunat ja pilko ne keskikokoisiksi kuutioiksi. Laita perunat vesikulhoon estämään tummumista.", "Kuumenna öljy suuressa paistinpannussa keskikuumalla ja kallistele pannua, jotta öljy leviää tasaisesti.", "Valuta perunat ja lisää kuumaan öljyyn. Mausta suolalla, pippurilla ja maustepippurilla, ja paista noin 10 minuuttia välillä käännellen, kunnes ruskistuvat.", "Pilko pekoni ja lisää perunoiden joukkoon. Paista 5-6 minuuttia, kunnes pekoni on rapea.", "Laske lämpöä, lisää valkosipuli ja persilja, ja paista vielä minuutin ajan.", "Kaada juuri ennen tarjoilua vaahterasiirappi joukkoon ja sekoita. Tarjoa esimerkiksi paistetun kananmunan kanssa."]},
  {"id": "englantilainen-aamiainen", "name": "Perinteinen englantilainen aamiainen", "category": "Aamiainen", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/utxryw1511721587.jpg", "aiImage": false, "servings": 2, "ingredients": [{"name": "Makkarat", "amount": 2, "unit": "kpl", "chip": "Makkara"}, {"name": "Pekoni", "amount": 3, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Herkkusienet", "amount": 2, "unit": "kpl", "chip": "Sieni"}, {"name": "Tomaatti", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Verimakkara", "amount": 1, "unit": "viipale", "chip": "Verimakkara"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Leipäviipale paistamiseen", "amount": 1, "unit": "viipale", "chip": "Leipä"}], "steps": ["Kuumenna paistinpannu tai grillilevy miedolla lämmöllä ja voitele kevyesti öljyllä.", "Paista makkarat hitaasti noin 15-20 minuuttia välillä käännellen, kunnes kauttaaltaan kypsiä ja kullanruskeita.", "Paista pekoni samalla levyllä 2-4 minuuttia puolelta, kunnes se on sopivan rapea. Paista sienet ja puolitetut tomaatit muutama minuutti puolelta suolan ja pippurin kera.", "Paista verimakkaraviipaleet 1-2 minuuttia puolelta, kunnes hieman rapeat.", "Paista leipäviipale toisessa pannussa runsaassa öljyssä molemmin puolin rapeaksi, ja paista munat samaan pannuun halutulle kypsyysasteelle.", "Kokoa kaikki ainekset lämpimille lautasille ja tarjoa heti."]},
  {"id": "taysi-englantilainen-aamiainen", "name": "Täysi englantilainen aamiainen", "category": "Aamiainen", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sqrtwu1511721265.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Makkarat", "amount": 4, "unit": "kpl", "chip": "Makkara"}, {"name": "Pekoni", "amount": 4, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Herkkusienet", "amount": 4, "unit": "kpl", "chip": "Sieni"}, {"name": "Tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Verimakkara", "amount": 2, "unit": "viipaletta", "chip": "Verimakkara"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Leipäviipale paistamiseen", "amount": 1, "unit": "viipale", "chip": "Leipä"}, {"name": "Papuja tomaattikastikkeessa", "amount": 100, "unit": "g", "chip": "Pavut"}], "steps": ["Kuumenna paistinpannu tai grillilevy miedolla lämmöllä ja voitele kevyesti öljyllä.", "Paista makkarat hitaasti noin 15-20 minuuttia välillä käännellen, kunnes kauttaaltaan kypsiä ja kullanruskeita.", "Paista pekoni samalla levyllä 2-4 minuuttia puolelta. Paista sienet ja puolitetut tomaatit muutama minuutti puolelta suolan ja pippurin kera.", "Paista verimakkaraviipaleet 1-2 minuuttia puolelta, kunnes hieman rapeat. Kuumenna samalla papuja tomaattikastikkeessa pienessä kattilassa.", "Paista leipäviipale toisessa pannussa runsaassa öljyssä molemmin puolin rapeaksi, ja paista munat samaan pannuun halutulle kypsyysasteelle.", "Kokoa kaikki ainekset lämpimille lautasille ja tarjoa heti."]},
  {"id": "hollantilaiset-poffertjes", "name": "Hollantilaiset minilettuset", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/oaqz9f1766593912.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 125, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Tattarijauho", "amount": 125, "unit": "g", "chip": "Tattarijauho"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Voi taikinaan", "amount": 1, "unit": "nokare", "chip": "Voi"}, {"name": "Maito", "amount": 300, "unit": "ml", "chip": "Maito"}, {"name": "Hiiva", "amount": 10, "unit": "g", "chip": "Hiiva"}, {"name": "Vaniljasokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Voi tarjoiluun", "amount": 1, "unit": "annos", "chip": "Voi"}, {"name": "Tomusokeri tarjoiluun", "amount": 1, "unit": "annos", "chip": "Tomusokeri"}], "steps": ["Liuota hiiva haaleaan maitoon.", "Sekoita tattarijauho ja vehnäjauho kulhossa, tee keskelle kuoppa ja kaada sinne hiivaliemi. Lisää loput maidosta ja sekoita tasaiseksi taikinaksi.", "Lisää kananmunat, suola ja vaniljasokeri, ja sekoita. Anna taikinan kohota noin 45 minuuttia liinan alla.", "Kuumenna poffertjes-pannu ja laita jokaiseen kuoppaan pieni nokare voita. Kaada kuopat puolilleen taikinaa.", "Paista ensin toinen puoli kunnes pinta alkaa kuivua, käännä pienellä haarukalla ja paista toinen puoli kullanruskeaksi.", "Tarjoa lämpiminä voin ja tomusokerin kera."]},
  {"id": "hedelma-tuorejuustopiirakat", "name": "Hedelmäiset tuorejuustotortut", "category": "Aamiainen", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1543774956.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Tuorejuusto", "amount": 35, "unit": "g", "chip": "Tuorejuusto"}, {"name": "Sokeri", "amount": 250, "unit": "g", "chip": "Sokeri"}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vehnäjauho leipomiseen", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Voitaikina", "amount": 2, "unit": "kpl", "chip": "Voitaikina"}, {"name": "Mansikoita", "amount": 1, "unit": "annos", "chip": "Mansikka"}, {"name": "Vadelmia", "amount": 1, "unit": "annos", "chip": "Vadelma"}, {"name": "Karhunvatukoita", "amount": 1, "unit": "annos", "chip": "Karhunvatukka"}], "steps": ["Kuumenna uuni 200 asteeseen ja vuoraa kaksi leivinpeltiä leivinpaperilla.", "Sekoita kulhossa tuorejuusto, sokeri ja vaniljauute tasaiseksi seokseksi.", "Jauhota työtaso, kauli voitaikina levyksi ja leikkaa se yhdeksään yhtä suureen neliöön.", "Leikkaa jokaisen neliön kahteen vastakkaiseen kulmaan L-kirjaimen muotoinen viilto reunasta noin sentin päähän, ja taita toinen kulma vastakkaiseen alanurkkaan niin että syntyy timantin muoto.", "Lusikoi keskelle täytettä ja lisää päälle marjoja. Toista lopuille neliöille ja siirrä pellille.", "Paista 15-20 minuuttia kunnes taikina on kullanruskea ja pöhöttynyt."]},
  {"id": "mandazi-donitsit", "name": "Kenialaiset mandazi-donitsit", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/thazgm1555350962.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Itsekohoava vehnäjauho", "amount": 750, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Sokeri", "amount": 6, "unit": "rkl", "chip": "Sokeri"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 240, "unit": "ml", "chip": "Maito"}], "steps": ["Sekoita kulhossa jauho ja sokeri.", "Vatkaa erillisessä kulhossa kananmuna maidon joukkoon.", "Tee jauhon keskelle kuoppa, kaada muna-maitoseos joukkoon ja sekoita hitaasti taikinaksi.", "Vaivaa taikinaa 3-4 minuuttia, kunnes se ei enää tartu kulhon reunoihin ja pinta on tasainen. Peitä kostealla liinalla ja anna levätä 15 minuuttia.", "Kauli taikina noin sentin paksuiseksi levyksi jauhotetulla alustalla ja leikkaa haluamasi kokoisiksi paloiksi.", "Paista palat kuumassa öljyssä molemmin puolin vaaleanruskeiksi ja tarjoa lämpiminä tai kylminä."]},
  {"id": "torrijat", "name": "Espanjalaiset torrijat", "category": "Aamiainen", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/927vvp1779732018.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Appelsiinin raastettu kuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Sitruunan raastettu kuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Täysmaito", "amount": 950, "unit": "ml", "chip": "Maito"}, {"name": "Sokeri", "amount": 100, "unit": "g", "chip": "Sokeri"}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kuiva sherry", "amount": 80, "unit": "ml", "chip": "Sherry"}, {"name": "Patonki", "amount": 1, "unit": "kpl", "chip": "Leipä"}, {"name": "Oliiviöljy paistamiseen", "amount": 240, "unit": "ml", "chip": null}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Hunaja tarjoiluun", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Raasta appelsiinin ja sitruunan kuori kattilaan, lisää maito, sokeri ja kanelitanko, ja kuumenna kiehuvaksi. Ota liedeltä ja sekoita joukkoon sherry.", "Leikkaa patonki noin sentin paksuisiksi viipaleiksi ja lado ne uunivuokaan.", "Kaada haalennut maitoseos leipäviipaleiden päälle ja anna imeytyä noin 5 minuuttia, käännä viipaleet ja anna vielä 5 minuuttia, kunnes leipä on imenyt nestettä muttei hajoa.", "Kuumenna öljy paistinpannulla ja vatkaa munat kulhossa.", "Kastele jokainen leipäviipale munaseoksessa ja paista öljyssä molemmin puolin kullanruskeaksi, noin 3-4 minuuttia puolelta.", "Nosta talouspaperin päälle valumaan ja tarjoa hunajalla kuorrutettuna."]},
  {"id": "kolumbialaiset-tayteperunapallot", "name": "Kolumbialaiset täytetyt perunapallot", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/zdyurx1783801146.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kasviöljy paistamiseen", "amount": 1, "unit": "annos", "chip": null}, {"name": "Peruna", "amount": 5, "unit": "kpl", "chip": "Peruna"}, {"name": "Suola perunoihin", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Oliiviöljy täytteeseen", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaatti kuutioituna", "amount": 150, "unit": "g", "chip": "Tomaatti"}, {"name": "Sipuli hienonnettuna", "amount": 80, "unit": "ml", "chip": "Sipuli"}, {"name": "Kevätsipuli hienonnettuna", "amount": 80, "unit": "ml", "chip": "Kevätsipuli"}, {"name": "Valkosipulinkynsi murskattuna", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Jauhettu kumina", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Sazon-mauste", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Suola täytteeseen", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Mustapippuri täytteeseen", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Naudan jauheliha", "amount": 225, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Kananmuna taikinaan", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vehnäjauho taikinaan", "amount": 30, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Suola taikinaan", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Sazon-mauste taikinaan", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Maito taikinaan", "amount": 60, "unit": "ml", "chip": "Maito"}], "steps": ["Kuori perunat, paloittele ja keitä suolatussa vedessä noin 20 minuuttia kunnes pehmeitä. Valuta ja soseuta haarukalla.", "Kuumenna öljy pannussa ja kuullota sipuli, tomaatti, kevätsipuli, valkosipuli, kumina ja sazon-mauste 5 minuuttia. Lisää jauheliha ja paista 10-15 minuuttia, jäähdytä hieman.", "Sekoita taikinan ainekset kulhossa tasaiseksi ja jätä odottamaan.", "Jaa perunasose 10 osaan, muotoile palloiksi ja litistä lätyiksi. Lusikoi keskelle täytettä ja sulje reunat huolellisesti pallon muotoon.", "Kuumenna öljy 180 asteeseen, kastele perunapallot taikinassa ja paista kultaisenruskeiksi noin 4 minuuttia välillä käännellen.", "Nosta talouspaperille valumaan ja tarjoa halutun kastikkeen kanssa."]},

smetanan, viipaloidun avokadon ja korianterin kera, limelohkon kanssa."]},
  {"id": "uunibrie-suolaheinahillolla", "name": "Uunibrie suolaheinähillolla", "category": "Alkuruoka", "price": 3, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/fg7d641784666908.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kuivattu suolaheinä", "amount": 240, "unit": "ml", "chip": "Suolaheinä"}, {"name": "Ruskea sokeri", "amount": 400, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Inkiväärijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kanelijauhe", "amount": 60, "unit": "ml", "chip": null}, {"name": "Vaniljatanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Appelsiinin raastettu kuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Vesi hilloon", "amount": 1, "unit": "annos", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Voitaikina", "amount": 1, "unit": "kpl", "chip": "Voitaikina"}, {"name": "Brie-juusto", "amount": 900, "unit": "g", "chip": "Juusto"}, {"name": "Vesi munavoiteluun", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Yhdistä sokeri, suolaheinä, appelsiinin kuori ja hieman vettä kattilassa, kuumenna kiehuvaksi ja hauduta kunnes suolaheinä pehmenee ja seos paksuuntuu hillon paksuiseksi. Lisää inkivääri, kaneli ja vanilja, ja anna jäähtyä.", "Leikkaa brie-juusto halki tai jätä kokonaiseksi kiekoksi, ja lusikoi jäähtynyttä hilloa reilusti pinnalle.", "Kauli voitaikina levyksi ja leikkaa ylimääräiset reunat pois.", "Kääri taikina huolellisesti juuston ympärille niin, että se peittyy kokonaan, ja purista saumat tiiviisti kiinni. Käännä pakkaus sauma alaspäin leivinpaperoidulle pellille.", "Sekoita muna ja vesi, ja sivele seos taikinan pinnalle. Voit koristella pinnan ylijäämätaikinalla.", "Paista 200-asteisessa uunissa kunnes taikina on kullanruskea ja rapea, ja anna vetäytyä hetki ennen tarjoilua."]},
  {"id": "kermainen-tomaattikeitto", "name": "Kermainen tomaattikeitto", "category": "Alkuruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/stpuws1511191310.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sipuli hienonnettuna", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Selleri", "amount": 2, "unit": "vartta", "chip": "Selleri"}, {"name": "Porkkana", "amount": 300, "unit": "g", "chip": "Porkkana"}, {"name": "Peruna", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Laakerinlehti", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Tomaattipyree", "amount": 5, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Sokeri", "amount": 2, "unit": "rkl", "chip": "Sokeri"}, {"name": "Valkoviinietikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Tomaattimurska", "amount": 1500, "unit": "g", "chip": "Tomaatti"}, {"name": "Passata", "amount": 500, "unit": "g", "chip": "Tomaatti"}, {"name": "Kasvisliemikuutio", "amount": 3, "unit": "kpl", "chip": "Kasvisliemi"}, {"name": "Täysmaito", "amount": 400, "unit": "ml", "chip": "Maito"}], "steps": ["Lämmitä öljy isossa padassa, lisää sipuli, selleri, porkkana, peruna ja laakerinlehdet, ja hauduta miedolla lämmöllä 10-15 minuuttia, kunnes sipuli on pehmennyt.", "Sekoita joukkoon tomaattipyree, sokeri, etikka, tomaattimurska ja passata, ja murenna joukkoon liemikuutiot.", "Lisää litra kiehuvaa vettä, kuumenna kiehuvaksi ja hauduta kannen alla 15 minuuttia, kunnes peruna on kypsä. Poista laakerinlehdet.", "Soseuta keitto sauvasekoittimella tai tehosekoittimessa hyvin tasaiseksi. Mausta ja lisää tarvittaessa hieman sokeria.", "Kuumenna keitto uudelleen tarjoiluvaiheessa ja sekoita joukkoon maito varovasti ilman kiehauttamista.", "Tarjoa pienissä kulhoissa, esimerkiksi juustoisten voisarvien kera."]},
  {"id": "brokkoli-stiltonkeitto", "name": "Brokkoli-stiltonkeitto", "category": "Alkuruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/tvvxpv1511191952.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Varsiselleri", "amount": 1, "unit": "kpl", "chip": "Selleri"}, {"name": "Purjo, viipaloitu", "amount": 1, "unit": "kpl", "chip": "Purjo"}, {"name": "Peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Voi", "amount": 15, "unit": "g", "chip": "Voi"}, {"name": "Kasvisliemi, kuuma", "amount": 1, "unit": "l", "chip": "Kasvisliemi"}, {"name": "Parsakaali, paloiteltu", "amount": 1, "unit": "kpl", "chip": "Parsakaali"}, {"name": "Stilton-juusto", "amount": 140, "unit": "g", "chip": "Juusto"}], "steps": ["Kuumenna öljy kattilassa ja kuullota sipulia keskilämmöllä, kunnes se pehmenee.", "Lisää selleri, purjo, peruna ja voinokare, peitä kannella ja anna hautua noin 5 minuuttia.", "Kaada joukkoon kasvisliemi ja isoimmat brokkolinvarret, keitä 10-15 minuuttia kunnes kasvikset ovat pehmeitä.", "Lisää loput brokkolista ja keitä vielä 5 minuuttia.", "Soseuta keitto sauvasekoittimella tai tehosekoittimessa, sekoita joukkoon murustettu stilton niin että osa jää nyhtelöiksi.", "Mausta mustapippurilla ja tarjoa heti."]},
  {"id": "tuorejuustopiirakka-tomaatilla", "name": "Tuorejuustopiirakka tomaatilla", "category": "Alkuruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wurrux1468416624.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 250, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Voi", "amount": 125, "unit": "g", "chip": "Voi"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Tuorejuusto", "amount": 300, "unit": "g", "chip": "Tuorejuusto"}, {"name": "Maito", "amount": 1, "unit": "dl", "chip": "Maito"}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Parmesaanijuusto, raastettu", "amount": 100, "unit": "g", "chip": "Parmesaani"}, {"name": "Pieniä tomaatteja", "amount": 350, "unit": "g", "chip": "Tomaatti"}, {"name": "Valkoviinietikka", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Hunaja", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Basilika", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Muodosta jauhoista, voista, munasta ja suolasta taikina, painele se piirakkavuokaan ja anna jäähtyä jääkaapissa.", "Sekoita tuorejuusto ja maito tasaiseksi, lisää loput munat ja parmesaani ja mausta suolalla, pippurilla ja muskotilla.", "Pistele pohja haarukalla, kaada täyte päälle ja paista 175 asteessa noin 25 minuuttia, peitä folioilla puolessa välissä.", "Viipaloi tomaatit ja sekoita niihin kuumennetut öljy, etikka ja hunaja maustettuna suolalla ja pippurilla.", "Nosta tomaattiviipaleet valmiin piirakan päälle ja koristele tuoreilla basilikanlehdillä."]},
  {"id": "simpukkakeitto-new-englandin-tyyliin", "name": "Simpukkakeitto New Englandin tyyliin", "category": "Kala ja äyriäiset", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/rvtvuw1511190488.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Simpukat", "amount": 1.5, "unit": "kg", "chip": "Simpukat"}, {"name": "Voi", "amount": 50, "unit": "g", "chip": "Voi"}, {"name": "Pekoni", "amount": 150, "unit": "g", "chip": "Pekoni"}, {"name": "Sipuli, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Timjami", "amount": 2, "unit": "oksaa", "chip": null}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Vehnäjauho", "amount": 1, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Maito", "amount": 1.5, "unit": "dl", "chip": "Maito"}, {"name": "Kuohukerma", "amount": 1.5, "unit": "dl", "chip": "Kerma"}, {"name": "Peruna", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Persilja, silputtu", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Huuhtele simpukat, keitä niitä 500 ml:ssa vettä kannen alla pari minuuttia kunnes kuoret aukeavat, siivilöi liemi talteen ja irrota simpukanliha kuorista.", "Ruskista pekonia voissa samassa kattilassa, lisää sipuli, timjami ja laakerinlehti ja hauduta pehmeäksi.", "Ripottele joukkoon jauhot, sekoita tahnaksi ja lisää vähitellen simpukkaliemi, maito ja kerma.", "Lisää perunakuutiot ja keitä noin 10 minuuttia, murskaa osa perunoista keiton reunaa vasten paksuntamaan liemeä.", "Sekoita joukkoon simpukanliha, kuumenna läpi ja mausta suolalla ja mustapippurilla.", "Viimeistele persiljalla ja tarjoa esimerkiksi rapean leivän kanssa."]},
  {"id": "afganistanilaiset-mantu-taskut", "name": "Afganistanilaiset mantu-taskut", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/oemdp11779556068.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 450, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Vesi", "amount": 225, "unit": "ml", "chip": null}, {"name": "Lampaan jauheliha", "amount": 450, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Vihreä chili, hienonnettu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Sipuli, hienonnettu", "amount": 450, "unit": "g", "chip": "Sipuli"}, {"name": "Mustapippuri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kasviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Siivilöity jogurtti", "amount": 425, "unit": "ml", "chip": "Jogurtti"}, {"name": "Korianteri, silputtu", "amount": 1, "unit": "hyppysellinen", "chip": null}], "steps": ["Sekoita jauhoihin suola ja vesi, vaivaa kimmoisaksi taikinaksi ja anna levätä liinan alla noin tunti.", "Sekoita lampaanjauheliha, sipuli, chili, suola, pippuri ja mausteet keskenään täytteeksi.", "Kaulitse taikina ohueksi ja leikkaa noin 10 cm neliöiksi, laita jokaiseen lusikallinen täytettä.", "Taita kulmat keskelle niin että pieni aukko jää höyryn kulkua varten, ja höyrytä taskuja 30-45 minuuttia.", "Kuumenna öljy, lisää tomaattipyree ja hauduta yksinkertaiseksi kastikkeeksi.", "Nosta mantu-taskut lautaselle, kaada päälle tomaattikastike ja jogurtti, viimeistele korianterilla."]},

  {"id": "mutabbaq-taskuleivat", "name": "Mutabbaq-taskuleivät", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/i5o2b61763739053.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Jauheliha", "amount": 500, "unit": "g", "chip": "Jauheliha"}, {"name": "Valkosipuli, murskattu", "amount": 1.5, "unit": "rkl", "chip": "Valkosipuli"}, {"name": "Inkivääri, murskattu", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Tomaatti, hienonnettu", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Kevätsipuli, hienonnettu", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Filotaikinalevyt", "amount": 12, "unit": "kpl", "chip": "Filotaikina"}, {"name": "Sulatettu voi", "amount": 3.6, "unit": "dl", "chip": "Voi"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jeera", "amount": 1, "unit": "tl", "chip": null}, {"name": "Maustesekoitus (allspice)", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kurkuma", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": "Sokeri"}], "steps": ["Ruskista valkosipuli ja inkivääri öljyssä, lisää jauheliha ja mausteet ja kypsennä läpi. Anna jäähtyä.", "Sekoita jäähtynyt liha isossa kulhossa munan, tomaatin ja kevätsipulin kanssa.", "Aseta filotaikinalevy tai kevätrullataikina pöydälle, sivele sulatetulla voilla ja lusikoi täyte keskelle.", "Taita taikina täytteen ympärille tiiviiksi taskuksi ja sivele sauma voilla.", "Paista taskuja pannulla öljyssä joka puolelta kultaisen ruskeiksi, tai voitele voilla ja paista uunissa 180 asteessa 10-15 minuuttia."]},

  {"id": "afganistanilainen-baghlaw", "name": "Afganistanilainen saostettu pähkinäleivos siirapissa", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/bjtjyl1779552068.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Vehnäjauho", "amount": 600, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 450, "unit": "ml", "chip": "Maito"}, {"name": "Kasviöljy paistamiseen", "amount": 75, "unit": "ml", "chip": null}, {"name": "Leivinjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jauhetut saksanpähkinät", "amount": 50, "unit": "g", "chip": "Saksanpähkinä"}, {"name": "Kardemumma", "amount": 10, "unit": "g", "chip": null}, {"name": "Sokeri", "amount": 300, "unit": "g", "chip": "Sokeri"}, {"name": "Vesi", "amount": 1, "unit": "l", "chip": null}], "steps": ["Vatkaa munat ja sekoita ne jauhoihin, lisää maito ja vaivaa joukkoon jauhetut saksanpähkinät, leivinjauhe ja kardemumma kimmoisaksi taikinaksi.", "Kaulitse taikina ohueksi suorakaiteeksi, taittele se noin 3 cm levyisiksi nauhoiksi ja leikkaa paloiksi.", "Kuumenna öljy paistolämpötilaan, samalla keitä vedestä ja sokerista siirappi ja pidä lämpimänä.", "Paista taikinapalat öljyssä kullanruskeiksi ja nosta ne suoraan lämpimään siirappiin liotumaan.", "Nosta leivokset siirapista, ripottele vielä lämpiminä pintaan jauhettuja saksanpähkiniä ja anna jäähtyä ennen tarjoilua."]},
  {"id": "bakewell-torttu", "name": "Bakewell-torttu", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wyrqqq1468233628.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Vehnäjauho", "amount": 175, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kylmä voi", "amount": 75, "unit": "g", "chip": "Voi"}, {"name": "Kylmä vesi", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Vadelmahillo", "amount": 1, "unit": "rkl", "chip": "Vadelmahillo"}, {"name": "Voi", "amount": 125, "unit": "g", "chip": "Voi"}, {"name": "Sokeri", "amount": 125, "unit": "g", "chip": "Sokeri"}, {"name": "Manteljauhe", "amount": 125, "unit": "g", "chip": "Manteli"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Manteliuute", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Manteliviipaleet", "amount": 50, "unit": "g", "chip": "Manteli"}], "steps": ["Hierro jauhot ja kylmä voi murumaiseksi, lisää kylmää vettä kunnes taikina kokoontuu, kaulitse ja vuoraa sillä piirakkavuoka. Jäähdytä 30 minuuttia.", "Kuumenna uuni 200 asteeseen, paista pohjaa foliolla ja papupainoilla 15 minuuttia, poista painot ja paista vielä 5 minuuttia.", "Levitä vadelmahillo paistetun pohjan päälle.", "Sulata voi, sekoita joukkoon sokeri, manteljauhe, muna ja manteliuute, ja kaada seos hillon päälle.", "Ripottele pinnalle manteliviipaleet ja paista noin 35 minuuttia, peitä foliolla jos manteli tummuu liian nopeasti."]},
  {"id": "bulgarialaiset-hunajakeksit", "name": "Bulgarialaiset hunajakeksit", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/y75q5j1782685779.jpg", "aiImage": false, "servings": 8, "ingredients": [{"name": "Kananmuna, isoja", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Tomusokeri", "amount": 2.4, "unit": "dl", "chip": "Sokeri"}, {"name": "Hunaja", "amount": 0.6, "unit": "dl", "chip": "Hunaja"}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kasviöljy", "amount": 7.2, "unit": "dl", "chip": "Kasviöljy"}, {"name": "Vehnäjauho", "amount": 9.6, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 1, "unit": "tl", "chip": null}, {"name": "Leivinjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suklaanapit", "amount": 4.8, "unit": "dl", "chip": "Suklaa"}], "steps": ["Vatkaa munat ja tomusokeri parisen minuuttia, lisää vaniljauute ja hunaja, sekoita ja lisää lopuksi öljy.", "Yhdistä jauhot, suola, kaneli ja leivinjauhe erikseen ja sekoita ne kahdessa erässä taikinaan. Anna taikinan levätä 5-10 minuuttia.", "Muotoile taikinasta pieniä palloja, litistä ne pellille ja paista 180 asteessa 12-15 minuuttia kullanruskeiksi. Anna jäähtyä täysin.", "Sulata suklaa öljyn kanssa vesihauteessa.", "Kasta jäähtyneet keksit puoliksi sulaan suklaaseen ja anna suklaan jähmettyä ennen tarjoilua."]},
  {"id": "joulukakku-briteittain", "name": "Joulukakku briteittäin", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ldnrm91576791881.jpg", "aiImage": false, "servings": 10, "ingredients": [{"name": "Voi", "amount": 200, "unit": "g", "chip": "Voi"}, {"name": "Ruskea sokeri (muscovado)", "amount": 200, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Vehnäjauho", "amount": 200, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna, vatkattu", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Manteljauhe", "amount": 50, "unit": "g", "chip": "Manteli"}, {"name": "Sherry", "amount": 100, "unit": "ml", "chip": "Sherry"}, {"name": "Sokeroitu hedelmäkuori", "amount": 85, "unit": "g", "chip": "Sokeroitu hedelmäkuori"}, {"name": "Glaseerukirsikka", "amount": 85, "unit": "g", "chip": "Kirsikka"}, {"name": "Rusinat", "amount": 250, "unit": "g", "chip": "Rusinat"}, {"name": "Korintit", "amount": 250, "unit": "g", "chip": "Korintit"}, {"name": "Pekaanipähkinä", "amount": 100, "unit": "g", "chip": "Pekaanipähkinä"}, {"name": "Sitruunankuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Maustesekoitus", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Ruusuvesi", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Vaniljauute", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Leivinjauhe", "amount": 0.5, "unit": "tl", "chip": null}], "steps": ["Vatkaa voi ja sokeri vaahdoksi, lisää vuorotellen jauho ja vatkattu muna pienissä erissä hyvin sekoittaen.", "Sekoita joukkoon manteljauhe ja sherry, lisää sitten sokeroitu hedelmäkuori, kirsikat, rusinat, korintit, pähkinät, sitruunankuori, maustesekoitus, ruusuvesi ja vaniljauute.", "Sekoita lopuksi joukkoon leivinjauhe ja kaada taikina voideltuun kakkuvuokaan.", "Paista 160 asteessa 30 minuuttia, laske sitten lämpötila 150 asteeseen ja jatka paistoa noin 2-2,25 tuntia kunnes tikku tulee puhtaana ulos.", "Anna kakun jäähtyä vuoassa, kääri se sitten kelmuun ja folioon ja anna maustua ennen tarjoilua."]},
  {"id": "kanelipyorykkakeksit", "name": "Kanelipyörykkäkeksit", "category": "Jälkiruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/txce0y1782494894.jpg", "aiImage": false, "servings": 6, "ingredients": [{"name": "Vehnäjauho", "amount": 250, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Suolaton voi", "amount": 180, "unit": "g", "chip": "Voi"}, {"name": "Sokeri", "amount": 85, "unit": "g", "chip": "Sokeri"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Kaneli", "amount": 2, "unit": "tl", "chip": null}, {"name": "Ruskea sokeri", "amount": 30, "unit": "g", "chip": "Ruskea sokeri"}], "steps": ["Vatkaa voi ja sokeri vaahdoksi, lisää muna ja hyppysellinen suolaa.", "Sekoita joukkoon siivilöity vehnäjauho ja vaivaa tasaiseksi taikinaksi. Jäähdytä kelmuun käärittynä 15 minuuttia.", "Sekoita ruskea sokeri ja kaneli keskenään.", "Kaulitse taikina jauhotetulla alustalla suorakaiteen muotoiseksi levyksi ja ripottele pinnalle kaneli-sokeriseos.", "Kääri taikina tiukaksi rullaksi, jäähdytä vielä 30 minuuttia ja leikkaa rulla siivuiksi.", "Paista siivut leivinpaperilla 180 asteessa 14-16 minuuttia ja anna jäähtyä ennen tarjoilua."]},
  {"id": "gaselinsarvet", "name": "Gaselinsarvet", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0h1b7m1764120235.jpg", "aiImage": false, "servings": 10, "ingredients": [{"name": "Manteli", "amount": 4.8, "unit": "dl", "chip": "Manteli"}, {"name": "Sokeri", "amount": 1.8, "unit": "dl", "chip": "Sokeri"}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Kaneli", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Appelsiinikukkavesi", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Vehnäjauho", "amount": 4.8, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Suolaton voi", "amount": 1.2, "unit": "dl", "chip": "Voi"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Kananmuna, vatkattu", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Kasviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Appelsiinikukkavesi", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Pistaasipähkinä, murskattu", "amount": 3, "unit": "rkl", "chip": "Pistaasipähkinä"}], "steps": ["Paahda mantelit uunissa 150 asteessa 20-25 minuuttia kunnes ne tuoksuvat ja ovat rapeita.", "Sekoita jauhot, voi ja suola muruiksi, lisää muna, öljy ja appelsiinikukkavesi ja vaivaa sileäksi taikinaksi. Kääri kelmuun ja jäähdytä 30 minuuttia.", "Jauha jäähtyneet mantelit hienoksi, sekoita joukkoon sokeri, kaneli, muna ja appelsiinikukkavesi tahnaksi.", "Muotoile mantelitahnasta pieniä ohuita tikkuja ja kaulitse taikina ohueksi levyksi.", "Kääri jokainen mantelitikku taikinaan, muotoile puolikuun muotoisiksi sarviksi ja leikkaa reunat siistiksi.", "Paista 165 asteessa noin 20 minuuttia kevyen kultaisiksi, ripottele jäähtyneiden sarvien päälle murskattua pistaasipähkinää."]},
  {"id": "dundee-kakku", "name": "Dundee-kakku", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wxyvqq1511723401.jpg", "aiImage": false, "servings": 10, "ingredients": [{"name": "Manteli, kokonainen", "amount": 100, "unit": "g", "chip": "Manteli"}, {"name": "Voi", "amount": 180, "unit": "g", "chip": "Voi"}, {"name": "Ruskea sokeri (muscovado)", "amount": 180, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Appelsiininkuori", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Aprikoosihillo", "amount": 3, "unit": "rkl", "chip": "Aprikoosihillo"}, {"name": "Vehnäjauho", "amount": 225, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Leivinjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kananmuna, isoja", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Manteljauhe", "amount": 100, "unit": "g", "chip": "Manteli"}, {"name": "Maito", "amount": 2, "unit": "rkl", "chip": "Maito"}, {"name": "Kuivatut hedelmät", "amount": 500, "unit": "g", "chip": "Kuivatut hedelmät"}, {"name": "Glaseerukirsikka", "amount": 100, "unit": "g", "chip": "Kirsikka"}, {"name": "Maito", "amount": 1, "unit": "rkl", "chip": "Maito"}, {"name": "Sokeri", "amount": 2, "unit": "tl", "chip": "Sokeri"}], "steps": ["Liota kokonaiset mantelit kiehuvassa vedessä 5 minuuttia, valuta ja anna kuivua. Kuumenna uuni 180 asteeseen.", "Vatkaa voi pehmeäksi, lisää sokeri ja vaahdota, sekoita joukkoon appelsiininkuori ja aprikoosihillo.", "Lisää munat vähitellen sekoittaen, sekoita jauhoihin leivinjauhe ja lisää taikinaan mantelijauheen kanssa.", "Sekoita joukkoon maito, kuivatut hedelmät ja kirsikat ja kaada taikina voideltuun kakkuvuokaan.", "Asettele kokonaiset mantelit kakun pinnalle ja paista noin 45 minuuttia, laske sitten lämpötila 160 asteeseen ja jatka 60-80 minuuttia kunnes tikku tulee lähes puhtaana ulos.", "Sivele valmiin kakun pinnalle lämmitetty maito-sokeriseos ja anna jäähtyä vuoassa ennen kääreilyä
