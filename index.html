  {"id": "chick-fil-a-sandwich", "name": "Kotitekoinen kanaburgeri", "category": "Kana", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sbx7n71587673021.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan rintafile", "amount": 1, "unit": "kpl", "chip": "Kana"}, {"name": "Etikkasuolaliemi", "amount": 0.6, "unit": "dl", "chip": "Etikkasuolaliemi"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 0.6, "unit": "dl", "chip": "Maito"}, {"name": "Vehnäjauho", "amount": 1.2, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Tomusokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Paprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Valkosipulijauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Sellerisuola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Cayennepippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Ruokaöljy", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Seesamihampurilaissämpylä", "amount": 1, "unit": "kpl", "chip": "Hampurilaissämpylä"}], "steps": ["Peitä kana muovikelmulla ja taputtele se tasaisen ohueksi lihanuijalla, leikkaa kahtia.", "Marinoi kanapalat suolakurkkuliemessä 30–60 minuuttia (halutessa hieman tabascoa mukaan tulisuutta varten).", "Vatkaa muna ja maito keskenään omassa kulhossa. Sekoita toiseen kulhoon jauho, sokeri ja mausteet.", "Kasta kanapalat ensin munaseokseen ja sitten jauhoseokseen molemmin puolin.", "Kuumenna öljy paistinpannussa ja paista kanapalat noin 2 minuuttia per puoli, kunnes kultaisia ja läpikypsiä.", "Valuta talouspaperilla ja kokoa voileipä paahdetun sämpylän ja suolakurkkuviipaleiden kanssa."]},
  {"id": "chicken-mushroom-hotpot", "name": "Kana-sienipata perunakuorrutteella", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uuuspp1511297945.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 50, "unit": "g", "chip": "Voi"}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Herkkusienet", "amount": 100, "unit": "g", "chip": "Sieni"}, {"name": "Vehnäjauho", "amount": 40, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kanaliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kanaliemi"}, {"name": "Muskottipähkinä", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Sinappijauhe", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Kana, kypsä", "amount": 250, "unit": "g", "chip": "Kana"}, {"name": "Maissi", "amount": 2, "unit": "kourallinen", "chip": "Maissi"}, {"name": "Peruna, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Voi, sivelyyn", "amount": 1, "unit": "nokare", "chip": "Voi"}], "steps": ["Lämmitä uuni 200 asteeseen. Sulata voi kattilassa, lisää sipuli ja kypsennä 5 minuuttia, lisää sienet joukkoon.", "Kun sipuli ja sienet ovat lähes kypsiä, ripottele joukkoon jauho ja sekoita tahnaksi. Murustele liemikuutio joukkoon ja anna paistua miedolla lämmöllä 2 minuuttia.", "Lisää vähitellen kylmä liemi tai vesi koko ajan sekoittaen. Mausta pippurilla, muskottipähkinällä ja sinapilla, kuumenna kiehuvaksi ja anna kastikkeen sakenee.", "Lisää kypsä kana ja maissi kastikkeeseen ja kaada seos voideltuun uunivuokaan.", "Asettele perunaviipaleet limittäin täytteen päälle, sivele voisulalla ja paista uunissa noin 35 minuuttia kunnes perunat ovat kullanruskeita ja kypsiä."]},
  {"id": "kana-congee", "name": "Kiinalainen kana-riisipuuro", "category": "Kana", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1529446352.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananrintapaloja", "amount": 225, "unit": "g", "chip": "Kana"}, {"name": "Suolaa", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Valkopippuria", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Inkiväärimehua", "amount": 1, "unit": "tl", "chip": null}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kevätsipulia silputtuna", "amount": 1, "unit": "rkl", "chip": "Kevätsipuli"}, {"name": "Riisiä", "amount": 1.2, "unit": "dl", "chip": "Riisi"}, {"name": "Vettä", "amount": 19, "unit": "dl", "chip": null}, {"name": "Tuoretta korianteria", "amount": 1, "unit": "nippu", "chip": null}], "steps": ["Sekoita kanapalat suolan, valkopippurin ja inkiväärimehun kanssa ja anna maustua hetki syrjässä.", "Huuhtele riisi hyvin muutamaan kertaan ja kaada kattilaan runsaan veden kanssa.", "Kiehauta ja keitä sitten miedolla lämmöllä noin 20-25 minuuttia, sekoittaen väliajoin, kunnes riisi hajoaa paksuksi puuroksi.", "Lisää maustettu kana puuroon ja anna hautua vielä noin 10 minuuttia kannen alla.", "Mausta lopuksi tuoreella inkiväärillä, kevätsipulilla, suolalla ja pippurilla.", "Annostele kulhoihin ja koristele tuoreella korianterilla ennen tarjoilua."]},
  {"id": "kana-kinkku-purjopiirakka", "name": "Kana-kinkkupiirakka purjolla", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xrrtss1511555269.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanalientä", "amount": 4.5, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Kananrintafileitä", "amount": 3, "unit": "kpl", "chip": "Kana"}, {"name": "Voita kastikkeeseen", "amount": 75, "unit": "g", "chip": "Voi"}, {"name": "Purjoa viipaloituna", "amount": 2, "unit": "kpl", "chip": "Purjo"}, {"name": "Valkosipulinkynttä", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Vehnäjauhoja kastikkeeseen", "amount": 50, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Maitoa", "amount": 2, "unit": "dl", "chip": "Maito"}, {"name": "Valkoviiniä", "amount": 3, "unit": "rkl", "chip": "Valkoviini"}, {"name": "Kuohukermaa", "amount": 1.5, "unit": "dl", "chip": "Kerma"}, {"name": "Kinkkua kuutioituna", "amount": 150, "unit": "g", "chip": "Kinkku"}, {"name": "Merisuolaa", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Mustapippuria", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Vehnäjauhoja taikinaan", "amount": 350, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Voita taikinaan", "amount": 200, "unit": "g", "chip": "Voi"}, {"name": "Kananmunaa taikinaan ja voiteluun", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Kylmää vettä taikinaan", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Kuumenna kanalientä kattilassa, lisää kananrintafileet ja hauduta kannen alla noin 10 minuuttia. Nosta kana lientä talteen sivuun.", "Sulata osa voista kattilassa, kuullota purjo ja valkosipuli pehmeäksi, ripottele joukkoon jauhot ja anna hetken aikaa.", "Lisää maito vähän kerrallaan sekoittaen, kaada joukkoon keitinliemi ja viini, ja anna kastikkeen sakenea. Mausta suolalla ja pippurilla, sekoita joukkoon kerma ja jäähdytä.", "Tee taikina jauhoista ja voista murumaiseksi, lisää muna ja vesi ja muotoile taikinapallo. Kaulitse suurin osa taikinasta ja vuoraa sillä piirakkavuoka.", "Paloittele kana ja sekoita kastikkeeseen kinkun ja purjon kanssa. Kaada täyte vuokaan, peitä kaulitulla kannella ja sulje reunat.", "Voitele kansi munalla, tee pieni reikä höyryn poistumista varten ja paista 200-asteisessa uunissa noin 35-40 minuuttia kullanruskeaksi."]},
  {"id": "kana-appelsiinikastikkeessa", "name": "Kolumbialainen appelsiinikana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uuns781783804024.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanankoipia", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Oliiviöljyä", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Voita", "amount": 2, "unit": "rkl", "chip": "Voi"}, {"name": "Silputtua sipulia", "amount": 1.2, "unit": "dl", "chip": "Sipuli"}, {"name": "Punaista paprikaa", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Valkosipulinkynttä", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Suolaa", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuria", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kanalientä", "amount": 2.4, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Tuorepuristettua appelsiinimehua", "amount": 1.2, "unit": "dl", "chip": "Appelsiinimehu"}, {"name": "Ruskeaa sokeria", "amount": 3, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Tuoretta korianteria", "amount": 0.6, "unit": "dl", "chip": null}], "steps": ["Kuumenna oliiviöljy ja voi kattilassa, lisää sipuli, paprika ja valkosipuli ja paista noin 3 minuuttia pehmeiksi.", "Lisää kanankoivet joukkoon, mausta suolalla ja pippurilla ja ruskista molemmin puolin noin minuutin ajan.", "Kaada sekaan kanaliemi ja appelsiinimehu, kaavi pannun pohjaa puulusikalla ja lisää ruskea sokeri.", "Peitä kattila kannella, alenna lämpöä ja hauduta noin 45 minuuttia, kunnes kana on kypsää.", "Kaada kastike kanan päälle ja tarjoile valkoisen riisin kanssa, koristeltuna tuoreella korianterilla."]},
  {"id": "kana-karaage", "name": "Japanilainen kanakaraage", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/tyywsw1505930373.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Luutonta, nahatonta kanan reisifileetä", "amount": 450, "unit": "g", "chip": "Kana"}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Soijakastiketta", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Sakea", "amount": 1, "unit": "rkl", "chip": "Sake"}, {"name": "Sokeria", "amount": 2, "unit": "tl", "chip": "Sokeri"}, {"name": "Perunatärkkelystä", "amount": 0.8, "unit": "dl", "chip": "Perunatärkkelys"}, {"name": "Kasviöljyä paistamiseen", "amount": 0.8, "unit": "dl", "chip": null}, {"name": "Sitruunalohkoja tarjoiluun", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Sekoita kulhossa inkivääri, valkosipuli, soijakastike, sake ja sokeri. Lisää kanapalat, sekoita tasaisesti ja anna marinoitua jääkaapissa vähintään tunti.", "Kuumenna runsaasti öljyä kattilassa noin 180 asteeseen.", "Vuoraa ritilä talouspaperilla ja kaada perunatärkkelys omaan kulhoonsa.", "Pyöräytä kanapalat tärkkelyksessä niin, että ne peittyvät tasaisesti.", "Paista kanapaloja erissä kuumassa öljyssä, kunnes pinta on ruskea ja kana kypsää sisältä. Nosta paperille valumaan.", "Halutessasi paista palat vielä toisen kerran rapeuden lisäämiseksi. Tarjoile sitruunalohkojen kanssa."]},
  {"id": "kana-kvinoa-kreikkalainen-salaatti", "name": "Kreikkalainen kana-kvinoasalaatti", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/k29viq1585565980.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kvinoaa", "amount": 225, "unit": "g", "chip": "Kvinoa"}, {"name": "Voita", "amount": 25, "unit": "g", "chip": "Voi"}, {"name": "Silputtua punaista chiliä", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kananrintafileitä", "amount": 400, "unit": "g", "chip": "Kana"}, {"name": "Oliiviöljyä", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Mustia oliiveja", "amount": 1, "unit": "kourallinen", "chip": "Oliivit"}, {"name": "Punasipulia silputtuna", "amount": 1, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Fetajuustoa", "amount": 100, "unit": "g", "chip": "Feta"}, {"name": "Silputtua minttua", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Sitruunan mehu ja kuori", "amount": 0.5, "unit": "kpl", "chip": null}], "steps": ["Keitä kvinoa pakkauksen ohjeen mukaan, huuhtele kylmällä vedellä ja valuta hyvin.", "Sekoita sulanut voi, silputtu chili ja valkosipuli tahnaksi.", "Hautele kananrintafileet oliiviöljyssä ja mausteilla kuumalla pannulla noin 3-4 minuuttia puolelta, kunnes kypsiä. Nosta lautaselle ja lisää päälle chili-voitahna sulamaan.", "Sekoita kulhossa tomaatit, oliivit, punasipuli, feta ja mintti, ja lisää joukkoon jäähtynyt kvinoa.", "Mausta loppuosalla oliiviöljyä, sitruunamehulla ja -kuorella. Tarjoile kanafileiden kera valuttaen voi-mehut päälle."]},
  {"id": "coq-au-vin", "name": "Ranskalainen viinikana", "category": "Kana", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qstyvs1505931190.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljyä", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Pekonia kuutioituna", "amount": 100, "unit": "g", "chip": "Pekoni"}, {"name": "Pieniä salottisipuleita", "amount": 12, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Kanankoipia", "amount": 2, "unit": "kpl", "chip": "Kana"}, {"name": "Kanankoipireisiä", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Kananrintaa", "amount": 2, "unit": "kpl", "chip": "Kana"}, {"name": "Valkosipulinkynttä hienonnettuna", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Brandyä", "amount": 3, "unit": "rkl", "chip": "Brandy"}, {"name": "Punaviiniä", "amount": 6, "unit": "dl", "chip": "Punaviini"}, {"name": "Kanalientä", "amount": 1.5, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Tomaattipyreetä", "amount": 2, "unit": "tl", "chip": "Tomaattipyree"}, {"name": "Tuoretta timjamia", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Tuoretta rosmariinia", "amount": 2, "unit": "oksaa", "chip": null}, {"name": "Laakerinlehteä", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Persiljaa koristeeksi", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Kastanjasieniä", "amount": 250, "unit": "g", "chip": "Sieni"}, {"name": "Vehnäjauhoja", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Voita", "amount": 1, "unit": "tl", "chip": "Voi"}], "steps": ["Ruskista pekoni öljyssä padassa rapeaksi ja nosta sivuun. Paista sitten salottisipulit samassa rasvassa ruskeiksi ja nosta ne pekonin joukkoon.", "Kuivaa kananpalat ja ruskista ne padassa erissä joka puolelta. Lisää valkosipuli ja kaada joukkoon brandy, anna kiehahtaa ja alkoholin haihtua.", "Palauta kana pataan, lisää viini, liemi ja tomaattipyree sekä yrttikimppu. Mausta suolalla ja pippurilla, lisää pekoni ja salottisipulit takaisin joukkoon.", "Peitä pata, hauduta miedolla lämmöllä 50-60 minuuttia, kunnes kana on kypsää.", "Paista sienet erillisessä pannussa kullanruskeiksi. Nosta kana, sipulit ja pekoni tarjoiluastiaan ja poista yrttikimppu.", "Sekoita jauhot, öljy ja voi paksuntajaksi ja vatkaa se pikkuhiljaa kiehuvaan kastikkeeseen. Kaada kastike sienten kera kanan päälle ja koristele persiljalla."]},
  {"id": "sinappikana-kermakastikkeessa", "name": "Kermainen sinappikana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/4htbtm1783803558.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanankoipia", "amount": 8, "unit": "kpl", "chip": "Kana"}, {"name": "Paprikajauhetta", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suolaa", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuria", "amount": 1, "unit": "tl", "chip": null}, {"name": "Oliiviöljyä", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynttä", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Silputtua sipulia", "amount": 1.2, "unit": "dl", "chip": "Sipuli"}, {"name": "Kanalientä", "amount": 4.8, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Sinappia", "amount": 2, "unit": "rkl", "chip": "Sinappi"}, {"name": "Kuohukermaa", "amount": 2.4, "unit": "dl", "chip": "Kerma"}, {"name": "Hunajaa", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Silputtua persiljaa", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuivaa kanankoivet ja mausta suolalla, pippurilla ja paprikajauheella.", "Kuumenna öljy kattilassa ja ruskista kanankoivet joka puolelta noin 10 minuuttia. Nosta sivuun.", "Kuullota sipuli ja valkosipuli samassa kattilassa pehmeiksi. Lisää kanaliemi, sinappi, hunaja ja kerma, ja mausta suolalla ja pippurilla.", "Palauta kanankoivet kattilaan, peitä kannella ja hauduta miedolla lämmöllä noin 45 minuuttia kypsäksi.", "Tarjoile kastikkeen kera riisin kanssa, silputun persiljan koristamana."]},
  {"id": "hunaja-balsamikana-parsakaali-peruna", "name": "Hunaja-balsamikana uuniperunoilla ja parsakaalilla", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/kvbotn1581012881.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Perunoita lohkoiksi leikattuna", "amount": 10, "unit": "kpl", "chip": "Peruna"}, {"name": "Parsakaalia paloina", "amount": 2, "unit": "kpl", "chip": "Parsakaali"}, {"name": "Valkosipulinkynttä", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kananrintafileitä", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Balsamietikkaa", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Hunajaa", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kanalientä", "amount": 0.7, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Voita", "amount": 2, "unit": "rkl", "chip": "Voi"}, {"name": "Kasviöljyä", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Oliiviöljyä", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Kuumenna uuni 220 asteeseen. Leikkaa perunat lohkoiksi ja levitä pellille öljyn, suolan ja pippurin kanssa. Paista noin 5 minuuttia.", "Leikkaa parsakaali suupaloiksi, sekoita joukkoon öljyä ja osa valkosipulista ja lisää pellille perunoiden viereen. Paahda perunoita ja parsakaalia yhteensä 15-20 minuuttia, kunnes rapeita ja kauniin ruskeita.", "Mausta kananrinnat suolalla ja pippurilla ja paista pannulla öljyssä noin 5-6 minuuttia puolelta, kunnes kypsiä. Anna vetäytyä sivussa.", "Kuumenna samassa pannussa loput valkosipulista, lisää balsamietikka, hunaja, kanaliemi ja vähän vettä, ja hauduta kastiketta paksuksi ja kiiltäväksi muutama minuutti.", "Sekoita joukkoon voi ja mausta maun mukaan. Palauta kana pannuun ja käännä paloja glaseeraukseen.", "Annostele kana, parsakaali ja perunat lautasille ja valuta loppu glaseeraus kanan päälle."]},
  {"id": "kabse-kanariisi", "name": "Saudiarabialainen kabse-kanariisi", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/utqnjv1763598650.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanaa paloina", "amount": 400, "unit": "g", "chip": "Kana"}, {"name": "Riisiä", "amount": 2.4, "unit": "dl", "chip": "Riisi"}, {"name": "Vihreää paprikaa", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Punaista paprikaa", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Herkkusieniä", "amount": 2, "unit": "kpl", "chip": "Sieni"}, {"name": "Maissia", "amount": 1, "unit": "kpl", "chip": "Maissi"}, {"name": "Porkkanoita", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Rusinoita", "amount": 1, "unit": "kourallinen", "chip": "Rusinat"}, {"name": "Kurkumaa", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kabse-mausteseosta", "amount": 1, "unit": "tl", "chip": "Kabse-mausteseos"}, {"name": "Suolaa", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Mustapippuria", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Ruskista kanapalat oliiviöljyssä padassa, lisää liemikuutio ja anna hautua kannen alla noin 30 minuuttia.", "Paahda toisessa kattilassa vihannekset pehmeiksi ja hieman karamellisoituneiksi.", "Lisää riisi, rusinat ja mausteet vihannesten joukkoon, kaada päälle noin 6 dl vettä.", "Anna riisin kypsyä kannen alla, kunnes vesi on imeytynyt ja riisi on kypsää.", "Kokoa kana ja mausteinen riisi yhteen ja viimeistele uunissa hetken ajan ennen tarjoilua."]},
  {"id": "nom-banh-chok-kanakeitto", "name": "Kambodzalainen nuudelikeitto kanalla", "category": "Kana", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6g9gif1782688663.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vettä", "amount": 19, "unit": "dl", "chip": null}, {"name": "Kanan reisilihaa paloina", "amount": 450, "unit": "g", "chip": "Kana"}, {"name": "Valkosipulinkynttä hienonnettuna", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kasviöljyä", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kalakastiketta", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Suolaa", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sokeria", "amount": 1, "unit": "tl", "chip": "Sokeri"}, {"name": "Riisinuudeleita", "amount": 225, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Papuituja", "amount": 4.8, "unit": "dl", "chip": "Idut"}, {"name": "Silputtua minttua", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Limeä lohkoina", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Punaista chiliä viipaloituna", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Kuumenna öljy isossa kattilassa ja kuullota valkosipuli tuoksuvaksi noin minuutin ajan.", "Lisää kanapalat ja ruskista niitä joka puolelta noin 5 minuuttia.", "Kaada joukkoon vesi ja kiehauta. Lisää kalakastike, suola ja sokeri, ja anna hautua kannettomana noin 20 minuuttia.", "Keitä riisinuudelit pakkauksen ohjeen mukaan, huuhtele kylmällä vedellä ja jaa neljään kulhoon.", "Kaada kuuma liemi kanan kanssa nuudeleiden päälle.", "Viimeistele papuiduilla, silputulla mintulla ja halutessasi chiliviipaleilla, ja tarjoile limelohkojen kera."]},

  {"id": "samlar-kari-khmer-punainen-curry", "name": "Khmer-punainen kanacurry", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/k5qzdl1782689660.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kasviöljyä", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kanaa paloina", "amount": 450, "unit": "g", "chip": "Kana"}, {"name": "Sipulia viipaloituna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynttä hienonnettuna", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punaista currytahnaa", "amount": 2, "unit": "rkl", "chip": "Punainen currytahna"}, {"name": "Kookosmaitoa", "amount": 4, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Kanalientä", "amount": 2.4, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Kalakastiketta", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Ruskeaa sokeria", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Bambunversoja", "amount": 2.4, "unit": "dl", "chip": "Bambunversot"}, {"name": "Punaista paprikaa viipaloituna", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Thai-basilikaa", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Limeä lohkoina", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Kuumenna öljy padassa ja ruskista kanapalat joka puolelta noin 5-7 minuuttia. Nosta sivuun.", "Kuullota sipuli pehmeäksi samassa padassa, lisää valkosipuli ja inkivääri ja paista tuoksuvaksi.", "Lisää currytahna joukkoon ja paista noin minuutti, kunnes tuoksu voimistuu.", "Kaada joukkoon kookosmaito ja kanaliemi, kaavi pohjaa ja lisää kalakastike ja ruskea sokeri. Palauta kana pataan.", "Anna kiehahtaa, alenna lämpöä ja hauduta kannen alla 15 minuuttia. Lisää bambunversot ja paprika ja hauduta vielä 5 minuuttia ilman kantta.", "Sekoita joukkoon thai-basilika juuri ennen tarjoilua ja tarjoile limelohkojen kanssa."]},
  {"id": "kana-shawarma-04", "name": "Egyptiläinen kanashawarma", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/kcv6hj1598733479.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan reisipaloja", "amount": 1, "unit": "kg", "chip": "Kana"}, {"name": "Jauhettua korianteria", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Jeeraa", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kardemummaa", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Cayennepippuria", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhetta", "amount": 2, "unit": "tl", "chip": null}, {"name": "Sitruunamehua marinadiin", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Oliiviöljyä", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kreikkalaista jogurttia", "amount": 2.4, "unit": "dl", "chip": "Jogurtti"}, {"name": "Valkosipulinkynsi kastikkeeseen", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Jeeraa kastikkeeseen", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sitruunamehua kastikkeeseen", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Salaattia", "amount": 1, "unit": "kourallinen", "chip": "Salaatti"}, {"name": "Tomaattia viipaloituna", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Pitaleipiä", "amount": 6, "unit": "kpl", "chip": "Leipä"}], "steps": ["Sekoita mausteet, sitruunamehu ja oliiviöljy marinadiksi ja hiero kanapalojen pintaan. Anna marinoitua jääkaapissa mielellään yön yli, vähintään muutama tunti.", "Sekoita jogurtti, valkosipuli, jeera ja sitruunamehu jogurttikastikkeeksi. Säilytä jääkaapissa tarjoiluun asti.", "Kuumenna grilli tai paistinpannu keskikuumaksi ja paista kanapaloja noin 4-5 minuuttia puolelta, kunnes pinnat ovat kauniisti ruskistuneet ja kana kypsä.", "Anna kanan levätä hetki foliolla peitettynä ja viipaloi sitten ohuiksi suikaleiksi.", "Levitä pitaleivälle jogurttikastiketta, lisää salaattia ja tomaattia ja täytä shawarmakana päälle. Rullaa ja tarjoile heti."]},
  {"id": "espanjalaiset-pavut-kanalla-ja-chorizolla", "name": "Espanjalaiset pavut kanan ja chorizon kera", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/bpkxtw1763332446.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kuivattuja papuja", "amount": 300, "unit": "g", "chip": "Pavut"}, {"name": "Sipulia silputtuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Paprikajauhetta", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tuoretta timjamia", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Laakerinlehteä", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Persiljaa", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Kanan reisipaloja", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Perunoita", "amount": 250, "unit": "g", "chip": "Peruna"}, {"name": "Chorizoa paloina", "amount": 250, "unit": "g", "chip": "Chorizo"}, {"name": "Pinaattia", "amount": 100, "unit": "g", "chip": "Pinaatti"}], "steps": ["Liota papuja vähintään 4 tuntia tai yön yli, huuhtele ja valuta seuraavana päivänä.", "Laita pavut isoon pataan sipulin, paprikajauheen ja yrttien kanssa, lisää kanan paloja, ja peitä vedellä tai liemellä.", "Kiehauta, alenna lämpöä ja hauduta kannen alla noin 45 minuuttia.", "Nosta kana hetkeksi sivuun, lisää perunat ja chorizo pataan ja jatka kypsennystä noin 30 minuuttia, kunnes pavut ja perunat ovat pehmeitä.", "Poista kanasta nahka ja luut, revi liha isoiksi paloiksi ja palauta pataan yhdessä pinaatin kanssa.", "Hauduta vielä muutama minuutti, kunnes pinaatti on lysähtänyt, ja tarjoile kuumana."]},
  {"id": "makea-hapan-kana", "name": "Makea-hapan kana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/arzs741766434335.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan reisipaloja", "amount": 450, "unit": "g", "chip": "Kana"}, {"name": "Munanvalkuainen", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suolaa", "amount": 1, "unit": "tl", "chip": null}, {"name": "Maissitärkkelystä", "amount": 2, "unit": "tl", "chip": "Maissitärkkelys"}, {"name": "Ananaspaloja", "amount": 280, "unit": "g", "chip": "Ananas"}, {"name": "Ananasmehua", "amount": 0.6, "unit": "dl", "chip": "Ananasmehu"}, {"name": "Valkoviinietikkaa", "amount": 0.6, "unit": "dl", "chip": null}, {"name": "Ketsuppia", "amount": 0.6, "unit": "dl", "chip": "Ketsuppi"}, {"name": "Ruskeaa sokeria", "amount": 3, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Öljyä paistamiseen", "amount": 4, "unit": "tl", "chip": null}, {"name": "Punaista paprikaa paloina", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Keltaista paprikaa paloina", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Sekoita kanapalat munanvalkuaisen, suolan ja maissitärkkelyksen kanssa ja anna maustua noin 15 minuuttia.", "Vatkaa ananasmehu, etikka, ketsuppi ja ruskea sokeri makea-happamaksi kastikkeeksi.", "Kuumenna wokki tai pannu erittäin kuumaksi, lisää öljyä ja paista kanapaloja erissä puolelta minuutti kerrallaan, kunnes ruskistuneet mutta vielä hieman raakoja sisältä. Nosta lautaselle.", "Paista paprikat ja inkivääri samassa pannussa hetki, lisää sitten ananaspalat ja kastike.", "Kun kastike alkaa kiehua, palauta kana joukkoon ja hauduta 1-2 minuuttia, kunnes kana on läpikypsää.", "Maista ja tarkista maku, ja tarjoile kuuman riisin kanssa."]},
  {"id": "thaimaalaiset-kanapihvit-chilikastikkeella", "name": "Thaimaalaiset kanapihvit makealla chilikastikkeella", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6s3i3p1763488540.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Isoja kananrintafileitä", "amount": 2, "unit": "kpl", "chip": "Kana"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sipulia silputtuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Tuoretta korianteria", "amount": 0.9, "unit": "dl", "chip": null}, {"name": "Silputtua vihreää chiliä", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Oliiviöljyä paistamiseen", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Makeaa chilikastiketta tarjoiluun", "amount": 1, "unit": "dl", "chip": "Makea chilikastike"}, {"name": "Limeä lohkoina", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kevätsipulia silputtuna", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Punaista chiliä koristeeksi", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Aseta kananrinnat, valkosipuli, inkivääri, sipuli, korianteri ja chili tehosekoittimeen ja jauha karkeaksi seokseksi.", "Muotoile seoksesta käsin kuusi pientä pihviä.", "Kuumenna öljy pannulla ja paista pihvejä keskilämmöllä noin 6-8 minuuttia, käännä kerran, kunnes läpikypsiä ja ruskistuneita.", "Tarjoile kuumana makean chilikastikkeen kera.", "Koristele limelohkoilla, tuoreella korianterilla, silputulla kevätsipulilla ja punaisella chilillä."]},
  {"id": "thaimaalainen-vihrea-kanakeitto", "name": "Thaimaalainen vihreä kanakeitto", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7kb44y1763589084.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Auringonkukkaöljyä", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipulia silputtuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kanan reisipaloja", "amount": 500, "unit": "g", "chip": "Kana"}, {"name": "Valkosipulinkynttä viipaloituna", "amount": 4, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Thain vihreää currytahnaa", "amount": 280, "unit": "g", "chip": "Vihreä currytahna"}, {"name": "Kookosmaitoa", "amount": 4, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Kanalientä", "amount": 20, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Limenlehtiä", "amount": 5, "unit": "kpl", "chip": null}, {"name": "Kalakastiketta", "amount": 2, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Kevätsipulia silputtuna", "amount": 1, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Vihreitä papuja", "amount": 280, "unit": "g", "chip": "Vihreä papu"}, {"name": "Bambunversoja", "amount": 150, "unit": "g", "chip": "Bambunversot"}, {"name": "Limeä", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Tuoretta basilikaa", "amount": 1, "unit": "nippu", "chip": null}], "steps": ["Kuumenna öljy isossa kattilassa, lisää sipuli ja kuullota noin 3 minuuttia pehmeäksi.", "Lisää kana ja valkosipuli ja paista, kunnes kanan pinta muuttuu väriä.", "Sekoita joukkoon currytahna, kookosmaito, kanaliemi, limenlehdet ja kalakastike, ja anna hautua noin 12 minuuttia.", "Lisää kevätsipulin vihreä osa, vihreät pavut ja bambunversot ja kypsennä vielä 4-6 minuuttia, kunnes pavut ovat juuri kypsiä.", "Soseuta limemehu ja basilika sauvasekoittimella tasaiseksi vihreäksi tahnaksi ja sekoita se keittoon yhdessä viipaloidun kevätsipulin kanssa.", "Kuumenna vielä hetki ja tarjoile limelohkojen kanssa."]},
  {"id": "ayam-percik-mausteinen-uunikana", "name": "Malesialainen mausteinen uunikana (Ayam Percik)", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/020z181619788503.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan reisipaloja", "amount": 6, "unit": "kpl", "chip": "Kana"}, {"name": "Salottisipulia", "amount": 16, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Raastettua inkivääriä", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynttä", "amount": 6, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Cayennepippuria", "amount": 8, "unit": "kpl", "chip": null}, {"name": "Kurkumaa", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Jeeraa", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Korianterinsiemeniä", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Fenkolinsiemeniä", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Tamarinditahnaa", "amount": 2, "unit": "rkl", "chip": "Tamarinditahna"}, {"name": "Kookosmaitoa", "amount": 4, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Sokeria", "amount": 1, "unit": "tl", "chip": "Sokeri"}, {"name": "Vettä", "amount": 2.4, "unit": "dl", "chip": null}], "steps": ["Soseuta salottisipuli, inkivääri, valkosipuli ja mausteet tehosekoittimessa tasaiseksi tahnaksi.", "Paista tahnaa pannulla keskilämmöllä noin 10 minuuttia, kunnes tuoksuvaa. Lisää tarvittaessa vähän vettä ettei se pala kiinni.", "Lisää tamarinditahna, kookosmaito, vesi ja sokeri, kiehauta ja hauduta sitten miedolla lämmöllä noin 10 minuuttia. Mausta maun mukaan.", "Anna kastikkeen jäähtyä, kaada se kanapalojen päälle ja anna marinoitua jääkaapissa vähintään yön yli.", "Kuumenna uuni 220 asteeseen, levitä kastike uunipellille ja lado kana päälle. Paista noin 35-45 minuuttia, kunnes kypsä.", "Anna kanan levätä hetki ja tarjoile kastikkeen kera höyrytetyn riisin kanssa."]},
  {"id": "kana-couscous", "name": "Marokkolainen kana-couscous", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qxytrx1511304021.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljyä", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipulia silputtuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kananrintaa suikaleina", "amount": 200, "unit": "g", "chip": "Kana"}, {"name": "Raastettua inkivääriä", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Harissamaustetta", "amount": 2, "unit": "rkl", "chip": "Harissa"}, {"name": "Kuivattuja aprikooseja", "amount": 10, "unit": "kpl", "chip": "Kuivatut aprikoosit"}, {"name": "Kikherneitä", "amount": 220, "unit": "g", "chip": "Kikherne"}, {"name": "Couscousia", "amount": 200, "unit": "g", "chip": "Couscous"}, {"name": "Kanalientä", "amount": 2, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Tuoretta korianteria", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuumenna oliiviöljy pannulla ja kuullota sipuli pehmeäksi noin 1-2 minuuttia.", "Lisää kana ja paista 7-10 minuuttia, kunnes kypsää ja sipuli on kullanruskea.", "Raasta joukkoon inkivääri, sekoita harissa mukaan ja paista vielä minuutin ajan.", "Lisää aprikoosit, kikherneet ja couscous, kaada päälle kanaliemi ja sekoita kerran.", "Peitä pannu kannella tai foliolla ja anna levätä noin 5 minuuttia, kunnes couscous on imenyt liemen ja pehmennyt.", "Kohenna couscous haarukalla, sekoita joukkoon korianteri ja tarjoile heti."]},
  {"id": "kana-enchilada-vuoka", "name": "Meksikolainen kana-enchiladavuoka", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qtuwxu1468233098.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Enchiladakastiketta", "amount": 400, "unit": "g", "chip": "Enchiladakastike"}, {"name": "Raastettua Monterey Jack -juustoa", "amount": 700, "unit": "g", "chip": "Juusto"}, {"name": "Maissitortilloja", "amount": 6, "unit": "kpl", "chip": "Maissitortilla"}, {"name": "Kananrintafileitä", "amount": 2, "unit": "kpl", "chip": "Kana"}], "steps": ["Leikkaa kananrinnat noin kolmeen osaan, laita pieneen kattilaan ja kaada päälle enchiladakastike. Hauduta kannen alla miedolla lämmöllä noin 20 minuuttia, kunnes kana on kypsä, sekoittaen väliajoin.", "Nosta kana kastikkeesta ja revi se kahdella haarukalla säikeiksi.", "Kuumenna uuni 190 asteeseen. Levitä uunivuoan pohjalle vähän jäljellä olevaa kastiketta ja aseta päälle tortillat.", "Kerrosta vuorotellen tortilla, revitty kana, kastike ja raastettu juusto, kunnes ainekset on käytetty. Päättele kerrostus juustoon.", "Paista uunissa peittämättömänä 20-30 minuuttia, kunnes vuoka kuplii ja juusto on sulanut ja hieman ruskistunut.", "Anna hetki jäähtyä ja tarjoile lämpimänä."]},
  {"id": "kana-lollipop", "name": "Rapea kanan lollipop", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/nz0lg71784671684.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanansiipiä", "amount": 900, "unit": "g", "chip": "Kana"}, {"name": "Mustapippuria", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Paprikajauhetta", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Hienonnettua valkosipulia", "amount": 1, "unit": "rkl", "chip": "Valkosipuli"}, {"name": "Suolaa", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Maissitärkkelystä", "amount": 4, "unit": "rkl", "chip": "Maissitärkkelys"}], "steps": ["Huuhtele kanansiivet ja valuta hyvin.", "Mausta siivet suolalla, mustapippurilla, paprikajauheella ja valkosipulilla.", "Leikkaa keittiösaksilla lihaa irti siiven kärjestä niin, että luu paljastuu tikun tavoin.", "Pyöräytä siivet maissitärkkelyksessä ja paista upporasvassa keskiruskeiksi.", "Halutessasi sivele siipiin suosikkikastiketta ja viimeistele uunissa, tai jatka paistamista rasvassa kunnes kullanruskeat ja rapeat.", "Tarjoile kuumana, halutessasi lisää kastiketta siveltynä päälle."]},
  {"id": "riisipaperi-dumplingit", "name": "Vietnamilaiset riisipaperinyytit", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sfahy01763752319.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Valkokaalia hienonnettuna", "amount": 0.25, "unit": "kpl", "chip": "Kaali"}, {"name": "Porkkanaa raastettuna", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Shiitakesieniä silputtuna", "amount": 100, "unit": "g", "chip": "Sieni"}, {"name": "Sian jauhelihaa", "amount": 400, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Valkosipulinkynttä hienonnettuna", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Raastettua inkivääriä", "amount": 20, "unit": "g", "chip": null}, {"name": "Soijakastiketta täytteeseen", "amount": 2, "unit": "tl", "chip": "Soijakastike"}, {"name": "Seesamiöljyä", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kevätsipulia silputtuna", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Riisipaperiarkkeja", "amount": 20, "unit": "kpl", "chip": "Riisipaperi"}, {"name": "Kasviöljyä paistamiseen", "amount": 0.75, "unit": "dl", "chip": null}, {"name": "Soijakastiketta kastikkeeseen", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Riisietikkaa kastikkeeseen", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Seesaminsiemeniä", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Kevätsipulia kastikkeeseen", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}], "steps": ["Hienonna kaali monitoimikoneessa, sekoita joukkoon suolaa ja anna vetäytyä 15 minuuttia. Purista sitten ylimääräinen neste pois liinan avulla.", "Sekoita kaali kulhossa porkkanan, sienten, sianjauhelihan, valkosipulin, inkiväärin, soijakastikkeen, seesamiöljyn ja kevätsipulin kanssa. Mausta pippurilla ja sekoita käsin tasaiseksi täytteeksi.", "Kostuta riisipaperiarkki hetkeksi lämpimässä vedessä, siirrä öljytylle alustalle ja lusikoi keskelle reilu ruokalusikallinen täytettä. Taittele arkin reunat täytteen ympärille tiiviiksi paketiksi.", "Kuumenna öljy pannulla ja paista nyyttejä 3-5 minuuttia, kunnes pohja on kullanruskea. Käännä varovasti, peitä kannella ja paista vielä 3-4 minuuttia lisää.", "Sekoita samalla kastikkeen ainekset pieneen kulhoon.", "Tarjoile paistetut nyytit heti kuumina, kastikkeen kera."]},
  {"id": "tourtiere-sikapiirakka", "name": "Kanadalainen sianlihapiirakka (Tourtière)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ytpstt1511814614.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Keskikokoinen peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Auringonkukkaöljyä", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sian jauhelihaa", "amount": 500, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Sipulia hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi hienonnettuna", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kanelia", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Maustepippuria", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Muskottipähkinää", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kasvislientä", "amount": 1, "unit": "dl", "chip": "Kasvisliemi"}, {"name": "Murotaikinaa", "amount": 400, "unit": "g", "chip": "Taikinapohja"}, {"name": "Kananmunaa voiteluun", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuumenna uuni 200 asteeseen. Keitä peruna kypsäksi, valuta ja soseuta, anna jäähtyä.", "Kuumenna öljy pannulla ja ruskista sianjauheliha nopeasti sipulin kanssa.", "Lisää valkosipuli, mausteet ja kasvisliemi, mausta suolalla ja pippurilla ja sekoita hyvin. Ota pois liedeltä ja sekoita seos perunasoseeseen. Anna jäähtyä.", "Kaulitse puolet taikinasta ja vuoraa sillä piirakkavuoka. Kaada täyte vuokaan ja kostuta reunat vedellä.", "Kaulitse loppu taikina kanneksi, aseta täytteen päälle ja paina reunat kiinni. Tee pintaan pieniä reikiä ja voitele munalla.", "Paista noin 30 minuuttia, kunnes taikina on rapea ja kullanruskea. Tarjoile lohkoina raikkaan salaatin kanssa."]},
  {"id": "chileni-empanada", "name": "Chileläinen empanada", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/q4xgij1782851193.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "tl", "chip": "Valkosipuli"}, {"name": "Kuivattu oregano", "amount": null, "unit": null, "chip": null}, {"name": "Jauhettu kumina", "amount": null, "unit": null, "chip": null}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Sian jauheliha", "amount": 450, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Rusinat", "amount": 2.4, "unit": "dl", "chip": "Rusinat"}, {"name": "Mustat oliivit", "amount": 2.4, "unit": "dl", "chip": "Oliivit"}, {"name": "Kananmunat", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vesi", "amount": null, "unit": null, "chip": null}, {"name": "Kasvisrasva", "amount": 2.4, "unit": "dl", "chip": "Kasvisrasva"}, {"name": "Vehnäjauho", "amount": 12, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Kananmunat (voiteluun)", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Sulata voi pannulla ja kuullota silputtu sipuli, valkosipuli, oregano ja kumina pehmeäksi ja kullanruskeaksi noin 5-7 minuuttia.", "Lisää jauheliha ja paista rapeaksi ja murustuvaksi, kaada ylimääräinen rasva pois. Sekoita joukkoon rusinat, oliivit ja keitetyt kananmunat.", "Vatkaa vesi ja maissitärkkelys keskenään ja kaada seokseen, kunnes täyte sakenee. Anna jäähtyä.", "Sekoita maito ja sulatettu kasvisrasva keskenään, ja vehnäjauho ja suola erikseen. Yhdistä nesteet jauhoihin ja vaivaa taikina, anna levätä 10 minuuttia.", "Kaulitse taikina ohueksi ja leikkaa 12 ympyrää. Lisää täytettä keskelle, taita puolikuuksi ja sulje reunat haarukalla. Voitele munalla.", "Paista 200-asteisessa uunissa noin 25 minuuttia kullanruskeiksi."]},
  {"id": "porsaankyljykset-criolla", "name": "Kolumbialaiset porsaankyljykset kreolikastikkeessa", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/087fu71783802698.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porsaankyljykset", "amount": 4, "unit": "kpl", "chip": "Sianliha"}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sinappi", "amount": null, "unit": null, "chip": null}, {"name": "Jauhettu kumina", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Korianteri", "amount": null, "unit": null, "chip": null}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}], "steps": ["Sekoita pussissa kyljyksiin sinappi, kumina, valkosipuli, suola ja pippuri. Anna marinoitua jääkaapissa vähintään tunti, mieluiten yön yli.", "Kuumenna öljy pannulla ja paista kyljyksiä noin 3 minuuttia puolelta. Nosta lihat sivuun.", "Paista samalla pannulla sipuli ja tomaatti kullanruskeiksi 5-7 minuuttia, lisää tarvittaessa öljyä.", "Palauta kyljykset pannulle, peitä ja hauduta miedolla lämmöllä noin 15 minuuttia kunnes liha on mureaa.", "Annostele kyljykset lautasille, kaada kastike päälle ja ripottele tuoretta korianteria pinnalle."]},
  {"id": "fasirky-lihapullat", "name": "Fašírky – slovakialaiset lihapullat", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/gtpvwp1763363947.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sian jauheliha", "amount": 500, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Leipä", "amount": 2, "unit": "viipaletta", "chip": "Leipä"}, {"name": "Maito", "amount": 0.3, "unit": "dl", "chip": "Maito"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Meirami", "amount": null, "unit": null, "chip": null}, {"name": "Sinappi", "amount": null, "unit": null, "chip": null}, {"name": "Persilja", "amount": null, "unit": null, "chip": null}, {"name": "Vehnäjauho", "amount": 1.2, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Kananmuna (kuorrutukseen)", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Korppujauho", "amount": 2.4, "unit": "dl", "chip": "Korppujauho"}, {"name": "Rypsiöljy paistamiseen", "amount": null, "unit": null, "chip": null}], "steps": ["Liota leipäviipaleet maidossa pehmeiksi, purista ylimääräinen neste pois ja survo murusiksi.", "Sekoita isossa kulhossa jauheliha, silputtu sipuli, valkosipuli, liotettu leipä, kananmuna ja mausteet tasaiseksi massaksi.", "Muotoile massasta kämmenen kokoisia pihvejä ja painele hieman litteiksi.", "Pyöräytä pihvit ensin jauhossa, sitten vatkatussa munassa ja lopuksi korppujauhoissa.", "Paista rypsiöljyssä keskilämmöllä noin 4-5 minuuttia puolelta, kunnes pihvit ovat kullanruskeita ja kypsiä.", "Tarjoile perunamuusin, kaalisalaatin tai tuoreen leivän kanssa."]},
  {"id": "frikadeller-tanskalaiset-lihapullat", "name": "Frikadeller – tanskalaiset lihapullat", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/bnhfa71784662834.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Sian jauheliha", "amount": 500, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Vehnäjauho", "amount": 1, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Kaurahiutale", "amount": 1, "unit": "rkl", "chip": "Kaurahiutale"}, {"name": "Maito", "amount": 1.2, "unit": "dl", "chip": "Maito"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Voi", "amount": 2, "unit": "rkl", "chip": "Voi"}], "steps": ["Hienonna sipuli ja valkosipuli.", "Sekoita jauhelihaan suola, jauho, kaurahiutaleet, sipuli, valkosipuli, kananmuna ja lopuksi maito. Sekoita, kunnes seos on kiinteää.", "Anna seoksen vetäytyä jääkaapissa vähintään 30 minuuttia, mieluiten pidempäänkin.", "Kuumenna voi pannulla ja muotoile seoksesta lusikalla pyöreitä lihapullia, noin 2 ruokalusikallista kerrallaan.", "Paista lihapullia molemmin puolin, kunnes pinta on kauniin ruskea ja sisus kypsä.", "Tarjoile kuumana perunasalaatin kanssa."]},
  {"id": "kuubalainen-voileipa", "name": "Kuubalainen grillivoileipä", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/djdg8l1784578885.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porsaankyljykset", "amount": 450, "unit": "g", "chip": "Sianliha"}, {"name": "Suola", "amount": null, "unit": null, "chip": null}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Appelsiini", "amount": 1, "unit": "kpl", "chip": "Appelsiini"}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kuivattu oregano", "amount": null, "unit": null, "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": null, "chip": null}, {"name": "Valkosipulijauhe", "amount": null, "unit": null, "chip": null}, {"name": "Dijon-sinappi", "amount": 2, "unit": "rkl", "chip": "Sinappi"}, {"name": "Majoneesi", "amount": 2, "unit": "rkl", "chip": "Majoneesi"}, {"name": "Kuubalainen leipä", "amount": 240, "unit": "g", "chip": "Leipä"}, {"name": "Suolaton voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Sveitsiläinen juusto", "amount": 120, "unit": "g", "chip": "Juusto"}, {"name": "Kinkkuviipaleet", "amount": 240, "unit": "g", "chip": "Kinkku"}, {"name": "Suolakurkkuviipaleet", "amount": 4, "unit": "kpl", "chip": "Suolakurkku"}], "steps": ["Pistele kyljyksiin haarukalla reikiä, mausta suolalla ja hiero pinnalle öljyä.", "Sekoita appelsiinin ja limen mehu ja kuori, oregano, pippuri ja valkosipulijauhe. Lisää puolet marinadista lihaan ja anna vetäytyä 10-15 minuuttia. Sekoita sinappi ja majoneesi loppuun marinadiin.", "Paista tai paahda kyljykset uunissa noin 200 asteessa 15-20 minuuttia kypsiksi.", "Leikkaa leipä neljäksi palaksi ja voitele ulkopinnat voilla, sisäpinnat sinappi-majoneesiseoksella.", "Kokoa voileivät: juustoa, kinkkua, paistettua porsasta, suolakurkkua ja lisää juustoa. Sulje leivät ja kääri folioon.", "Paahda voileipiä painaen raskaalla pannulla noin 3-4 minuuttia puolelta, kunnes juusto sulaa ja pinta rapeutuu. Leikkaa puoliksi ja tarjoile."]},
  {"id": "khmer-riisipannukakku", "name": "Kambodžalainen riisipannukakku sianlihalla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xrv78g1782769859.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Riisijauho", "amount": 2.4, "unit": "dl", "chip": "Riisijauho"}, {"name": "Maissitärkkelys", "amount": 0.6, "unit": "dl", "chip": "Maissitärkkelys"}, {"name": "Kookosmaito", "amount": 3, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Vesi", "amount": null, "unit": null, "chip": null}, {"name": "Jauhettu kurkuma", "amount": null, "unit": null, "chip": null}, {"name": "Possunkyljysviipaleet", "amount": 225, "unit": "g", "chip": "Sianliha"}, {"name": "Idut", "amount": 2.4, "unit": "dl", "chip": "Idut"}, {"name": "Sipuli", "amount": 0.5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kalakastike", "amount": null, "unit": null, "chip": "Kalakastike"}], "steps": ["Vatkaa riisijauho, maissitärkkelys, kookosmaito, vesi ja kurkuma tasaiseksi taikinaksi. Anna levätä 15 minuuttia.", "Kuumenna paistinpannu ja lisää hieman öljyä. Ruskista sianlihaviipaleet muutama minuutti, siirrä sivuun pannun laitaan.", "Lisää sipuli ja anna pehmetä hetki. Kaada osa taikinasta pannulle ohueksi kerrokseksi.", "Ripottele idut puolelle pannukakkua, peitä hetkeksi kannella höyrytystä varten.", "Paista kunnes reunat rapeutuvat ja kultautuvat. Taita pannukakku puoliksi itujen päälle.", "Toista jäljellä olevalla taikinalla ja tarjoile kalakastikkeen kanssa."]},
  {"id": "vietnamilainen-karamelliporsas", "name": "Vietnamilainen karamellisoitu porsas", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/4mzt101763761546.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Maapähkinäöljy", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Possun lapaviipaleet", "amount": 500, "unit": "g", "chip": "Sianliha"}, {"name": "Salottisipuli", "amount": 2, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Jauhettu inkivääri", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Ruskea sokeri", "amount": 75, "unit": "g", "chip": "Ruskea sokeri"}, {"name": "Kalakastike", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Chilikastike", "amount": 2, "unit": "tl", "chip": "Chilikastike"}, {"name": "Kevätsipuli", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Riisi", "amount": null, "unit": null, "chip": "Riisi"}, {"name": "Pak choi", "amount": null, "unit": null, "chip": "Pak choi"}], "steps": ["Kuumenna osa öljystä wokissa kovalla lämmöllä ja ruskista possunlihasuikaleet erissä. Nosta sivuun.", "Laske lämpöä, lisää loppu öljy sekä salottisipuli, inkivääri ja chili. Kuullota pehmeiksi.", "Lisää sokeri, kalakastike ja pari desilitraa vettä. Kiehauta ja sekoita, kunnes sokeri liukenee. Palauta liha pannulle.", "Anna kiehua reippaasti 8-10 minuuttia, kunnes kastike sakenee ja peittää lihan kiiltävänä kerroksena.", "Maista ja tarkista maku kalakastikkeella ja chilikastikkeella tarpeen mukaan.", "Ripottele pinnalle kevätsipuli ja tarjoile höyrytetyn riisin ja pak choin kanssa."]},
  {"id": "kangkung-possunlihalla", "name": "Kambodžalainen paistettu vesipinaatti possunlihalla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wympxc1779734808.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vesipinaatti (kangkung)", "amount": 1, "unit": "nippu", "chip": "Vesipinaatti"}, {"name": "Sian jauheliha", "amount": 150, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Fermentoidut soijapavut", "amount": 2, "unit": "rkl", "chip": "Fermentoidut soijapavut"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Öljy paistamiseen", "amount": null, "unit": null, "chip": null}, {"name": "Kalakastike", "amount": null, "unit": null, "chip": "Kalakastike"}, {"name": "Sokeri", "amount": null, "unit": null, "chip": "Sokeri"}, {"name": "Chili", "amount": null, "unit": null, "chip": null}], "steps": ["Kuumenna öljy wokissa keskilämmöllä ja paista valkosipuli noin 30 sekuntia, kunnes se tuoksuu.", "Lisää jauheliha ja riko se lastalla pieniksi paloiksi. Paista kypsäksi ja ruskeaksi 2-3 minuuttia.", "Sekoita joukkoon fermentoidut soijapavut ja kuumenna vielä minuutin ajan.", "Lisää paloiteltu vesipinaatti ja paista nopeasti 2-3 minuuttia, jotta se säilyttää kirkkaan värinsä ja rapeutensa.", "Mausta kalakastikkeella ja sokerilla maun mukaan, ja tarjoile heti höyrytetyn riisin kanssa."]},
  {"id": "prahok-ktis-dippi", "name": "Prahok ktis – possu-kookosdippi", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/g80f4t1782690273.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sian jauheliha", "amount": 450, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Kookosmaito", "amount": 2.4, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Fermentoitu kalatahna (prahok)", "amount": 3, "unit": "rkl", "chip": "Fermentoitu kalatahna"}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Salottisipuli", "amount": 2, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Chili", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Ruskea sokeri", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Kalakastike", "amount": 2, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Korianteri", "amount": null, "unit": null, "chip": null}], "steps": ["Kuumenna öljy pannulla ja kuullota hienonnettu valkosipuli ja salottisipuli, kunnes ne tuoksuvat ja saavat vaalean värin.", "Lisää jauheliha ja paista murustellen, kunnes kypsää eikä punaista näy, noin 5-7 minuuttia.", "Sekoita joukkoon fermentoitu kalatahna ja anna sen sekoittua lihaan minuutin ajan.", "Kaada joukkoon kookosmaito, laske lämpöä ja hauduta noin 10 minuuttia, kunnes seos hieman sakenee.", "Lisää kalakastike, ruskea sokeri ja hienonnettu chili, sekoita kunnes sokeri liukenee.", "Ota pannu pois liedeltä, sekoita joukkoon limemehu ja tuore korianteri. Anna jäähtyä hetki ennen tarjoilua."]},

Anna vetäytyä hetki liedeltä pois otettuna ja tarjoile smetanan kanssa."]},

  {"id": "possukasulet", "name": "Ranskalainen possukasulet", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wxuvuv1511299147.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Hanhenrasva", "amount": 4, "unit": "rkl", "chip": "Hanhenrasva"}, {"name": "Possunliha kuutioina", "amount": 350, "unit": "g", "chip": "Sianliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 10, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Fenkolinsiemen", "amount": null, "unit": null, "chip": null}, {"name": "Punaviinietikka", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kasvisliemi", "amount": 6, "unit": "dl", "chip": "Kasvisliemi"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Rosmariini", "amount": null, "unit": null, "chip": null}, {"name": "Persilja", "amount": null, "unit": null, "chip": null}, {"name": "Valkoiset pavut", "amount": 400, "unit": "g", "chip": "Pavut"}, {"name": "Korppujauho", "amount": 2, "unit": "rkl", "chip": "Korppujauho"}, {"name": "Öljy", "amount": null, "unit": null, "chip": null}, {"name": "Leipä tarjoiluun", "amount": null, "unit": null, "chip": "Leipä"}, {"name": "Parsakaali tarjoiluun", "amount": null, "unit": null, "chip": "Parsakaali"}], "steps": ["Kuumenna uuni 140 asteeseen. Ruskista hanhenrasvassa lihakuutiot uunivuokaan sopivassa padassa. Lisää viipaloitu sipuli, valkosipulinkynnet, porkkana ja fenkolinsiemen, kuullota pehmeiksi.", "Kaada joukkoon punaviinietikka kaapien pohjan irti. Lisää kasvisliemi, tomaattipyree ja puolet yrteistä. Kiehauta, mausta ja keitä 10 minuuttia.", "Peitä kannella ja paista uunissa 2 tuntia, poista kansi viimeiseksi tunniksi. Lisää pavut viimeisen puolen tunnin aikana.", "Ota pata uunista ja kuumenna grilli. Ripottele pinnalle loput yrtit ja korppujau   {"id": "boxty-aamiainen", "name": "Irlantilainen perunaletturuoka", "category": "Aamiainen", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/naqyel1608588563.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 4, "unit": "kpl", "chip": "Peruna"}, {"name": "Kevätsipuli", "amount": 1, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Vehnäjauho", "amount": 1, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Munanvalkuainen", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Kirnupiimä", "amount": 1.5, "unit": "dl", "chip": "Kirnupiimä"}, {"name": "Ruokasoodaa", "amount": null, "unit": null, "chip": null}, {"name": "Voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kirsikkatomaatti", "amount": 6, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Pekoni", "amount": 12, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Kananmuna", "amount": 6, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuori perunat, raasta puolet ja purista raasteesta neste pois. Keitä loput perunat kuoriman kanssa 10-15 minuuttia kypsiksi ja soseuta.", "Sekoita perunamuusi, perunaraaste, kevätsipuli ja jauho keskenään.", "Vatkaa munanvalkuainen vaahdoksi, sekoita joukkoon kirnupiimä ja ruokasooda, ja lisää tämä seos perunamassaan.", "Kuumenna pannulla voita ja öljyä ja paista lusikallisia perunataikinasta molemmin puolin kullanruskeiksi, noin 3-5 minuuttia puolelta.", "Paista tomaatteja voissa ja öljyssä pehmeiksi ja grillaa pekoni rapeaksi.", "Paista kananmunat halutulla tavalla ja kokoa lautaselle boxty-letut, pekoni ja munat, tomaatit tarjoile vieressä."]},
  {"id": "porsas-siideripata", "name": "Irlantilainen siideripata porsaasta", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7vpsfp1608588991.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Porsaankyljykset", "amount": 4, "unit": "kpl", "chip": "Sianliha"}, {"name": "Pekoni", "amount": 4, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Peruna", "amount": 4, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Lanttu", "amount": 0.5, "unit": "kpl", "chip": "Lanttu"}, {"name": "Kaali", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Laakerinlehti", "amount": null, "unit": null, "chip": null}, {"name": "Siideri", "amount": 1, "unit": "dl", "chip": "Siideri"}, {"name": "Kanaliemi", "amount": 1, "unit": "dl", "chip": "Kanaliemi"}], "steps": ["Kuumenna voi padassa ja ruskista kyljykset molemmin puolin 2-3 minuuttia. Nosta sivuun.", "Lisää pekoni, porkkana, peruna ja lanttu pataan, ja paista hetki kunnes ne saavat väriä.", "Sekoita joukkoon kaali, aseta kyljykset takaisin päälle, lisää laakerinlehti sekä siideri ja liemi.", "Peitä pata ja anna hautua miedolla lämmöllä noin 20 minuuttia, kunnes liha on kypsää ja kasvikset mureita.", "Tarjoile suoraan pataruukusta kuumana."]},
  {"id": "kinkkusarki-colcannon", "name": "Kinkkusäärimuusi (colcannon)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/n41ny81608588066.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Jauhoinen peruna", "amount": 800, "unit": "g", "chip": "Peruna"}, {"name": "Voi", "amount": 50, "unit": "g", "chip": "Voi"}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kaali", "amount": 1, "unit": "kpl", "chip": "Kaali"}, {"name": "Kevätsipuli", "amount": 8, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Kuohukerma", "amount": 1, "unit": "dl", "chip": "Kerma"}, {"name": "Sinappi", "amount": 2, "unit": "rkl", "chip": "Sinappi"}, {"name": "Keitetty kinkkusäärikinkku", "amount": 180, "unit": "g", "chip": "Kinkku"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuori ja paloittele perunat, keitä suolatussa vedessä 10-15 minuuttia pehmeiksi.", "Sulata voi pannulla ja kuullota valkosipuli, silputtu kaali ja kevätsipuli, kunnes kaali on juuri ja juuri pehmennyt.", "Valuta perunat, anna hetki höyrystyä ja soseuta samassa kattilassa kerman, sinapin ja mausteiden kanssa.", "Sekoita muusin joukkoon kaaliseos ja paloiteltu kinkku, pidä lämpimänä.", "Paista pannulla kananmunat halutulla tavalla ja tarjoile jokaisen colcannon-annoksen päällä yksi paistettu muna."]},
  {"id": "japanilainen-katsudon", "name": "Japanilainen katsudon", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/d8f6qx1604182128.jpg", "aiImage": false, "servings": 2, "ingredients": [{"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Paneroitu possukotletti (tonkatsu)", "amount": 1, "unit": "kpl", "chip": "Sianliha"}, {"name": "Kasvisliemi", "amount": 1.5, "unit": "dl", "chip": "Kasvisliemi"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Mirin", "amount": null, "unit": null, "chip": "Mirin"}, {"name": "Sokeri", "amount": null, "unit": null, "chip": "Sokeri"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sushiriisi", "amount": 200, "unit": "g", "chip": "Riisi"}, {"name": "Ruohosipuli", "amount": null, "unit": null, "chip": null}], "steps": ["Kuumenna öljy pannulla ja paista viipaloitu sipuli kullanruskeaksi. Aseta valmiiksi paistettu tonkatsu-kotletti pannun keskelle.", "Sekoita kasvisliemi, soijakastike, mirin ja sokeri, ja kaada suurin osa seoksesta kotletin ympärille. Anna kastikkeen hieman sakeutua ja kotletin lämmetä.", "Kaada vatkatut kananmunat kotletin ympärille ja anna hyytyä 2-3 minuuttia, jotta muna on kypsää mutta hieman löysää.", "Jaa keitetty riisi kahteen kulhoon, nosta munaseos ja kotletti riisin päälle.", "Ripottele ruohosipulia pinnalle ja tarjoile halutessa lisäsoijalla."]},
  {"id": "lao-naem-khao", "name": "Laolainen rapea riisisalaatti", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0dypw51779817467.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Jasmiiniriisi", "amount": 7.2, "unit": "dl", "chip": "Riisi"}, {"name": "Kookos raastettuna", "amount": 1, "unit": "kpl", "chip": "Kookos"}, {"name": "Öljy paistamiseen", "amount": null, "unit": null, "chip": null}, {"name": "Hapan porsasmakkara", "amount": 4.8, "unit": "dl", "chip": "Hapan porsasmakkara"}, {"name": "Pikkelöity valkosipuli", "amount": 2, "unit": "kpl", "chip": "Pikkelöity valkosipuli"}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kalakastike", "amount": 2, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Salottisipuli", "amount": 1, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Kevätsipuli", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Korianteri", "amount": null, "unit": null, "chip": null}, {"name": "Kuuma minttu", "amount": null, "unit": null, "chip": null}, {"name": "Minttu", "amount": null, "unit": null, "chip": null}, {"name": "Paahdetut maapähkinät", "amount": 0.6, "unit": "dl", "chip": "Maapähkinä"}, {"name": "Tuoreet kasvikset tarjoiluun", "amount": null, "unit": null, "chip": null}, {"name": "Jäävuorisalaatti", "amount": null, "unit": null, "chip": "Salaatti"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Viipaloi sipuli ja salottisipuli ohuiksi ja anna liota jäävedessä sivussa.", "Sekoita keitetty riisi ja raastettu kookos käsin tasaiseksi seokseksi, muotoile 5 cm palloja.", "Kuumenna öljy pannussa. Vatkaa munat, kastele riisipallot munassa ja paista syvässä öljyssä kullanruskeiksi ja rapeiksi.", "Anna palloja jäähtyä hetki, riko ne isoon kulhoon ja r
