<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruokaralli.fi – Mitä tänään syötäisiin?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0;
    --bg-card:#FFFFFF;
    --green:#5A7247;
    --green-dark:#455938;
    --orange:#E0954F;
    --orange-dark:#c97e3a;
    --text:#2E2B24;
    --text-soft:#6b6558;
    --border:#e8e2d3;
    --radius:18px;
    --shadow:0 4px 18px rgba(46,43,36,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Karla',sans-serif;
    padding-bottom:70px;
  }
  h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;}
  header{
    padding:18px 16px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
    border-bottom:1px solid var(--border);
  }
  .brand{font-size:22px;font-weight:700;color:var(--green-dark);}
  .brand span{color:var(--orange);}
  .fav-btn{
    background:#fff;border:1.5px solid var(--border);cursor:pointer;
    padding:8px 14px;border-radius:12px;display:flex;align-items:center;gap:6px;
    font-family:'Karla',sans-serif;font-weight:700;font-size:13.5px;color:var(--text);
  }
  .fav-btn.active{background:#fdeee0;border-color:var(--orange);}

  main{max-width:520px;margin:0 auto;padding:0 14px;}

  .ad-slot{
    background:#f1ede2;border:1px dashed #ccc4ae;border-radius:14px;
    text-align:center;color:#9b9484;font-size:12px;padding:22px 10px;margin:14px 0;
  }
  .ad-slot.top-banner{margin-top:14px;}

  .panel{
    background:var(--bg-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-top:14px;
  }
  .panel h2{margin:0 0 10px;font-size:17px;color:var(--green-dark);}
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{
    flex:1;text-align:center;padding:9px 4px;border-radius:12px;
    background:#f1ede2;font-size:13px;font-weight:700;cursor:pointer;
    border:1px solid transparent;color:var(--text-soft);
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .tab.active{background:var(--green);color:#fff;}
  .tab svg{width:15px;height:15px;flex-shrink:0;}

  .ing-search{
    width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);
    font-size:14px;font-family:'Karla',sans-serif;margin-bottom:10px;
  }
  .ing-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;}
  .ing-chip{
    padding:6px 12px;border-radius:20px;background:#f1ede2;font-size:13px;
    cursor:pointer;border:1px solid transparent;user-select:none;
  }
  .ing-chip.selected{background:var(--green);color:#fff;}
  .selected-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .selected-row .ing-chip{background:#e4ecdf;}
  .budget-row{display:flex;gap:8px;}
  .budget-btn{
    flex:1;padding:10px;border-radius:12px;background:#f1ede2;text-align:center;
    font-weight:700;cursor:pointer;border:1px solid transparent;font-size:15px;
  }
  .budget-btn.selected{background:var(--orange);color:#fff;}
  .surprise-btn{
    width:100%;margin-top:14px;padding:13px;border:none;border-radius:14px;
    background:var(--orange);color:#fff;font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:16px;cursor:pointer;
  }
  .surprise-btn:active{background:var(--orange-dark);}

  .result-count{margin:18px 2px 8px;font-size:14px;color:var(--text-soft);}

  .card-stack{position:relative;}
  .card{
    background:var(--bg-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:16px;
    position:relative;
  }
  .card img{width:100%;height:170px;object-fit:cover;display:block;background:#eee;}
  .card-body{padding:14px 14px 16px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600;margin:0;}
  .price-tag{
    font-weight:700;color:var(--orange-dark);background:#fdeee0;
    padding:3px 9px;border-radius:10px;font-size:13px;white-space:nowrap;
  }
  .match-bar-wrap{background:#f1ede2;border-radius:8px;height:8px;margin:10px 0 6px;overflow:hidden;}
  .match-bar{height:100%;background:var(--green);border-radius:8px;}
  .match-text{font-size:12.5px;color:var(--text-soft);}
  .missing{font-size:12.5px;color:var(--orange-dark);margin-top:4px;}
  .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .tag{font-size:11px;background:#eef1e8;color:var(--green-dark);padding:3px 8px;border-radius:8px;font-weight:700;}
  .ai-note{font-size:10.5px;color:var(--text-soft);font-style:italic;padding:4px 14px 0;}
  .card-actions{display:flex;gap:8px;margin-top:12px;}
  .open-btn{
    flex:1;padding:9px;border-radius:10px;background:var(--green);color:#fff;
    border:none;font-weight:700;cursor:pointer;font-family:'Karla',sans-serif;
  }
  .heart-btn{
    width:40px;border-radius:10px;background:#f1ede2;border:none;cursor:pointer;font-size:16px;
  }
  .heart-btn.active{background:#fbe1d3;}
  .empty-state{
    text-align:center;padding:40px 14px;color:var(--text-soft);font-size:14px;
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(46,43,36,0.5);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:0 0 24px;
  }
  .modal img{width:100%;height:200px;object-fit:cover;}
  .modal-inner{padding:16px 18px;}
  .modal-close{
    position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.85);
    border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;
  }
  .modal h2{font-size:21px;margin:0 0 4px;}
  .serving-row{display:flex;align-items:center;gap:10px;margin:12px 0;}
  .serving-btn{
    width:32px;height:32px;border-radius:50%;border:none;background:var(--green);color:#fff;
    font-size:17px;cursor:pointer;
  }
  .ing-list{list-style:none;padding:0;margin:10px 0;}
  .ing-list li{
    display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;
  }
  .ing-list li.missing-ing{color:var(--orange-dark);font-weight:700;}
  .steps{padding-left:20px;font-size:14.5px;line-height:1.6;}
  .steps li{margin-bottom:8px;}
  .modal-actions{display:flex;justify-content:center;margin-top:16px;}
  .modal-actions button{
    padding:11px 28px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-family:'Karla',sans-serif;
  }
  .btn-fav{background:var(--orange);color:#fff;}

  .site-footer{
    background:var(--bg-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px 16px;
    margin:24px 0 20px;
    text-align:center;
  }
  .site-footer h2{margin:0 0 8px;font-size:16px;color:var(--green-dark);}
  .site-footer p{margin:0 0 10px;font-size:13.5px;color:var(--text-soft);}
  .footer-email{
    display:inline-block;font-weight:700;color:var(--orange-dark);
    text-decoration:none;font-size:14.5px;
  }
  .footer-email:hover{text-decoration:underline;}

  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>

  {"id": "kaali-jauhelihapadassa", "name": "Bulgarialainen kaali-jauhelihapata", "category": "Liha", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/brmxra1782681940.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana", "amount": 200, "unit": "g", "chip": "Porkkana"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Savupaprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jauhettu kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kaali", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Omenaviinietikka", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vesi", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna öljy pannussa ja ruskista jauheliha murustaen.", "Lisää sipuli, porkkana, paprika, valkosipuli ja tomaattisose, mausta suolalla, pippurilla, savupaprikalla ja kuminalla, ja kypsennä pari minuuttia.", "Lisää silputtu kaali, etikka ja vesi, sekoita, laske lämpöä, peitä kannella ja hauduta noin 30 minuuttia välillä sekoittaen.", "Tarkista kaalin kypsyys ja anna tarvittaessa kiehua kannettomana vielä 5-7 minuuttia, jotta ylimääräinen neste haihtuu.", "Ripottele pintaan tuoretta persiljaa ennen tarjoilua."]},
  {"id": "jamaikalaiset-lihapiirakat", "name": "Jamaikalaiset lihapiirakat", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wsqqsw1515364068.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 480, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Curryjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Voi tai rasvakeitin", "amount": 250, "unit": "g", "chip": "Voi"}, {"name": "Jääkylmä vesi", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Naudan jauheliha", "amount": 900, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Maustepippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 2.4, "unit": "dl", "chip": "Sipuli"}, {"name": "Chilipaprika", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Valkosipuli", "amount": 2, "unit": "tl", "chip": "Valkosipuli"}, {"name": "Timjami", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ketsuppi", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kevätsipuli", "amount": 1.2, "unit": "dl", "chip": "Kevätsipuli"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Vaivaa taikina jauhosta, suolasta, kurkumasta/currystä ja rasvasta, lisää jääkylmää vettä kunnes taikina kokoontuu, ja anna vetäytyä kylmässä 30 minuuttia.", "Mausta jauheliha maustepippurilla ja mustapippurilla, ruskista se öljyssä yhdessä sipulin, chilin, valkosipulin ja timjamin kanssa.", "Lisää ketsuppia ja vettä, hauduta kunnes neste on suurimmaksi osaksi haihtunut ja seos on paksua, ja sekoita lopuksi joukkoon kevätsipuli. Anna jäähtyä.", "Kaulitse taikina ja leikkaa ympyröiksi, annostele täyte puolelle ympyrästä, taita kiinni ja rypytä reunat.", "Sivele pinnat munavaahdolla ja pa   {"id": "cevapi-makkarat", "name": "Kroatialaiset cevapi-lihamakkarat", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vc08jn1628769553.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sian jauheliha", "amount": 250, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Persilja", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Leivinjauhe", "amount": 0.75, "unit": "tl", "chip": null}, {"name": "Korppujauho", "amount": 2, "unit": "rkl", "chip": "Korppujauho"}, {"name": "Vesi", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kasvisliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kasvisliemi"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Sekoita jauhelihat, hienonnettu sipuli ja raastettu valkosipuli keskenään.", "Lisää persilja, paprikajauhe, leivinjauhe, korppujauho, vesi, murustettu liemikuutio, suola ja pippuri, ja sekoita tasaiseksi taikinaksi.", "Anna seoksen levätä kylmässä 1-2 tuntia.", "Muotoile seoksesta pikkusormen paksuisia ja noin 8 cm pitkiä makkaroita.", "Grillaa makkaroita kuumalla grillipannulla tai avotulella noin 12-14 minuuttia, kääntäen useasti, kunnes ne ovat kypsiä ja ruskistuneet."]},
  {"id": "jauhelihapiirakka", "name": "Perinteinen jauhelihapiirakka", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xwutvy1511555540.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Vehnäjauho", "amount": 1.5, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Herkkusieni", "amount": 75, "unit": "g", "chip": "Sieni"}, {"name": "Naudanlihaliemi", "amount": 2.5, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Worcestershirekastike", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Voitaikina", "amount": 400, "unit": "g", "chip": "Taikinapohja"}, {"name": "Munankeltuainen", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuumenna öljy paistinpannussa ja ruskista jauheliha murustaen 4-5 minuuttia.", "Lisää sipuli ja tomaattisose, kypsennä hetki, sekoita joukkoon jauho ja lisää sitten sienet, lihaliemi ja worcesterkastike.", "Anna kiehahtaa, laske lämpöä, peitä ja hauduta noin 20 minuuttia. Anna täytteen jäähtyä ja siirrä se piirakkavuokaan.", "Kaulitse taikina vuokaa suuremmaksi, aseta täytteen päälle, painele reunat kiinni ja koristele halutessasi taikinatähteillä.", "Tee kanteen muutama viilto höyryä varten, sivele munankeltuaisella ja paista 200 asteessa 20-25 minuuttia kultaisenruskeaksi."]},
  {"id": "pienet-chili-jauhelihapiiraat", "name": "Pienet chili-jauhelihapiiraat", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/6sarfo1762340107.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voitaikina", "amount": 450, "unit": "g", "chip": "Taikinapohja"}, {"name": "Auringonkukkaöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Chilijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Jauhettu kumina", "amount": 2, "unit": "tl", "chip": null}, {"name": "Naudan jauheliha", "amount": 250, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Tomaattisose", "amount": 85, "unit": "g", "chip": "Tomaattipyree"}, {"name": "Naudanlihaliemi", "amount": 1.5, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Kaneli", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Kidneypavut", "amount": 200, "unit": "g", "chip": "Pavut"}, {"name": "Peruna", "amount": 1, "unit": "kpl", "chip": "Peruna"}, {"name": "Smetana", "amount": 3, "unit": "rkl", "chip": "Smetana"}, {"name": "Ruohosipuli", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna öljy pannussa ja kuullota sipulia 5 minuuttia, lisää mausteet ja jauheliha, ja ruskista.", "Sekoita joukkoon tomaattisose, liemi ja kaneli, kiehauta ja anna hautua 15-20 minuuttia kunnes nestettä on jäljellä hyvin vähän. Lisää pavut viimeisiksi 5 minuutiksi ja anna seoksen jäähtyä.", "Painele taikinasta pyöreitä levyjä muffinivuokaan, pistele pohja haarukalla ja paista 200 asteessa 10 minuuttia, jäähdytä.", "Keitä ja soseuta peruna smetanan kanssa, mausta ja sekoita joukkoon ruohosipuli.", "Lusikoi taikinakuppeihin chiliseosta ja päälle perunamuusia, ja paista vielä noin 15 minuuttia kultaisenruskeiksi."]},
  {"id": "soijaglaseeratut-lihamureket", "name": "Soijaglaseeratut lihamureket wasabimuusilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/o2wb6p1581005243.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 5, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 340, "unit": "g", "chip": "Porkkana"}, {"name": "Kevätsipuli", "amount": 1, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Leipä", "amount": 1, "unit": "viipale", "chip": "Leipä"}, {"name": "Valkosipulijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Rypsiöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sokeri", "amount": 4, "unit": "tl", "chip": "Sokeri"}, {"name": "Voi", "amount": 60, "unit": "g", "chip": "Voi"}, {"name": "Sriracha-kastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ketsuppi", "amount": 1, "unit": "dl", "chip": null}, {"name": "Wasabitahna", "amount": 0.5, "unit": "tl", "chip": null}], "steps": ["Kuutioi peruna ja viipaloi porkkanat, ja levitä porkkanat uunipellille öljyn, suolan ja pippurin kanssa.", "Liota leipä vedessä, sekoita se jauhelihan, srirachan, sipulin valkoisen osan, puolen valkosipulista ja mausteiden kanssa, ja muotoile neljä murekesta.", "Paista mureket ja porkkanat uunissa 220 asteessa noin 20 minuuttia.", "Keitä perunat kypsiksi, valuta ja soseuta ne voin, lopun valkosipulin ja wasabin kanssa, mausta suolalla ja pippurilla.", "Sivele mureisiin soija-ketsuppiglaseeraus ja paista vielä muutama minuutti, kunnes porkkanat ovat ruskistuneet. Tarjoile perunamuusin kanssa ja ripottele pinnalle kevätsipulin vihreää osaa."]},
  {"id": "spagetti-bolognese", "name": "Spagetti bolognese", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sutysw1468247559.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Vähärasvainen naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Herkkusieni", "amount": 90, "unit": "g", "chip": "Sieni"}, {"name": "Kuivattu oregano", "amount": 1, "unit": "tl", "chip": null}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaattimurska"}, {"name": "Kuuma naudanlihaliemi", "amount": 3, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Worcestershirekastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Spagetti", "amount": 350, "unit": "g", "chip": "Pasta"}, {"name": "Parmesaani", "amount": 50, "unit": "g", "chip": "Juusto"}], "steps": ["Kuullota sipuli öljyssä muutama minuutti, lisää valkosipuli ja jauheliha, ja ruskista.", "Lisää sienet ja oregano, ja jatka paistamista pari minuuttia.", "Sekoita joukkoon tomaattimurska, lihaliemi, tomaattisose ja worcesterkastike, kiehauta, laske lämpöä ja hauduta kannen alla noin 30 minuuttia.", "Keitä spagetti pakkauksen ohjeen mukaan, valuta ja sekoita halutessasi joukkoon tilkka oliiviöljyä.", "Sekoita lihakastike spagetin kanssa ja tarjoile raastetun parmesaanin kera."]},
  {"id": "argentiinalaiset-empanadat", "name": "Argentiinalaiset naudanliha-empanadat", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/q99te31763075494.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 500, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Voi", "amount": 200, "unit": "g", "chip": "Voi"}, {"name": "Vesi", "amount": 1.2, "unit": "dl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Vihreät oliivit", "amount": 100, "unit": "g", "chip": "Oliivit"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}], "steps": ["Sekoita jauho ja suola, lisää voi näpertäen mureaksi, lisää vesi vähän kerrallaan ja vaivaa taikinaksi, kääri kelmuun ja anna jäähtyä 30 minuuttia.", "Kuullota sipuli, lisää jauheliha ja ruskista, mausta kuminalla ja paprikalla, ja anna jäähtyä.", "Sekoita jäähtyneeseen täytteeseen keitetyt kananmunat ja oliivit.", "Kaulitse taikina, leikkaa ympyröiksi, täytä lusikallisella seosta, taita ja rypytä reunat kiinni.", "Paista 200 asteessa 20-25 minuuttia, kunnes empanadat ovat kultaisenruskeita."]},
  {"id": "kenialainen-naudanlihacurry", "name": "Kenialainen naudanlihacurry", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lqampv1762325397.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vesi", "amount": 9.5, "unit": "dl", "chip": null}, {"name": "Naudanliha kuutioina", "amount": 900, "unit": "g", "chip": "Naudanliha"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 2, "unit": "tl", "chip": null}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Punasipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Tomaatti", "amount": 4, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Paprikajauhe", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Mustapippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Curryjauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Tomaattisose", "amount": 4, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Keitä naudanlihaa valkosipulin ja inkiväärin kera vedessä noin 20 minuuttia, valuta ja säilytä keitinliemi.", "Kuullota sipuli öljyssä pehmeäksi, lisää tomaatit ja hauduta kunnes ne hajoavat.", "Lisää valutettu liha joukkoon ja jatka kypsentämistä hetki.", "Mausta paprikalla, pippurilla, currylla, tomaattisoseella ja suolalla, ja lisää takaisin keitinliemi sekä tarvittaessa lisää vettä.", "Anna kiehua ilman kantta noin tunnin ajan, kunnes liha on mureaa ja kastike paksuuntunut. Viimeistele tuoreella chilillä ja korianterilla."]},
  {"id": "ma-po-tofu", "name": "Ma po -tofu", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1525874812.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Tofu", "amount": 450, "unit": "g", "chip": "Tofu"}, {"name": "Naudan jauheliha", "amount": 100, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Seesamiöljy", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Chilipapu-tahna (doubanjiang)", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Fermentoidut mustapavut", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Chilihiutale", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Sichuanpippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Vesi", "amount": 4, "unit": "dl", "chip": null}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kevätsipuli", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 1, "unit": "pala", "chip": null}, {"name": "Maissitärkkelys", "amount": 1, "unit": "rkl", "chip": "Maissitärkkelys"}], "steps": ["Mausta jauheliha ripauksella suolaa ja seesamiöljyä.", "Kuutioi tofu ja ryöppää sitä minuutin ajan kevyesti suolatussa vedessä, valuta.", "Paista jauheliha kuumassa öljyssä rapeaksi ja nosta sivuun.", "Paista samassa wokissa chilitahnaa hetki, lisää valkosipuli, kevätsipulin valkoinen osa, inkivääri ja fermentoidut pavut, ja mausta chilihiutaleilla.", "Lisää vesi, kiehauta, laske tofu joukkoon varovasti, lisää soijakastike ja liha, ja hauduta 6-8 minuuttia.", "Sakeuta kastike maissitärkkelysveteen sekoittaen, mausta lopuksi suolalla ja tarjoile riisin kanssa kevätsipulin vihreää osaa ripotellen."]},
  {"id": "pate-chinois", "name": "Kanadalainen paimenenpiiras (pâté chinois)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/yyrrxr1511816289.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 950, "unit": "g", "chip": "Peruna"}, {"name": "Voi", "amount": 60, "unit": "ml", "chip": "Voi"}, {"name": "Maito", "amount": 1.2, "unit": "dl", "chip": "Maito"}, {"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kermamainen maissi", "amount": 500, "unit": "ml", "chip": "Maissi"}, {"name": "Paprikajauhe", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Keitä kuoritut perunat pehmeiksi suolatussa vedessä ja valuta.", "Soseuta perunat voin ja maidon kanssa tasaiseksi, mausta suolalla ja pippurilla.", "Ruskista sipuli lopulla voilla, lisää jauheliha ja paista kypsäksi, mausta suolalla ja pippurilla.", "Levitä liha vuoan pohjalle, peitä maissilla ja lopuksi perunamuusilla, ripottele pinnalle paprikaa ja persiljaa.", "Paista 190 asteessa noin 30 minuuttia ja viimeistele halutessasi grillivastuksen alla, kunnes pinta on ruskistunut."]},
  {"id": "roti-john", "name": "Roti john -lihasämpylä", "category": "Liha", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hx335q1619789561.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudan jauheliha", "amount": 115, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Chili", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Patonki", "amount": 0.5, "unit": "kpl", "chip": "Leipä"}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Majoneesi", "amount": 1, "unit": "annos", "chip": "Majoneesi"}], "steps": ["Sekoita jauheliha, hienonnettu sipuli, munat ja chili keskenään kulhossa, mausta suolalla ja pippurilla.", "Kuumenna hieman öljyä pannulla ja kaada seos siihen ohueksi levyksi.", "Aseta halkaistu patonki avoimena seoksen päälle, painele spatulalla ja paista noin 2 minuuttia.", "Käännä leipä ja anna toisenkin puolen rapeutua hieman.", "Nosta pannulta, leikkaa sopiviksi paloiksi ja tarjoile majoneesin kanssa."]},
  {"id": "arubalainen-satee", "name": "Arubalainen satee-vartaat", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/dqxtlh1780153831.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Sitruuna", "amount": 2, "unit": "kpl", "chip": "Sitruuna"}, {"name": "Sokeri", "amount": 2, "unit": "rkl", "chip": "Sokeri"}, {"name": "Soijakastike", "amount": 2.4, "unit": "dl", "chip": "Soijakastike"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jauhettu korianteri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Rypsiöljy", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Naudanliha kuutioina", "amount": 900, "unit": "g", "chip": "Naudanliha"}, {"name": "Rypsiöljy vartaisiin", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Soijakastike vartaisiin", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}], "steps": ["Soseuta tehosekoittimessa sipuli, valkosipuli, sitruunamehu, sokeri, soijakastike, suola, korianteri ja öljy tasaiseksi marinadiksi.", "Kaada marinadi kuutioidun naudanlihan päälle ja anna marinoitua jääkaapissa muutama tunti.", "Pujota lihakuutiot vartaisiin.", "Sekoita öljy ja soijakastike, ja pyörittele vartaat siinä ennen paistamista, jotta liha ei kuivu.", "Paista vartaat pannulla tai grillissä kypsiksi ja kauniin ruskeiksi."]},
  {"id": "turkkilainen-lahmacun", "name": "Turkkilainen lahmacun", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/tqd3ac1763786065.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnäjauho", "amount": 500, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kuivahiiva", "amount": 10, "unit": "g", "chip": null}, {"name": "Maissijauho", "amount": 1, "unit": "sirotus", "chip": null}, {"name": "Tomaatti", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Vihreä chili", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Kevätsipuli", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Persilja", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Naudan jauheliha", "amount": 250, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Chilihiutale", "amount": 2, "unit": "tl", "chip": null}, {"name": "Jauhettu kumina", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Maustepippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sitruuna", "amount": 0.5, "unit": "kpl", "chip": "Sitruuna"}, {"name": "Punasipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}], "steps": ["Sekoita jauho, hiiva ja vesi, ja anna kohota lämpimässä 15 minuuttia, lisää loput vedestä ja suola, vaivaa 10 minuuttia joustavaksi taikinaksi ja kohota vielä 30 minuuttia.", "Kuumenna uuni mahdollisimman kuumaksi ja sirottele pellille hieman maissijauhoa.", "Kuori tomaatit ja pilko ne pieneksi, silppua chilit hienoksi.", "Sekoita tomaatit, chilit, kevätsipuli, silputtu persilja, jauheliha ja mausteet keskenään suolan ja mustapippurin kanssa.", "Jaa taikina neljään palaan, kaulitse ohuiksi levyiksi ja levitä pinnalle ohut kerros lihaseosta.", "Paista 10-15 minuuttia kunnes reunat alkavat tummua, ripottele päälle persiljaa ja punasipulia, ja purista päälle sitruunamehua."]},
  {"id": "paneroitu-naudanpihvi", "name": "Kolumbialainen paneroitu naudanpihvi", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lmwaf61783805434.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha, pihvi", "amount": 900, "unit": "g", "chip": "Naudanliha"}, {"name": "Yrttimarinadi (aliños)", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Vehnäjauho", "amount": 2.4, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Korppujauho", "amount": 4.8, "unit": "dl", "chip": "Korppujauho"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Rypsiöljy paistamiseen", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Taputtele pihvit kalikalla ohuiksi kahden muovikalvon välissä.", "Marinoi pihvit yrttimarinadissa jääkaapissa muutaman tunnin tai yön yli.", "Sekoita jauho, korppujauho, kumina ja persilja keskenään omaan astiaansa, ja vatkaa munat toiseen astiaan.", "Pyöräytä pihvit ensin jauhoseoksessa, sitten munassa ja lopuksi uudelleen jauhoseoksessa.", "Paista pihvejä kuumassa öljyssä 3-4 minuuttia puolelta, kunnes ne ovat kultaisenruskeita, ja valuta talouspaperilla."]},
  {"id": "norjalaiset-karbonadit", "name": "Norjalaiset karbonadit karamellisoidulla sipulilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0bpjb11763075817.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Muskottipähkinä", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Maissitärkkelys", "amount": 0.5, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Vesi", "amount": 50, "unit": "ml", "chip": null}, {"name": "Voi paistamiseen", "amount": 2, "unit": "rkl", "chip": "Voi"}], "steps": ["Raasta puolikas sipuli ja viipaloi loput. Kuullota viipaloitu sipuli voissa hitaasti kullanruskeaksi.", "Sekoita jauheliha raastetun sipulin, suolan, pippurin, muskotin, maissitärkkelyksen ja veden kanssa.", "Muotoile seoksesta pötkylä ja leikkaa siitä kuusi pihviä, viillä pintaan kevyt ruudukko veitsellä.", "Ruskista karbonadit kuumalla voilla molemmin puolin, laske sitten lämpöä ja paista vielä 2-3 minuuttia.", "Tarjoile karamellisoidun sipulin, keitettyjen perunoiden ja ruskean kastikkeen kera."]},
  {"id": "filippiinilainen-naudanliha-caldereta", "name": "Filippiiniläinen naudanliha-caldereta", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/41cxjh1683207682.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha kuutioina", "amount": 900, "unit": "g", "chip": "Naudanliha"}, {"name": "Naudanlihaliemikuutio", "amount": 1, "unit": "kpl", "chip": "Naudanliemi"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Vesi", "amount": 4.8, "unit": "dl", "chip": null}, {"name": "Vihreä paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Peruna", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Tomaattisose", "amount": 230, "unit": "g", "chip": "Tomaattipyree"}, {"name": "Maapähkinävoi", "amount": 3, "unit": "rkl", "chip": "Maapähkinä"}, {"name": "Chilijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 5, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}], "steps": ["Kuullota sipuli ja valkosipuli öljyssä, lisää naudanliha ja ruskista pinnalta.", "Lisää soijakastike, tomaattisose ja vesi, kiehauta ja sekoita joukkoon liemikuutio, hauduta kannen alla noin 30 minuuttia kunnes liha on mureaa.", "Paista erikseen kuutioidut perunat ja porkkanat pannulla ruskeiksi.", "Lisää pataan chilijauhe ja maapähkinävoi, sekoita, ja lisää sitten paprikat sekä paistetut perunat ja porkkanat.", "Hauduta vielä 5-7 minuuttia kannen alla, mausta suolalla ja mustapippurilla, ja tarjoile."]},
  {"id": "cumberland-piiras", "name": "Cumberlandin naudanlihapiiras", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/pvfkz61761595976.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Selleri", "amount": 2, "unit": "varsi", "chip": "Selleri"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Laakerinlehti", "amount": 5, "unit": "kpl", "chip": null}, {"name": "Timjami", "amount": 3, "unit": "oksaa", "chip": null}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Vehnäjauho", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Tomaattisose", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Worcestershirekastike", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Naudanlihaliemikuutio", "amount": 2, "unit": "kpl", "chip": "Naudanliemi"}, {"name": "Naudan pataliha", "amount": 800, "unit": "g", "chip": "Naudanliha"}, {"name": "Peruna", "amount": 800, "unit": "g", "chip": "Peruna"}, {"name": "Cheddarjuusto", "amount": 25, "unit": "g", "chip": "Juusto"}, {"name": "Parmesaani", "amount": 25, "unit": "g", "chip": "Juusto"}], "steps": ["Kuullota selleri, sipuli, porkkana, laakerinlehti ja tuore timjami öljyssä ja voissa noin 10 minuuttia.", "Sekoita joukkoon jauho, tomaattisose, worcesterkastike ja liemikuutiot, kaada päälle kuumaa vettä ja lisää naudanliha.", "Anna kiehahtaa ja hauduta uunissa 160 asteessa noin 2,5-3 tuntia, kunnes liha on hyvin mureaa ja kastike paksuuntunut.", "Keitä perunat noin kolme neljäsosaa kypsiksi, viipaloi ne ja sekoita joukkoon jäljellä oleva öljy sekä timjaminlehdet.", "Siirrä liha uunivuokaan, lado päälle perunaviipaleet kerroksittain juuston kanssa, ja paista 200 asteessa 30-40 minuuttia kunnes pinta on rapea ja kultainen."]},
  {"id": "egyptilainen-fatteh", "name": "Egyptiläinen naudanliha-fatteh", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/rlwcc51598734603.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha", "amount": 450, "unit": "g", "chip": "Naudanliha"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kanaliemikuutio", "amount": 1, "unit": "kpl", "chip": "Kanaliemi"}, {"name": "Tomaatti", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Valkosipulinkynsi", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Riisi", "amount": 4.8, "unit": "dl", "chip": "Riisi"}, {"name": "Ohuet nuudelit", "amount": 0.6, "unit": "dl", "chip": "Nuudelit"}, {"name": "Voi", "amount": 0.6, "unit": "dl", "chip": "Voi"}, {"name": "Oliiviöljy", "amount": 4.8, "unit": "dl", "chip": null}, {"name": "Pitaleipä", "amount": 1, "unit": "kpl", "chip": "Leipä"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkoviinietikka", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "maun mukaan", "chip": null}], "steps": ["Revi pitaleipä paloiksi ja paista voissa rapeaksi ja kullanruskeaksi. Lisää joukkoon murskattu valkosipuli ja kuminaa, ja aseta vuoan pohjalle.", "Ruskista naudanliha voissa, lisää sipuli, suola, pippuri ja liemikuutio, peitä vedellä ja hauduta noin 2 tuntia, kunnes liha on mureaa. Ota liha talteen ja säilytä keitinliemi.", "Paista nuudelit voissa kullanruskeiksi, lisää riisi ja paista hetki, kaada joukkoon vettä ja suolaa, ja keitä riisi kypsäksi.", "Kostuta leipäpalat osalla lihalientä, lado päälle riisi ja loppu liemi.", "Valmista tomaattikastike paistamalla tomaatti, tomaattisose, valkosipuli, kumina ja etikka öljyssä, kunnes kastike on sakeaa, ja levitä riisin päälle.", "Paista lopuksi liha kuumassa öljyssä hieman lisätomaattisoseen ja valkosipulin kanssa, ja lado se annoksen päälle ennen tarjoilua."]},
  {"id": "shawarma-naudanpaisti-wrap", "name": "Shawarma-tapaan haudutettu naudanpaisti pitaleivässä", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/swo87v1763595282.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudan lapapaisti", "amount": 1000, "unit": "g", "chip": "Naudanliha"}, {"name": "Naudanliemi", "amount": 2.4, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Sitruunamehu", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Jauhettu kumina", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Paprikajauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jauhettu inkivääri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kurkuma", "amount": 1, "unit": "tl", "chip": null}, {"name": "Cayennepippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Jauhettu korianteri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Neilikka", "amount": 0.25, "unit": "tl", "chip": null}], "steps": ["Sekoita mausteet, naudanliemi ja sitruunamehu haudutuspadassa tai kattilassa.", "Lisää naudanpaisti liemeen ja pyörittele mausteseoksessa niin että se peittyy kauttaaltaan.", "Peitä ja hauduta miedolla lämmöllä 8–10 tuntia, kunnes liha on täysin mureaa.", "Nosta liha pois liemestä, revi se kahdella haarukalla säikeiksi ja poista ylimääräinen rasva.", "Kuori rasva liemen pinnalta ja sekoita revitty liha takaisin kastikkeeseen.", "Levitä liha lämpimälle pitaleivälle, lisää haluamasi lisukkeet, kääri rullaksi ja paahda vielä hetki pannulla."]},
  {"id": "aussialainen-pihviburger", "name": "Australialainen pihviburger punajuurella", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/44bzep1761848278.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vähärasvainen naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Keitetty punajuuri", "amount": 100, "unit": "g", "chip": "Punajuuri"}, {"name": "Naanleipä", "amount": 2, "unit": "kpl", "chip": "Naanleipä"}, {"name": "Rucola", "amount": 50, "unit": "g", "chip": "Rucola"}, {"name": "Smetana-ruohosipulidippi", "amount": 4, "unit": "rkl", "chip": "Smetana"}], "steps": ["Mausta jauheliha suolalla ja mustapippurilla, sekoita kevyesti kostein käsin ja muotoile neljä pihviä.", "Viipaloi keitetty punajuuri ja halkaise naanleivät.", "Paahda naanleivät grillipannulla molemmin puolin kevyesti ja paista pihvit 2–3 minuuttia puolelta.", "Aseta puolikas naanleipä lautaselle, lado päälle rucolaa, pihvi ja punajuuriviipaleita.", "Lisää lusikallinen smetanadippiä ja mausta vielä suolalla ja mustapippurilla ennen tarjoilua."]},
  {"id": "naudanrintapaisti-patauunissa", "name": "Uunihaudutettu naudanrintapaisti juureksilla", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ursuup1487348423.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanrintaa", "amount": 2000, "unit": "g", "chip": "Naudanliha"}, {"name": "Suola", "amount": 1, "unit": "annos", "chip": null}, {"name": "Sipuli", "amount": 3, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 5, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Timjami", "amount": 1, "unit": "oksa", "chip": null}, {"name": "Rosmariini", "amount": 1, "unit": "oksa", "chip": null}, {"name": "Laakerinlehti", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Naudanliemi", "amount": 4.8, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Sinappi", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Peruna", "amount": 4, "unit": "kpl", "chip": "Peruna"}], "steps": ["Leikkaa lihan rasvapinta ristikkokuvioon, suolaa liha ja anna sen levätä huoneenlämmössä puoli tuntia.", "Ruskista liha rasvapuoli alaspäin paksupohjaisessa padassa, kunnes pinta on kauniin ruskea, käännä ja ruskista toinenkin puoli.", "Nosta liha sivuun ja kuullota pilkotut sipulit padassa, lisää valkosipuli hetkeksi joukkoon.", "Sido tuoreet yrtit nipuksi, palauta liha pataan yrttien ja naudanliemen kanssa, kuumenna kiehuvaksi ja siirrä 150-asteiseen uuniin noin kolmeksi tunniksi, käännellen lihaa tunnin välein.", "Lisää porkkanat ja jatka kypsennystä tunnin verran, kunnes liha on mureaa ja porkkanat kypsiä.", "Nosta liha leikkuulaudalle levähtämään foliopeitteen alle, mausta jäljelle jäänyt liemi tarvittaessa sinapilla, ja leikkaa liha syitä vastaan; tarjoa perunoiden ja kastikkeen kanssa."]},
  {"id": "lok-lak-naudanpihvi", "name": "Kambodžalainen Lok Lak -naudanpihvi", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/t2b8bn1779737789.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanfilee", "amount": 1000, "unit": "g", "chip": "Naudanliha"}, {"name": "Valkosipuli", "amount": 5, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Ruokaöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Palmusokeri", "amount": 1.5, "unit": "rkl", "chip": "Palmusokeri"}, {"name": "Merisuola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkoviini", "amount": 2, "unit": "rkl", "chip": "Valkoviini"}, {"name": "Osterikastike", "amount": 2, "unit": "rkl", "chip": "Osterikastike"}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Seesamiöljy", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Salaatti", "amount": 500, "unit": "g", "chip": "Salaatti"}, {"name": "Tomaatti", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Sipuli", "amount": 200, "unit": "g", "chip": "Sipuli"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Merisuola", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Kampotin pippuri", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Limemehu", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Paista munat aurinkomunina ja pese salaatti; viipaloi sipuli ja tomaatit ohuiksi.", "Leikkaa naudanfilee 2–3 cm kuutioiksi ja marinoi merisuolalla, palmusokerilla, valkoviinillä, osterikastikkeella, soijakastikkeella ja seesamiöljyllä.", "Kuumenna paistinpannu kovalle lämmölle, ruskista hienonnettu valkosipuli öljyssä ja paista marinoitu liha 5–7 minuuttia haluamasi kypsyysasteen mukaan.", "Paahda Kampotin pippuri kuivalla pannulla tuoksuvaksi, jauha ja sekoita merisuolaan ja limemehuun kastikkeeksi.", "Kokoa annos lautaselle salaatista, tomaatista ja sipulista, l   {"id": "beef-mandi-riisipata", "name": "Beef mandi – arabialaistyylinen naudanliha-riisipata", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1nalo51765188375.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Basmatiriisi", "amount": 1000, "unit": "g", "chip": "Riisi"}, {"name": "Naudanliemi", "amount": 12, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 5, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Vihreä chili", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Tomaatti", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Suola", "amount": 2.5, "unit": "tl", "chip": null}, {"name": "Ruokaöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kurkumajauhe", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Kardemumma", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Neilikka", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Laakerinlehti", "amount": 0.5, "unit": "tl", "chip": null}], "steps": ["Pese naudanliha, leikkaa isoiksi paloiksi ja mausta suolalla ja kurkumalla.", "Kuumenna öljy padassa ja kuullota sipuli kullanruskeaksi, lisää valkosipuli, chili ja tomaatti, hauduta pehmeäksi.", "Lisää mausteet: kardemumma, neilikka ja laakerinlehti, sekä liha, ja sekoita kunnes liha on tasaisesti mausteisen.", "Kaada joukkoon naudanliemi, peitä ja hauduta 1,5–2 tuntia, kunnes liha on mureaa; nosta liha sivuun ja siivilöi liemi.", "Lisää liotettu basmatiriisi liemeen ja keitä kannen alla, kunnes riisi on kypsää ja kuohkeaa.", "Nosta liha riisin päälle, anna höyryn tehdä loppuosan muutaman minuutin ajan ja tarjoa salaatin tai chutneyn kera."]},

  {"id": "naudanliha-empanadat", "name": "Naudanliha-empanadat chimichurrilla", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/dxpc7j1764370714.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sianihra", "amount": 60, "unit": "g", "chip": "Sianihra"}, {"name": "Vesi", "amount": 340, "unit": "ml", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Vehnäjauho", "amount": 600, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Tomaatti", "amount": 3, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Punasipuli", "amount": 1, "unit": "iso", "chip": "Sipuli"}, {"name": "Kevätsipuli", "amount": 1, "unit": "nippu", "chip": "Kevätsipuli"}, {"name": "Ulkofilee", "amount": 750, "unit": "g", "chip": "Naudanliha"}, {"name": "Kuivattu oregano", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Chilihiutaleet", "amount": 1, "unit": "tl", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Suola", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Pippuri", "amount": 1, "unit": "maun mukaan", "chip": null}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Munavesi", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Chimichurrikastike", "amount": 1, "unit": "loraus", "chip": "Chimichurrikastike"}], "steps": ["Sekoita taikinaan sianihra, lämmin vesi ja suola, lisää jauhot ja oregano ja vaivaa tasaiseksi taikinaksi; anna levätä jääkaapissa vähintään puoli tuntia.", "Kuori ja kuutioi tomaatit, hienonna valkosipuli ja pilko sipulit.", "Kuullota sipulit ja valkosipuli oliiviöljyssä, ruskista sen jälkeen naudanliha kovalla lämmöllä, mausta yrteillä ja tomaateilla ja anna hetken hautua; keitä kovaksi keitetyt munat ja pilko ne jouk   {"id": "sunnuntain-paistiateria", "name": "Brittiläinen sunnuntain paistiateria", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ssrrrs1503664277.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanpaisti", "amount": 8, "unit": "viipale", "chip": "Naudanliha"}, {"name": "Parsakaali", "amount": 12, "unit": "kukinto", "chip": "Parsakaali"}, {"name": "Peruna", "amount": 600, "unit": "g", "chip": "Peruna"}, {"name": "Porkkana", "amount": 300, "unit": "g", "chip": "Porkkana"}, {"name": "Vehnäjauho", "amount": 140, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maito", "amount": 200, "unit": "ml", "chip": "Maito"}, {"name": "Auringonkukkaöljy", "amount": 1, "unit": "loraus", "chip": null}], "steps": ["Keitä parsakaali ja porkkana kiehuvassa suolavedessä mureiksi.", "Paista naudanpaisti ja perunat uunissa noin 45 minuuttia, käännellen perunoita jotta ne eivät pala.", "Kuumenna uuni 230 asteeseen ja öljyä yorkshire-vuoat, laita ne kuumaan uuniin lämpenemään.", "Vatkaa jauhoista ja munista tasainen taikina, lisää vähitellen maito ja mausta suolalla ja pippurilla.", "Kaada taikina kuumiin vuokiin ja paista 20–25 minuuttia, kunnes puddingit ovat kohonneet ja kullanruskeita.", "Annostele lautaselle paisti, perunat, vihannekset ja yorkshire-pudingit, ja tarjoa kastikkeen kera."]},

oa, anna kohota noin tunti, sivele munavedellä, ripottele seesaminsiemeniä ja paista 220-asteisessa uunissa 15–20 minuuttia kullanruskeiksi.", "Karamellisoi sipulisiivut voissa hitaasti, hiero pihvit valkosipulilla ja paista ne, pekoni ja munat.", "Halkaise sämpylät, levitä sinappia, kerrosta pihvi, kinkku, juusto, pekoni, tomaatti ja salaatti, ja lado paistettu muna päälle.", "Viimeistele runsaalla chimichurrikastikkeella ja karamellisoiduilla sipuleilla."]},

  {"id": "massaman-naudanlihacurry", "name": "Massaman-naudanlihacurry", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/tvttqv1504640475.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Maapähkinä", "amount": 85, "unit": "g", "chip": "Maapähkinä"}, {"name": "Kookoskerma", "amount": 400, "unit": "ml", "chip": "Kookoskerma"}, {"name": "Massaman-currytahna", "amount": 4, "unit": "rkl", "chip": "Massaman-currytahna"}, {"name": "Naudanliha", "amount": 600, "unit": "g", "chip": "Naudanliha"}, {"name": "Peruna", "amount": 450, "unit": "g", "chip": "Peruna"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Limenlehti", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Tamarinditahna", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Ruskea sokeri", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Kalakastike", "amount": 1, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Jasmiiniriisi", "amount": 1, "unit": "annos", "chip": "Riisi"}], "steps": ["Paahda maapähkinät uunissa kullanruskeiksi ja pilko karkeasti.", "Kuumenna hieman kookoskermaa padassa, lisää currytahna ja paista hetki, lisää naudanliha ja sekoita, kunnes se on tahnan peitossa.", "Lisää loppu kookoskerma, vettä, perunat, sipuli, limenlehdet, kanelitanko, tamarinditahna, ruskea sokeri, kalakastike ja suurin osa maapähkinöistä.", "Kuumenna kiehuvaksi, peitä ja hauduta uunissa noin 2 tuntia, kunnes liha on mureaa.", "Ripottele pinnalle viipaloitua chiliä ja jäljellä olevat maapähkinät.", "Tarjoa suoraan padasta jasmiiniriisin kanssa."]},
  {"id": "kreikkalainen-moussaka", "name": "Kreikkalainen moussaka", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ctg8jd1585563097.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Munakoiso", "amount": 1, "unit": "iso", "chip": "Munakoiso"}, {"name": "Kreikkalainen jogurtti", "amount": 150, "unit": "g", "chip": "Jogurtti"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Parmesaani", "amount": 3, "unit": "rkl", "chip": "Parmesaani"}, {"name": "Tomaatti", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Tomaattipyree", "amount": 4, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Peruna", "amount": 350, "unit": "g", "chip": "Peruna"}], "steps": ["Kuumenna grilli/uunin grillivastus ja ruskista naudan jauheliha syvässä uuninkestävässä pannussa noin 5 minuuttia.", "Pistele munakoisoa haarukalla ja pehmennä se mikrossa 3–5 minuuttia.", "Sekoita jogurtti, muna ja parmesaani keskenään ja mausta.", "Sekoita tomaatit, tomaattipyree ja perunaviipaleet lihan joukkoon ja kuumenna läpi, tasoita pinta.", "Viipaloi pehmennetty munakoiso ja lado lihaseoksen päälle, kaada jogurttiseos päälle ja tasoita.", "Grillaa kunnes pinta on kuplivan kullanruskea."]},

  {"id": "pihvi-vietnamilainen-nuudelisalaatti", "name": "Pihvi ja vietnamilainen nuudelisalaatti", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/st9shl1763755808.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Ruskea riisinuudeli", "amount": 85, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Rypsiöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Naudanfilee", "amount": 250, "unit": "g", "chip": "Naudanliha"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kiinankaali", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Kevätsipuli", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Limemehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Ruskea sokeri", "amount": 2, "unit": "tl", "chip": "Ruskea sokeri"}, {"name": "Riisiviinietikka", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Kalakastike", "amount": 0.5, "unit": "rkl", "chip": "Kalakastike"}], "steps": ["Sekoita kastikkeen ainekset (kalakastike, valkosipuli, riisiviinietikka, ruskea sokeri, limemehu) kulhossa ja lisää tilkka vettä, kunnes sokeri on liuennut.", "Keitä nuudelit pakkauksen ohjeen mukaan, jäähdytä kylmässä vedessä ja valuta.", "Sekoita nuudeleihin raastettu porkkana, kaali, kevätsipuli ja kastike.", "Kuumenna öljy pannussa ja paista pihvi haluamaasi kypsyysasteeseen, anna levätä 5 minuuttia ja viipaloi.", "Jaa salaatti ja pihviviipaleet kulhoihin ja ripottele päälle chiliä ja korianteria."]},
  {"id": "kroatialainen-gulassi", "name": "Perinteinen kroatialainen gulassi", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/n1hcou1628770088.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha", "amount": 500, "unit": "g", "chip": "Naudanliha"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Punaviini", "amount": 200, "unit": "ml", "chip": "Punaviini"}, {"name": "Vesi", "amount": 2, "unit": "l", "chip": null}, {"name": "Sinappi", "amount": 3, "unit": "rkl", "chip": "Sinappi"}, {"name": "Suola", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Pippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kasviöljy", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Puhdista ja kuutioi naudanliha, marinoi sinapissa ja mausteissa jääkaapissa noin tunnin ajan.", "Ruskista liha rasvassa padassa kauttaaltaan ja nosta sivuun.", "Silppua sipulit hienoksi ja raasta porkkanat, kuullota niitä miedolla lämmöllä 15 minuuttia kevyesti suolaten.", "Lisää liha, laakerinlehdet ja valkosipuli, kaada joukkoon viini ja anna kiehua 10–15 minuuttia alkoholin haihtumiseksi, lisää sitten osa vedestä.", "Peitä pata ja hauduta miedolla lämmöllä tunti, lisää loput vedestä ja jatka vielä 30–45 minuuttia.", "Anna hieman jäähtyä, viimeistele persiljalla ja tarjoa tuoreen leivän ja salaatin kanssa."]},
  {"id": "kasvis-shepherds-pie", "name": "Kasvisshepherd's pie linsseillä", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/w8umt11583268117.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 1350, "unit": "g", "chip": "Peruna"}, {"name": "Pienet perunat", "amount": 1350, "unit": "g", "chip": "Peruna"}, {"name": "Suolattu voi", "amount": 120, "unit": "g", "chip": "Voi"}, {"name": "Sieni", "amount": 28, "unit": "g", "chip": "Sieni"}, {"name": "Ruskeat linssit", "amount": 1.8, "unit": "dl", "chip": "Linssit"}, {"name": "Valkosipuli", "amount": 6, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sipuli", "amount": 7.2, "unit": "dl", "chip": "Sipuli"}, {"name": "Tomaattipyree", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Laakerinlehti", "amount": 1, "unit": "annos", "chip": null}, {"name": "Oliiviölji", "amount": 1, "unit": "annos", "chip": null}, {"name": "Kuiva valkoviini", "amount": 4.8, "unit": "dl", "chip": "Valkoviini"}, {"name": "Kasvisliemi", "amount": 19, "unit": "dl", "chip": "Kasvisliemi"}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Soijakastike", "amount": 2, "unit": "tl", "chip": "Soijakastike"}, {"name": "Rosmariini", "amount": 2, "unit": "oksa", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "annos", "chip": null}, {"name": "Salvia", "amount": 1, "unit": "annos", "chip": null}, {"name": "Ruohosipuli", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Paista kuorimattomat perunat 230-asteisessa uunissa noin 45 minuuttia pehmeiksi, kuori, soseuta ja sekoita joukkoon sula voi; mausta suolalla.", "Keitä linssit valkosipulinkynnen ja suolan kanssa vedessä kypsiksi, siivilöi ja poista valkosipuli.", "Kuullota sipuli oliiviöljyssä pehmeäksi, lisää loput valkosipulista ja tomaattipyree, paista hetki; lisää laakerinlehti ja valkoviini ja anna kiehua kasaan.", "Lisää kasvisliemi ja hauduta kastiketta kasaan noin 45 minuuttia, siivilöi, suurusta maissitärkkelys-vesiseoksella ja lisää soijakastike; mausta suolalla ja pippurilla.", "Paahda uunissa pieniä perunoita ja muut juurekset öljyssä, valkosipulissa ja rosmariinissa kypsiksi; sekoita joukkoon tuoreet sienet ja yrtit.", "Levitä linssit vuokaan, lado paahdetut kasvikset päälle, kaada kastike joukkoon ja peitä perunasoseella; paista 230 asteessa 30 minuuttia kullankeltaiseksi."]},

  {"id": "barbadoksen-pippuripata", "name": "Barbadoksen pippuripata", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/5tf8j11782236249.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sian koivet", "amount": 2, "unit": "kpl", "chip": "Sian koipi"}, {"name": "Häränhäntä", "amount": 900, "unit": "g", "chip": "Häränhäntä"}, {"name": "Lime- tai sitruunamehu", "amount": null, "unit": "loraus", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Scotch bonnet -chili", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Sipuli, iso", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Neilikka", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Sokeri", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Basilika", "amount": null, "unit": "ripaus", "chip": null}, {"name": "Timjami", "amount": null, "unit": "ripaus", "chip": null}, {"name": "Naudanliha", "amount": 900, "unit": "g", "chip": "Naudanliha"}], "steps": ["Huuhtele naudanliha ja anna sen maustua lime- tai sitruunamehussa hetken.", "Viipaloi valkosipuli ja sipuli hienoksi, silppua basilika ja timjami. Käsittele scotch bonnet -chilit varovasti käsineillä, sillä ne polttavat ihoa ja silmiä herkästi.", "Huuhtele liha ja leikkaa se kuutioiksi yhdessä sian koipien ja häränhännän kanssa.", "Keitä sian koivet kiehuvassa vedessä, kaada vesi pois ja lisää sitten naudanliha ja häränhäntä tuoreeseen kiehuvaan veteen.", "Lisää valkosipuli, sipuli, chilit, kanelitanko, neilikat, basilika, timjami sekä hyppysellinen suolaa ja sokeria.", "Hauduta kunnes liha on mureaa – pata maistuu vielä paremmalta lämmitettynä seuraavana päivänä, joten kuumenna se aina kunnolla ennen tarjoilua."]},
  {"id": "naudanliha-osteripiirakka", "name": "Naudanliha-osteripiirakka", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wrssvt1511556563.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha, kuutioitu", "amount": 900, "unit": "g", "chip": "Naudanliha"}, {"name": "Oliiviöljy", "amount": null, "unit": "paistamiseen", "chip": null}, {"name": "Salottisipuli", "amount": 3, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Pekoni", "amount": 125, "unit": "g", "chip": "Pekoni"}, {"name": "Timjami", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Stout-olut", "amount": 3.3, "unit": "dl", "chip": "Stout-olut"}, {"name": "Naudanliemi", "amount": 4, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Osterit", "amount": 8, "unit": "kpl", "chip": "Osteri"}, {"name": "Vehnäjauho", "amount": 400, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Voi", "amount": 250, "unit": "g", "chip": "Voi"}, {"name": "Kananmuna, voiteluun", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Mausta naudanliha suolalla ja mustapippurilla, ruskista se erissä kuumassa öljyssä ja siirrä syrjään.", "Kuullota samassa pannussa salottisipuli, valkosipuli ja pekoni, lisää sitten yrtit.", "Kaada stout-olut pannuun ja keitä hetki pohjaan tarttuneiden makujen irrottamiseksi. Yhdistä liha, sipuliseos ja liemi uunivuoassa, ja hauduta uunissa 180 asteessa noin 1,5–2 tuntia kunnes liha on mureaa.", "Sakeuta kastike maissitärkkelystahnalla, mausta ja anna jäähtyä.", "Tee murotaikina jauhoista, suolasta, voista ja vedestä. Vuoraa piirakkavuoka osalla taikinaa, lisää täyte ja osterit, ja peitä lopulla tai
