  {"id": "beef-bourguignon", "name": "Beef bourguignon selleripyreellä", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vtqxtu1511784197.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Paistorasva", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Naudan potka", "amount": 600, "unit": "g", "chip": "Naudanliha"}, {"name": "Pekoni", "amount": 100, "unit": "g", "chip": "Pekoni"}, {"name": "Salottisipuli", "amount": 350, "unit": "g", "chip": "Salottisipuli"}, {"name": "Herkkusieni", "amount": 250, "unit": "g", "chip": "Sieni"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Yrttikimppu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Punaviini", "amount": 7.5, "unit": "dl", "chip": "Punaviini"}, {"name": "Sellerijuuri", "amount": 600, "unit": "g", "chip": "Sellerijuuri"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Tuore timjami", "amount": null, "unit": "oksia", "chip": null}, {"name": "Tuore rosmariini", "amount": null, "unit": "oksia", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Kardemumma", "amount": 4, "unit": "kpl", "chip": null}], "steps": ["Ruskista maustettu naudanliha kuumassa rasvassa erissä ja siirrä sivuun.", "Ruskista samassa padassa pekoni, salottisipuli, sienet, valkosipuli ja yrttikimppu, lisää sitten tomaattipyree ja sekoita.", "Lisää liha takaisin, kaada joukkoon punaviini ja vähän vettä, keitä kiehuvaksi ja kaavi pohjan rasvat irti.", "Peitä pata foliolla ja hauduta uunissa 130 asteessa noin 3 tuntia kunnes liha on mureaa; sakeuta kastike tarvittaessa erikseen kiehauttamalla.", "Valmista selleripyree kuutioimalla sellerijuuri, paistamalla se öljyssä kullanruskeaksi ja hauduttamalla se pehmeäksi rosmariinin, timjamin, laakerinlehden ja kardemumman kanssa vedessä. Soseuta lopuksi.", "Annostele beef bourguignon lautasille selleripyreen kera."]},
  {"id": "naudanliha-pho", "name": "Naudanliha-pho", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/pbzcrx1763765096.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliemi", "amount": 10, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Sipuli, iso", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Inkivääri", "amount": null, "unit": "iso pala", "chip": null}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Tähtianis", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Korianterinsiemenet", "amount": 1, "unit": "tl", "chip": null}, {"name": "Neilikka", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Ulkofilepihvi", "amount": 225, "unit": "g", "chip": "Naudanliha"}, {"name": "Palmusokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kalakastike", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Soijakastike", "amount": 1.5, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Riisinuudelit", "amount": 200, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Kevätsipuli", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Basilika", "amount": null, "unit": "kourallinen", "chip": null}, {"name": "Korianteri", "amount": null, "unit": "kourallinen", "chip": null}, {"name": "Lime", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Kaada naudanliemi ja vesi kattilaan. Hiillä sipuli ja inkivääri kuumalla pannulla tai grillissä kunnes ne saavat väriä, ja lisää liemeen.", "Paahda mausteet (kanelitanko, tähtianis, korianterinsiemenet, neilikka) pannussa tuoksuviksi ja lisää ne liemeen. Keitä kiehuvaksi, hauduta sitten kannessa noin 30 minuuttia ja siivilöi.", "Pakasta pihvi hetki, jotta se on helpompi viipaloida hyvin ohuiksi siivuiksi.", "Mausta liemi palmusokerilla, kalakastikkeella ja soijakastikkeella maun mukaan.", "Keitä nuudelit ohjeen mukaan, jaa kulhoihin ja lado päälle raa'at pihvisiivut. Kaada kiehuva liemi kulhoihin, jolloin liha kypsyy kuumuudesta.", "Viimeistele kevätsipulilla, chilillä ja yrteillä, ja tarjoile limelohkon kanssa."]},
  {"id": "beef-stroganoff", "name": "Beef stroganoff", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/svprys1511176755.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Sieni", "amount": 250, "unit": "g", "chip": "Sieni"}, {"name": "Naudanfile", "amount": 500, "unit": "g", "chip": "Naudanliha"}, {"name": "Vehnäjauho", "amount": 1, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Smetana", "amount": 150, "unit": "g", "chip": "Smetana"}, {"name": "Sinappi", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Naudanliemi", "amount": 1, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Persilja", "amount": null, "unit": "topping", "chip": null}], "steps": ["Kuullota viipaloitu sipuli öljyssä miedolla lämmöllä noin 15 minuuttia kunnes se on pehmeää, lisää sitten valkosipuli.", "Lisää voi ja sienet, ja paista noin 5 minuuttia kunnes sienet ovat pehmenneet. Mausta ja nosta hetkeksi sivuun.", "Pyörittele suikaloitu naudanliha suolatussa ja pippuroidussa jauhossa, ja paista se kuumassa pannussa reilun ruskeaksi.", "Lisää sipulit ja sienet takaisin pannuun.", "Vatkaa keskenään smetana, sinappi ja naudanliemi, ja kaada seos pannuun. Kypsennä miedolla lämmöllä noin 5 minuuttia.", "Ripottele pinnalle persiljaa ja tarjoile pastan tai riisin kanssa."]},
  {"id": "bigos", "name": "Bigos – puolalainen metsästäjän muhennos", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/fl4brj1764361323.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Valkokaali, viipaloitu", "amount": 1, "unit": "kpl", "chip": "Kaali"}, {"name": "Naudanliemi", "amount": 2.5, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Kuivatut sienet, liotettuna", "amount": 100, "unit": "g", "chip": "Sieni"}, {"name": "Sianihra", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Saksalainen makkara", "amount": 400, "unit": "g", "chip": "Makkara"}, {"name": "Pekoni", "amount": 250, "unit": "g", "chip": "Pekoni"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Naudanliha", "amount": 750, "unit": "g", "chip": "Naudanliha"}, {"name": "Kuivatut luumut", "amount": 200, "unit": "g", "chip": "Kuivatut luumut"}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Neilikka", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Kokonaiset pippurit", "amount": 12, "unit": "kpl", "chip": null}, {"name": "Katajanmarjat", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Maustepippuri", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Punaviini", "amount": 0.9, "unit": "dl", "chip": "Punaviini"}, {"name": "Tomaattipyree", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}], "steps": ["Laita silputtu kaali pataan liemen kanssa ja hauduta noin 50 minuuttia kunnes se on pehmeää.", "Leikkaa liotetut sienet suikaleiksi ja säästä liotusvesi. Paista sianihrassa makkarat ja pekoni, nosta sivuun, ja kuullota sitten sipuli samassa rasvassa.", "Lisää sienet liotusvetineen, paistetut lihat, sipuli ja luumut, ja anna hautua kannen alla noin 20 minuuttia.", "Lisää mausteet, punaviini ja tomaattipyree, kuumenna kiehuvaksi ja hauduta sitten kannen alla noin tunti.", "Mausta suolalla ja anna jäähtyä – bigos maistuu parhaalta seuraavana tai sitä seuraavana päivänä.", "Kuumenna uudelleen kiehuvaksi ennen tarjoilua."]},
  {"id": "bistek", "name": "Bistek – filippiiniläinen sipulipihvi", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/4pqimk1683207418.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha, ohuiksi viipaloitu", "amount": 450, "unit": "g", "chip": "Naudanliha"}, {"name": "Soijakastike", "amount": 5, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Sitruuna", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Valkosipuli", "amount": 3, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Sipuli", "amount": 3, "unit": "kpl", "chip": "Sipuli"}, {"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Vesi", "amount": 2.4, "unit": "dl", "chip": null}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}], "steps": ["Marinoi naudanliha soijakastikkeessa, sitruunamehussa ja mustapippurissa vähintään tunti, mieluiten yön yli.", "Paista puolet sipuleista öljyssä pehmeiksi ja nosta sivuun.", "Valuta liha marinadista ja säästä neste. Paista liha samassa pannussa nopeasti molemmin puolin, ja nosta sivuun.", "Kuullota samassa pannussa valkosipuli ja loput sipulista.", "Kaada joukkoon säästetty marinadi ja vesi, keitä kiehuvaksi. Lisää liha takaisin, peitä ja hauduta kunnes liha on mureaa.", "Mausta suolalla ja pippurilla, ja viimeistele paistetuilla sipuleilla."]},
  {"id": "bitterballen", "name": "Bitterballen – hollantilaiset lihapyörykät", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lhqev81565090111.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 100, "unit": "g", "chip": "Voi"}, {"name": "Vehnäjauho", "amount": 150, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Naudanliemi", "amount": 7, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Sipuli", "amount": 30, "unit": "g", "chip": "Sipuli"}, {"name": "Persilja", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Naudanliha, keitetty ja revitty", "amount": 400, "unit": "g", "chip": "Naudanliha"}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Muskottipähkinä", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Vehnäjauho, paneeraukseen", "amount": 50, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Korppujauho", "amount": 50, "unit": "g", "chip": "Korppujauho"}], "steps": ["Sulata voi kattilassa, lisää jauhot vähitellen ja sekoita paksuksi taikinaksi.", "Kaada joukkoon liemi vähitellen koko ajan sekoittaen, lisää sipuli, persilja ja revitty liha, ja hauduta kunnes seos on paksua kastiketta.", "Kaada massa matalaan astiaan, peitä ja jäähdytä useita tunteja kunnes se on jähmettynyt.", "Pyörittele taikinasta pieniä palloja, pyöräytä ensin jauhoissa, sitten kananmunassa ja lopuksi korppujauhoissa.", "Jäähdytä pallot vielä hetki ja kuumenna paistoöljy noin 190 asteeseen.", "Paista bitterballenit kullanruskeiksi ja tarjoile sinapin kanssa."]},
  {"id": "feijoada", "name": "Feijoada – brasilialainen papupata", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xrxz7h1782592711.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Mustat pavut", "amount": 250, "unit": "g", "chip": "Pavut"}, {"name": "Pekoni", "amount": 100, "unit": "g", "chip": "Pekoni"}, {"name": "Porsaan kylkiluu", "amount": 500, "unit": "g", "chip": "Porsaan kylkiluu"}, {"name": "Chorizo", "amount": 3, "unit": "kpl", "chip": "Chorizo"}, {"name": "Possun lapa", "amount": 500, "unit": "g", "chip": "Sianliha"}, {"name": "Sipuli", "amount": 3, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Chilihiutaleet", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Öljy", "amount": null, "unit": "loraus", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}], "steps": ["Paista pekoni rapeaksi isossa kannellisessa padassa, nosta sivuun ja säästä rasva pataan.", "Ruskista erissä kylkiliha, makkarat ja possun lapa, mausta suolalla ja pippurilla.", "Nosta lihat sivuun ja kuullota sipuli, valkosipuli ja chili samassa padassa öljyn kera pehmeiksi.", "Lisää lihat, laakerinlehdet ja valutetut pavut. Peitä vedellä ja keitä kiehuvaksi.", "Alenna lämpöä ja hauduta kannen alla noin 2 tuntia kunnes pavut ovat pehmeitä ja liha mureaa.", "Tarjoile riisin kera ja ripottele pinnalle persiljaa tai korianteria."]},
  {"id": "corned-beef-kaali", "name": "Suolattu naudanliha ja kaali", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xb97a81583266727.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Suolattu naudanrinta", "amount": 1.35, "unit": "kg", "chip": "Suolattu naudanliha"}, {"name": "Pieni peruna", "amount": 10, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 5, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kaali", "amount": 1, "unit": "pää", "chip": "Kaali"}], "steps": ["Aseta suolattu naudanliha isoon pataan ja peitä vedellä. Lisää mukana tullut mausteseos.", "Kuumenna kiehuvaksi, alenna lämpöä ja hauduta noin 50 minuuttia per puolikilo, kunnes liha on mureaa.", "Lisää kokonaiset perunat ja kuoritut, paloitellut porkkanat, keitä lähes kypsiksi.", "Lisää lohkottu kaali ja jatka keittämistä vielä 15 minuuttia.", "Nosta liha padasta ja anna sen levätä 15 minuuttia ennen viipalointia.", "Nosta vihannekset kulhoon, kaada halutessasi hieman keitinlientä päälle, ja viipaloi liha syitä vastaan."]},
  {"id": "corned-beef-hash", "name": "Suolatun naudanlihan pannupaisti", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vz94r81760534692.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Suolaton voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Suolattu naudanliha, paloiteltu", "amount": 7, "unit": "dl", "chip": "Suolattu naudanliha"}, {"name": "Peruna, kuutioitu", "amount": 3, "unit": "kpl", "chip": "Peruna"}, {"name": "Suola", "amount": null, "unit": "ripaus", "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": "ripaus", "chip": null}, {"name": "Persilja", "amount": null, "unit": "silputtuna", "chip": null}], "steps": ["Kuumenna voi isossa, mieluiten valurauta-, pannussa keskilämmöllä. Lisää sipuli ja paista muutama minuutti kunnes se on läpikuultavaa.", "Sekoita joukkoon paloiteltu suolattu naudanliha ja perunakuutiot, levitä tasaisesti pannuun ja painele lastalla.", "Anna seoksen ruskistua koskematta siihen; kun kuulet sen sihisevän, se on hyvä merkki.", "Käännä osissa lastalla kun pohja on ruskistunut, ja painele taas kiinni pannuun. Lisää tarvittaessa hieman lisää voita.", "Jatka kunnes perunat ja liha ovat kauttaaltaan kauniin ruskeita.", "Ota pannu pois liedeltä, sekoita joukkoon silputtu persilja, mausta reilulla mustapippurilla ja suolalla maun mukaan."]},
  {"id": "irlantilainen-lammaspata", "name": "Irlantilainen lammaspata", "category": "Liha", "price": 3, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sxxpst1468569714.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vehnänjyvät, liotettuna", "amount": 300, "unit": "g", "chip": "Vehnänjyvät"}, {"name": "Lampaan kyljykset", "amount": 2, "unit": "kg", "chip": "Lampaanliha"}, {"name": "Oliiviöljy", "amount": 1.2, "unit": "dl", "chip": null}, {"name": "Salottisipuli", "amount": 24, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Porkkana, iso", "amount": 4, "unit": "kpl", "chip": "Porkkana"}, {"name": "Nauris", "amount": 2, "unit": "kpl", "chip": "Nauris"}, {"name": "Sellerijuuri", "amount": 1, "unit": "kpl", "chip": "Sellerijuuri"}, {"name": "Charlotte-peruna", "amount": 350, "unit": "g", "chip": "Peruna"}, {"name": "Valkoviini", "amount": 1.5, "unit": "dl", "chip": "Valkoviini"}, {"name": "Kidesokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Tuore timjami", "amount": 4, "unit": "oksaa", "chip": null}, {"name": "Oregano", "amount": 4, "unit": "oksaa", "chip": null}, {"name": "Kanaliemi", "amount": 4.5, "unit": "dl", "chip": "Kanaliemi"}], "steps": ["Kuumenna uuni 180 asteeseen. Keitä liotettu vehnä runsaassa vedessä kiehuvaksi ja hauduta noin tunti kunnes se on kypsää; valuta ja jätä odottamaan.", "Mausta lampaanliha suolalla ja pippurilla. Ruskista se erissä kuumassa öljyssä joka puolelta, älä ahda pannua liian täyteen.", "Ruskista samassa padassa salottisipulit ja muut juurekset erissä kullanruskeiksi, lisäten öljyä tarpeen mukaan.", "Lisää valkoviini, sokeri, yrtit sekä suolaa ja pippuria, keitä kovalla lämmöllä muutama minuutti.", "Lisää lammas, juurekset ja keitetty vehnä takaisin pataan yhdessä kanaliemen kanssa. Kuumenna kiehuvaksi ja siirrä pata uuniin puoleksitoista tunniksi.", "Jos lientä on liikaa, keitä kantta ilman vielä hetki kunnes kastike on sopivan paksua."]},
  {"id": "jiggs-dinner", "name": "Jiggs Dinner – kanadalainen suolalihapata", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/z1tfnw1764443171.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Suolattu naudanliha", "amount": 900, "unit": "g", "chip": "Suolattu naudanliha"}, {"name": "Keltainen halkaistu herne", "amount": 2.4, "unit": "dl", "chip": "Keltainen halkaistu herne"}, {"name": "Kaali", "amount": 1, "unit": "pää", "chip": "Kaali"}, {"name": "Porkkana", "amount": 6, "unit": "kpl", "chip": "Porkkana"}, {"name": "Nauris, iso", "amount": 1, "unit": "kpl", "chip": "Nauris"}, {"name": "Peruna", "amount": 8, "unit": "kpl", "chip": "Peruna"}, {"name": "Voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Mustapippuri", "amount": null, "unit": "maun mukaan", "chip": null}], "steps": ["Liota suolaliha lohkottuna vedessä yön yli, samoin halkaistut herneet omassa vedessään.", "Valuta liha ja laita se isoon pataan runsaan veden kanssa. Kääri herneet kangaspussiin tai harsokankaaseen ja upota se pataan.", "Keitä kiehuvaksi, alenna lämpöä ja hauduta noin 2 tuntia.", "Nosta hernepussi pois, soseuta herneet ja mausta ne voilla ja pippurilla.", "Lisää pataan kaali ja keitä 20 minuuttia, lisää sitten nauris, porkkanat ja perunat ja keitä kunnes juurekset ovat pehmeitä.", "Nosta liha ja juurekset tarjoiluvadille, ja käytä keitinlientä kastikkeen tai liemen pohjana."]},
  {"id": "lakra-me-mish", "name": "Albanialainen kaali-lihapata", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/mobh1l1779648766.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudanliha, kuutioitu", "amount": 500, "unit": "g", "chip": "Naudanliha"}, {"name": "Kaali, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Kaali"}, {"name": "Paprikajauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Tomaattipyree", "amount": 3, "unit": "tl", "chip": "Tomaattipyree"}, {"name": "Paprika, kuutioitu", "amount": 2, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Sipuli, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Chilihiutaleet", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Oliiviöljy", "amount": null, "unit": "loraus", "chip": null}, {"name": "Kiehuva vesi", "amount": 1, "unit": "l", "chip": null}], "steps": ["Kuumenna öljy padassa, lisää sipuli, naudanlihakuutiot ja paprika, ja paista noin 5 minuuttia välillä sekoittaen kunnes liha on ruskistunut.", "Lisää paprikajauhe, tomaattipyree ja chilihiutaleet, mausta suolalla ja pippurilla, ja paista vielä 2 minuuttia.", "Lisää kaali ja sekoita, paista 3–5 minuuttia sekoitellen kunnes suurin osa rasvasta on haihtunut.", "Kaada joukkoon kiehuva vesi niin, että se peittää kaalin reilusti, laita kansi päälle ja kuumenna kiehuvaksi.", "Hauduta miedolla lämmöllä noin 2,5 tuntia, kunnes kaali on pehmeää ja liha mureaa.", "Anna padan jäähtyä hetki ennen tarjoilua syvissä lautasissa."]},
  {"id": "sitruunaruoho-naudanpata", "name": "Sitruunaruoho-naudanpata nuudeleilla", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ntafxw1763586291.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Inkivääri", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Sitruunaruoho", "amount": 3, "unit": "vartta", "chip": "Sitruunaruoho"}, {"name": "Korianterinlehdet", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Punainen chili", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Kasviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Naudanliha, kuutioitu", "amount": 250, "unit": "g", "chip": "Naudanliha"}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Viiden mausteen jauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Ruskea sokeri", "amount": 1, "unit": "tl", "chip": "Ruskea sokeri"}, {"name": "Naudanliemi", "amount": 4, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Riisinuudelit", "amount": 100, "unit": "g", "chip": "Riisinuudelit"}, {"name": "Lime", "amount": null, "unit": "tarjoiluun", "chip": null}], "steps": ["Soseuta tehosekoittimessa inkivääri, valkosipuli, sitruunaruoho, korianteri ja yksi chili.", "Kuumenna öljy padassa ja paista soseutettu tahna noin 5 minuuttia miedolla lämmöllä.", "Lisää naudanliha, soijakastike, viiden mausteen jauhe, sokeri ja liemi. Kuumenna kiehuvaksi, alenna lämpöä ja hauduta noin 1 tunti 15 minuuttia.", "Ota kansi pois ja jatka kypsentämistä vielä 15 minuuttia, kunnes liha on mureaa.", "Valmista nuudelit pakkauksen ohjeen mukaan, valuta ja jaa kulhoihin.", "Kaada pata nuudelien päälle, ripottele jäljellä olevaa chiliä ja korianterinlehtiä, ja tarjoile limelohkojen kanssa."]},
  {"id": "kanan-paistettu-riisi", "name": "Kanan paistettu riisi", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wuyd2h1765655837.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananreisi, kuutioitu", "amount": 450, "unit": "g", "chip": "Kana"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Rypsiöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 3, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sipuli", "amount": 1.6, "unit": "dl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Inkiväärijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Porkkana, iso", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Herne", "amount": 1.6, "unit": "dl", "chip": "Herne"}, {"name": "Jasmiiniriisi, kypsä", "amount": 9.6, "unit": "dl", "chip": "Riisi"}, {"name": "Kevätsipuli", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Viiden mausteen jauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 2.5, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Seesamiöljy", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Käytä mieluiten edellisenä päivänä keitettyä, jäähtynyttä riisiä – näin se ei muutu paistettaessa tahmeaksi. Kypsennä riisi tarvittaessa etukäteen ja anna sen kuivahtaa pellillä pari tuntia.", "Kuutioi kananreisi pieniksi paloiksi, mausta suolalla ja anna maustua hetki.", "Kuumenna wokki tai iso paistinpannu, paista munat nopeasti munakokkelin tapaan ja nosta lautaselle.", "Paista kanapalat samassa pannussa muutama minuutti kypsiksi, nosta sivuun.", "Paista sipuli, valkosipuli ja inkivääri tuoksuviksi, lisää porkkana ja herneet ja paista pari minuuttia.", "Lisää riisi, kevätsipuli ja viiden mausteen jauhe, sekoita hyvin. Lisää soijakastike ja seesamiöljy, sekoita joukkoon kana ja munat, ja kuumenna vielä pari minuuttia ennen tarjoilua."]},
  {"id": "bengali-kanacurry", "name": "Bengalilainen kanacurry perunoilla", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/9ya6o71780262651.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli, kuutioitu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Inkivääri-valkosipulitahna", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaatti, kuutioitu", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Cayennepippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Currypulveri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Garam masala", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kurkuma", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jeerajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kananrinta", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Punainen peruna, iso", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Korianteri", "amount": 1.2, "unit": "dl", "chip": null}], "steps": ["Kuumenna öljy pannussa ja kuullota sipuli läpikuultavaksi noin 5 minuuttia.", "Lisää inkivääri-valkosipulitahna ja jatka paistamista vielä 5 minuuttia.", "Sekoita joukkoon tomaatit ja hauduta kunnes ne pehmenevät ja muuttuvat soseiseksi, noin 5–10 minuuttia.", "Mausta cayennepippurilla, currylla, garam masalalla, kurkumalla ja jeeralla, ja paista mausteet tuoksuviksi.", "Lisää kana ja perunat, hauduta sekoittaen välillä kunnes perunat ovat pehmeitä ja kana kypsää, noin 20 minuuttia.", "Ripottele pinnalle korianteria ja anna hautua vielä hetki ennen tarjoilua."]},
  {"id": "pastel-de-choclo", "name": "Pastel de choclo – chileläinen maissipaistos", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/47abic1782854326.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Sipuli, kuutioitu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": "maun mukaan", "chip": null}, {"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Kana, kypsä ja revitty", "amount": 200, "unit": "g", "chip": "Kana"}, {"name": "Rusina", "amount": 2, "unit": "rkl", "chip": "Rusinat"}, {"name": "Vihreä oliivi", "amount": 2, "unit": "rkl", "chip": "Oliivit"}, {"name": "Maissi, säilyke", "amount": 3, "unit": "tölkkiä", "chip": "Maissi"}, {"name": "Basilika", "amount": 2, "unit": "tl", "chip": null}, {"name": "Voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Maito", "amount": 2.4, "unit": "dl", "chip": "Maito"}, {"name": "Sokeri", "amount": 2, "unit": "tl", "chip": "Sokeri"}, {"name": "Suola", "amount": null, "unit": "maun mukaan", "chip": null}], "steps": ["Keitä kananmunat kovaksi, jäähdytä, kuori ja paloittele karkeasti.", "Kuumenna öljy pannussa, kuullota sipuli, valkosipuli, suola, paprika ja pippuri.", "Lisää naudan jauheliha ja paista ruskeaksi. Sekoita joukkoon revitty kana, rusinat ja oliivit sekä kuoritut munat, ja pidä täyte lämpimänä.", "Soseuta maissi ja basilika tehosekoittimessa sileäksi, kuumenna kattilassa voin kanssa kunnes seos sakenee.", "Sekoita joukkoon maito, sokeri ja suola, ja hauduta kunnes seoksesta tulee paksua tahnaa.", "Levitä liha-kanatäyte uunivuokaan, peitä maissitahnalla, rip   {"id": "kananmaksapatee", "name": "Kananmaksapatee", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hob03q1780264260.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmaksa", "amount": 450, "unit": "g", "chip": "Kananmaksa"}, {"name": "Pekoni", "amount": 225, "unit": "g", "chip": "Pekoni"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Sipuli, iso", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Sinappijauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Suola", "amount": null, "unit": "maun mukaan", "chip": null}, {"name": "Mustapippuri", "amount": null, "unit": "maun mukaan", "chip": null}, {"name": "Maito", "amount": null, "unit": "loraus", "chip": null}, {"name": "Sherry", "amount": 1, "unit": "rkl", "chip": "Sherry"}], "steps": ["Puhdista kananmaksat kalvoista ja sapesta.", "Laita maksat uuninkestävään pataan yhdessä karkeasti pilkotun pekonin, valkosipulin, sipulin ja sinappijauheen kanssa.", "Mausta suolalla ja pippurilla ja peitä maidolla.", "Aseta kansi päälle ja kypsennä miedossa uunissa, noin 150 asteessa, noin 2 tuntia.", "Soseuta seos tehosekoittimella tasaiseksi, tarkista maustaminen ja lisää sherry.", "Kaada patee tarjoiluastiaan ja peitä pinta sulatetulla voilla; jäähdytä ennen tarjoilua."]},
  {"id": "panang-kanacurry", "name": "Panang-kanacurry", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0dhtwr1763371444.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kookosmaito", "amount": 4, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Panang-currytahna", "amount": 1.5, "unit": "rkl", "chip": "Currytahna"}, {"name": "Kananrinta", "amount": 200, "unit": "g", "chip": "Kana"}, {"name": "Vihreät pavut", "amount": 100, "unit": "g", "chip": "Vihreä papu"}, {"name": "Kalakastike", "amount": 2.5, "unit": "rkl", "chip": "Kalakastike"}, {"name": "Ruskea sokeri", "amount": 1.5, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Makrut-limenlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Basilikanlehdet", "amount": null, "unit": "kourallinen", "chip": null}, {"name": "Jasmiiniriisi, keitettynä", "amount": 400, "unit": "g", "chip": "Riisi"}, {"name": "Punainen chili", "amount": 6, "unit": "kpl", "chip": null}, {"name": "Kuivatut chilit", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Katkarapupasta", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkosipuli", "amount": 4, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Galangal", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sitruunaruoho", "amount": 1, "unit": "rkl", "chip": "Sitruunaruoho"}, {"name": "Limenkuori", "amount": null, "unit": "2 limestä", "chip": null}, {"name": "Muskottipähkinä", "amount": 1, "unit": "tl", "chip": null}, {"name": "Korianterijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jeerajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Maapähkinä", "amount": 2, "unit": "rkl", "chip": "Maapähkinä"}], "steps": ["Valmista currytahna: survo huhmareessa kuivatut ja tuoreet chilit, katkarapupasta, valkosipuli, galangal, sitruunaruoho, limenkuori, korianterijauhe, jeera, muskottipähkinä ja maapähkinät yhdessä suolan kanssa karkeaksi tahnaksi. Voit myös käyttää tehosekoitinta lisäten hieman kookosmaitoa.", "Kuumenna osa kookosmaidon paksusta kerroksesta kattilassa, lisää currytahnaa ja kuumenna tuoksuvaksi noin minuutin ajan.", "Lisää kana ja paista muutama minuutti kunnes se alkaa ruskistua, lisää sitten vihreät pavut.", "Mausta kalakastikkeella ja sokerilla, kaada joukkoon loput kookosmaidosta, lisää puolet limenlehdistä ja hauduta kunnes kana on kypsää.", "Sekoita joukkoon basilikanlehdet ja ota pannu pois liedeltä.", "Tarjoile höyrytetyn jasmiiniriisin kanssa, koristele viipaloidulla chilillä ja lopuilla limenlehdillä."]},
  {"id": "tandoori-kana", "name": "Tandoori-kana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qptpvt1487339892.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sitruuna", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Paprikajauhe", "amount": 4, "unit": "tl", "chip": null}, {"name": "Punasipuli, hienonnettu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kananreisi", "amount": 16, "unit": "kpl", "chip": "Kana"}, {"name": "Kasviöljy", "amount": null, "unit": "sivelyyn", "chip": null}, {"name": "Kreikkalainen jogurtti", "amount": 3, "unit": "dl", "chip": "Jogurtti"}, {"name": "Inkivääri", "amount": null, "unit": "iso pala", "chip": null}, {"name": "Valkosipuli", "amount": 4, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Garam masala", "amount": 0.75, "unit": "tl", "chip": null}, {"name": "Jeerajauhe", "amount": 0.75, "unit": "tl", "chip": null}, {"name": "Chilijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kurkuma", "amount": 0.25, "unit": "tl", "chip": null}], "steps": ["Sekoita sitruunamehu, paprikajauhe ja hienonnettu punasipuli isossa vuoassa. Viillä kananreisiin muutama viilto ja pyörittele ne mehuseoksessa, anna maustua 10 minuuttia.", "Sekoita marinadin ainekset (jogurtti, inkivääri, valkosipuli, garam masala, jeera, chilijauhe ja kurkuma) keskenään ja kaada kanan päälle.", "Sekoita hyvin, peitä ja anna marinoitua jääkaapissa vähintään tunti, mielellään yön yli.", "Kuumenna grilli. Nosta kananpalat ritilälle uunipellin päälle.", "Sivele kevyesti öljyllä ja grillaa noin 8 minuuttia per puoli, kunnes kana on läpikypsää ja kevyesti hiiltynyttä.", "Tarjoile heti kuumana."]},
  {"id": "teriyaki-kanavuoka", "name": "Teriyaki-kanavuoka", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Soijakastike", "amount": 1.8, "unit": "dl", "chip": "Soijakastike"}, {"name": "Vesi", "amount": 1.2, "unit": "dl", "chip": null}, {"name": "Ruskea sokeri", "amount": 0.6, "unit": "dl", "chip": "Ruskea sokeri"}, {"name": "Inkiväärijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkosipuli, hienonnettu", "amount": 0.5, "unit": "tl", "chip": "Valkosipuli"}, {"name": "Maissitärkkelys", "amount": 4, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Kananrinta", "amount": 2, "unit": "kpl", "chip": "Kana"}, {"name": "Pakastevihannessekoitus", "amount": 350, "unit": "g", "chip": "Pakastevihannessekoitus"}, {"name": "Ruskea riisi", "amount": 7, "unit": "dl", "chip": "Riisi"}], "steps": ["Kuumenna uuni 175 asteeseen ja voitele uunivuoka.", "Kuumenna kattilassa soijakastike, vesi, ruskea sokeri, inkivääri ja valkosipuli, ja keitä kiehuvaksi minuutin ajan.", "Sekoita maissitärkkelys pieneen määrään vettä ja lisää se kiehuvaan kastikkeeseen, keitä kunnes kastike sakenee.", "Aseta kananrinnat vuokaan ja kaada osa kastikkeesta päälle. Paista uunissa noin 35 minuuttia kunnes kana on kypsää, ja revi se sitten haarukoilla.", "Höyrytä tai keitä vihannekset pakkauksen ohjeen mukaan, ja sekoita ne riisin ja kanan joukkoon vuoassa yhdessä suurimman osan kastikkeesta kanssa.", "Paista vielä 15 minuuttia, anna vetäytyä hetki ja tarjoile loppu kastike valuttaen annosten päälle."]},
  {"id": "kana-parmentier", "name": "Kana-parmentier", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/uwvxpv1511557015.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 1.5, "unit": "kg", "chip": "Peruna"}, {"name": "Voi, perunasoseeseen", "amount": 30, "unit": "g", "chip": "Voi"}, {"name": "Kuohukerma", "amount": 5, "unit": "rkl", "chip": "Kerma"}, {"name": "Munankeltuainen", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Voi, täytteeseen", "amount": 30, "unit": "g", "chip": "Voi"}, {"name": "Salottisipuli", "amount": 7, "unit": "kpl", "chip": "Salottisipuli"}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 2, "unit": "vartta", "chip": "Selleri"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Valkoviini", "amount": 4, "unit": "rkl", "chip": "Valkoviini"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaattimurska"}, {"name": "Kanaliemi", "amount": 3.5, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Kana, kypsä ja revitty", "amount": 600, "unit": "g", "chip": "Kana"}, {"name": "Mustat oliivit", "amount": 16, "unit": "kpl", "chip": "Oliivit"}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Gruyère-juusto", "amount": 50, "unit": "g", "chip": "Juusto"}], "steps": ["Keitä perunat suolatussa vedessä pehmeiksi, valuta ja soseuta perunasoseeksi. Sekoita joukkoon voi, kerma ja munankeltuaiset, mausta.", "Sulata voi padassa, lisää salottisipuli, porkkana ja selleri, ja kuullota pehmeiksi. Lisää valkosipuli.", "Kaada joukkoon valkoviini ja anna kiehua hetki. Lisää tomaattipyree, tomaattimurska ja kanaliemi, ja hauduta 10–15 minuuttia kunnes seos sakenee.", "Sekoita joukkoon revitty kana, oliivit ja persilja, mausta suolalla ja pippurilla.", "Kaada täyte uunivuokaan ja levitä pinnalle perunasose. Raasta päälle gruyère-juusto.", "Paista 180 asteessa noin 30–35 minuuttia, kunnes vuoka on läpikuumaa ja peruna kullanruskeaa."]},
  {"id": "kana-shawarma", "name": "Kana-shawarma yrttijogurttikastikkeella", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/hcg6l91763596970.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananrinta", "amount": 1, "unit": "kg", "chip": "Kana"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Korianterijauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Jeerajauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kardemumma", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Cayennepippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Savupaprikajauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 2, "unit": "tl", "chip": null}, {"name": "Sitruunamehu", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kreikkalainen jogurtti", "amount": 2.4, "unit": "dl", "chip": "Jogurtti"}, {"name": "Valkosipuli, kastikkeeseen", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Jeerajauhe, kastikkeeseen", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sitruunamehu, kastikkeeseen", "amount": null, "unit": "loraus", "chip": null}], "steps": ["Leikkaa kana ohuiksi suikaleiksi ja siirrä ne pussiin.", "Lisää valkosipuli, korianteri, jeera, kardemumma, cayennepippuri, savupaprika, suola, sitruunamehu ja öljy. Sulje pussi ja sekoita hyvin, anna marinoitua jääkaapissa vähintään 10–12 tuntia.", "Paista pitaleivät kuumalla pannulla kevyesti molemmin puolin ja nosta sivuun.", "Paista marinoitu kana erissä kuumassa pannussa reilun ruskeaksi ja läpikypsäksi, noin 5–8 minuuttia per erä.", "Valmista kastike sekoittamalla jogurttiin valkosipuli, jeera ja sitruunamehu, ja mausta suolalla.", "Levitä pitaleivälle kastiketta, lisää salaatti, sipuli, tomaatti ja paistettu kana, ja viimeistele lisää kastikkeella."]},
  {"id": "savuiset-kanavartaat", "name": "Savuiset kanavartaat", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/3um6il1763794322.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananreisi", "amount": 6, "unit": "kpl", "chip": "Kana"}, {"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Fenkolinsiemenet", "amount": 1, "unit": "tl", "chip": null}, {"name": "Jeerajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Makea savupaprika", "amount": 1, "unit": "tl", "chip": null}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Punaviinietikka", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Liota 15 puuvarrasta vedessä 10 minuuttia, jos käytät puisia tikkuja.", "Leikkaa kana noin 3 cm paloiksi, sekoita kulhossa osa öljystä, mausteet, valkosipuli ja etikka. Sekoita kana joukkoon ja mausta.", "Anna marinoitua jääkaapissa halutessasi jopa vuorokauden.", "Pujota 2–3 palaa varrasta kohden.", "Sivele loppu öljy grillipannuun tai -levylle, kuumenna kunnolla ja paista vartaat noin 3–4 minuuttia per puoli, tarvittaessa erissä.", "Pidä valmiit vartaat lämpiminä matalassa uunissa ja tarjoile halutessasi savuisen aiolin kanssa."]},
  {"id": "belgialainen-waterzooi", "name": "Belgialainen kana-waterzooi", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/nmxec11782498644.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanankoipi", "amount": 1, "unit": "kpl", "chip": "Kana"}, {"name": "Kananrinta", "amount": 1, "unit": "kpl", "chip": "Kana"}, {"name": "Vesi", "amount": 7.2, "unit": "dl", "chip": null}, {"name": "Porkkana, pieni", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Purjo", "amount": 2, "unit": "kpl", "chip": "Purjo"}, {"name": "Selleri", "amount": 1, "unit": "kpl", "chip": "Selleri"}, {"name": "Peruna", "amount": 100, "unit": "g", "chip": "Peruna"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Rosmariini", "amount": 1, "unit": "oksa", "chip": null}, {"name": "Kerma", "amount": 3.6, "unit": "dl", "chip": "Kerma"}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Suolaton voi", "amount": 1, "unit": "rkl", "chip": "Voi"}, {"name": "Munankeltuainen", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Mustapippuri", "amount": null, "unit": "hyppysellinen", "chip": null}, {"name": "Suola", "amount": null, "unit": "hyppysellinen", "chip": null}], "steps": ["Laita kana, vesi ja valkosipulinkynsi kattilaan, kuumenna kiehuvaksi ja hauduta miedolla lämmöllä 10 minuuttia. Nosta kanapalat pois ja säästä liemi.", "Anna kanan jäähtyä, kuutioi rinta ja irrota koivesta liha, poista luut ja nahka. Suikaloi purjo, selleri ja porkkana ohuiksi.", "Sulata voi padassa rosmariinin ja laakerinlehtien kanssa, lisää vihannekset, mausta suolalla ja pippurilla ja paista noin 3 minuuttia.", "Lisää revitty ja kuutioitu kana, peitä ja hauduta 5 minuuttia. Lisää kerma ja osa säästetystä liemestä.", "Peitä ja hauduta noin 20 minuuttia kunnes perunat ovat pehmeitä. Vatkaa munankeltuainen pieneen määrään lämmintä kermaa erillisessä kupissa, ja lisää se takaisin pataan kastikkeen sakeuttamiseksi.", "Sekoita, mausta tarpeen mukaan, poista rosmariini ja laakerinlehdet, ja tarjoile kuumana kermakastikkeella valutettuna."]},
  {"id": "brown-stew-chicken", "name": "Jamaikalainen ruskea kanapata", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/sypxpx1515365095.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kokonainen kana, paloiteltuna", "amount": 1, "unit": "kpl", "chip": "Kana"}, {"name": "Tomaatti, pilkottu", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Sipuli, pilkottu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi, pilkottu", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Punainen paprika, pilkottu", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Porkkana, pilkottu", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Limetti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Timjami", "amount": 2, "unit": "tl", "chip": null}, {"name": "Maustepippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Maissitärkkelys", "amount": 2, "unit": "tl", "chip": "Maissitärkkelys"}, {"name": "Kookosmaito", "amount": 480, "unit": "ml", "chip": "Kookosmaito"}, {"name": "Ruokaöljy", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Hiero limetin mehua kanan pintaan ja anna vaikuttaa hetki, kaada ylimääräinen mehu pois.", "Sekoita kulhossa tomaatti, sipuli, valkosipuli, paprika, timjami, maustepippuri ja soijakastike, lisää kana joukkoon ja anna marinoitua vähintään tunti.", "Kuumenna öljy pannussa ja ruskista kanapalat erissä kuumassa öljyssä, nostele valmiit palat sivuun.", "Kaada ylimääräinen rasva pois, laita kana takaisin pannuun, kaada marinadi päälle ja lisää porkkana. Hauduta keskilämmöllä noin 10 minuuttia.", "Sekoita maissitärkkelys kookosmaitoon ja lisää pataan koko ajan sekoittaen. Laske lämpö miedolle ja hauduta vielä noin 20 minuuttia, kunnes kana on mureaa."]},
  {"id": "chicken-chorizo-rice-pot", "name": "Kana-chorizopata riisillä", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/fk80jp1763280767.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kana, paloiteltuna", "amount": 1, "unit": "kpl", "chip": "Kana"}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen paprika, pilkottu", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Valkosipulinkynsi, murskattu", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Chorizomakkara", "amount": 225, "unit": "g", "chip": "Chorizo"}, {"name": "Tomaattipyree", "amount": 1, "unit": "rkl", "chip": "Tomaatti"}, {"name": "Timjami, silputtu", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkoviini", "amount": 150, "unit": "ml", "chip": "Valkoviini"}, {"name": "Kanaliemi", "amount": 800, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Riisi", "amount": 400, "unit": "g", "chip": "Riisi"}, {"name": "Persilja, silputtu", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna öljy padassa ja ruskista kanapalat joka puolelta erissä, nosta ne sivuun.", "Laske lämpöä, lisää sipuli ja paprika ja kypsennä noin 10 minuuttia kunnes pehmenevät.", "Lisää valkosipuli ja chorizo, paista pari minuuttia kunnes chorizon rasva vapautuu. Lisää tomaattipyree ja kypsennä hetki.", "Palauta kana pataan, lisää timjami, valkoviini ja kanaliemi. Kuumenna kiehuvaksi, peitä kannella ja hauduta 30 minuuttia.", "Lisää riisi, sekoita joukkoon ja hauduta vielä noin 15 minuuttia kunnes riisi on kypsää ja neste imeytynyt. Anna vetäytyä 10 minuuttia, mausta ja ripottele persiljaa päälle."]},
  {"id": "chicken-alfredo-primavera", "name": "Kana-alfredo primavera", "category": "Pasta", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/syqypv1486981727.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 2, "unit": "rkl", "chip": "Voi"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Kanan rintafile", "amount": 5, "unit": "kpl", "chip": "Kana"}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kesäkurpitsa, kuutioitu", "amount": 1, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Parsakaali, paloiteltu", "amount": 1, "unit": "kpl", "chip": "Parsakaali"}, {"name": "Herkkusienet, viipaloidut", "amount": 225, "unit": "g", "chip": "Sieni"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Chilihiutaleet", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkoviini", "amount": 1.2, "unit": "dl", "chip": "Valkoviini"}, {"name": "Maito", "amount": 1.2, "unit": "dl", "chip": "Maito"}, {"name": "Kuohukerma", "amount": 1.2, "unit": "dl", "chip": "Kerma"}, {"name": "Parmesaanijuusto, raastettu", "amount": 100, "unit": "g", "chip": "Juusto"}, {"name": "Pastarusetit", "amount": 450, "unit": "g", "chip": "Pasta"}, {"name": "Suola ja pippuri", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Persilja, silputtu", "amount": 1, "unit": "rkl", "chip": null}], "steps": ["Kuumenna osa voista ja öljystä pannussa, mausta kanafileet suolalla ja pippurilla ja paista molemmin puolin läpikypsiksi. Nosta lepäämään.", "Keitä pasta suolatussa vedessä pakkauksen ohjeen mukaan al denteksi, säästä hieman keitinvettä ja valuta.", "Lisää samaan pannuun loput voista ja öljystä, paista kesäkurpitsa, parsakaali, sienet ja paprika chilihiutale   {"id": "chicken-basquaise", "name": "Kana Baskimaan tyyliin", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/wruvqv1511880994.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananpalat", "amount": 1.5, "unit": "kg", "chip": "Kana"}, {"name": "Voi", "amount": 25, "unit": "g", "chip": "Voi"}, {"name": "Oliiviöljy", "amount": 6, "unit": "rkl", "chip": null}, {"name": "Sipuli, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Iso punainen paprika", "amount": 3, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Chorizomakkara", "amount": 130, "unit": "g", "chip": "Chorizo"}, {"name": "Aurinkokuivatut tomaatit", "amount": 8, "unit": "kpl", "chip": "Aurinkokuivatut tomaatit"}, {"name": "Valkosipulinkynsi, viipaloitu", "amount": 6, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Basmatiriisi", "amount": 300, "unit": "g", "chip": "Riisi"}, {"name": "Tomaattipyree", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Paprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Laakerinlehti", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Timjami", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Kanaliemi", "amount": 350, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Kuiva valkoviini", "amount": 180, "unit": "ml", "chip": "Valkoviini"}, {"name": "Sitruuna", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Mustat oliivit", "amount": 100, "unit": "g", "chip": "Oliivit"}, {"name": "Suola ja pippuri", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Lämmitä uuni 180 asteeseen. Ruskista kananpalat voi-öljyseoksessa erissä, mausta suolalla ja pippurilla, ja nosta sivuun.", "Paista sipulia öljyssä noin 10 minuuttia pehmeäksi, lisää paprikat ja jatka vielä 5 minuuttia.", "Lisää chorizo, aurinkokuivatut tomaatit ja valkosipuli, paista pari minuuttia. Lisää riisi ja sekoita se rasvaan mukaan.", "Sekoita joukkoon tomaattipyree, paprikajauhe, laakerinlehdet ja timjami. Kaada liemi ja viini joukkoon, kuumenna kiehuvaksi ja laske lämpö miedolle.", "Painele riisi nesteen alle, nosta kananpalat päälle ja lisää sitruunalohkot sekä oliivit ympärille.", "Peitä ja kypsennä uunissa noin 50 minuuttia, kunnes riisi on kypsää ja kana läpikypsää."]},
  {"id": "french-onion-chicken", "name": "Ranskalainen sipulikana perunamuusilla", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/b5ft861583188991.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan rintafile", "amount": 2, "unit": "kpl", "chip": "Kana"}, {"name": "Porkkana", "amount": 350, "unit": "g", "chip": "Porkkana"}, {"name": "Peruna", "amount": 5, "unit": "kpl", "chip": "Peruna"}, {"name": "Sipuli, viipaloitu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Naudanliemi", "amount": 2.4, "unit": "dl", "chip": "Naudanliemi"}, {"name": "Mozzarellaraaste", "amount": 150, "unit": "g", "chip": "Juusto"}, {"name": "Smetana", "amount": 2, "unit": "rkl", "chip": "Smetana"}, {"name": "Voi", "amount": 3, "unit": "rkl", "chip": "Voi"}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Ruokaöljy", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Suola ja pippuri", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Lämmitä uuni 220 asteeseen. Pilko porkkanat viistoiksi paloiksi, kuutioi perunat ja viipaloi sipuli ohuesti.", "Levitä porkkanat pellille, valuta päälle öljyä, mausta suolalla ja pippurilla ja paahda noin 15–20 minuuttia kypsiksi.", "Keitä perunat suolatussa vedessä kypsiksi noin 12–15 minuuttia, valuta ja pidä lämpimänä.", "Paista sipuli öljyssä pehmeäksi ja kevyesti ruskeaksi, ripottele joukkoon sokeria, lisää naudanliemi ja hauduta kunnes seos on siirappista. Nosta hetkeksi sivuun.", "Mausta kanafileet suolalla ja pippurilla ja paista pannussa kypsiksi. Lisää loppuvaiheessa karamellisoitu sipuli ja juusto päälle, peitä kunnes juusto sulaa.", "Muusaa keitetyt perunat smetanan, voin, suolan ja pippurin kanssa. Tarjoile kana perunamuusin ja paahdettujen porkkanoiden kanssa."]},
  {"id": "general-tsos-chicken", "name": "Kenraali Tson kana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1529444113.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan rintafile", "amount": 700, "unit": "g", "chip": "Kana"}, {"name": "Vehnäjauho", "amount": 1.8, "unit": "dl", "chip": "Vehnäjauho"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Leivinjauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sipulisuola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkosipulijauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kanaliemi", "amount": 1.2, "unit": "dl", "chip": "Kanaliemi"}, {"name": "Duck-kastike", "amount": 0.6, "unit": "dl", "chip": "Duck-kastike"}, {"name": "Soijakastike", "amount": 3, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Hunaja", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Riisietikka", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Seesamiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Gochujang", "amount": 0.5, "unit": "rkl", "chip": "Gochujang"}, {"name": "Maissitärkkelys, sakeuttamiseen", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kevätsipuli, silputtu", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Inkivääri", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Sekoita kulhossa kanaliemi, soijakastike, duck-kastike, riisietikka, gochujang, valkosipuli, inkivääri ja kevätsipuli kastikkeeksi.", "Mausta kanapalat suolalla, kasta ne vatkattuun kananmunaan ja pyörittele maissitärkkelys-jauhoseoksessa niin että ne saavat rapean pinnan.", "Paista tai upporasvakeitä kanapalat kultaisen ruskeiksi ja kypsiksi, nosta talouspaperille valumaan.", "Kuumenna kastike padassa kiehuvaksi ja sakeuta tarvittaessa vedellä sekoitetulla maissitärkkelyksellä.", "Lisää paistettu kana kastikkeeseen, sekoita hyvin ja anna kiehahtaa vielä hetki ennen tarjoilua."]},
  {"id": "katsu-chicken-curry", "name": "Katsu-kanacurry", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vwrpps1503068729.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kanan rintafile", "amount": 4, "unit": "kpl", "chip": "Kana"}, {"name": "Vehnäjauho", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Kananmuna, vatkattu", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Korppujauho", "amount": 100, "unit": "g", "chip": "Korppujauho"}, {"name": "Paistoöljy", "amount": 230, "unit": "ml", "chip": null}, {"name": "Ruokaöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi, pilkottu", "amount": 5, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Porkkana, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Vehnäjauho kastikkeeseen", "amount": 2, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Curryjauhe", "amount": 4, "unit": "tl", "chip": null}, {"name": "Kanaliemi", "amount": 600, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Hunaja", "amount": 2, "unit": "tl", "chip": null}, {"name": "Soijakastike", "amount": 4, "unit": "tl", "chip": "Soijakastike"}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Garam masala", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Kuumenna öljyä kattilassa, kuullota sipuli ja valkosipuli, lisää porkkana ja hauduta miedolla lämmöllä 10–12 minuuttia.", "Ripottele joukkoon jauho ja curryjauhe, paista hetki. Lisää kanaliemi vähitellen sekoittaen, lisää hunaja, soijakastike ja laakerinlehti. Kuumenna kiehuvaksi.", "Anna kastikkeen hautua noin 20 minuuttia kunnes se sakenee mutta on vielä kaadettavaa. Sekoita joukkoon garam masala ja siivilöi kastike sileäksi.", "Mausta kanafileet suolalla ja pippurilla, panoroi ne ensin jauhossa, sitten kananmunassa ja lopuksi korppujauhoissa.", "Paista panoroidut fileet kuumassa öljyssä molemmin puolin kultaisen ruskeiksi ja kypsiksi, valuta talouspaperilla.", "Kaada curry-kastike kanan päälle ja tarjoile keitetyn riisin kanssa."]},
  {"id": "pollo-en-pepitoria", "name": "Pollo en pepitoria", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/li30ck1763281992.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sahrami", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Extra-neitsytoliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 6, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Manteli", "amount": 35, "unit": "g", "chip": "Manteli"}, {"name": "Vanha leipä", "amount": 30, "unit": "g", "chip": "Leipä"}, {"name": "Persilja, silputtu", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kananreisi", "amount": 8, "unit": "kpl", "chip": "Kana"}, {"name": "Sipuli, pilkottu", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana, pilkottu", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri, pilkottu", "amount": 1, "unit": "kpl", "chip": "Selleri"}, {"name": "Sherryviini", "amount": 250, "unit": "ml", "chip": "Sherry"}, {"name": "Kanaliemi", "amount": 350, "unit": "ml", "chip": "Kanaliemi"}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Neilikka", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Manteli, koristeeksi", "amount": 2, "unit": "rkl", "chip": "Manteli"}], "steps": ["Liota sahramia vähässä kuumassa vedessä. Paista valkosipuli öljyssä vaaleankullanruskeaksi, lisää mantelit ja leipä ja paista kunnes kultaisia. Soseuta seos monitoimikoneessa suolan, pippurin ja persiljan kanssa.", "Ruskista kananreidet samassa padassa joka puolelta, mausta ja nosta sivuun.", "Paista sipuli, porkkana ja selleri padan rasvassa kullanruskeiksi. Lisää sherry ja irrota pohjaan tarttuneet maut. Kaada joukkoon liemi ja sahramivesi, kuumenna kiehuvaksi ja laske lämpö miedolle.", "Lisää mausteet ja laakerinlehdet, palauta kana pataan ja hauduta kannen alla noin 40 minuuttia.", "Nosta kana hetkeksi sivuun. Erottele keitettyjen munien keltuaiset, sekoita ne osaan kastiketta ja lisää takaisin pataan sakeuttamaan. Lisää manteli-leipäseos ja anna hautua hetki.", "Palauta kana kastikkeeseen, kuumenna läpi ja tarjoile riisin kanssa. Koristele persiljalla, mantelilla ja pilkotulla munanvalkuaisella."]},
  {"id": "spanish-chicken-pie", "name": "Espanjalainen kanapiirakka", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/8ovxf41763253962.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 1, "unit": "kg", "chip": "Peruna"}, {"name": "Paprikajauhe", "amount": 3, "unit": "tl", "chip": null}, {"name": "Oliiviöljy", "amount": 2, "unit": "tl", "chip": null}, {"name": "Sipuli, viipaloitu", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi, hienonnettu", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Tomaattimurska", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Kana, kypsä", "amount": 300, "unit": "g", "chip": "Kana"}, {"name": "Paahdettu paprika", "amount": 140, "unit": "g", "chip": "Paprika (vihannes)"}, {"name": "Vihreät oliivit", "amount": 1, "unit": "kourallinen", "chip": "Oliivit"}], "steps": ["Lämmitä uuni 200 asteeseen. Keitä perunat kypsiksi noin 15–20 minuuttia, valuta ja muusaa mausteiden ja osan paprikajauheesta kanssa.", "Kuumenna öljy pannussa, paista sipuli ja valkosipuli pehmeiksi. Lisää loput paprikajauheesta ja tomaattimurska, anna kiehahtaa.", "Kaada seos uunivuokaan ja sekoita joukkoon kanapalat, paahdetut paprikat ja oliivit.", "Levitä perunamuusi täytteen päälle ja paista uunissa noin 15 minuuttia, kunnes muusi on kullanruskeaa ja täyte kuplii."]},

  {"id": "kung-pao-chicken", "name": "Kung Pao -kana", "category": "Kana", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1525872624.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sake tai riisiviini", "amount": 2, "unit": "rkl", "chip": "Sake"}, {"name": "Soijakastike", "amount": 2, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Seesamiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Maissitärkkelys", "amount": 2, "unit": "rkl", "chip": "Maissitärkkelys"}, {"name": "Vesi", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Kana, paloiteltuna", "amount": 500, "unit": "g", "chip": "Kana"}, {"name": "Chilijauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Riisietikka", "amount": 1, "unit": "tl", "chip": null}, {"name": "Ruskea sokeri", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}, {"name": "Kevätsipuli, pilkottu", "amount": 4, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Valkosipulinkynsi", "amount": 6, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Vesikastanja", "amount": 220, "unit": "g", "chip": "Vesikastanja"}, {"name": "Maapähkinä", "amount": 100, "unit": "g", "chip": "Maapähkinä"}], "steps": ["Sekoita sake tai riisiviini, soijakastike, seesamiöljy ja veteen liuotettu maissitärkkelys. Jaa seos kahtia.", "Sekoita puolet seoksesta kanapalojen kanssa lasikulhossa, peitä ja anna marinoitua jääkaapissa noin 30 minuuttia.", "Sekoita toiseen pannuun loppu marinadi, chilijauhe, etikka ja ruskea sokeri. Lisää joukkoon kevätsipulit, valkosipuli, vesikastanjat ja maapähkinät. Kuumenna miedolla lämmöllä kunnes tuoksuu.", "Nosta kana marinadista ja paista se erillisessä pannussa kypsäksi, kunnes lihasneste on kirkasta.", "Lisää paistettu kana tuoksuvaan kastikkeeseen ja anna hautua yhdessä kunnes kastike sakenee."]},
