  {"id": "mustapapupata", "name": "Costa Rican mustapapupata", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/81ahfr1784394567.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Mustat pavut", "amount": 400, "unit": "g", "chip": "Pavut"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Vihreä paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Selleri", "amount": 80, "unit": "g", "chip": "Selleri"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Jauhettu kumina", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Oregano", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 2, "unit": "tl", "chip": null}, {"name": "Vesi", "amount": 1.2, "unit": "l", "chip": null}], "steps": ["Laita kaikki ainekset painekattilaan tai Instant Pot -laitteeseen ja sekoita.", "Kypsennä korkealla paineella noin 35 minuuttia.", "Anna paineen laskea itsestään noin 20 minuuttia ennen kuin vapautat loppupaineen.", "Avaa kansi, tarkista maku ja tarjoa heti, tai anna jäähtyä ja säilytä jääkaapissa tai pakastimessa."]},
  {"id": "jamaikalainen-riisi-ja-pavut", "name": "Jamaikalainen kookosriisi ja pavut", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/pkyvrn1764878267.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Riisi", "amount": 370, "unit": "g", "chip": "Riisi"}, {"name": "Kookosmaito", "amount": 380, "unit": "g", "chip": "Kookosmaito"}, {"name": "Kidneypavut", "amount": 450, "unit": "g", "chip": "Pavut"}, {"name": "Vesi", "amount": 240, "unit": "ml", "chip": null}, {"name": "Suola", "amount": 2, "unit": "tl", "chip": null}, {"name": "Maustepippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kevätsipuli", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Timjami", "amount": 2, "unit": "oksaa", "chip": null}, {"name": "Scotch bonnet -chili", "amount": 1, "unit": "kpl", "chip": null}], "steps": ["Lisää riisi, kookosmaito, punaiset pavut, vesi, suola, maustepippuri ja mustapippuri isoon kattilaan ja sekoita.", "Aseta kevätsipulit, timjami ja scotch bonnet -chili seoksen päälle ja kuumenna kiehuvaksi.", "Käännä lämpö matalalle, peitä kannella ja anna kypsyä noin 18 minuuttia. Ota kattila pois liedeltä ja anna vielä levätä kannen alla 5 minuuttia.", "Poista kevätsipulit, chili ja timjami, kohenna riisi haarukalla ja tarjoa."]},
  {"id": "haudutettu-munakoiso-harissalla", "name": "Pannulla haudutettu munakoiso harissalla, kikherneillä ja kuminajogurtilla", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/yqwtvu1487426027.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Munakoiso", "amount": 6, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Harissatahna", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Kikherneet", "amount": 1, "unit": "tölkki", "chip": "Kikherne"}, {"name": "Kirsikkatomaatit", "amount": 300, "unit": "g", "chip": "Tomaatti"}, {"name": "Kreikkalainen jogurtti", "amount": 350, "unit": "g", "chip": "Jogurtti"}, {"name": "Jauhettu kumina", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuumenna öljy pannulla ja ruskista munakoisot joka puolelta keskilämmöllä, kunnes ne ovat täysin pehmeitä, noin 20 minuuttia. Mausta suolalla ja pippurilla.", "Sekoita harissa, kikherneet ja tomaatit keskenään ja lisää munakoisojen joukkoon. Kypsennä kunnes tomaatit alkavat hajota, noin 5 minuuttia. Lisää tarvittaessa vettä.", "Sekoita jogurttiin kumina, suola ja pippuri.", "Ripottele munakoisoseoksen päälle persiljaa, valuta hieman öljyä ja tarjoa kuminajogurtin kanssa."]},
  {"id": "kiinalainen-tomaatti-munawokki", "name": "Kiinalainen tomaatti-munawokki", "category": "Kasvis", "price": 1, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/rwvw8q1765660071.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Tomaatti", "amount": 450, "unit": "g", "chip": "Tomaatti"}, {"name": "Kasviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 5, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Seesamiöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kanaliemijauhe", "amount": 2, "unit": "tl", "chip": "Kanaliemi"}, {"name": "Sokeri", "amount": 2, "unit": "tl", "chip": "Sokeri"}, {"name": "Valkopippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kevätsipuli", "amount": 1, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Jasmiiniriisi", "amount": 2, "unit": "dl", "chip": "Riisi"}], "steps": ["Viipaloi tomaatit lohkoiksi. Riko munat kulhoon ja vatkaa kevyesti.", "Kuumenna kasviöljy pannulla ja paista munat hitaasti kokkareiksi liikutellen, kunnes ne ovat juuri hyytyneet mutta vielä hieman kosteat. Nosta munat syrjään.", "Lisää seesamiöljy pannulle, paista tomaatteja pari minuuttia kunnes ne pehmenevät. Lisää kanaliemijauhe, sokeri ja pippuri, sekoita kunnes liukenevat.", "Lisää munat takaisin pannulle ja sekoita varovasti läpikuumaksi. Mausta tarvittaessa suolalla, ripottele kevätsipulia päälle ja tarjoa höyrytetyn riisin kanssa."]},
  {"id": "espanjalainen-tortilla", "name": "Espanjalainen perunatortilla", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/quuxsx1511476154.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Voi", "amount": 25, "unit": "g", "chip": "Voi"}, {"name": "Peruna", "amount": 400, "unit": "g", "chip": "Peruna"}, {"name": "Valkosipuli", "amount": 6, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kananmuna", "amount": 8, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Patonki", "amount": 1, "unit": "kpl", "chip": "Leipä"}, {"name": "Tomaatti", "amount": 4, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Oliiviöljy tarjoiluun", "amount": 1, "unit": "loraus", "chip": null}], "steps": ["Kuullota siivutettu sipuli matalalla lämmöllä öljyssä ja voissa noin 15 minuuttia, kunnes se on pehmeää muttei ruskistunut.", "Lisää perunaviipaleet, peitä kannella ja paista noin 15-20 minuuttia välillä sekoittaen.", "Murskaa valkosipuli joukkoon ja kaada päälle vatkatut munat. Peitä kannella ja anna kypsyä hiljalleen, kunnes reunat ovat kypsät mutta keskiosa vielä hieman löysä.", "Käännä tortilla lautasen avulla ja liu'uta takaisin pannulle kypsymään toiselta puolelta. Tarjoa lämpimänä tai kylmänä persiljalla koristeltuna, patongin ja raastetun tomaatin kera."]},
  {"id": "porkkana-kaalisalaatti", "name": "Raikas porkkana-kaalisalaatti", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/dbazbg1763779999.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Porkkana", "amount": 4, "unit": "kpl", "chip": "Porkkana"}, {"name": "Punakaali", "amount": 0.5, "unit": "kpl", "chip": "Kaali"}, {"name": "Punasipuli", "amount": 2, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Minttu", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Paahdetut maapähkinät", "amount": 1, "unit": "kourallinen", "chip": "Maapähkinä"}, {"name": "Limemehu", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Maapähkinäöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Fariinisokeri", "amount": 1, "unit": "rkl", "chip": "Ruskea sokeri"}], "steps": ["Raasta tai suikaloi porkkana ja kaali, viipaloi sipuli ja laita kulhoon.", "Sekoita kastikkeeksi limemehu, öljy, chili ja fariinisokeri, kunnes sokeri liukenee.", "Kaada kastike vihannesten päälle ja sekoita hyvin.", "Lisää yrtit, sekoita vielä kerran ja ripottele lopuksi maapähkinät päälle."]},
  {"id": "ilmafritteeratut-patatas-bravas", "name": "Ilmafritteeratut patatas bravas", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/3m8yae1763257951.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 900, "unit": "g", "chip": "Peruna"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Paprikajauhe", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaattimurska", "amount": 225, "unit": "g", "chip": "Tomaatti"}, {"name": "Basilika", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Liota perunapalat kiehuvassa vedessä 30 minuuttia, valuta ja anna kuivahtaa. Kuumenna ilmafritteerauskone 200 asteeseen.", "Sekoita perunat öljyyn, suolaan ja pippuriin, ja kypsennä ilmafritteerauskorissa 20-30 minuuttia rapeiksi ja kullanruskeiksi.", "Kuullota sipuli öljyssä pehmeäksi, lisää valkosipuli ja paprikajauhe, kypsennä hetki. Lisää tomaattisose ja tomaattimurska, ja hauduta kunnes kastike on hieman paksuuntunut.", "Kaada kastike valmiiden perunoiden päälle, ripottele basilikaa päälle ja tarjoa heti."]},
  {"id": "kaalikeitto-shchi", "name": "Venäläinen kaalikeitto (Shchi)", "category": "Alkuruoka", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/60oc3k1699009846.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Voi", "amount": 45, "unit": "g", "chip": "Voi"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kaali", "amount": 1, "unit": "kpl", "chip": "Kaali"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 1, "unit": "varsi", "chip": "Selleri"}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kasvisliemi", "amount": 1.9, "unit": "l", "chip": "Kasvisliemi"}, {"name": "Peruna", "amount": 2, "unit": "kpl", "chip": "Peruna"}, {"name": "Tomaatti", "amount": 2, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Smetana", "amount": 1, "unit": "annos", "chip": "Smetana"}, {"name": "Tilli", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Sulata voi kattilassa ja kuullota sipuli läpikuultavaksi.", "Lisää kaali, porkkana ja selleri, ja kypsennä muutama minuutti sekoitellen.", "Lisää laakerinlehti ja kasvisliemi, kiehauta ja anna kypsyä miedolla lämmöllä kannen alla noin 15 minuuttia. Lisää perunat ja jatka kypsentämistä noin 10 minuuttia.", "Lisää tomaatit, kiehauta ja anna kypsyä vielä 5 minuuttia. Mausta suolalla ja pippurilla, poista laakerinlehti. Tarjoa smetanalla ja tillillä koristeltuna."]},
  {"id": "itavaltalaiset-juustokneidlit", "name": "Itävaltalaiset juustokneidlit", "category": "Alkuruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/x26z3y1780155760.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Leipä", "amount": 250, "unit": "g", "chip": "Leipä"}, {"name": "Juusto", "amount": 250, "unit": "g", "chip": "Juusto"}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Peruna", "amount": 3, "unit": "kpl", "chip": "Peruna"}, {"name": "Vehnäjauho", "amount": 100, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Maito", "amount": 250, "unit": "ml", "chip": "Maito"}, {"name": "Sipuli", "amount": 1, "unit": "pieni", "chip": "Sipuli"}, {"name": "Voi", "amount": 1, "unit": "annos", "chip": "Voi"}], "steps": ["Sekoita leipäkuutiot maitoon, mausta suolalla ja anna turvota hetki.", "Lisää raastetut perunat, raastettu juusto, kananmunat ja persilja.", "Kuullota kuutioitu sipuli voissa kullanruskeaksi ja sekoita taikinaan.", "Lisää jauhot ja vaivaa taikina kevyesti. Muotoile pyöreiksi nyytteiksi, painele hieman litteiksi ja paista voissa kummaltakin puolelta kullanruskeiksi.", "Tarjoa kirkkaassa liemikeitossa."]},
  {"id": "kidneypapucurry", "name": "Kidneypapucurry", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/sywrsu1511463066.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kasviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 1, "unit": "pala", "chip": null}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Garam masala", "amount": 2, "unit": "tl", "chip": null}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Kidneypavut", "amount": 400, "unit": "g", "chip": "Pavut"}, {"name": "Basmatiriisi", "amount": 1, "unit": "annos", "chip": "Riisi"}], "steps": ["Kuumenna öljy pannulla ja kuullota sipuli suolan kanssa hitaasti pehmeäksi ja hieman kullanväriseksi.", "Lisää valkosipuli, inkivääri ja korianterin varret, ja kypsennä pari minuuttia.", "Lisää mausteet ja paista minuutti, kunnes tuoksu vapautuu. Lisää tomaattimurska ja kidneypavut liemineen, ja kiehauta.", "Hauduta miedolla lämmöllä 15 minuuttia, kunnes curry on kauniin paksua. Mausta ja tarjoa basmatiriisin ja korianterinlehtien kanssa."]},
  {"id": "patatas-bravas-perinteinen", "name": "Perinteinen patatas bravas", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/bvg8sn1763298713.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Tomaattimurska", "amount": 225, "unit": "g", "chip": "Tomaatti"}, {"name": "Tomaattisose", "amount": 1, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Makea paprikajauhe", "amount": 2, "unit": "tl", "chip": null}, {"name": "Chilijauhe", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "hyppysellinen", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "annos", "chip": null}, {"name": "Peruna", "amount": 900, "unit": "g", "chip": "Peruna"}, {"name": "Oliiviöljy perunoille", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna öljy ja kuullota sipuli pehmeäksi noin 5 minuuttia. Lisää valkosipuli, tomaattimurska, tomaattisose, paprikajauhe, chilijauhe, sokeri ja ripaus suolaa.", "Kiehauta ja anna hautua miedolla lämmöllä noin 10 minuuttia, kunnes kastike on paksuuntunut.", "Kuumenna uuni 200 asteeseen. Kuivaa perunat, sekoita öljyyn ja mausteisiin, ja paista uunivuoassa 40-50 minuuttia rapeiksi ja kullanruskeiksi.", "Lusikoi tomaattikastike paistettujen perunoiden päälle, ripottele persiljaa ja tarjoa."]},
  {"id": "pisto-con-huevos", "name": "Pisto-kasvispata munilla", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/0nswfe1763279040.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 4, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Paprika (sekoitus)", "amount": 5, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Oregano", "amount": 1, "unit": "tl", "chip": null}, {"name": "Timjami", "amount": 1, "unit": "annos", "chip": null}, {"name": "Laakerinlehti", "amount": 4, "unit": "kpl", "chip": null}, {"name": "Kesäkurpitsa", "amount": 2, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Munakoiso", "amount": 1, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Tomaatti", "amount": 4, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuumenna öljy padassa ja hauduta sipuli suolan kanssa kannen alla matalalla lämmöllä 15 minuuttia. Lisää valkosipuli ja kypsennä pari minuuttia.", "Lisää paprikat ja kypsennä kannen alla noin 5 minuuttia.", "Sekoita joukkoon oregano, timjami, laakerinlehdet, kesäkurpitsa ja munakoiso, ja hauduta kannen alla 10 minuuttia. Lisää tomaatit ja jatka hauduttamista 20 minuuttia.", "Riko munat varovasti padan pinnalle ja anna kypsyä miedolla lämmöllä 5-6 minuuttia, kunnes valkuainen on kypsä mutta keltuainen vielä pehmeä. Ripottele persiljaa ja tarjoa."]},
  {"id": "perunasalaatti-olivier", "name": "Venäläinen perunasalaatti (Olivier)", "category": "Lisuke", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/ebvuir1699013665.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 4, "unit": "kpl", "chip": "Peruna"}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Suola", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Valkoviinietikka", "amount": 0.5, "unit": "rkl", "chip": null}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Nakkimakkara", "amount": 200, "unit": "g", "chip": "Makkara"}, {"name": "Tilli", "amount": 1, "unit": "annos", "chip": null}, {"name": "Herneet", "amount": 1, "unit": "tölkki", "chip": "Herne"}, {"name": "Sipuli", "amount": 4, "unit": "kpl", "chip": "Sipuli"}, {"name": "Majoneesi", "amount": 240, "unit": "ml", "chip": "Majoneesi"}], "steps": ["Kuutioi perunat ja porkkanat, keitä suolatussa ja etikkaa sisältävässä vedessä pehmeiksi noin 15 minuuttia. Valuta ja anna jäähtyä.", "Kuutioi makkara ja munat, silppua sipuli ja tilli.", "Sekoita kulhossa perunat, porkkanat, makkara, herneet ja sipuli.", "Lisää majoneesi ja tilli, sekoita hyvin ja mausta suolalla ja pippurilla. Peitä kelmulla ja anna vetäytyä jääkaapissa vähintään tunti ennen tarjoilua."]},
  {"id": "provencelainen-munakaskerroskakku", "name": "Provencelainen munakaskerroskakku", "category": "Alkuruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/qwtrtp1511799242.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kananmuna", "amount": 10, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kesäkurpitsa", "amount": 2, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Kevätsipuli", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Paahdettu punainen paprika", "amount": 4, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Tuorejuusto", "amount": 300, "unit": "g", "chip": "Tuorejuusto"}, {"name": "Maito", "amount": 90, "unit": "ml", "chip": "Maito"}, {"name": "Ruohosipuli", "amount": 1, "unit": "annos", "chip": null}, {"name": "Basilika", "amount": 1, "unit": "annos", "chip": null}, {"name": "Rucola", "amount": 1, "unit": "annos", "chip": "Rucola"}, {"name": "Parmesaani", "amount": 1, "unit": "annos", "chip": "Parmesaani"}], "steps": ["Jaa munat kahteen kulhoon, viisi kumpaankin, ja vatkaa kevyesti mausteiden kanssa. Paista kesäkurpitsa ja kevätsipuli öljyssä pehmeiksi ja sekoita toiseen munaseokseen. Sekoita toiseen seokseen paahdetut paprikat, valkosipuli ja chili.", "Paista kummastakin seoksesta ohuita, koko pannun kokoisia munakkaita, kolme kumpaakin, hieman öljyä lisäten joka kerta.", "Vatkaa tuorejuusto pehmeäksi ja sekoita joukkoon maito, yrtit, suola ja pippuri.", "Pinoa munakkaat vuoraan kakkuvuokaan vuorotellen, levittäen ohut kerros juustotäytettä joka kerroksen väliin. Peitä kelmulla ja anna jäähtyä jääkaapissa.", "Kumoa kakku tarjoiluvadille, koristele rucolalla, parmesaanilla ja lorauksella oliiviöljyä, ja leikkaa lohkoiksi."]},
  {"id": "ribollita", "name": "Ribollita - toscanalainen leipäkeitto", "category": "Alkuruoka", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/xrrwpx1487347049.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 5, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 1, "unit": "varsi", "chip": "Selleri"}, {"name": "Valkosipuli", "amount": 1, "unit": "rkl", "chip": "Valkosipuli"}, {"name": "Cannellini-pavut", "amount": 470, "unit": "ml", "chip": "Pavut"}, {"name": "Tomaattimurska", "amount": 1, "unit": "tölkki", "chip": "Tomaatti"}, {"name": "Vesi", "amount": 950, "unit": "ml", "chip": null}, {"name": "Rosmariini", "amount": 1, "unit": "oksa", "chip": null}, {"name": "Timjami", "amount": 1, "unit": "oksa", "chip": null}, {"name": "Lehtikaali", "amount": 450, "unit": "g", "chip": "Lehtikaali"}, {"name": "Täysjyväleipä", "amount": 4, "unit": "viipaletta", "chip": "Leipä"}, {"name": "Punasipuli", "amount": 1, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Parmesaani", "amount": 60, "unit": "g", "chip": "Parmesaani"}], "steps": ["Kuumenna osa öljystä padassa ja kuullota sipuli, porkkana, selleri ja valkosipuli suolan ja pippurin kanssa pehmeiksi, noin 5-10 minuuttia.", "Lisää pavut, tomaatit, vesi, rosmariini ja timjami. Kiehauta, laske lämpöä ja hauduta kannen alla 15-20 minuuttia.", "Poista yrttien varret, lisää lehtikaali ja mausta maun mukaan.", "Aseta padan päälle leipäviipaleet, ripottele päälle punasipuli, valuta loppu öljy ja ripottele parmesaania.", "Paista uunissa kuumassa lämmössä, kunnes leipä ja juusto ovat ruskistuneet ja rapeat, noin 10-15 minuuttia. Tarjoile heti."]},
  {"id": "paahdettu-munakoiso-linsseilla", "name": "Paahdettu munakoiso linssien ja pinjansiementen kanssa", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/ysqrus1487425681.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 4, "unit": "rkl", "chip": null}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 2, "unit": "varsi", "chip": "Selleri"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 6, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Ruskeat linssit", "amount": 340, "unit": "g", "chip": "Linssit"}, {"name": "Laakerinlehti", "amount": 2, "unit": "kpl", "chip": null}, {"name": "Vesi", "amount": 950, "unit": "ml", "chip": null}, {"name": "Omenaviinietikka", "amount": 10, "unit": "ml", "chip": null}, {"name": "Munakoiso", "amount": 2, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Rosmariini", "amount": 4, "unit": "oksaa", "chip": null}, {"name": "Pinjansiemenet", "amount": 60, "unit": "ml", "chip": "Pinjansiemenet"}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Kuumenna öljy kattilassa ja kuullota porkkana, selleri ja sipuli pehmeiksi. Lisää valkosipuli ja kypsennä hetki.", "Lisää linssit, laakerinlehdet, vesi ja ripaus suolaa. Kiehauta, peitä osittain kannella ja hauduta noin 30 minuuttia, kunnes linssit ovat kypsiä. Sekoita joukkoon etikka ja mausta.", "Leikkaa munakoisot puoliksi, viillä pinta ristikkoon, sivele öljyllä, mausta ja aseta rosmariinioksa päälle. Paista uunissa kuumassa lämmössä kypsiksi ja tummiksi, noin 25-35 minuuttia.", "Paahda pinjansiemenet kuivalla pannulla kullanruskeiksi. Sekoita osa persiljasta linsseihin, nostele lautaselle, aseta munakoisot päälle ja ripottele pinjansiemeniä ja loput persiljaa."]},
  {"id": "shakshuka", "name": "Shakshuka - munat tomaattikastikkeessa", "category": "Aamiainen", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/g373701551450225.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punasipuli", "amount": 2, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Korianteri", "amount": 1, "unit": "annos", "chip": null}, {"name": "Kirsikkatomaatit", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Kananmuna", "amount": 4, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Fetajuusto", "amount": 1, "unit": "ripaus", "chip": "Feta"}], "steps": ["Kuumenna öljy kannellisessa pannussa ja hauduta sipuli, chili, valkosipuli ja korianterin varret pehmeiksi noin 5 minuuttia.", "Lisää tomaatit ja sokeri, ja hauduta kupliseksi noin 8-10 minuuttia, kunnes kastike on paksuuntunut.", "Tee lusikalla neljä syvennystä kastikkeeseen ja riko jokaiseen kananmuna.", "Peitä kannella ja kypsennä matalalla lämmöllä 6-8 minuuttia, kunnes munat ovat mieleisesi kypsyneet. Ripottele fetaa ja korianterin lehtiä päälle, tarjoa rapean leivän kanssa."]},
  {"id": "savuinen-linssichili-kurpitsalla", "name": "Savuinen linssichili kurpitsalla", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/uwxqwy1483389553.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kurpitsa", "amount": 1, "unit": "pieni", "chip": "Kurpitsa"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Purjo", "amount": 1, "unit": "kpl", "chip": "Purjo"}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kumina", "amount": 4, "unit": "tl", "chip": null}, {"name": "Korianteri (jauhe)", "amount": 2, "unit": "tl", "chip": null}, {"name": "Savupaprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Chilijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kaakaojauhe", "amount": 1, "unit": "tl", "chip": "Kaakaojauhe"}, {"name": "Kuivattu oregano", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Tomaattimurska", "amount": 1, "unit": "tölkki", "chip": "Tomaatti"}, {"name": "Vesi", "amount": 700, "unit": "ml", "chip": null}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Ruskeat linssit", "amount": 350, "unit": "ml", "chip": "Linssit"}, {"name": "Cashewpähkinät", "amount": 240, "unit": "ml", "chip": "Cashewpähkinä"}, {"name": "Omenaviinietikka", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Viipaloi kurpitsa, sivele öljyllä ja suolalla ja paahda uunissa 200 asteessa 20-30 minuuttia kääntäen puolivälissä. Anna jäähtyä ja kuutioi.", "Keitä huuhdotut linssit vedessä kiehuvaksi ja anna kiehua kannettomana 20-30 minuuttia, kunnes ne ovat pehmeitä. Valuta.", "Kuullota sipuli ja purjo öljyssä pehmeiksi, lisää valkosipuli ja mausteet ja kypsennä hetki. Lisää tomaattimurska, vesi ja porkkanat, ja hauduta kannen alla 20 minuuttia.", "Lisää linssit ja paahdettu kurpitsa, kypsennä vielä 10 minuuttia. Tarjoa tuoreella chilillä, limelohkoilla, korianterilla, kevätsipulilla ja cashewkermalla."]},
  {"id": "mausteinen-tortilla", "name": "Mausteinen tortilla kirsikkatomaateilla", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/7b862e1763194846.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Auringonkukkaöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Punainen chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Currymauste", "amount": 2, "unit": "tl", "chip": null}, {"name": "Kirsikkatomaatit", "amount": 300, "unit": "g", "chip": "Tomaatti"}, {"name": "Peruna", "amount": 500, "unit": "g", "chip": "Peruna"}, {"name": "Korianteri", "amount": 1, "unit": "nippu", "chip": null}, {"name": "Kananmuna", "amount": 8, "unit": "kpl", "chip": "Kananmuna"}], "steps": ["Kuumenna öljy pannulla ja paista sipuli ja puolet chilistä pehmeiksi noin 5 minuuttia. Lisää currymauste ja paista vielä minuutti.", "Lisää kirsikkatomaatit, perunat ja korianterin varret pannulle.", "Mausta munat, kaada seoksen päälle ja anna hyytyä hiljalleen noin 8-10 minuuttia, kunnes tortilla on lähes kypsä.", "Rapsauta grilliä ja kypsennä tortillan pintaa vielä 1-2 minuuttia. Ripottele korianterinlehdet ja loput chilistä päälle, leikkaa lohkoiksi ja tarjoa vihreän salaatin kanssa."]},
  {"id": "taytetyt-paprikat-kvinoalla", "name": "Täytetyt paprikat kvinoalla ja mustilla pavuilla", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/b66myb1683207208.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vihreä paprika", "amount": 4, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Kvinoa", "amount": 240, "unit": "ml", "chip": "Kvinoa"}, {"name": "Mustat pavut", "amount": 1, "unit": "tölkki", "chip": "Pavut"}, {"name": "Maissi", "amount": 240, "unit": "ml", "chip": "Maissi"}, {"name": "Tomaattimurska", "amount": 1, "unit": "tölkki", "chip": "Tomaatti"}, {"name": "Kumina", "amount": 1, "unit": "tl", "chip": null}, {"name": "Chilijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Savupaprikajauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Juusto", "amount": 350, "unit": "ml", "chip": "Juusto"}, {"name": "Korianteri", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Kuumenna uuni 190 asteeseen. Aseta paprikapuolikkaat leikkuupuoli ylöspäin uunivuokaan ja paista 15-20 minuuttia, kunnes ne ovat hieman pehmenneet.", "Kuullota sipuli öljyssä pehmeäksi noin 3-4 minuuttia, lisää valkosipuli ja kypsennä minuutti.", "Sekoita joukkoon keitetty kvinoa, pavut, maissi, tomaattimurska ja mausteet, ja kuumenna läpi. Sekoita joukkoon osa juustosta.", "Täytä paprikat seoksella, ripottele päälle loput juustosta ja paista uunissa vielä 15-20 minuuttia, kunnes juusto on sulanut ja paprikat pehmeitä. Ripottele korianteria päälle ennen tarjoilua."]},
  {"id": "thaimaalainen-kookoskasviskeitto", "name": "Thaimaalainen kookoskasviskeitto", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/4k8nzy1763583384.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Punainen currytahna", "amount": 1.5, "unit": "rkl", "chip": "Currytahna"}, {"name": "Kasviöljy", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kasvisliemi", "amount": 1, "unit": "l", "chip": "Kasvisliemi"}, {"name": "Kookosmaito", "amount": 400, "unit": "ml", "chip": "Kookosmaito"}, {"name": "Ruskea sokeri", "amount": 2, "unit": "tl", "chip": "Ruskea sokeri"}, {"name": "Munanuudelit", "amount": 175, "unit": "g", "chip": "Nuudelit"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kiinankaali", "amount": 0.5, "unit": "kpl", "chip": "Kiinankaali"}, {"name": "Idut", "amount": 150, "unit": "g", "chip": "Idut"}, {"name": "Kirsikkatomaatit", "amount": 6, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Limemehu", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Kevätsipuli", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}], "steps": ["Kuumenna currytahna öljyssä kattilassa minuutin ajan, kunnes tuoksu vapautuu.", "Lisää kasvisliemi, kookosmaito ja sokeri, ja anna kiehua 3 minuuttia.", "Lisää nuudelit, porkkana ja kiinankaali, ja anna kiehua 4-6 minuuttia, kunnes kaikki on kypsää. Sekoita joukkoon idut ja tomaatit.", "Mausta limemehulla ja tarvittaessa suolalla, annostele kulhoihin ja ripottele päälle kevätsipulia ja korianteria."]},
  {"id": "kasvispata", "name": "Herkullinen kasvispata linsseillä", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/vptwyt1511450962.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipuli", "amount": 3, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kumina", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Timjami", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Porkkana", "amount": 3, "unit": "kpl", "chip": "Porkkana"}, {"name": "Selleri", "amount": 2, "unit": "varsi", "chip": "Selleri"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Keltainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Tomaattimurska", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Kasvisliemi", "amount": 250, "unit": "ml", "chip": "Kasvisliemi"}, {"name": "Kesäkurpitsa", "amount": 2, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Linssit", "amount": 250, "unit": "g", "chip": "Linssit"}], "steps": ["Kuumenna öljy isossa padassa ja kuullota sipuli pehmeäksi noin 5-10 minuuttia.", "Lisää valkosipuli, mausteet, porkkana, selleri ja paprikat, ja kypsennä 5 minuuttia.", "Lisää tomaatit, liemi ja kesäkurpitsa, ja hauduta kannen alla 20-25 minuuttia.", "Poista timjaminoksat, lisää linssit ja anna kiehahtaa. Tarjoa riisin, perunamuusin tai kvinoan kanssa."]},
  {"id": "kasvisshakshuka", "name": "Kasvisshakshuka paahtoleivällä", "category": "Aamiainen", "price": 1, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/eo0yfb1763600916.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Punasipuli", "amount": 0.5, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Punainen paprika", "amount": 0.5, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Tomaattimurska", "amount": 400, "unit": "g", "chip": "Tomaatti"}, {"name": "Kumina", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkosipulijauhe", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Cayennepippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kananmuna", "amount": 2, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Persilja", "amount": 1, "unit": "annos", "chip": null}, {"name": "Chilihiutaleet", "amount": 1, "unit": "annos", "chip": null}, {"name": "Paahtoleipä", "amount": 2, "unit": "viipaletta", "chip": "Leipä"}], "steps": ["Paista sipulia ja paprikaa keskilämmöllä pannulla, kunnes sipuli on pehmeää.", "Lisää valkosipulijauhe ja kypsennä minuutti.", "Lisää tomaattimurska ja loput mausteet, sekoita hyvin ja hauduta noin 20 minuuttia.", "Tee kastikkeeseen syvennykset ja riko niihin munat. Kypsennä kunnes valkuainen on kypsä, koristele ja tarjoa paahtoleivän kanssa."]},
  {"id": "algerialainen-paprikasalaatti", "name": "Algerialainen paahdettu paprikasalaatti", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/tbj1bs1764118062.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vihreä paprika", "amount": 3, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Punasipuli", "amount": 1, "unit": "rkl", "chip": "Punasipuli"}, {"name": "Valkosipuli", "amount": 1, "unit": "kynsi", "chip": "Valkosipuli"}, {"name": "Tomaatti", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}], "steps": ["Paahda kokonaiset paprikat uunissa 230 asteessa 30-45 minuuttia, kunnes kuori on mustunut täpliltä ja paprikat pehmeitä.", "Anna paprikoiden jäähtyä hetki, kuori ne ja poista siemenet, ja paloittele noin sentin kuutioiksi.", "Kuumenna öljy pannulla ja kuullota sipuli läpikuultavaksi noin 5 minuuttia.", "Lisää valkosipuli, suola ja pippuri, sekä paprikat ja tomaatti, ja kypsennä sekoitellen noin 5 minuuttia, kunnes tomaatti on pehmennyt."]},
  {"id": "baingan-bharta", "name": "Intialainen savumunakoisomuhennos (Baingan Bharta)", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/urtpqw1487341253.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Munakoiso", "amount": 1, "unit": "iso", "chip": "Munakoiso"}, {"name": "Sipuli", "amount": 120, "unit": "ml", "chip": "Sipuli"}, {"name": "Tomaatti", "amount": 240, "unit": "ml", "chip": "Tomaatti"}, {"name": "Valkosipuli", "amount": 6, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Vihreä chili", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Chilijauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Öljy", "amount": 1.5, "unit": "rkl", "chip": null}, {"name": "Korianterinlehdet", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Sivele munakoiso öljyllä ja paahda avotulella, grillissä tai uunissa, kunnes kuori on mustunut ja sisus täysin pehmeä. Anna jäähtyä ja kuori pois palanut kuori.", "Paloittele tai soseuta paahdettu munakoiso.", "Kuumenna öljy pannulla ja kuullota silputtu sipuli ja valkosipuli läpikuultaviksi, älä ruskista. Lisää vihreä chili ja tomaatti, ja hauduta kunnes öljy alkaa erottua seoksesta.", "Lisää chilijauhe ja munakoiso, sekoita hyvin ja mausta suolalla. Kypsennä vielä 4-5 minuuttia.", "Sekoita joukkoon korianterinlehdet ja tarjoa rotilla, leivällä tai riisin kanssa."]},
  {"id": "kermainen-maissikeitto", "name": "Kermainen maissikeitto", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/yf5eyw1783804464.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Maissintähkä", "amount": 4, "unit": "kpl", "chip": "Maissi"}, {"name": "Vesi", "amount": 1.4, "unit": "l", "chip": null}, {"name": "Kanaliemikuutio", "amount": 2, "unit": "kpl", "chip": "Kanaliemi"}, {"name": "Valkosipuli", "amount": 2, "unit": "kynttä", "chip": "Valkosipuli"}, {"name": "Suola", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Korianteri", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Peruna", "amount": 1, "unit": "dl", "chip": "Peruna"}, {"name": "Kevätsipuli", "amount": 1, "unit": "dl", "chip": "Kevätsipuli"}, {"name": "Kuohukerma", "amount": 240, "unit": "ml", "chip": "Kerma"}], "steps": ["Laita maissi, vesi, liemikuutiot, valkosipuli, suola, pippuri, korianteri, peruna ja kevätsipuli isoon kattilaan ja kiehauta.", "Laske lämpöä ja anna kiehua noin 4 minuuttia, kunnes maissi on pehmeää.", "Soseuta keitto tehosekoittimessa ja kaada takaisin kattilaan. Lisää kerma ja kuumenna miedolla lämmöllä noin 15 minuuttia, sekoitellen välillä.", "Kaada keitto kulhoihin, koristele korianterilla ja perunatikuilla, ja tarjoa."]},
  {"id": "valkoisten-papujen-keitto", "name": "Bulgarialainen valkoisten papujen keitto", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/p5nzbk1782680889.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Kuivatut cannellini-pavut", "amount": 450, "unit": "g", "chip": "Pavut"}, {"name": "Sipuli", "amount": 2, "unit": "kpl", "chip": "Sipuli"}, {"name": "Rypsiöljy", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Punainen paprika", "amount": 2, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Tomaattipyree", "amount": 0.8, "unit": "dl", "chip": "Tomaattipyree"}, {"name": "Porkkana", "amount": 2, "unit": "kpl", "chip": "Porkkana"}, {"name": "Vesi", "amount": 14, "unit": "dl", "chip": null}, {"name": "Kuivattu minttu", "amount": 1, "unit": "tl", "chip": null}, {"name": "Timjami", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kesäkynteli (mausteyrtti)", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Silputtu persilja", "amount": 1, "unit": "nippu", "chip": null}], "steps": ["Liota papuja kylmässä vedessä yön yli, huuhtele ja valuta.", "Kuullota toinen sipuleista ja porkkanat öljyssä pari minuuttia isossa kattilassa.", "Lisää pavut, vesi, paprikat, kokonainen sipuli, mausteet ja tomaattipyree. Keitä kiehuvaksi ja anna hautua kannen alla noin 2 tuntia, kunnes pavut ovat pehmeitä.", "Nosta paprikat ja kokonainen sipuli pois, kuori ja soseuta/pilko ne, ja lisää takaisin keittoon.", "Mausta tarvittaessa lisää suolalla ja pippurilla, ja tarjoa persiljasilpulla koristeltuna."]},

  {"id": "falafel-pitaleipa", "name": "Falafelpita tahinikastikkeella", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/ae6clc1760524712.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Valmiit falafelpallot", "amount": 12, "unit": "kpl", "chip": "Falafel"}, {"name": "Tahinitahna", "amount": 0.6, "unit": "dl", "chip": "Tahini"}, {"name": "Vesi", "amount": 0.6, "unit": "dl", "chip": null}, {"name": "Sitruunamehu", "amount": 2, "unit": "rkl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Paprikajauhe", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Pitaleipä", "amount": 6, "unit": "kpl", "chip": "Leipä"}, {"name": "Salaatti", "amount": 1, "unit": "kpl", "chip": "Salaatti"}, {"name": "Tomaatti", "amount": 1, "unit": "kpl", "chip": "Tomaatti"}, {"name": "Kurkku", "amount": 0.5, "unit": "kpl", "chip": "Kurkku"}, {"name": "Suolakurkku", "amount": 1, "unit": "kpl", "chip": "Suolakurkku"}, {"name": "Punasipuli", "amount": 1, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Harissamausteseos", "amount": 3, "unit": "tl", "chip": null}], "steps": ["Lämmitä falafelit uunissa 230-asteisena noin 8-10 minuuttia kuumiksi.", "Vatkaa samalla tahinikastike sekoittamalla tahini, vesi, sitruunamehu, valkosipuli ja paprikajauhe kulhossa tasaiseksi.", "Leikkaa pitaleipiin tasku ja täytä ne falafeleilla sekä salaatilla, tomaatilla, kurkulla, suolakurkulla ja punasipulilla.", "Valuta päälle tahinikastiketta ja lisää halutessasi harissamausteseosta, tarjoa heti."]},
  {"id": "gigantes-plaki", "name": "Kreikkalaiset uunipavut tomaattikastikkeessa", "category": "Kasvis", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/b79r6f1585566277.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Isot valkoiset pavut", "amount": 400, "unit": "g", "chip": "Pavut"}, {"name": "Oliiviöljy", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 2, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Tomaattipyree", "amount": 2, "unit": "rkl", "chip": "Tomaattipyree"}, {"name": "Tomaatti", "amount": 800, "unit": "g", "chip": "Tomaatti"}, {"name": "Sokeri", "amount": 1, "unit": "rkl", "chip": "Sokeri"}, {"name": "Kuivattu oregano", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kaneli", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Persilja", "amount": 2, "unit": "rkl", "chip": null}], "steps": ["Liota pavut yön yli, keitä sitten vedessä noin 50 minuuttia kunnes hieman pehmeitä mutteivät vielä täysin kypsiä. Valuta.", "Kuumenna öljyä pannulla ja kuullota sipuli ja valkosipuli noin 10 minuuttia.", "Lisää tomaattipyree, tomaatit, sokeri, oregano ja kaneli, ja anna kiehahtaa muutama minuutti.", "Sekoita joukkoon pavut, kaada seos uunivuokaan ja paista 180-asteisessa uunissa noin 1 tunti ilman kantta.", "Anna jäähtyä hieman, ripottele pinnalle persiljaa ja lisää halutessasi tilkka oliiviöljyä ennen tarjoilua."]},
  {"id": "jamaikalainen-riisi-papuruoka", "name": "Jamaikalainen kookosriisi ja pavut", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/11bvtm1764795135.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Kevätsipuli", "amount": 2, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Riisi", "amount": 380, "unit": "g", "chip": "Riisi"}, {"name": "Kookosmaito", "amount": 1.8, "unit": "dl", "chip": "Kookosmaito"}, {"name": "Vesi", "amount": 1.8, "unit": "dl", "chip": null}, {"name": "Suola", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Maustepippuri (allspice)", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.25, "unit": "tl", "chip": null}, {"name": "Kidneypavut", "amount": 450, "unit": "g", "chip": "Pavut"}, {"name": "Timjami", "amount": 2, "unit": "oksa", "chip": null}], "steps": ["Kuumenna öljy padassa ja kuullota sipuli pehmeäksi, lisää sitten valkosipuli ja kevätsipuli hetkeksi.", "Lisää riisi, kookosmaito, vesi, suola, maustepippuri ja mustapippuri, sekoita.", "Kaada päälle valuttamattomat kidneypavut ilman sekoittamista, aseta timjaminoksat päälle.", "Kuumenna kiehuvaksi, laita kansi päälle, mausta lämpö ja anna hautua matalalla lämmöllä noin 18 minuuttia.", "Anna vetäytyä kannen alla vielä 5 minuuttia, poista timjami ja kuohkeuta riisi haarukalla ennen tarjoilua."]},
  {"id": "kafteji", "name": "Tunisialainen paistettu kasvis-munaruoka (kafteji)", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/1bsv1q1560459826.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Peruna", "amount": 5, "unit": "kpl", "chip": "Peruna"}, {"name": "Oliiviöljy paistamiseen", "amount": 2, "unit": "dl", "chip": null}, {"name": "Vihreä paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Sipuli", "amount": 5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Ras el hanout -mausteseos", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kurpitsa", "amount": 500, "unit": "g", "chip": "Kurpitsa"}, {"name": "Kananmuna", "amount": 6, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Pippuri", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Kuori perunat, leikkaa kuutioiksi ja paista runsaassa öljyssä kullanruskeiksi noin 20 minuuttia, valuta talouspaperilla.", "Paahda halkaistut paprikat grillivastuksen alla mustiksi, hikoile suljetussa pussissa 15 minuuttia ja kuori.", "Paista ohuiksi renkaiksi leikattu sipuli öljyssä kullanruskeaksi ja lisää loppuun ras el hanout.", "Paista kuutioitu kurpitsa samassa öljyssä pehmeäksi ja kevyesti ruskistuneeksi.", "Yhdistä kaikki paistetut kasvikset pannulle, kaada päälle vatkatut munat ja anna hyytyä kannen alla.", "Mausta suolalla ja pippurilla, ja hienonna kaikki yhdessä leikkuulaudalla ennen tarjoilua."]},
  {"id": "fenkoli-munakoiso-paella", "name": "Uunivihannespaella fenkolista ja munakoisosta", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/1520081754.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Pikkumunakoiso", "amount": 6, "unit": "kpl", "chip": "Munakoiso"}, {"name": "Fenkoli", "amount": 4, "unit": "kpl", "chip": "Fenkoli"}, {"name": "Punainen paprika", "amount": 1, "unit": "kpl", "chip": "Paprika (vihannes)"}, {"name": "Kesäkurpitsa", "amount": 1, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Paellariisi", "amount": 300, "unit": "g", "chip": "Riisi"}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Sahrami", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Valkoviini", "amount": 2, "unit": "dl", "chip": "Valkoviini"}, {"name": "Kasvisliemi", "amount": 7, "unit": "dl", "chip": "Kasvisliemi"}, {"name": "Pakastetut herneet", "amount": 100, "unit": "g", "chip": "Herne"}, {"name": "Sitruuna", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Persilja", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Mustapippuri", "amount": 1, "unit": "ripaus", "chip": null}], "steps": ["Paahda fenkoli, munakoiso, paprika ja kesäkurpitsa öljyssä, suolassa ja pippurissa 200-asteisessa uunissa 20 minuuttia.", "Kuullota sipuli öljyssä paellapannulla, lisää riisi, paprikajauhe ja sahrami ja paahda hetki.", "Lisää valkoviini, anna kiehua kasaan, ja kaada joukkoon kaksi kolmasosaa liemestä. Hauduta ilman kantta 10 minuuttia.", "Sekoita joukkoon herneet ja paahdetut kasvikset, kaada loppu liemi päälle, aseta sitruunaviipaleet pinnalle ja peitä foliolla noin 10 minuuttia.", "Nosta lämpöä hetkeksi rapean pohjan saamiseksi, anna vetäytyä ja ripottele pinnalle persiljaa ennen tarjoilua."]},
  {"id": "vegaaninen-lasagne", "name": "Vegaaninen linssilasagne", "category": "Pasta", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/rvxxuy1468312893.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Punaiset linssit", "amount": 2.4, "unit": "dl", "chip": "Linssit"}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Kesäkurpitsa", "amount": 1, "unit": "kpl", "chip": "Kesäkurpitsa"}, {"name": "Korianteri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Pinaatti", "amount": 150, "unit": "g", "chip": "Pinaatti"}, {"name": "Lasagnelevyt", "amount": 10, "unit": "kpl", "chip": "Pasta"}, {"name": "Kasvimargariini", "amount": 35, "unit": "g", "chip": "Kasvimargariini"}, {"name": "Vehnäjauho", "amount": 4, "unit": "rkl", "chip": "Vehnäjauho"}, {"name": "Soijamaito", "amount": 3, "unit": "dl", "chip": "Soijamaito"}, {"name": "Sinappi", "amount": 1.5, "unit": "tl", "chip": null}, {"name": "Viinietikka", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Keitä porkkana, sipuli ja kesäkurpitsa pehmeiksi, lisää linssit ja hauduta noin 20 minuuttia kunnes linssit ovat kypsiä.", "Kalauta pinaattia hetki kiehuvassa vedessä ja nosta sivuun. Keitä lasagnelevyt pakkauksen ohjeen mukaan ja valuta.", "Sulata margariini kattilassa, lisää jauho ja kaada vähitellen joukkoon soijamaito jatkuvasti sekoittaen. Mausta sinapilla ja etikalla, keitä tasaiseksi kastikkeeksi.", "Kokoa lasagne vuokaan kerrostellen levyjä, linssitäytettä, pinaattia ja kastiketta.", "Paista 180-asteisessa uunissa noin 25 minuuttia kunnes pinta on kullanruskea."]},
  {"id": "syyrialaiset-vihreat-pavut", "name": "Syyrialaiset oliiviöljypavut", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/21yc5s1760524759.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Tuoreet vihreät pavut", "amount": 450, "unit": "g", "chip": "Vihreä papu"}, {"name": "Oliiviöljy", "amount": 0.6, "unit": "dl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Korianteri", "amount": 0.6, "unit": "dl", "chip": null}], "steps": ["Laita pavut isoon kattilaan ja valuta päälle oliiviöljyä, mausta suolalla ja laita kansi päälle.", "Kypsennä keskilämmöllä välillä sekoittaen, kunnes pavut ovat kypsiä ja hieman ruskehtavia.", "Lisää joukkoon korianteri ja valkosipuli, ja kypsennä vielä hetki kunnes korianteri lakastuu.", "Tarjoa pääruokana lämpimän pitaleivän kanssa tai lisukkeena."]},
  {"id": "punasipulipikkelssi", "name": "Norjalainen punasipulipikkelssi", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/ppodrp1762325183.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Punasipuli", "amount": 3, "unit": "kpl", "chip": "Punasipuli"}, {"name": "Merisuola", "amount": 2, "unit": "tl", "chip": null}, {"name": "Siideri- tai omenaviinietikka", "amount": 2, "unit": "dl", "chip": null}, {"name": "Sokeri", "amount": 50, "unit": "g", "chip": "Sokeri"}, {"name": "Mustapippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Laakerinlehti", "amount": 4, "unit": "kpl", "chip": null}], "steps": ["Kuori sipulit, puolita ja viipaloi ohuiksi puolikuiksi. Ripottele suolaa päälle ja anna vetäytyä siivilässä noin tunti.", "Kuumenna etikka, hieman vettä ja sokeri kattilassa kiehuvaksi sokerin liuottamiseksi, anna kiehua pari minuuttia.", "Pakkaa sipulit puhtaisiin purkkeihin, ripottele joukkoon pippuria.", "Kaada lämmin etikkaliemi purkkeihin, lisää laakerinlehdet ja sulje purkit.", "Säilytä jääkaapissa, pikkelssi maistuu parhaimmillaan noin viikon kuluttua ja säilyy neljä viikkoa."]},
  {"id": "padron-paprikat", "name": "Paistetut padrón-paprikat", "category": "Alkuruoka", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/0ljvc51763248075.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Padrón-paprikat", "amount": 500, "unit": "g", "chip": "Padrón-paprikat"}], "steps": ["Kuumenna öljy pannulla kuumaksi.", "Paista paprikoita usein käännellen noin 5 minuuttia, kunnes ne ovat pehmeitä ja hieman korventuneita.", "Nosta lautaselle, ripottele päälle merisuolaa ja tarjoa heti tapasannoksena."]},
  {"id": "vegaaninen-banh-mi", "name": "Vegaaninen banh mi -voileipä", "category": "Kasvis", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/sonirb1763782831.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Raastetut vihannekset (porkkana, retiisi)", "amount": 150, "unit": "g", "chip": "Pikkelöity vihannesraaste"}, {"name": "Valkoviinietikka", "amount": 3, "unit": "rkl", "chip": null}, {"name": "Sokeri", "amount": 1, "unit": "tl", "chip": "Sokeri"}, {"name": "Patonki", "amount": 1, "unit": "kpl", "chip": "Leipä"}, {"name": "Hummus", "amount": 100, "unit": "g", "chip": "Hummus"}, {"name": "Tempeh", "amount": 175, "unit": "g", "chip": "Tempeh"}, {"name": "Korianteri", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Minttu", "amount": 1, "unit": "kourallinen", "chip": null}, {"name": "Chilikastike", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Sekoita raastetut vihannekset kulhossa etikan, sokerin ja hyppysellisen suolaa kanssa ja anna maustua hetki.", "Paahda halkaistut patonkiviipaleet uunissa 180-asteisessa lämmössä noin 5 minuuttia.", "Levitä patonkien sisäpinnoille hummusta, lado päälle paistetut tempehsiivut ja pikkelöidyt vihannekset.", "Ripottele päälle korianteria ja minttua, lisää tilkka chilikastiketta ja sulje voileivät."]},
  {"id": "vegaaninen-suklaakakku", "name": "Vegaaninen suklaakakku", "category": "Jälkiruoka", "price": 2, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/qxutws1486978099.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Itsekohoava vehnäjauho", "amount": 300, "unit": "g", "chip": "Vehnäjauho"}, {"name": "Kookossokeri", "amount": 100, "unit": "g", "chip": "Kookossokeri"}, {"name": "Kaakaojauhe", "amount": 40, "unit": "g", "chip": "Kaakaojauhe"}, {"name": "Leivinjauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Pellavansiemenmuna", "amount": 2, "unit": "kpl", "chip": "Pellavansiemenet"}, {"name": "Mantelimaito", "amount": 1.2, "unit": "dl", "chip": "Mantelimaito"}, {"name": "Vaniljauute", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kiehuva vesi", "amount": 1.2, "unit": "dl", "chip": null}], "steps": ["Sekoita kaikki kuivat aineet keskenään kulhossa.", "Lisää joukkoon pellavansiemenmuna, mantelimaito, vaniljauute ja kiehuva vesi, ja sekoita tasaiseksi taikinaksi.", "Kaada taikina voideltuun vuokaan ja paista 180-asteisessa uunissa noin 45 minuuttia.", "Anna jäähtyä ja koristele sulatetulla vegaanisella suklaalla."]},
  {"id": "airfryer-kevatkaarylit", "name": "Ilmafritteerin kevätkääryleet", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/grhn401765687086.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Oliiviöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sian jauheliha", "amount": 450, "unit": "g", "chip": "Sian jauheliha"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Inkivääri", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Porkkana", "amount": 1, "unit": "kpl", "chip": "Porkkana"}, {"name": "Kevätsipuli", "amount": 3, "unit": "kpl", "chip": "Kevätsipuli"}, {"name": "Kaali", "amount": 700, "unit": "g", "chip": "Kaali"}, {"name": "Soijakastike", "amount": 1, "unit": "rkl", "chip": "Soijakastike"}, {"name": "Riisiviinietikka", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Kevätkääryletaikinalevyt", "amount": 12, "unit": "kpl", "chip": "Taikinapohja"}, {"name": "Öljy voiteluun", "amount": 1, "unit": "annos", "chip": null}, {"name": "Ankkakastike tarjoiluun", "amount": 1, "unit": "annos", "chip": null}, {"name": "Luumukastike tarjoiluun", "amount": 1, "unit": "annos", "chip": null}], "steps": ["Ruskista jauheliha öljyssä pannulla murustaen, kunnes se on kypsä läpikotaisin.", "Lisää valkosipuli, inkivääri, porkkana, kevätsipuli ja kaali, ja kypsennä kunnes kaali pehmenee.", "Mausta soijakastikkeella ja riisiviinietikalla, anna jäähtyä hieman.", "Lado täytettä taikinalevyille, kostuta reunat vedellä ja rullaa tiiviiksi kääryleiksi.", "Sivele kääryleet öljyllä ja paista ilmafritteerissä 200-asteisessa lämmössä noin 10-12 minuuttia, kunnes ne ovat kullanruskeita ja rapeita.", "Tarjoa heti ankka- tai luumukastikkeen kanssa."]},
  {"id": "puolalaiset-jauhelihapihvit", "name": "Puolalaiset jauhelihapihvit (kotlety)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/vvn5f71764360273.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Sämpylä", "amount": 1, "unit": "kpl", "chip": "Leipä"}, {"name": "Maito", "amount": 1.2, "unit": "dl", "chip": "Maito"}, {"name": "Sipuli", "amount": 1, "unit": "kpl", "chip": "Sipuli"}, {"name": "Rypsiöljy", "amount": 1, "unit": "dl", "chip": null}, {"name": "Naudan jauheliha", "amount": 500, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Valkosipulinkynsi", "amount": 1, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Meirami", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Korppujauho", "amount": 75, "unit": "g", "chip": "Korppujauho"}], "steps": ["Liota sämpylä maidossa, kunnes se on täysin pehmennyt.", "Kuullota sipuli öljyssä pehmeäksi ja kullanruskeaksi.", "Purista sämpylästä ylimääräinen maito pois ja sekoita se jauhelihaan yhdessä paistetun sipulin, munan, valkosipulin ja meiramin kanssa. Mausta ja sekoita hyvin.", "Muotoile massasta 8 pihviä ja pyörittele ne korppujauhoissa.", "Paista pihvejä öljyssä molemmin puolin noin 6-7 minuuttia kummaltakin puolelta, kunnes ne ovat läpikypsiä ja ruskistuneita."]},
  {"id": "venezuelalaiset-taskuleivat", "name": "Venezuelalaiset täytetyt maissitaskut (empanadat)", "category": "Liha", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/zjtfp31764440795.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Naudan jauheliha", "amount": 450, "unit": "g", "chip": "Naudan jauheliha"}, {"name": "Pippuri", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Jauhettu jeera", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Rypsiöljy", "amount": 1, "unit": "rkl", "chip": null}, {"name": "Sipuli", "amount": 2.4, "unit": "dl", "chip": "Sipuli"}, {"name": "Vihreä paprika", "amount": 1.2, "unit": "dl", "chip": "Paprika (vihannes)"}, {"name": "Punainen paprika", "amount": 1.2, "unit": "dl", "chip": "Paprika (vihannes)"}, {"name": "Valkosipulijauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kapris", "amount": 0.6, "unit": "dl", "chip": null}, {"name": "Tomaattikastike", "amount": 1, "unit": "tölkki", "chip": "Tomaattikastike"}, {"name": "Sazon-mausteseos", "amount": 1, "unit": "annos", "chip": null}, {"name": "Maissijauho (masarepa)", "amount": 300, "unit": "g", "chip": "Maissijauho"}, {"name": "Rypsiöljy paistamiseen", "amount": 3, "unit": "dl", "chip": null}], "steps": ["Ruskista jauheliha kuumassa öljyssä, kunnes vaaleus on kadonnut.", "Lisää sipuli, paprikat, valkosipulijauhe, kapris, tomaattikastike ja sazon, ja hauduta kunnes suurin osa nesteestä on haihtunut, noin 20 minuuttia. Anna jäähtyä.", "Vaivaa maissijauhotaikina koossapysyväksi mutta ei sormiin tarttuvaksi.", "Muotoile taikinapalloista litteitä ympyröitä, lado keskelle täytettä ja taita puoliympyrän muotoon.", "Sulje reunat esimerkiksi kulhon reunalla painaen ja paista taskuja kuumassa öljyssä molemmin puolin kullanruskeiksi."]},
  {"id": "omena-perunasose", "name": "Hollantilainen omena-perunasose (hete bliksem)", "category": "Lisuke", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/pa03n41777540582.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Omena", "amount": 250, "unit": "g", "chip": "Omena"}, {"name": "Peruna", "amount": 250, "unit": "g", "chip": "Peruna"}, {"name": "Kanelitanko", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Vaahterasiirappi", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Pekoni", "amount": 4, "unit": "viipaletta", "chip": "Pekoni"}, {"name": "Juusto", "amount": 200, "unit": "g", "chip": "Juusto"}, {"name": "Suola", "amount": 1, "unit": "ripaus", "chip": null}, {"name": "Kananmuna", "amount": 1, "unit": "kpl", "chip": "Kananmuna"}, {"name": "Seesaminsiemenet", "amount": 50, "unit": "g", "chip": "Seesaminsiemenet"}], "steps": ["Kuori ja pilko perunat, keitä suolatussa vedessä 10 minuuttia, lisää pilkotut omenat ja kanelitanko ja keitä vielä 10 minuuttia kunnes molemmat ovat kypsiä.", "Paista pekoni kuivalla pannulla rapeaksi ja nosta talouspaperille valumaan.", "Kastele juustopalat vatkatussa munassa ja pyörittele seesaminsiemenissä, paista kuumalla pannulla nopeasti molemmin puolin rapeiksi.", "Valuta perunat ja omenat, poista kanelitanko ja soseuta yhdessä, mausta kanelilla ja suolalla.", "Tarjoa perunasose pekonin ja paistetun juuston kera."]},
  {"id": "algerialaiset-porkkanat", "name": "Algerialaiset mausteiset porkkanat", "category": "Lisuke", "price": 1, "vegetarian": true, "vegan": true, "image": "https://www.themealdb.com/images/media/meals/o2cd4r1764113576.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Vesi", "amount": 3.6, "unit": "dl", "chip": null}, {"name": "Porkkana", "amount": 900, "unit": "g", "chip": "Porkkana"}, {"name": "Oliiviöljy", "amount": 5, "unit": "rkl", "chip": null}, {"name": "Suola", "amount": 1, "unit": "tl", "chip": null}, {"name": "Mustapippuri", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Kaneli", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Jeera", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Valkosipulinkynsi", "amount": 3, "unit": "kpl", "chip": "Valkosipuli"}, {"name": "Timjami", "amount": 0.5, "unit": "tl", "chip": null}, {"name": "Laakerinlehti", "amount": 1, "unit": "kpl", "chip": null}, {"name": "Sitruunamehu", "amount": 1, "unit": "tl", "chip": null}], "steps": ["Höyrytä viipaloidut porkkanat kannen alla noin 4-6 minuuttia, kunnes ne ovat kypsiä mutta eivät veltoiksi. Ota talteen puoli desiä keitinlientä.", "Kuumenna öljy pannulla, mausta suolalla, pippurilla, kanelilla, jeeralla, valkosipulilla ja timjamilla, ja anna tuoksahtaa noin 10 minuuttia matalalla lämmöllä.", "Lisää talletettu keitinliemi ja laakerinlehti, ja hauduta kannen alla 20 minuuttia.", "Sekoita porkkanat mausteliemeen, kypsennä vielä 2-3 minuuttia ja poista laakerinlehti.", "Viimeistele sitruunamehulla ennen tarjoilua."]},

  {"id": "dolma-viininlehdet", "name": "Albanialaiset täytetyt viininlehdet lampaanlihalla", "category": "Alkuruoka", "price": 2, "vegetarian": false, "vegan": false, "image": "https://www.themealdb.com/images/media/meals/lqshrh1779648160.jpg", "aiImage": false, "servings": 4, "ingredients": [{"name": "Suolavedessä säilötyt viininlehdet", "amount": 40, "unit": "kpl", "chip": "Viininlehdet"}, {"name": "Lampaan jauheliha", "amount": 400, "unit": "g", "chip": "Lampaan jauheliha"}, {"name": "Sipuli", "amount": 5, "unit": "kpl", "chip": "Sipuli"}, {"name": "Riisi", "amount": 75, "unit": "g", "chip": "Riisi"}, {"name": "Pippuri", "amount": 1, "unit": "tl", "chip": null}, {"name": "Paprikajauhe", "amount": 1, "unit": "tl", "chip": null}, {"name": "Kasvisliemi (kuivattu)", "amount": 1, "unit": "tl", "chip": "Kasvisliemi"}, {"name": "Persilja", "amount": 25, "unit": "g", "chip": null}, {"name": "Basilika", "amount": 1, "unit": "tl", "chip": null}, {"name": "Oliiviöljy", "amount": 1, "unit": "loraus", "chip": null}, {"name": "Suola", "amount": 1, "unit": "annos", "chip": null}, {"name": "Kiehuva vesi", "amount": 2, "unit": "l", "chip": null}], "steps": ["Kuullota hienonnettu sipuli oliiviöljyssä 5 minuuttia kunnes se alkaa ruskistua.", "Sekoita joukkoon jauheliha, riisi, pippuri, paprikajauhe, kasvisliemijauhe, persilja ja basilika.", "Aseta viininlehdet päällekkäin, lusikoi keskelle täytettä ja käärittele tiiviiksi rullaksi taittaen reunat sisään.", "Vuoraa kattilan pohja viininlehdillä ja pinoa dolmat tiiviisti kattilaan.", "Kaada joukkoon kiehuvaa vettä juuri kääryleiden peittoon, kiehauta ja hauduta kannen alla noin 1,5 tuntia.", "Anna jäähtyä hetki ennen tarjoilua."]},
